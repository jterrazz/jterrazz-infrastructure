apiVersion: v2
name: common
description: Library chart, the one implementation of every concern app and platform-service share
# invariant: a LIBRARY chart: it is never installed, and Helm renders none of its files.
# Everything it owns lives in templates/_*.tpl as a named template, included by
# the two consumer charts.
type: library
# invariant: pinned exactly by the `common` dependency of
# kubernetes/charts/app/Chart.yaml and kubernetes/charts/platform-service/Chart.yaml:
# a file:// dependency resolves by exact version, so a bump here without them
# fails `helm dependency update` in validate.yaml, before anything renders.
version: 1.5.0
