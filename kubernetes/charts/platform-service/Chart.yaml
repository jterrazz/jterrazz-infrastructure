apiVersion: v2
name: platform-service
description: Shared chart for platform service ingress, certificates, and storage
type: application
# invariant: not published to any registry and has no out-of-repo consumers, so this
# version is bookkeeping only: nothing pulls the chart by version.
version: 2.14.0

# invariant: the one implementation of every concern this chart shares with `app`
# (IngressRoute, Certificate, PV/PVC, NetworkPolicy, InfisicalSecret). A
# relative file:// repository, so `helm dependency update` resolves it from the
# working tree with no registry and no network. The version is common's exactly;
# a mismatch fails `helm dependency update` in validate.yaml.
dependencies:
  - name: common
    version: 1.5.0
    repository: file://../common
