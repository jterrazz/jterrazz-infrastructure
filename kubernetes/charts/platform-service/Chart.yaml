apiVersion: v2
name: platform-service
description: Shared chart for platform service ingress, certificates, and storage
type: application
# Not published to any registry and has no out-of-repo consumers, so this
# version is bookkeeping only — nothing pulls the chart by version.
version: 2.11.0

# The one implementation of every concern this chart shares with `app`
# (IngressRoute, Certificate, PV/PVC, NetworkPolicy, InfisicalSecret). A
# relative file:// repository, so `helm dependency update` resolves it from the
# working tree with no registry and no network. KEEP THE VERSION IN SYNC with
# kubernetes/charts/common/Chart.yaml — asserted by scripts/assert-sync.py.
dependencies:
  - name: common
    version: 1.3.0
    repository: file://../common
