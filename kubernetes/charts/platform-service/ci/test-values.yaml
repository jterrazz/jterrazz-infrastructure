# CI fixture for the platform-service chart.
#
# Purpose: make `helm template`/`helm lint` render REAL objects. Every
# template is gated (`if .Values.host`, `range .Values.storage`), so linting
# with default values renders ZERO objects. This file is the contract the CI
# kubeconform step renders against.
#
#   helm template ci-test kubernetes/charts/platform-service \
#     -f kubernetes/charts/platform-service/ci/test-values.yaml
#
# Exercises the multi-volume storage map (the librechat shape) plus the two
# things chart 2.1 added — `access` and `storage.<key>.claimName` — and the
# populated-nodeName path that the app chart's fixture deliberately leaves
# empty.

name: ci-test-service
host: ci-test-service.jterrazz.com
port: 8080

# Second name on the same route + a SAN on the same certificate — the rename
# path. `Host(a) || Host(b)`, never the v2 `Host(a, b)`.
aliases:
  - ci-test-alias.example

# cluster-internal-access instead of private-access on the IngressRoute.
# This is the branch registry and openpanel need and the pre-2.1 boolean
# could not express. Flip to `private` (the default) or `public` locally to
# check the other two branches.
access: cluster-internal

# Named volumes. The PV is always <name>-<key>; hostPath is
# /var/lib/k8s-data/<name>[/<pathSuffix>].
storage:
  # No pathSuffix -> /var/lib/k8s-data/ci-test-service
  # PV/PVC: ci-test-service-data (reproduces the historical <name>-data name).
  data:
    size: 3Gi
  # With pathSuffix -> /var/lib/k8s-data/ci-test-service/uploads
  # PV/PVC: ci-test-service-uploads.
  uploads:
    size: 5Gi
    pathSuffix: uploads
  # claimName override: the PVC is named storage-ci-test-0 while the PV keeps
  # its <name>-<key> identity — see templates/storage.yaml for why that matters.
  metrics:
    size: 1Gi
    pathSuffix: metrics
    claimName: storage-ci-test-0
  # nodeLocalPath override: the hostPath leaves /var/lib/k8s-data entirely, so
  # the data lives in the VM and does NOT survive a repave (grafana-data is the
  # one live user — see templates/storage.yaml).
  node-local:
    size: 1Gi
    nodeLocalPath: /var/lib/ci-test-node-local

# Populated so the PV nodeAffinity block renders. With this empty the block
# must be omitted entirely rather than emit `values: [""]`.
infrastructure:
  nodeName: ci-test-node
