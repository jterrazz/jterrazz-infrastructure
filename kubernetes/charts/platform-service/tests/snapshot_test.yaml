suite: full fixture render (snapshot)
#
# Pins the ENTIRE manifest set the chart produces from ci/test-values.yaml,
# byte for byte, in __snapshot__/snapshot_test.yaml.snap.
#
# What this catches that the targeted suites do not: a hostPath that moves, a
# reclaim policy that flips from Retain to Delete, a storageClassName that
# stops being `manual`. Those are one-word edits with a data-loss blast radius
# — the PVs here are hostPath volumes holding Grafana, the three VictoriaMetrics
# stores, LibreChat, OpenPanel and registry state.
#
# Reviewing a failure: read the diff. If every changed line is intended,
#   helm unittest -u kubernetes/charts/platform-service
# regenerates the .snap — and that diff is what the change review should
# actually look at. Never regenerate without reading it.
values:
  - ../ci/test-values.yaml
tests:
  - it: matches the recorded render of the CI fixture
    asserts:
      - matchSnapshot: {}
