suite: certificates and credentials owned by the service, not by its routes
#
# Both blocks exist for the same reason: the object they render is referenced
# BY NAME from somewhere this chart cannot see — a TLS secret named on an
# app-chart route, a Secret an upstream chart wires `envFrom` to. So both names
# are required inputs and neither is derived.
#
# The fixture is loaded per test rather than for the suite: helm-unittest's
# `set` deep-merges into it, so the last case — a credentials block MISSING its
# secretName — cannot be expressed on top of a fixture that supplies one.
tests:
  - it: renders the service's own certificate and the extra one, and no more
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/certificate.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: names the extra certificate and its secret after the map key
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/certificate.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: ci-test-shared-tls
      - equal:
          path: spec.secretName
          value: ci-test-shared-tls
      - equal:
          path: spec.dnsNames
          value:
            - ci-test-shared.jterrazz.com

  - it: renders no InfisicalSecret when the service has no credentials
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    set:
      secrets: null
    asserts:
      - hasDocuments:
          count: 0

  - it: syncs the declared path into the Secret name the consumer reads
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ci-test-service-infisical
      - equal:
          path: spec.authentication.universalAuth.secretsScope.secretsPath
          value: /jterrazz-infrastructure/ci-test-service
      - equal:
          path: spec.authentication.universalAuth.secretsScope.envSlug
          value: prod
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: ci-test-service-credentials
      - equal:
          path: spec.managedKubeSecretReferences[0].secretNamespace
          value: NAMESPACE

  - it: hard-fails a credentials block with no secretName to write into
    templates:
      - templates/infisical.yaml
    set:
      name: ci-test-service
      secrets:
        path: /jterrazz-infrastructure/ci-test-service
    asserts:
      - failedTemplate:
          errorMessage: "secrets.secretName is required — the consumer reads it by that literal name"
