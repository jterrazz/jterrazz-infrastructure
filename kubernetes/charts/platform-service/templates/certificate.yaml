{{- if .Values.host }}
{{- include "common.certificate" (dict
      "name" (printf "%s-tls" (include "platform-service.name" .))
      "labels" (include "platform-service.labels" .)
      "secretName" (printf "%s-tls" (include "platform-service.name" .))
      "dnsNames" (concat (list (include "platform-service.host" .)) (.Values.aliases | default list))) }}
{{- end }}
{{- /* invariant: for a hostname several releases answer on; the key names a live Secret. */ -}}
{{- range $name, $cert := .Values.certificates }}
---
{{ include "common.certificate" (dict
     "name" $name
     "labels" (include "platform-service.labels" $)
     "secretName" $name
     "dnsNames" ($cert.dnsNames | required (printf "certificates.%s.dnsNames is required" $name))) }}
{{- end }}
