{{- if .Values.host }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "platform-service.name" . }}-tls
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
spec:
  secretName: {{ include "platform-service.name" . }}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - {{ include "platform-service.host" . }}
    {{- range .Values.aliases | default list }}
    - {{ . }}
    {{- end }}
{{- end }}
