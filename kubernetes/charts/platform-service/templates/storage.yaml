{{- /*
The named-volume map is this chart's; the PV/PVC pair is common.volume
(kubernetes/charts/common), which carries the data-safety notes.

  PV   <name>-<key>
  PVC  <name>-<key>, unless `claimName` overrides metadata.name
  path /var/lib/k8s-data/<name>[/<pathSuffix>], e.g. librechat + `mongo` ->
       /var/lib/k8s-data/librechat/mongo. Renaming a key moves the directory
       and the pod comes up on an empty volume.

`nodeLocalPath` opts a volume OUT of /var/lib/k8s-data, which on this target is
a symlink to the Mac over OrbStack's virtiofs share. Use it for data a service
reads and writes constantly rather than merely stores: virtiofs adds
per-syscall latency, and a SQLite-plus-index workload (Grafana's unified
storage) turns that into a CPU spin that pegs the pod. The cost is that this
data does NOT survive a repave — only ever point it at something
reconstructible.
*/ -}}
{{- $name := include "platform-service.name" . -}}
{{- $labels := include "platform-service.labels" . -}}
{{- $nodeName := .Values.infrastructure.nodeName | default "" -}}
{{- range $key, $volume := .Values.storage }}
{{- $size := $volume.size | required (printf "storage.%s.size is required" $key) }}
{{ include "common.volume" (dict
      "name" (printf "%s-%s" $name $key)
      "claimName" ($volume.claimName | default (printf "%s-%s" $name $key))
      "labels" (printf "%s\napp.kubernetes.io/component: storage" $labels)
      "size" $size
      "path" ($volume.nodeLocalPath | default (printf "/var/lib/k8s-data/%s%s" $name (ternary (printf "/%s" ($volume.pathSuffix | toString)) "" (hasKey $volume "pathSuffix"))))
      "nodeName" $nodeName) }}
{{- end }}
