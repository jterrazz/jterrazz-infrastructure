apiVersion: v2
name: app
description: Standard application chart for jterrazz infrastructure
type: application
# BUMP THIS in the same commit as any template change. App CI pulls the chart
# UNVERSIONED (oci://registry.internal.jterrazz.com/charts/app), and both publishers
# (.github/workflows/publish-chart.yaml and
# ansible/roles/platform/tasks/publish-app-chart.yml) refuse to overwrite an
# already-published version — so an unbumped template change publishes nothing
# and every app keeps rendering the old templates.
version: 2.10.0
appVersion: "1.17.1"

# The one implementation of every concern this chart shares with
# `platform-service`. A relative file:// repository so `helm dependency update`
# resolves it from the working tree with no registry and no network — and
# `helm package` bundles it into the .tgz every app pulls, so an app repo needs
# nothing new. KEEP THE VERSION IN SYNC with kubernetes/charts/common/Chart.yaml
# — asserted by scripts/assert-sync.py.
dependencies:
  - name: common
    version: 1.1.0
    repository: file://../common
