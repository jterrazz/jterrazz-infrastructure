suite: the registry pull secret is synced, never a chart value
# hazard: registry-credentials is synced by the operator from the jterrazz-ci project; the chart
# holds no credential. Only this suite pins its type, its literal name, the verbatim
# operator template and the registry gate; docs/decisions/015-deploy-secrets-are-fetched-once-by-ansible.md
templates:
  - templates/infisical.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: syncs registry-credentials from the registry's own project, typed for an image pull
    documentSelector:
      path: metadata.name
      value: ci-test-app-registry-infisical
    asserts:
      - equal:
          path: spec.authentication.universalAuth.secretsScope.projectSlug
          value: jterrazz-ci-v-nh-8
      - equal:
          path: spec.authentication.universalAuth.secretsScope.secretsPath
          value: /
      # invariant: `prod` is that project's env slug, not the app's deploy environment.
      - equal:
          path: spec.authentication.universalAuth.secretsScope.envSlug
          value: prod
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: registry-credentials
      - equal:
          path: spec.managedKubeSecretReferences[0].secretType
          value: kubernetes.io/dockerconfigjson

  - it: hands the operator a template that survives a hostile password
    # invariant: dict|toJson, never hand-written JSON (a `"` in the password); `auth` because
    # containerd prefers it.
    documentSelector:
      path: metadata.name
      value: ci-test-app-registry-infisical
    asserts:
      - equal:
          path: spec.managedKubeSecretReferences[0].template.data[".dockerconfigjson"]
          value: '{{ dict "auths" (dict "registry.internal.jterrazz.com" (dict "username" .DOCKER_REGISTRY_USERNAME.Value "password" .DOCKER_REGISTRY_PASSWORD.Value "auth" (list .DOCKER_REGISTRY_USERNAME.Value .DOCKER_REGISTRY_PASSWORD.Value | join ":" | b64enc))) | toJson }}'
      # invariant: no includeAllSecrets: it would copy KUBECONFIG_BASE64 and the rest in here.
      - notExists:
          path: spec.managedKubeSecretReferences[0].template.includeAllSecrets

  - it: leaves the app's own secrets Opaque and untemplated
    # invariant: the second CR leaves the first untouched.
    documentSelector:
      path: metadata.name
      value: ci-test-app-infisical
    asserts:
      - equal:
          path: spec.managedKubeSecretReferences[0].secretType
          value: Opaque
      - notExists:
          path: spec.managedKubeSecretReferences[0].template

  - it: renders no pull secret for a third-party image
    # invariant: a third-party image reads no credential, so no CR.
    set:
      environment: staging
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ci-test-app-infisical

  - it: renders the pull secret for an app that stores no secrets of its own
    # invariant: the two CRs are gated independently.
    set:
      spec.secrets: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ci-test-app-registry-infisical
