suite: the registry pull secret is synced, never a chart value
#
# `registry-credentials` — the dockerconfigjson every pod pulling from our own
# registry mounts as an imagePullSecret — is written by the Infisical operator
# from `/jterrazz-actions`, the same path CI reads its own `docker login` from.
# The chart carries no username and no password, so there is nothing to leak
# into a release Secret, into `helm get values -a`, or onto a runner's argv.
#
# Four things must hold, and nothing but this suite checks them:
#   * the TYPE of the managed Secret — an `Opaque` Secret named in
#     imagePullSecrets is accepted by the API and then ignored by the kubelet,
#     which surfaces as an unauthenticated pull, not as an error here;
#   * its NAME — `registry-credentials` is the literal deployment.yaml
#     references, a contract between two templates;
#   * the `.dockerconfigjson` template, verbatim: it is rendered by the
#     OPERATOR (text/template + sprig), so Helm's only job is to pass it
#     through as text. It is asserted as the value YAML parses back to, which
#     is what the operator receives — the line folding `toYaml` applies to a
#     long scalar is not part of the string;
#   * the gate — an image from anywhere else gets no pull secret on the pod and
#     no CR here, because this credential authenticates one registry.
templates:
  - templates/infisical.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: syncs registry-credentials from the CI path, typed for an image pull
    documentSelector:
      path: metadata.name
      value: ci-test-app-registry-infisical
    asserts:
      - equal:
          path: spec.authentication.universalAuth.secretsScope.secretsPath
          value: /jterrazz-actions
      # `prod` is CI's own env slug at that path (infra-connect pins it), not
      # the app's deploy environment: one stored copy, read by both.
      - equal:
          path: spec.authentication.universalAuth.secretsScope.envSlug
          value: prod
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: registry-credentials
      - equal:
          path: spec.managedKubeSecretReferences[0].secretType
          value: kubernetes.io/dockerconfigjson

  - it: hands the operator a template that survives a hostile password
    # dict|toJson, never a hand-written JSON string: a password containing `"`
    # or `\` would otherwise produce invalid JSON, which the apiserver would
    # store as bytes and containerd would fail on much later with an unhelpful
    # auth error. `auth` (base64 of user:password) is there because containerd
    # reads it in preference to the username/password pair.
    documentSelector:
      path: metadata.name
      value: ci-test-app-registry-infisical
    asserts:
      - equal:
          path: spec.managedKubeSecretReferences[0].template.data[".dockerconfigjson"]
          value: '{{ dict "auths" (dict "registry.internal.jterrazz.com" (dict "username" .DOCKER_REGISTRY_USERNAME.Value "password" .DOCKER_REGISTRY_PASSWORD.Value "auth" (list .DOCKER_REGISTRY_USERNAME.Value .DOCKER_REGISTRY_PASSWORD.Value | join ":" | b64enc))) | toJson }}'
      # No `includeAllSecrets`: it would put every raw value at
      # /jterrazz-actions — KUBECONFIG_BASE64 included — into this Secret
      # beside the docker config.
      - notExists:
          path: spec.managedKubeSecretReferences[0].template.includeAllSecrets

  - it: leaves the app's own secrets Opaque and untemplated
    # The second CR must not have changed the first: same file, one shared
    # library template, two very different destinations.
    documentSelector:
      path: metadata.name
      value: ci-test-app-infisical
    asserts:
      - equal:
          path: spec.managedKubeSecretReferences[0].secretType
          value: Opaque
      - notExists:
          path: spec.managedKubeSecretReferences[0].template

  - it: renders no pull secret for a third-party image
    # The staging fixture runs postgres:14-alpine. deployment.yaml attaches no
    # imagePullSecrets there, so a CR would sync a credential nothing reads.
    set:
      environment: staging
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ci-test-app-infisical

  - it: renders the pull secret for an app that stores no secrets of its own
    # The two CRs are independent: `spec.secrets.path` gates the app's own
    # Secret, the image's registry gates this one.
    set:
      spec.secrets: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ci-test-app-registry-infisical
