suite: spec.alerts -> Grafana alert-rule ConfigMap
# hazard: the label is the whole feature: Grafana's alerts sidecar
# (kubernetes/services/grafana/values.yaml) selects `grafana_alert: "1"` across
# ALL namespaces, so a ConfigMap that loses the label is not a broken alert;
# it is inert data nobody notices until an outage goes unannounced. Everything
# below exists because that failure is silent.
#
# Gating (prod-only, undeclared env) lives in environment_gating_test.yaml,
# next to the same assertions for dashboards.
templates:
  - templates/alert-configmap.yaml
tests:
  - it: renders nothing when the app declares no alerts
    # invariant: not a no-op assertion: the template must not emit an empty-`data`
    # ConfigMap. The alerts sidecar treats one as a provisioning file set and
    # an app that simply has no rules would churn Grafana on every deploy.
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts: null
    asserts:
      - hasDocuments:
          count: 0

  - it: puts every entry in ONE ConfigMap named <app>-alerts
    # invariant: one object, N keys: the fixture carries two entries precisely so a
    # template that overwrote `data` per iteration would fail here.
    values:
      - ../ci/test-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: ci-test-app-alerts
      - isSubset:
          path: metadata.labels
          content:
            app: ci-test-app
            environment: prod
            grafana_alert: "1"
      # invariant: no grafana_folder annotation, unlike dashboards: the alerts sidecar has
      # no folderAnnotation configured, and each group names its own `folder:`.
      - notExists:
          path: metadata.annotations
      - exists:
          path: data["ci-test-app.yaml"]
      - exists:
          path: data["ci-test-app-extra.yaml"]

  - it: keys each entry <name>.yaml and passes the payload through verbatim
    # hazard: byte-for-byte: these rule files are copied from a working Grafana
    # provisioning file, so any re-indent or re-quote the chart applies is a
    # rule that silently fails to provision.
    values:
      - ../ci/test-values.yaml
    asserts:
      - equal:
          path: data["ci-test-app.yaml"]
          value: |
            apiVersion: 1
            groups:
              - orgId: 1
                name: ci-test-app
                folder: ci-test-app
                interval: 1m
                rules: []
      - equal:
          path: data["ci-test-app-extra.yaml"]
          value: |
            apiVersion: 1
            groups:
              - orgId: 1
                name: ci-test-app-extra
                folder: ci-test-app
                interval: 5m
                rules: []

  - it: takes alerts from an environment override like any other spec key
    # value: spec.alerts is a plain map, so app.merged's deep-merge applies: an
    # environment may add or replace an entry. Pinned because the prod gate
    # makes this the one key whose override is only ever exercised in prod.
    values:
      - ../ci/test-values.yaml
    set:
      environments.prod.alerts:
        ci-test-app: |
          apiVersion: 1
          groups: []
    asserts:
      - equal:
          path: data["ci-test-app.yaml"]
          value: |
            apiVersion: 1
            groups: []
      # invariant: the non-overridden entry survives (maps deep-merge, lists replace).
      - exists:
          path: data["ci-test-app-extra.yaml"]

  - it: passes a rule whose uid is exactly 40 characters
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              interval: 1m
              rules:
                - uid: ci-test-app-a-uid-of-exactly-forty-chars
                  title: forty
    asserts:
      - hasDocuments:
          count: 1

  - it: fails the render on a rule uid over 40 characters
    # hazard: Grafana caps a uid at 40 and rejects its whole alerting reload, every
    # app's rules at once, while one such file is mounted.
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              interval: 1m
              rules:
                - uid: ci-test-app-a-uid-of-forty-one-characters
                  title: forty-one
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule uid "ci-test-app-a-uid-of-forty-one-characters" is 41 characters; Grafana caps a uid at 40 and rejects the whole alerting reload, for every app, when one exceeds it'

  - it: fails the render in staging too, before the rule reaches prod
    values:
      - ../ci/test-values.yaml
    set:
      environment: staging
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci-test-app-a-uid-of-forty-one-characters
    asserts:
      - failedTemplate: {}

  - it: fails the render on a rule with no uid
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - title: anonymous
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule 0 of group "ci-test-app" has no `uid`'

  - it: fails the render on a uid outside [a-zA-Z0-9_-]
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci.test.app
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule uid "ci.test.app" may hold only letters, digits, `-` and `_`'

  - it: fails the render on one uid used by two entries
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci-test-app-shared
        ci-test-app-extra: |
          apiVersion: 1
          groups:
            - name: ci-test-app-extra
              folder: ci-test-app
              rules:
                - uid: ci-test-app-shared
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app-extra: rule uid "ci-test-app-shared" is already used by spec.alerts.ci-test-app'

  - it: fails the render on a payload that is not an apiVersion 1 document
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          groups: []
    asserts:
      - failedTemplate:
          errorMessage: "spec.alerts.ci-test-app: the payload must be a Grafana provisioning document with `apiVersion: 1`"

  - it: fails the render on a group with no folder
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              rules: []
    asserts:
      - failedTemplate:
          errorMessage: "spec.alerts.ci-test-app: group 0 must name both `name` and `folder`"
