suite: undeclared environment renders NOTHING (chart 2.x behaviour)
# hazard: READ BEFORE "FIXING": an undeclared environment renders an EMPTY release, which
# `helm upgrade` applies by deleting everything. Pinned, not endorsed: chart 3.0 makes it a
# failedTemplate and rewrites this suite; docs/decisions/010-every-workload-renders-through-two-charts.md
tests:
  - it: renders zero manifests with the chart's own default values
    # outside: no values at all, which is why ci/test-values.yaml IS the contract.
    asserts:
      - hasDocuments:
          count: 0

  - it: renders zero manifests for an environment that is not declared
    values:
      - ../ci/test-values.yaml
    set:
      environment: prd
    asserts:
      - hasDocuments:
          count: 0

  - it: drops the prod-only dashboard ConfigMap in another environment
    # outside: prod-only: one Grafana folder per app, three environments would collide.
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/dashboard-configmap.yaml
    set:
      environment: staging
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the dashboard ConfigMap in prod
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/dashboard-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: ci-test-app

  - it: drops the prod-only alert ConfigMap in another environment
    # hazard: prod-only: rule uids are global, a staging copy would provision over prod's.
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/alert-configmap.yaml
    set:
      environment: staging
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the alert ConfigMap in prod
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/alert-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels.grafana_alert
          value: "1"
