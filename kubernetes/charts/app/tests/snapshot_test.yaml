# unwatched; docs/decisions/010-every-workload-renders-through-two-charts.md
templates:
  - templates/alert-configmap.yaml
  - templates/configmap.yaml
  - templates/cronjob.yaml
  - templates/dashboard-configmap.yaml
  - templates/deployment.yaml
  - templates/infisical.yaml
  - templates/ingress.yaml
  - templates/network-policy.yaml
  - templates/service.yaml
  - templates/storage.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: matches the recorded render of the CI fixture
    asserts:
      - matchSnapshot: {}
