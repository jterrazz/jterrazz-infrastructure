suite: an app container cannot be made privileged, and carries no API token
# invariant: an app may loosen the defaults, never past baseline Pod Security; failing at
# render explains it in the app's CI rather than inside a `helm --atomic` rollback.
values:
  - ../ci/test-values.yaml
templates:
  - templates/deployment.yaml
tests:
  - it: refuses privileged
    set:
      spec.securityContext.privileged: true
    asserts:
      - failedTemplate:
          errorPattern: may not set privileged
  - it: refuses allowPrivilegeEscalation
    set:
      spec.securityContext.allowPrivilegeEscalation: true
    asserts:
      - failedTemplate:
          errorPattern: may not set privileged
  - it: refuses a capability beyond NET_BIND_SERVICE
    set:
      spec.securityContext.capabilities.add: [NET_BIND_SERVICE, NET_ADMIN]
    asserts:
      - failedTemplate:
          errorPattern: may not set privileged
  - it: still allows NET_BIND_SERVICE, which even restricted admits
    set:
      spec.securityContext.capabilities.add: [NET_BIND_SERVICE]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE
  - it: mounts no service-account token
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: rolls on config changes, not on every helm upgrade
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
      - notExists:
          path: spec.template.metadata.annotations["rollout/release-revision"]
      - notExists:
          path: spec.template.metadata.annotations["rollout/deploy-id"]
  - it: rolls on every app CI deploy
    set:
      meta.deployId: "12345-1"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["rollout/deploy-id"]
          value: "12345-1"
