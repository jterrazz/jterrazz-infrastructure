suite: host redirects
templates:
  - templates/ingress.yaml
tests:
  - it: "emits one <app>-<idx>-redirect Middleware per redirect entry"
    # Rendered from the CI fixture, whose entries 3 and 4 are redirects. The
    # name is what the entry's own IngressRoute references, so a rename here is
    # a 404 there. documentSelector fails outright if the object is missing.
    values:
      - ../ci/test-values.yaml
    asserts:
      - equal:
          path: spec.redirectRegex.replacement
          value: "https://ci-test-app.jterrazz.com/${1}"
        documentSelector:
          path: metadata.name
          value: ci-test-app-3-redirect
      - equal:
          path: spec.redirectRegex.replacement
          value: "https://ci-test-app.jterrazz.com/moved"
        documentSelector:
          path: metadata.name
          value: ci-test-app-4-redirect
      - equal:
          path: spec.routes[0].middlewares
          value:
            - name: ci-test-app-3-redirect
        documentSelector:
          path: metadata.name
          value: ci-test-app-3

  - it: "preserves the path by default and emits a 301"
    set:
      metadata.name: web
      environment: prod
      spec: { image: "r/web:1", port: 3000, health: { path: / } }
      environments:
        prod:
          ingress:
            - { host: old.example.com, public: true, redirectTo: "https://new.example.com" }
    asserts:
      - equal:
          path: spec.redirectRegex.replacement
          value: "https://new.example.com/${1}"
        documentIndex: 1
      - equal:
          path: spec.redirectRegex.permanent
          value: true
        documentIndex: 1
  - it: "drops the path when preservePath is false"
    set:
      metadata.name: web
      environment: prod
      spec: { image: "r/web:1", port: 3000, health: { path: / } }
      environments:
        prod:
          ingress:
            - { host: old.example.com, public: true, redirectTo: "https://new.example.com/here", preservePath: false }
    asserts:
      - equal:
          path: spec.redirectRegex.replacement
          value: "https://new.example.com/here"
        documentIndex: 1
  - it: "refuses a redirect combined with a path"
    set:
      metadata.name: web
      environment: prod
      spec: { image: "r/web:1", port: 3000, health: { path: / } }
      environments:
        prod:
          ingress:
            - { host: old.example.com, public: true, path: /x, redirectTo: "https://new.example.com" }
    asserts:
      - failedTemplate:
          errorMessage: "ingress entry 0 for web sets both `path` and `redirectTo`; a redirect answers for the whole host, so combining them silently ignores the path"
  - it: "refuses a non-https redirect target"
    set:
      metadata.name: web
      environment: prod
      spec: { image: "r/web:1", port: 3000, health: { path: / } }
      environments:
        prod:
          ingress:
            - { host: old.example.com, public: true, redirectTo: "http://new.example.com" }
    asserts:
      - failedTemplate: {}
