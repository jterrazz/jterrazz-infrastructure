suite: registry dockerconfigjson survives hostile passwords
#
# The template builds the docker config with dict|toJson instead of pasting
# credentials between two literal quote characters. The old string-interpolated
# version produced INVALID JSON for any password containing `"` or `\` — and
# the failure was silent at apply time (the apiserver stores the Secret as
# opaque bytes) and only surfaced later as an unhelpful image-pull auth error.
#
# The assertions DECODE the base64 (`decodeBase64: true`) and match the JSON
# text, rather than pinning the encoded blob. Two reasons, both deliberate:
#   * a base64 constant is unreadable — the reviewer cannot see that the `"`
#     survived as `\"` and the `\` as `\\`, which IS the regression;
#   * a committed base64 blob next to the word `auth` is exactly the shape
#     every secret scanner (gitleaks here, GitGuardian on GitHub) reports, and
#     a repo whose scanner cries wolf is a repo where nobody reads it.
# The regexes below anchor the WHOLE document, so they are as strict as an
# exact match everywhere except the tail of the derived `auth` blob — whose
# prefix is still pinned to base64 of "ci-test:".
templates:
  - templates/registry-secret.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: escapes a password containing a double quote and a backslash
    # ci/test-values.yaml ships  not-a-secret"quote\backslash-fixture .
    # The decoded document must be exactly:
    #   {"auths":{"registry.internal.jterrazz.com":{"auth":"<b64 of user:pass>",
    #    "password":"not-a-secret\"quote\\backslash-fixture",
    #    "username":"ci-test"}}}
    # Note `\"` and `\\` in there: the quote does NOT terminate the JSON string
    # and the backslash does not escape the character after it. The broken
    # template produced `"password":"not-a-secret"quote\backslash-fixture"`,
    # which is unparseable JSON that still applied cleanly as a Secret.
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '^\{"auths":\{"registry\.internal\.jterrazz\.com":\{"auth":"Y2ktdGVzdDp[A-Za-z0-9+/]*={0,2}","password":"not-a-secret\\"quote\\\\backslash-fixture","username":"ci-test"\}\}\}$'

  - it: produces the same shape for an ordinary password
    # Control case: proves the escaping above is the payload's doing and not a
    # property of the template's output shape.
    set:
      registry.password: plain-pass
    asserts:
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '^\{"auths":\{"registry\.internal\.jterrazz\.com":\{"auth":"Y2ktdGVzdDp[A-Za-z0-9+/]*={0,2}","password":"plain-pass","username":"ci-test"\}\}\}$'

  - it: includes the `auth` field containerd prefers over user/password
    # containerd reads `auth` in preference to the username/password pair, so
    # a config missing it authenticates differently (or not at all) from one
    # that has it. Pinned as base64 of "<username>:" plus a base64 tail.
    asserts:
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '"auth":"Y2ktdGVzdDp[A-Za-z0-9+/]+={0,2}"'

  - it: names the Secret exactly what the pod's imagePullSecrets references
    # deployment.yaml names `imagePullSecrets: [{name: registry-credentials}]`
    # for any image on our own registry,
    # so this name is a contract between two templates, not a cosmetic choice.
    asserts:
      - equal:
          path: metadata.name
          value: registry-credentials

  - it: renders nothing when no registry credentials are passed
    # App CI passes them via --set; a `helm template` without them must not
    # emit an empty-credential Secret that would shadow a working one.
    set:
      registry.username: ""
      registry.password: ""
    asserts:
      - hasDocuments:
          count: 0
