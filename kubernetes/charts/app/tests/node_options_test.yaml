suite: NODE_OPTIONS heap cap and its 512Mi floor
# hazard: the chart injects NODE_OPTIONS=--max-old-space-size=<75% of the memory
# REQUEST>, but only above a 512Mi floor. The floor is not a style choice: for
# a small Next.js service (128Mi request) the derived 96MB cap starves SSR boot
# and crash-loops the pod — it regressed spwn.sh once. Below the floor the
# chart must inject NOTHING and leave V8's uncapped default in place.
templates:
  - templates/deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: injects nothing below the 512Mi floor
    set:
      spec.resources.memory: 256Mi
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
          any: true

  - it: injects nothing for a tiny Next.js-sized request
    # hazard: the exact shape that crash-looped spwn.sh: 128Mi -> a 96MB cap.
    set:
      spec.resources.memory: 128Mi
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
          any: true

  - it: injects a 75% cap exactly AT the floor
    # value: 512 * 3 / 4 = 384. The floor is inclusive (`ge 512`).
    set:
      spec.resources.memory: 512Mi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=384"

  - it: derives the cap from a Gi request through app.memMi
    # value: 1Gi -> 1024Mi -> 768. The cap tracks the REQUEST, not the (2x) limit:
    # sizing the heap off the cgroup limit is exactly the drift this prevents.
    set:
      spec.resources.memory: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"

  - it: derives the cap from signews-api's real 768Mi request
    set:
      spec.resources.memory: 768Mi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=576"

  - it: lets an app-declared NODE_OPTIONS win and injects nothing extra
    # hazard: the app's own value must survive verbatim AND the derived one must not
    # be appended: two NODE_OPTIONS entries is an invalid PodSpec, and the
    # last one would win silently.
    set:
      spec.resources.memory: 1Gi
      spec.env.NODE_OPTIONS: "--max-old-space-size=900 --enable-source-maps"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=900 --enable-source-maps"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"

  - it: skips injection for a request in an unparseable unit
    # invariant: app.memMi returns "" -> no cap, rather than a cap derived from a number
    # whose unit the chart did not understand.
    set:
      spec.resources.memory: 1000000Ki
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
          any: true

  - it: derives the cap from an environment-level resources override
    # invariant: `resources` DEEP merges, so an environment can raise memory alone and the
    # cap must follow it — this is the path a staging/prod split actually uses.
    set:
      spec.resources.memory: 256Mi
      environments.prod.resources.memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"
