# CI fixture for the app chart.
#
# Purpose: make `helm template`/`helm lint` render REAL objects. The chart
# gates every template behind `app.envExists` (metadata.name + environment +
# a matching entry in `environments`), so linting with default values renders
# ZERO objects and validates nothing. This file is the contract the CI
# kubeconform step renders against.
#
# Modelled on a realistic app (signews-api shape): two environments, a public
# + a private ingress surface, storage, secrets, and both platform services.
#
#   helm template app kubernetes/charts/app \
#     -f kubernetes/charts/app/ci/test-values.yaml
#
# Keep this exercising the widest reasonable surface — if a template branch is
# not reachable from here, CI is not checking it. The branches that are
# MUTUALLY EXCLUSIVE with the app shape above (an existing `claimName` instead
# of a rendered PV, an exec probe instead of an HTTP one, an isolated
# NetworkPolicy instead of the derived one) live in the `staging` environment
# at the bottom, which the unit tests render — one fixture cannot be both
# shapes at once.

metadata:
  name: ci-test-app

# Set by app CI from ${{ github.repository }} — pinned here so the Deployment
# renders the app.jterrazz.com/repository annotation branch.
meta:
  repository: jterrazz/ci-test-app

# Which of `environments` below is rendered. Everything is gated on this.
environment: prod

spec:
  # Set by app CI in real deploys; pinned here so app.image renders the
  # explicit branch rather than the <registry>/<app>:latest fallback.
  image: registry.internal.jterrazz.com/ci-test-app:ci

  port: 3000

  # Entrypoint overrides. Rendered verbatim; the image's own are used when
  # unset, which is the case for every app in the fleet.
  command: ["node", "server.js"]
  args: ["--enable-source-maps"]

  # Merged OVER the chart's hardened container defaults, which is the whole
  # point of the key — one capability back, everything else still dropped.
  securityContext:
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]

  # False here so prod renders the runAsNonRoot + uid/gid/fsGroup branch; the
  # `true` branch is exercised by the staging environment below.
  runAsRoot: false

  # >= 512Mi so the NODE_OPTIONS heap-cap branch in _helpers.tpl is exercised
  # (below that floor the chart deliberately injects nothing).
  resources:
    cpu: 100m
    memory: 512Mi
    memoryLimit: 1Gi

  health:
    path: /health
    timeoutSeconds: 5
    # Overridden away from the chart default (30) so the knob is exercised.
    startupFailureThreshold: 60

  # Renders the PV + PVC and the root `fix-permissions` initContainer.
  # Both keys are `required` as of chart 2.2 — dropping either must fail the
  # render rather than produce an unbindable PV.
  storage:
    size: 2Gi
    mountPath: /data

  # Exercises env injection + egress NetworkPolicy for both catalog entries,
  # and the client-label path (gateway-intelligence carries a clientLabel, so
  # the pod template gets `platform-client.jterrazz.com/gateway-intelligence`).
  platformServices:
    - otel-collector
    - gateway-intelligence

  # A client that cannot stamp the catalogue's clientLabel (its pods come from
  # a third-party chart), so it is named as a peer instead, plus one declared
  # egress rule on top of the derived DNS + internet.
  network:
    exposeTo:
      - namespace:platform-ai
    egress:
      - to: namespace:platform-analytics
        ports: [5432]

  # Renders the InfisicalSecret plus secretKeyRef env entries.
  secrets:
    path: /jterrazz-ci/ci-test-app
    env:
      - DATABASE_URL
      - API_TOKEN

  env:
    LOG_LEVEL: info

  # Renders the ConfigMap + its volume/volumeMount. Two forms: a plain string
  # is content mounted at /app/<filename>; a { path, content } map puts the
  # file where the IMAGE wants it instead.
  configFiles:
    ci-test.json: |
      { "fixture": true }
    ci-test.xml:
      path: /etc/ci-test/conf.d/ci-test.xml
      content: |
        <fixture/>

  # An existing Secret mounted read-only as files, for a credential an image
  # reads from disk rather than from env.
  secretMounts:
    - secretName: ci-test-app-files
      mountPath: /etc/ci-test-files

  # Only rendered when environment == prod.
  dashboards:
    overview: |
      { "title": "ci-test-app overview", "panels": [] }

  # Also prod-only. Two entries because the alerts ConfigMap is ONE object with
  # one data key per entry (dashboards are one object each) — a single entry
  # would not catch a template that silently emits only the last key.
  alerts:
    ci-test-app: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: ci-test-app
          folder: ci-test-app
          interval: 1m
          rules: []
    ci-test-app-extra: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: ci-test-app-extra
          folder: ci-test-app
          interval: 5m
          rules: []

  ingress:
    # Public surface, sub-path -> exercises the stripPrefix middleware.
    - host: ci-test-app.jterrazz.com
      path: /api
      public: true
    # Private surface -> exercises the private-access middleware attachment.
    - host: ci-test-app-internal.jterrazz.com
      path: /
      public: false
    # Sub-path WITHOUT stripPrefix -> the app serves the literal path, so no
    # stripPrefix Middleware may be emitted for this entry, and the smoke
    # contract opts the route out (nothing can derive a health URL under a
    # prefix the app routes itself).
    - host: ci-test-app-mcp.jterrazz.com
      path: /mcp
      public: true
      stripPrefix: false
    # Canonical-host redirect -> the <app>-<idx>-redirect Middleware, with
    # preservePath defaulting TRUE (deep links survive).
    - host: ci-test-app-old.jterrazz.com
      public: true
      redirectTo: https://ci-test-app.jterrazz.com
    # Same, with preservePath false -> one fixed landing page.
    - host: ci-test-app-legacy.jterrazz.com
      public: true
      redirectTo: https://ci-test-app.jterrazz.com/moved
      preservePath: false
    # Explicit smoke override -> the derived `/health` path and 200 are both
    # replaced. This is the escape hatch for a surface whose healthy answer is
    # not what the chart would guess.
    - host: ci-test-app-probe.jterrazz.com
      path: /
      public: false
      smoke:
        path: /ready
        expect: "204,200"
    # The three things `public:` cannot say, on one entry:
    #   access       cluster-internal — tailnet humans PLUS the cluster's pods.
    #   stripPrefix  a STRING: routed on /api/track, the backend serves /track.
    #   tlsSecret    a certificate owned by another release, so this render
    #                emits no Certificate for this host.
    # The derived smoke contract opts out (the stripped prefix is not the
    # route's own path, so no health URL is derivable) and the explicit block
    # opts back in with the one verb the route answers.
    - host: ci-test-app-ingest.jterrazz.com
      path: /api/track
      access: cluster-internal
      stripPrefix: /api
      tlsSecret: ci-test-shared-tls
      smoke:
        method: POST
        path: /api/track
        expect: "401"

environments:
  prod:
    tag: main
    replicas: 1
  # THE DATASTORE SHAPE. Not a realistic staging environment — it is the other
  # arm of every switch the prod render above takes, in the only place a
  # single fixture can hold it. Rendered by the unit tests, not by the CI
  # kubeconform step (which renders `prod`).
  staging:
    tag: main
    replicas: 1
    secretsEnv: prod
    # The other arm of the securityContext switch: no runAsNonRoot on the
    # container and no pod-level uid/gid/fsGroup block at all.
    runAsRoot: true
    resources:
      memory: 256Mi
    # A public image: no imagePullSecret (the credential authenticates our
    # registry alone) and no imagePullPolicy override.
    image: postgres:14-alpine
    # Clients dial this one by name and port, so the Service carries the real
    # port rather than 80.
    servicePort: 5432
    # Recreate without storage — the migration-on-boot case.
    strategy: Recreate
    # An existing claim another release owns: no PV/PVC is rendered, and
    # `owner` hands the volume to the uid the image runs as.
    storage:
      mountPath: /var/lib/postgresql/data
      claimName: ci-test-existing-claim
      owner: "70:70"
    # An exec probe: this server does not speak HTTP at all.
    health:
      exec: ["sh", "-c", "pg_isready"]
    # Nothing reaches it, it dials nothing — which is the entire security
    # model of an unauthenticated datastore.
    network:
      isolated: true
      exposeTo:
        - pods:app.kubernetes.io/name=ci-test-app
    ingress:
      - host: ci-test-app-staging.jterrazz.com
        path: /
        public: false

# Registry credentials — present so the dockerconfigjson Secret renders.
#
# The password keeps a double quote and a backslash, because those two
# characters are the entire point: they are the exact input that broke the old
# raw-string-interpolation template, so this fixture regression-tests the
# dict|toJson rewrite. Everything else about the value is deliberately
# self-describing and low-entropy — a fixture that LOOKS like a credential
# trips secret scanners (here and in the base64 the template derives from it),
# and a repo where the scanner cries wolf is a repo where nobody reads it.
registry:
  server: registry.internal.jterrazz.com
  username: ci-test
  password: 'not-a-secret"quote\backslash-fixture'
