{{- if eq (include "app.envExists" .) "true" -}}
{{- $appName := include "app.name" . -}}
{{- $secrets := (fromYaml (include "app.merged" .)).secrets -}}
{{- if $secrets.path }}
---
{{ include "common.infisicalSecret" (dict
     "name" (printf "%s-infisical" $appName)
     "labels" (include "app.labels" .)
     "envSlug" (include "app.infisicalEnv" .)
     "secretsPath" $secrets.path
     "secretName" (include "app.secretsName" .)
     "secretNamespace" .Release.Namespace) }}
{{- end }}
{{- if eq (include "app.privateImage" .) "true" }}
{{- /* hazard: the backticked string is the operator's template, not Helm's; dict|toJson
       survives a `"` in the password, and containerd prefers `auth` (ADR-015). */}}
{{- $dockerconfig := printf `{{ dict "auths" (dict %q (dict "username" .REGISTRY_PULL_USERNAME.Value "password" .REGISTRY_PULL_PASSWORD.Value "auth" (list .REGISTRY_PULL_USERNAME.Value .REGISTRY_PULL_PASSWORD.Value | join ":" | b64enc))) | toJson }}` .Values.registry.server }}
---
{{ include "common.infisicalSecret" (dict
     "name" (printf "%s-registry-infisical" $appName)
     "labels" (include "app.labels" .)
     "projectSlug" .Values.registry.infisicalProject
     "envSlug" "prod"
     "secretsPath" "/"
     "secretName" "registry-credentials"
     "secretNamespace" .Release.Namespace
     "secretType" "kubernetes.io/dockerconfigjson"
     "template" (dict "data" (dict ".dockerconfigjson" $dockerconfig))) }}
{{- end }}
{{- end }}
