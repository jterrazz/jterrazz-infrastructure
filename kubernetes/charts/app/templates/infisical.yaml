{{- if eq (include "app.envExists" .) "true" -}}
{{- $appName := include "app.name" . -}}
{{- $secrets := (fromYaml (include "app.merged" .)).secrets -}}
{{- if $secrets.path }}
---
{{ include "common.infisicalSecret" (dict
     "name" (printf "%s-infisical" $appName)
     "labels" (include "app.labels" .)
     "envSlug" (include "app.infisicalEnv" .)
     "secretsPath" $secrets.path
     "secretName" (include "app.secretsName" .)
     "secretNamespace" .Release.Namespace) }}
{{- end }}
{{- if eq (include "app.privateImage" .) "true" }}
{{- /*
The pull credential for OUR registry, synced by the operator like every other
secret; it is never a chart value, so it never reaches a Helm release Secret,
`helm get values -a`, or a runner's argv. It is the ONE stored copy of the
registry account: the `jterrazz-ci` project, which CI
(`jterrazz-actions/actions/infra-connect`, over OIDC) and the platform deploy
read too. `registry-credentials` is
the literal name the `imagePullSecrets` of deployment.yaml and cronjob.yaml
use: a contract between templates, not a derived string.

The backticked string is the OPERATOR's template, not Helm's: Helm passes it
through untouched and the operator renders it (text/template + sprig) against
the secrets at that path. It builds the docker config with dict|toJson rather
than by interpolating the credential into a hand-written JSON string: a
password containing a double quote or a backslash would otherwise yield invalid
JSON, and the failure surfaces much later as an unhelpful image-pull auth
error. `auth` (base64 of user:password) is included because containerd reads
that field in preference to the username/password pair.
*/}}
{{- $dockerconfig := printf `{{ dict "auths" (dict %q (dict "username" .DOCKER_REGISTRY_USERNAME.Value "password" .DOCKER_REGISTRY_PASSWORD.Value "auth" (list .DOCKER_REGISTRY_USERNAME.Value .DOCKER_REGISTRY_PASSWORD.Value | join ":" | b64enc))) | toJson }}` .Values.registry.server }}
---
{{ include "common.infisicalSecret" (dict
     "name" (printf "%s-registry-infisical" $appName)
     "labels" (include "app.labels" .)
     "projectSlug" .Values.registry.infisicalProject
     "envSlug" "prod"
     "secretsPath" "/"
     "secretName" "registry-credentials"
     "secretNamespace" .Release.Namespace
     "secretType" "kubernetes.io/dockerconfigjson"
     "template" (dict "data" (dict ".dockerconfigjson" $dockerconfig))) }}
{{- end }}
{{- end }}
