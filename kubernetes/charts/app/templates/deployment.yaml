{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $secrets := $spec.secrets -}}
{{- $envVars := $spec.env -}}
{{- $resources := $spec.resources -}}
{{- $platformEnv := fromYaml (include "app.platformEnv" .) -}}
{{- $platformClientLabels := fromYaml (include "app.platformClientLabels" .) -}}
{{- $storage := $spec.storage -}}
{{- /* Recreate is DERIVED from storage rather than asked for: every volume this
       chart mounts is an RWO hostPath, and two writers on one is the trap the
       datastores exist to avoid. `spec.strategy` overrides it for the workload
       that needs Recreate WITHOUT a volume — op-api runs its migrations on
       boot, so a rolling update would put two migration runners on the same
       database. */ -}}
{{- $strategy := $spec.strategy | default (ternary "Recreate" "" (not (not $storage))) -}}
{{- /* The chown initContainer is what makes a hostPath volume writable by a
       non-root container: the directory is created root-owned and only root
       can hand it over. `storage.owner` names the uid:gid the IMAGE runs as
       (70:70 for alpine postgres, 101:101 for clickhouse, …); the empty
       string skips the container entirely, for an image that runs as root and
       whose data must stay root-owned. */ -}}
{{- $owner := "1000:1000" -}}
{{- if and $storage (hasKey $storage "owner") -}}
{{- $owner = $storage.owner | toString -}}
{{- end -}}
{{- /* readOnlyRootFilesystem is deliberately NOT among these defaults: every app
here is a Next.js or Node service that writes caches at runtime, and setting
it would crash-loop them. `spec.securityContext` merges OVER the defaults, so
an app needing a capability back never has to fork the chart. deepCopy because
mergeOverwrite mutates its first argument.
*/ -}}
{{- $secDefaults := dict
      "allowPrivilegeEscalation" false
      "capabilities" (dict "drop" (list "ALL"))
      "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- /* runAsNonRoot would contradict an explicit spec.runAsRoot opt-out. */ -}}
{{- if not $spec.runAsRoot -}}
{{- $_ := set $secDefaults "runAsNonRoot" true -}}
{{- end -}}
{{- $securityContext := mergeOverwrite (deepCopy $secDefaults) $spec.securityContext -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  {{- /* The one place the cluster records WHICH REPO builds this workload.
         scripts/trigger-app-deploys.sh reads it off every app Deployment
         instead of holding a list; an app whose CI predates
         `--set meta.repository` stamps nothing and is reported as missing,
         rather than silently dropping out of the fleet rebuild. */}}
  {{- if .Values.meta.repository }}
  annotations:
    app.jterrazz.com/repository: {{ .Values.meta.repository | quote }}
  {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas }}
  # 3, not the k8s default 10 — see kubernetes/services/grafana/values.yaml.
  revisionHistoryLimit: 3
  {{- if $strategy }}
  strategy:
    type: {{ $strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollout/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- /* Platform-client labels: stamped on pod template labels ONLY
               (never selectorLabels — those are immutable). The target
               platform service's ingress NetworkPolicy selects on these. */}}
        {{- range $key, $value := $platformClientLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if not $spec.runAsRoot }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- end }}
      {{- /* Only for an image on OUR registry: that is the only one the
             credential can authenticate, and naming a Secret that does not
             exist in the namespace earns a FailedToRetrieveImagePullSecret
             warning on every pod start. Same fact decides imagePullPolicy
             below. */}}
      {{- if eq (include "app.privateImage" .) "true" }}
      imagePullSecrets:
        - name: registry-credentials
      {{- end }}
      {{- if and $storage $owner }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R {{ $owner }} {{ $storage.mountPath }}"]
          # Must stay root: hostPath dirs are created root-owned and only root
          # can chown them to the app's uid. Every capability is still dropped
          # except the three `chown -R` needs — CHOWN to change ownership,
          # FOWNER + DAC_OVERRIDE to traverse and modify dirs root does not own.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: {{ $storage.mountPath }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          {{- /* Always for our own registry: `main` / `next` tags are mutable,
                 so IfNotPresent would keep serving whatever the node cached at
                 the first pull. A third-party image is left at Kubernetes' own
                 default, which is what its pinned tag deserves — and what
                 keeps a pod restart off Docker Hub's anonymous pull quota. */}}
          {{- if eq (include "app.privateImage" .) "true" }}
          imagePullPolicy: Always
          {{- end }}
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          {{- if $spec.command }}
          command:
            {{- range $spec.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $spec.args }}
          args:
            {{- range $spec.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
          env:
            - name: PORT
              value: {{ $spec.port | quote }}
            {{- range $key, $value := $envVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not (hasKey $envVars "OTEL_SERVICE_NAME") }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "app.name" . }}
            {{- end }}
            {{- /* Both spellings: `deployment.environment` is what the
                   collector's Langfuse filter, the remote-write label
                   (deployment_environment) and @jterrazz/telemetry read;
                   `deployment.environment.name` is the current semconv,
                   which Langfuse maps to its Environment field. */}}
            {{- if not (hasKey $envVars "OTEL_RESOURCE_ATTRIBUTES") }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.environment }},deployment.environment.name={{ .Values.environment }}"
            {{- end }}
            {{- /* Opt-in platform-service env (spec.platformServices → the
                   catalog in _helpers.tpl). An app must declare
                   `otel-collector` for telemetry to flow — declaring it is
                   also what opens the egress hole. A user-set env wins. */}}
            {{- range $key, $value := $platformEnv }}
            {{- if not (hasKey $envVars $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Default Node.js heap cap ≈ 75% of the memory request.
                   Skipped entirely if the app sets its own NODE_OPTIONS.
                   Harmless on non-Node runtimes (the var is ignored). */}}
            {{- $nodeHeap := include "app.nodeMaxOldSpace" . }}
            {{- if and $nodeHeap (not (hasKey $envVars "NODE_OPTIONS")) }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ $nodeHeap }}"
            {{- end }}
            {{- if $secrets.env }}
            {{- range $secrets.env }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretsName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- if or $storage $spec.configFiles $spec.secretMounts }}
          volumeMounts:
            {{- if $storage }}
            - name: data
              mountPath: {{ $storage.mountPath }}
            {{- end }}
            {{- range $filename, $file := $spec.configFiles }}
            - name: config
              mountPath: {{ include "app.configFilePath" (dict "filename" $filename "file" $file) }}
              subPath: {{ $filename }}
              readOnly: true
            {{- end }}
            {{- range $spec.secretMounts }}
            - name: {{ .secretName }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu }}
              memory: {{ $resources.memory }}
            limits:
              memory: {{ include "app.memoryLimit" . }}
          # The startupProbe is what makes a slow boot safe, so liveness and
          # readiness keep Kubernetes' own timings — a wedged pod is restarted
          # in ~30s rather than the ~150s a lenient liveness probe would take.
          # Only timeoutSeconds is raised: 1s is not enough for a Node app that
          # also runs in-process background work.
          startupProbe:
            {{- include "app.probe" . | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
            failureThreshold: {{ $spec.health.startupFailureThreshold }}
          livenessProbe:
            {{- include "app.probe" . | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
          readinessProbe:
            {{- include "app.probe" . | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
      {{- if or $storage $spec.configFiles $spec.secretMounts }}
      volumes:
        {{- if $storage }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $storage.claimName | default (printf "%s-data" (include "app.name" .)) }}
        {{- end }}
        {{- if $spec.configFiles }}
        - name: config
          configMap:
            name: {{ include "app.name" . }}-config
        {{- end }}
        {{- range $spec.secretMounts }}
        - name: {{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
      {{- end }}
{{- end }}
