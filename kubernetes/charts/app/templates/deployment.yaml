{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $resources := $spec.resources -}}
{{- $platformClientLabels := fromYaml (include "app.platformClientLabels" .) -}}
{{- $storage := $spec.storage -}}
{{- /* invariant: an RWO hostPath never gets two writers, so storage implies Recreate. */ -}}
{{- $strategy := $spec.strategy | default (ternary "Recreate" "" (not (not $storage))) -}}
{{- $owner := "1000:1000" -}}
{{- if and $storage (hasKey $storage "owner") -}}
{{- $owner = $storage.owner | toString -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  {{- if .Values.meta.repository }}
  annotations:
    app.jterrazz.com/repository: {{ .Values.meta.repository | quote }}
  {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas }}
  revisionHistoryLimit: 3
  {{- if $strategy }}
  strategy:
    type: {{ $strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* invariant: a pod rolls on a config change or an app deploy, never on a bare upgrade,
             which would restart the registry under every platform deploy. */}}
      annotations:
        checksum/config: {{ $spec.configFiles | default dict | toJson | sha256sum | quote }}
        {{- with .Values.meta.deployId }}
        rollout/deploy-id: {{ . | quote }}
        {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- /* invariant: pod labels only: selectorLabels are immutable. */}}
        {{- range $key, $value := $platformClientLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "app.podSecurityContext" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if eq (include "app.privateImage" .) "true" }}
      imagePullSecrets:
        - name: registry-credentials
      {{- end }}
      {{- if and $storage $owner }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R {{ $owner }} {{ $storage.mountPath }}"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: {{ $storage.mountPath }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          {{- if eq (include "app.privateImage" .) "true" }}
          imagePullPolicy: Always
          {{- end }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          {{- if $spec.command }}
          command:
            {{- range $spec.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $spec.args }}
          args:
            {{- range $spec.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
          env:
            {{- include "app.containerEnv" (dict "ctx" . "resources" $resources) | trim | nindent 12 }}
          {{- if or $storage $spec.configFiles $spec.secretMounts }}
          volumeMounts:
            {{- include "app.volumeMounts" (dict "ctx" . "storage" (not (not $storage))) | trim | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu }}
              memory: {{ $resources.memory }}
            limits:
              memory: {{ include "app.memoryLimit" . }}
          startupProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" true) | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
            failureThreshold: {{ $spec.health.startupFailureThreshold }}
          livenessProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" true) | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
          readinessProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" false) | nindent 12 }}
            timeoutSeconds: {{ $spec.health.timeoutSeconds }}
      {{- if or $storage $spec.configFiles $spec.secretMounts }}
      volumes:
        {{- include "app.volumes" (dict "ctx" . "storage" (not (not $storage))) | trim | nindent 8 }}
      {{- end }}
{{- end }}
