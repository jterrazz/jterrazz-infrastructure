{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- if $spec.storage -}}
{{- $appName := include "app.name" . -}}
{{- $size := $spec.storage.size | required (printf "spec.storage.size is required when spec.storage is set (app %s)" $appName) -}}
{{- $_ := $spec.storage.mountPath | required (printf "spec.storage.mountPath is required when spec.storage is set (app %s)" $appName) -}}
{{- /* No nodeAffinity: app CI passes no node name. A second node would need one
       here AND on every platform-service volume, or a hostPath PV can bind
       where the disk is empty. The PV/PVC pair itself is common.volume. */ -}}
{{- include "common.volume" (dict
      "name" (printf "%s-%s-data" $appName .Values.environment)
      "claimName" (printf "%s-data" $appName)
      "labels" (include "app.labels" .)
      "size" $size
      "path" (printf "/var/lib/k8s-data/%s-%s" $appName .Values.environment)
      "nodeName" "") }}
{{- end }}
{{- end }}
