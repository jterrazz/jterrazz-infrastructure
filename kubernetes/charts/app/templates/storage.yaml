{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- /* hazard: a `claimName` belongs to another release; owning it too would let the wrong
       `helm uninstall` delete it. */ -}}
{{- if $spec.storage -}}
{{- $appName := include "app.name" . -}}
{{- $_ := $spec.storage.mountPath | required (printf "spec.storage.mountPath is required when spec.storage is set (app %s)" $appName) -}}
{{- if not $spec.storage.claimName -}}
{{- $size := $spec.storage.size | required (printf "spec.storage.size is required when spec.storage is set without a claimName (app %s)" $appName) -}}
{{- /* hazard: no nodeAffinity, since app CI passes no node name; a second node needs one. */ -}}
{{- include "common.volume" (dict
      "name" (printf "%s-%s-data" $appName .Values.environment)
      "claimName" (printf "%s-data" $appName)
      "labels" (include "app.volumeLabels" .)
      "size" $size
      "path" (printf "/var/lib/k8s-data/%s-%s" $appName .Values.environment)
      "nodeName" "") }}
{{- end }}
{{- end }}
{{- end }}
