{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  ports:
    {{- /* 80 by default, so an IngressRoute never mentions the app port. A
           workload whose CLIENTS dial it by name and port — a database in a
           connection string, an in-cluster HTTP API — sets servicePort to its
           own port instead, because that URL is written down somewhere this
           chart cannot see. */}}
    - port: {{ $spec.servicePort }}
      targetPort: {{ $spec.port }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
{{- end }}
