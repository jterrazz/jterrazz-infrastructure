{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $appName := include "app.name" . -}}
{{- $labels := include "app.labels" . -}}
{{- $ingressList := fromYamlArray (include "app.ingressList" .) -}}
{{- $healthPath := $spec.health.path | default "/" -}}
{{- if not (hasPrefix "/" $healthPath) }}{{ $healthPath = printf "/%s" $healthPath }}{{ end -}}

{{- /* invariant: one Certificate per host, none for an entry naming a foreign `tlsSecret`. */ -}}
{{- $hosts := dict -}}
{{- range $entry := $ingressList -}}
  {{- if and $entry.host (not $entry.tlsSecret) -}}
    {{- $_ := set $hosts $entry.host true -}}
  {{- end -}}
{{- end -}}

{{- range $host, $_ := $hosts }}
{{- $hostSlug := include "app.hostSlug" $host }}
---
{{ include "common.certificate" (dict
     "name" (printf "%s-%s-tls" $appName $hostSlug)
     "labels" $labels
     "secretName" (printf "%s-%s-tls" $appName $hostSlug)
     "dnsNames" (list $host)) }}
{{- end }}

{{- range $idx, $entry := $ingressList }}
{{- if and (not (hasKey $entry "public")) (not (hasKey $entry "access")) }}
  {{- fail (printf "ingress entry %d for %s is missing the required `public: true|false` field; declare network visibility explicitly" $idx $appName) }}
{{- end }}
{{- $hostSlug := include "app.hostSlug" $entry.host }}
{{- $access := $entry.access | default (ternary "public" "private" (eq (toString $entry.public) "true")) }}
{{- $isPublic := eq $access "public" }}
{{- $path := $entry.path | default "/" }}
{{- $hasPath := ne $path "/" }}
{{- $stripPrefix := $path }}
{{- if hasKey $entry "stripPrefix" }}
{{- if kindIs "bool" $entry.stripPrefix }}
{{- $stripPrefix = ternary $path "" $entry.stripPrefix }}
{{- else }}
{{- $stripPrefix = $entry.stripPrefix | toString }}
{{- end }}
{{- end }}
{{- $emitStripPrefix := and $hasPath (ne $stripPrefix "") }}
{{- $routeName := printf "%s-%d" $appName $idx }}
{{- $redirectTo := $entry.redirectTo | default "" }}
{{- $isRedirect := ne $redirectTo "" }}
{{- $preservePath := true }}
{{- if hasKey $entry "preservePath" }}{{- $preservePath = $entry.preservePath }}{{- end }}
{{- if and $isRedirect $hasPath }}
  {{- fail (printf "ingress entry %d for %s sets both `path` and `redirectTo`; a redirect answers for the whole host, so combining them silently ignores the path" $idx $appName) }}
{{- end }}
{{- if and $isRedirect (not (hasPrefix "https://" $redirectTo)) }}
  {{- fail (printf "ingress entry %d for %s: redirectTo must be an absolute https:// URL, got %q" $idx $appName $redirectTo) }}
{{- end }}
{{- if and $emitStripPrefix (not $isRedirect) }}
---
{{ include "common.middleware.stripPrefix" (dict
     "name" (printf "%s-strip-prefix" $routeName)
     "labels" $labels
     "prefix" $stripPrefix) }}
{{- end }}
{{- if $isRedirect }}
---
{{ include "common.middleware.redirect" (dict
     "name" (printf "%s-redirect" $routeName)
     "labels" $labels
     "host" $entry.host
     "replacement" (ternary (printf "%s/${1}" $redirectTo) $redirectTo $preservePath)) }}
{{- end }}
{{- $middlewares := list }}
{{- $accessMiddleware := include "common.accessMiddleware" $access }}
{{- if $accessMiddleware }}
{{- $middlewares = append $middlewares (dict "name" $accessMiddleware "namespace" "platform-networking") }}
{{- end }}
{{- if $isRedirect }}
{{- $middlewares = append $middlewares (dict "name" (printf "%s-redirect" $routeName)) }}
{{- end }}
{{- if and $emitStripPrefix (not $isRedirect) }}
{{- $middlewares = append $middlewares (dict "name" (printf "%s-strip-prefix" $routeName)) }}
{{- end }}
{{- /* invariant: the derived smoke contract; README.md tabulates it. */}}
{{- $smoke := dict "probe" true "path" (printf "%s%s" (ternary $path "" $hasPath) $healthPath) "expect" "200" }}
{{- if $isRedirect }}
{{- $_ := set $smoke "path" "/" }}
{{- $_ := set $smoke "expect" "301" }}
{{- $_ := set $smoke "location" (ternary (printf "%s/" $redirectTo) $redirectTo $preservePath) }}
{{- else if and $hasPath (ne $stripPrefix $path) }}
{{- $_ := set $smoke "probe" false }}
{{- end }}
{{- if hasKey $entry "smoke" }}
{{- if kindIs "bool" $entry.smoke }}
{{- $_ := set $smoke "probe" $entry.smoke }}
{{- else }}
{{- $_ := set $smoke "probe" true }}
{{- if $entry.smoke.path }}{{ $_ := set $smoke "path" $entry.smoke.path }}{{ end }}
{{- if $entry.smoke.expect }}{{ $_ := set $smoke "expect" $entry.smoke.expect }}{{ end }}
{{- if $entry.smoke.method }}{{ $_ := set $smoke "method" $entry.smoke.method }}{{ end }}
{{- end }}
{{- end }}
{{- /* invariant: Traefik requires a service even on a redirect route. */}}
---
{{ include "common.ingressRoute" (dict
     "name" $routeName
     "labels" $labels
     "annotations" (include "common.smokeAnnotations" $smoke)
     "match" (printf "Host(`%s`)%s" $entry.host (ternary (printf " && PathPrefix(`%s`)" $path) "" $hasPath))
     "middlewares" $middlewares
     "serviceName" $appName
     "servicePort" $spec.servicePort
     "tlsSecret" ($entry.tlsSecret | default (printf "%s-%s-tls" $appName $hostSlug))) }}
{{- end }}
{{- end }}
