{{- if eq (include "app.envExists" .) "true" -}}
{{- $appName := include "app.name" . -}}
{{- $labels := include "app.labels" . -}}
{{- $ingressList := fromYamlArray (include "app.ingressList" .) -}}
{{- /* The app already declares where it answers "I am healthy" — that is what
       makes the smoke contract below need no app-repo edit. */ -}}
{{- $healthPath := (fromYaml (include "app.merged" .)).health.path | default "/" -}}
{{- if not (hasPrefix "/" $healthPath) }}{{ $healthPath = printf "/%s" $healthPath }}{{ end -}}

{{- /* One Certificate per unique host — multiple ingress entries on the
       same host share one TLS secret. */ -}}
{{- $hosts := dict -}}
{{- range $entry := $ingressList -}}
  {{- if $entry.host -}}
    {{- $_ := set $hosts $entry.host true -}}
  {{- end -}}
{{- end -}}

{{- range $host, $_ := $hosts }}
{{- $hostSlug := include "app.hostSlug" $host }}
---
{{ include "common.certificate" (dict
     "name" (printf "%s-%s-tls" $appName $hostSlug)
     "labels" $labels
     "secretName" (printf "%s-%s-tls" $appName $hostSlug)
     "dnsNames" (list $host)) }}
{{- end }}

{{- /* Resource name is {app}-{idx} so two entries sharing a host or path
       still get unique object names. */ -}}
{{- range $idx, $entry := $ingressList }}
{{- if not (hasKey $entry "public") }}
  {{- fail (printf "ingress entry %d for %s is missing the required `public: true|false` field — declare network visibility explicitly" $idx $appName) }}
{{- end }}
{{- $hostSlug := include "app.hostSlug" $entry.host }}
{{- $isPublic := $entry.public }}
{{- $path := $entry.path | default "/" }}
{{- $hasPath := ne $path "/" }}
{{- /* Defaults TRUE: backends mount routes at /<resource>, without the /api
       prefix. An app serving the literal path (e.g. an MCP server at /mcp)
       sets stripPrefix: false. */ -}}
{{- $stripPrefix := true }}
{{- if hasKey $entry "stripPrefix" }}{{- $stripPrefix = $entry.stripPrefix }}{{- end }}
{{- $emitStripPrefix := and $hasPath $stripPrefix }}
{{- $routeName := printf "%s-%d" $appName $idx }}
{{- /* A redirect entry answers on its host and sends the client elsewhere; it
       never reaches the app. `preservePath` defaults TRUE because the common
       case is a canonical-host redirect, and dropping the path there breaks
       every deep link and inbound URL that ever pointed at the old host —
       silently, with a 301 that looks correct. Set it false for a redirect to
       one fixed page. */ -}}
{{- $redirectTo := $entry.redirectTo | default "" }}
{{- $isRedirect := ne $redirectTo "" }}
{{- $preservePath := true }}
{{- if hasKey $entry "preservePath" }}{{- $preservePath = $entry.preservePath }}{{- end }}
{{- if and $isRedirect $hasPath }}
  {{- fail (printf "ingress entry %d for %s sets both `path` and `redirectTo`; a redirect answers for the whole host, so combining them silently ignores the path" $idx $appName) }}
{{- end }}
{{- if and $isRedirect (not (hasPrefix "https://" $redirectTo)) }}
  {{- fail (printf "ingress entry %d for %s: redirectTo must be an absolute https:// URL, got %q" $idx $appName $redirectTo) }}
{{- end }}
{{- if and $emitStripPrefix (not $isRedirect) }}
---
{{ include "common.middleware.stripPrefix" (dict
     "name" (printf "%s-strip-prefix" $routeName)
     "labels" $labels
     "prefix" $path) }}
{{- end }}
{{- if $isRedirect }}
---
{{ include "common.middleware.redirect" (dict
     "name" (printf "%s-redirect" $routeName)
     "labels" $labels
     "host" $entry.host
     "replacement" (ternary (printf "%s/${1}" $redirectTo) $redirectTo $preservePath)) }}
{{- end }}
{{- /* Exactly one access middleware, never chained — common.accessMiddleware.
       A private entry gets private-access; a public one gets none and stays
       behind the global websecure chain. */ -}}
{{- $middlewares := list }}
{{- $access := include "common.accessMiddleware" (ternary "public" "private" $isPublic) }}
{{- if $access }}
{{- $middlewares = append $middlewares (dict "name" $access "namespace" "platform-networking") }}
{{- end }}
{{- if $isRedirect }}
{{- $middlewares = append $middlewares (dict "name" (printf "%s-redirect" $routeName)) }}
{{- end }}
{{- if and $emitStripPrefix (not $isRedirect) }}
{{- $middlewares = append $middlewares (dict "name" (printf "%s-strip-prefix" $routeName)) }}
{{- end }}
{{- /* THE SMOKE CONTRACT (kubernetes/charts/common/templates/_smoke.tpl).
       Derived, so an app repo needs no edit to be probed:

         redirect        `/` must answer with the middleware's 301, AND land on
                         the replacement the middleware was built from — a 301
                         to the wrong host is still a 301.
         stripPrefix     the route's prefix + the app's own health path, which
                         is what an outside caller has to ask for to reach it.
         literal prefix  NOT probed. With stripPrefix false the app serves its
                         own routing under the prefix, and nothing here knows
                         which URL below it answers — a guessed one would fail
                         for a route that is perfectly healthy. `smoke:` on the
                         entry is how such a route opts back in.

       `smoke: false` opts out; `smoke: { path, expect }` overrides. */}}
{{- $smoke := dict "probe" true "path" (printf "%s%s" (ternary $path "" $hasPath) $healthPath) "expect" "200" }}
{{- if $isRedirect }}
{{- $_ := set $smoke "path" "/" }}
{{- $_ := set $smoke "expect" "301" }}
{{- $_ := set $smoke "location" (ternary (printf "%s/" $redirectTo) $redirectTo $preservePath) }}
{{- else if and $hasPath (not $stripPrefix) }}
{{- $_ := set $smoke "probe" false }}
{{- end }}
{{- if hasKey $entry "smoke" }}
{{- if kindIs "bool" $entry.smoke }}
{{- $_ := set $smoke "probe" $entry.smoke }}
{{- else }}
{{- $_ := set $smoke "probe" true }}
{{- if $entry.smoke.path }}{{ $_ := set $smoke "path" $entry.smoke.path }}{{ end }}
{{- if $entry.smoke.expect }}{{ $_ := set $smoke "expect" $entry.smoke.expect }}{{ end }}
{{- end }}
{{- end }}
{{- /* A redirect still names a service: Traefik requires one on every route,
       and the redirect middleware answers before it is ever dialled. */}}
---
{{ include "common.ingressRoute" (dict
     "name" $routeName
     "labels" $labels
     "annotations" (include "common.smokeAnnotations" $smoke)
     "match" (printf "Host(`%s`)%s" $entry.host (ternary (printf " && PathPrefix(`%s`)" $path) "" $hasPath))
     "middlewares" $middlewares
     "serviceName" $appName
     "servicePort" 80
     "tlsSecret" (printf "%s-%s-tls" $appName $hostSlug)) }}
{{- end }}
{{- end }}
