# invariant: every key the templates read is defaulted here and nowhere else; empty means
# unset. Each field's shape and semantics is README.md beside this file.

metadata:
  name: ""

# invariant: set by app CI only. meta.repository becomes the app.jterrazz.com/repository
# annotation, the only way scripts/trigger-app-deploys.sh learns the app exists.
meta:
  repository: ""

spec:
  # invariant: set by app CI; empty falls back to <registry>/<app>:latest.
  image: ""
  port: 3000
  servicePort: 80
  replicas: 1
  command: []
  args: []
  # invariant: empty derives it: Recreate when storage is mounted (never two writers).
  strategy: ""
  resources:
    cpu: 100m
    memory: 256Mi
    memoryLimit: ""
  storage: {}
  configFiles: {}
  secretMounts: []
  dashboards: {}
  alerts: {}
  cronJobs: {}
  # value: merged OVER the hardened defaults (app.containerSecurityContext).
  securityContext: {}
  runAsRoot: false
  env: {}
  secrets: {}
  secretsEnv: ""
  ingress: []
  network:
    isolated: false
    exposeTo: []
    egress: []
  # invariant: resolved against app.platformCatalog; an unknown name hard-fails the render.
  platformServices: []
  health:
    path: /health
    livenessPath: ""
    # invariant: the first one set wins: exec, then tcp, then path.
    exec: []
    tcp: false
    # value: Kubernetes' 1s is too tight for a Node app doing in-process background work.
    timeoutSeconds: 5
    # value: 30 x the default 10s period = 300s of boot grace.
    startupFailureThreshold: 30

environments: {}

# outside: set by app CI during helm upgrade --install
environment: ""

# invariant: NO credential here: the pull secret is synced from Infisical. The hostname
# picks which images get it plus `Always`, and what the dockerconfigjson authenticates.
registry:
  server: registry.internal.jterrazz.com
  # invariant: the Infisical project holding the registry account, alone.
  infisicalProject: jterrazz-ci-v-nh-8
