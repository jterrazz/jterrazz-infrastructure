# invariant: every key the templates read is defaulted here and nowhere else (README.md).

metadata:
  name: ""

# invariant: set by app CI: the repository annotation `make redeploy-apps` reads, and the run
# id that rolls the pods on every app deploy.
meta:
  repository: ""
  deployId: ""

spec:
  image: ""
  port: 3000
  servicePort: 80
  replicas: 1
  command: []
  args: []
  strategy: ""
  resources:
    cpu: 100m
    memory: 256Mi
    memoryLimit: ""
  storage: {}
  configFiles: {}
  secretMounts: []
  dashboards: {}
  alerts: {}
  cronJobs: {}
  securityContext: {}
  runAsRoot: false
  env: {}
  secrets: {}
  secretsEnv: ""
  ingress: []
  network:
    isolated: false
    exposeTo: []
    egress: []
  platformServices: []
  health:
    path: /health
    livenessPath: ""
    exec: []
    tcp: false
    # value: 1s is too tight for a Node app doing in-process background work.
    timeoutSeconds: 5
    # value: 30 x the default 10s period: 300s of boot grace.
    startupFailureThreshold: 30

environments: {}

environment: ""

# invariant: no credential: the pull secret is synced from this Infisical project.
registry:
  server: registry.internal.jterrazz.com
  infisicalProject: jterrazz-ci-v-nh-8
