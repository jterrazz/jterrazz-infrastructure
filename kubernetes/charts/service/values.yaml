# service chart defaults
# Each platform service overrides these in kubernetes/services/<svc>/platform.yaml

name: ""
host: ""
port: 80

# Extra hostnames answered by the same IngressRoute and carried as SANs on the
# same certificate. Transitional ONLY, and the point is a rename: a service serves
# its old and new name at once so no consumer breaks. One service, one canonical
# `host` — not a place to park unrelated hostnames.
aliases: []

# Network visibility of the IngressRoute. Chooses which Traefik ipAllowList
# middleware is attached (the two are never chained — Traefik ANDs chained
# ipAllowLists, so chaining allows strictly less, not more):
#
#   private          -> private-access           tailnet humans only. The default.
#   cluster-internal -> cluster-internal-access  strict superset of private:
#                       tailnet humans PLUS the pod/service CIDRs and the
#                       node. For routes something inside the cluster must
#                       also reach (registry image pulls, openpanel SSR).
#   public           -> no access middleware. The route is still behind the
#                       rate-limit / compress / security-headers chain that
#                       the websecure entrypoint attaches globally.
#
# A leftover boolean `private:` key hard-fails the render
# (templates/ingress-route.yaml).
access: private

# Named volumes: <key> -> { size, pathSuffix?, claimName?, nodeLocalPath? }.
# Names and paths address live data — see templates/storage.yaml before
# changing any of them.
#
#   size           required; the PV capacity and the PVC request.
#   pathSuffix     nests the hostPath under <name>/ (one directory per app).
#   claimName      overrides the PVC name only, never the PV or the binding.
#   nodeLocalPath  absolute hostPath OUTSIDE /var/lib/k8s-data, i.e. in the VM
#                  rather than on the Mac share. For data a service works
#                  continuously; it does NOT survive a repave, so point it only
#                  at something reconstructible (grafana-data is the one user).
#
#   storage:
#     data:      { size: 3Gi, pathSuffix: mongo, claimName: storage-svc-0 }
#     uploads:   { size: 5Gi, pathSuffix: uploads }
storage: {}

# Injected at deploy time: the `service` release template in
# kubernetes/helmfile.yaml.gotmpl sets it from $NODE_NAME. Used as the hostPath
# PV's nodeAffinity match.
infrastructure:
  nodeName: ""
