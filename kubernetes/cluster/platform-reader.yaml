---
# invariant: the platform contract suite's identity in CI (harness/, .github/workflows/smoke.yaml):
# this repository's own GitHub OIDC user, reading what the suite discovers and asking the
# authorizer questions, with no stored credential. It writes nothing and reads no Secret.
# docs/decisions/022-the-platform-contract-is-a-typescript-suite-run-from-two-vantages.md
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, services, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list, watch]
  # outside: a SubjectAccessReview asks the authorizer about ANOTHER identity; it grants nothing.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: github:jterrazz/jterrazz-infrastructure
