---
# platform-analytics (OpenPanel). k3s enforces NetworkPolicy, so this is real
# isolation: ClickHouse and Redis run WITHOUT passwords (upstream design), and
# these policies plus the per-workload ones are the only thing keeping another
# namespace off them.
#
# WHAT IS AND IS NOT IN THIS FILE. The namespace BASELINE only — default-deny,
# allow-same-namespace, the namespace-wide DNS egress. Every rule that names
# one workload is declared with that workload, in the `network:` block of its
# values file in kubernetes/services/openpanel/.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # OpenPanel's own pods -> each other (apps to datastores); sourced by the
    # namespace label, so nothing outside platform-analytics matches. This is
    # the whole of what the three datastores admit: their own policies grant
    # nothing, and Traefik reaches only op-api and op-dashboard, which say so
    # themselves.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-analytics

---
# Egress is DEFAULT-DENY for every pod in the namespace (podSelector {} +
# policyTypes: Egress). This policy grants the namespace-wide minimum and
# nothing else; each application release declares the rest — which is what
# keeps the three datastores at "DNS and nothing else".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # All op-* pods -> CoreDNS on 53; namespace-wide because a pod resolves
    # before it can know which namespace answered.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
