---
# invariant: the namespace BASELINE only; the Traefik -> :5000 rule is the workload's, in
# kubernetes/services/registry/app.yaml. Nothing but Traefik reaches the registry.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-registry

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # outside: OPEN: confirm distribution 3.x makes no outbound call before removing this;
    # storage is local, but a wrong guess breaks every app deploy in CI.
    - ports:
        - protocol: TCP
          port: 443
