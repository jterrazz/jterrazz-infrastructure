---
# platform-telemetry — Grafana, the VictoriaMetrics family (metrics/logs/traces),
# kube-state-metrics, node-exporter and the OTel Collector.
#
# k3s enforces NetworkPolicy, so this is real isolation — and it is needed here
# for the same reason platform-analytics needs it: NONE of the three Victoria
# stores authenticates anything, and every write path is always on, with no
# receiver flag to leave off. VictoriaMetrics takes Prometheus remote-write on
# :8428, VictoriaLogs takes OTLP *and* Loki push on :9428, VictoriaTraces takes
# OTLP on :10428. Without this file any pod in the cluster could write junk into
# all three, or read every series, log line and span back out.
#
# TWO rules below are deliberately wider than the rest. Both are called out at
# the rule itself, so neither can be mistaken for an oversight:
#   * OTLP ingest (4317/4318) is open to every namespace — the platformServices
#     contract has nothing narrower to select on.
#   * VictoriaMetrics' egress is unrestricted — it scrapes an annotation-driven
#     target set that a static file cannot enumerate.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Pods in platform-telemetry -> each other, any port, sourced by the namespace
    # label. This ONE rule carries every store-facing flow, because every
    # legitimate client of a store lives here: grafana queries all three stores
    # (8428/9428/10428), otel-collector writes to all three, victoria-metrics
    # scrapes kube-state-metrics:8080. Naming them by pod label instead would be
    # strictly redundant and would drift the day a store moves.
    #
    # CONSEQUENCE: the three stores get NO cross-namespace ingress at all — the
    # only ports reachable from outside this namespace are the collector's two
    # OTLP ports and Grafana's 3000, both below. node-exporter is not covered and
    # cannot be: `hostNetwork: true` means its pod IP IS the node IP, so
    # NetworkPolicy never filters traffic to it (it is scraped via egress below).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-ingest
  namespace: platform-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
  policyTypes:
    - Ingress
  ingress:
    # ANY pod in ANY namespace -> the collector's OTLP ports: the ingest half of
    # the app chart's `platformServices: [otel-collector]` contract.
    #
    # DELIBERATELY namespace-wide, because nothing narrower is expressible.
    # NetworkPolicy has no globbing, so `prod-*` is not a selector; the only
    # labels app namespaces carry are their own names; and the otel-collector
    # catalog entry has no `clientLabel`, so opted-in app pods carry no marker.
    # The narrowing that IS applied is one pod, two ports, and the widest thing
    # granted is "write telemetry". Tightening means adding a clientLabel to that
    # catalog entry — land it only AFTER every app has redeployed carrying it.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-grafana
  namespace: platform-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  policyTypes:
    - Ingress
  ingress:
    # Traefik (kube-system) -> grafana POD port 3000: the private IngressRoute
    # from kubernetes/services/grafana/platform.yaml (grafana.internal.jterrazz.com,
    # `access: private`). Every other pod in this namespace is excluded by the
    # podSelector and stays same-namespace only.
    #
    # 3000, NOT the Service's 80. The Service is `port: 80 -> targetPort:
    # grafana (3000)`, and a NetworkPolicy only ever sees the POD port —
    # kube-proxy has already rewritten the destination by the time the packet is
    # filtered. Same trap, same answer as the 8317-not-80 note in
    # kubernetes/cluster/network-policies/prod-gateway-intelligence.yaml.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000

---
# Egress is DEFAULT-DENY for every pod in the namespace (podSelector {} +
# policyTypes: Egress), so each rule below is load-bearing — a telemetry flow
# not listed here stops working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Everything here -> CoreDNS on 53; namespace-wide because a pod resolves
    # before it can know which namespace answered.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything here -> anything else in platform-telemetry: the mirror of
    # allow-same-namespace above (grafana and the collector to the three
    # stores, VictoriaMetrics to kube-state-metrics).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry
    # -> the kube-apiserver, and -> the public internet on 443: one rule, because
    # on this cluster they are the same destination pattern.
    #
    # NOTE THE MISSING `except`. Copying platform-networking's
    # `0.0.0.0/0 except <RFC1918>` shape here breaks four of six workloads — the
    # apiserver is RFC1918 twice over: pods dial the `kubernetes` ClusterIP
    # (10.43.0.1:443), which iptables DNATs to the node's own 192.168.x.x:6443.
    # Both ports are listed for that reason; which one the filter sees depends on
    # whether it runs before or after DNAT, a CNI detail rather than a contract.
    #
    # Apiserver: grafana's two sidecars, otel-collector's informers,
    # victoria-metrics' kubernetes_sd, kube-state-metrics. 443 outbound:
    # otel-collector -> cloud.langfuse.com, grafana -> grafana.com (plugin
    # install on EVERY pod start).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-victoria-metrics-scrape
  namespace: platform-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-single
      app.kubernetes.io/instance: victoria-metrics
  policyTypes:
    - Egress
  egress:
    # DELIBERATELY UNRESTRICTED, and it has to be. VictoriaMetrics' target set
    # is discovered from prometheus.io annotations at runtime (server.scrape in
    # kubernetes/services/victoria-metrics/helm.yaml), so a static list here
    # would have to be re-derived on every deploy. The blast radius is bounded
    # on the far side instead: a scraper only ever GETs /metrics, and every
    # namespace it reaches into still enforces its own ingress policy.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
