---
# platform-ai — LibreChat plus the standalone MongoDB it stores everything in.
#
# k3s enforces NetworkPolicy, so this is real isolation, and the reason is the
# same one written at the top of kubernetes/services/librechat/mongodb.yaml:
# THE DATABASE HAS NO AUTHENTICATION. mongod listens on 27017 with no user, no
# password and no TLS, and it holds every account and every conversation. Until
# this file existed, any pod in the cluster could read or drop that database.
# These policies are the only thing standing in front of it.
#
# WHAT IS AND IS NOT IN THIS FILE. The namespace BASELINE, and nothing else.
# Both workloads declare their own reach with themselves: LibreChat in the
# `network:` block of kubernetes/services/librechat/service.yaml, mongod in the
# one in kubernetes/services/librechat/mongodb.yaml — which is where the rule
# that substitutes for its missing authentication now lives.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Egress is DEFAULT-DENY for every pod in the namespace (podSelector {} +
# policyTypes: Egress). This policy grants the namespace-wide minimum; the
# LibreChat-only additions live in that service's `network:` block, which is
# what keeps mongod's egress at "DNS and nothing else".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-ai
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Both pods -> CoreDNS on 53; namespace-wide because a pod resolves before
    # it can know which namespace answered. For librechat-mongodb this is the
    # ONLY egress it gets: a database that dials out is a database doing
    # something it was not asked to do.
    #
    # NOTE: no policy here gates the kubelet's tcpSocket probes on 27017.
    # Those are sourced from the node, not from a pod, and k3s' NetworkPolicy
    # enforcement does not filter them — which is why a pod stays Ready under
    # an ingress policy that admits almost nothing.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
