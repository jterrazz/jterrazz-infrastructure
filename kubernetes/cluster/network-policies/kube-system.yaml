---
# kube-system — CoreDNS, Traefik, klipper-lb and metrics-server.
#
# This namespace is last to get a policy on purpose: it is the one where a
# wrong rule takes the whole cluster down rather than one service. Everything
# below is ingress-only, and every allow is here because a real path needs it.
#
# TWO TRAPS, both already paid for elsewhere in this directory:
#
# 1. Policies are evaluated AFTER kube-proxy's DNAT, so every port here is a
#    containerPort, never a Service port. Traefik's Service listens on 80/443
#    and the pod on 8000/8443; a rule naming 80 applies to nothing and the
#    traffic is dropped by the default-deny with nothing logged.
# 2. hostNetwork clients are NOT pods to a NetworkPolicy. cloudflared runs
#    hostNetwork (it has to — see its README) and the apiserver runs on the
#    host, so both arrive as the node address and only an ipBlock matches
#    them. A podSelector-only rule silently excludes them.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# DNS from everywhere, and this rule is why the rest is safe to write. Every
# pod in every namespace resolves through here; scoping it to known namespaces
# would break the next namespace anyone creates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Traefik is the cluster's front door: klipper-lb DNATs the node's 80/443 into
# it, cloudflared dials its ClusterIP from the host netns, and in-cluster
# callers use it for the private hostnames. All three land on 8000/8443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 8443
          protocol: UDP

---
# klipper-lb. THIS IS THE RULE THAT BREAKS THE TAILNET IF IT IS MISSING, and
# it is invisible to every test that goes through cloudflared: the tunnel
# dials Traefik's ClusterIP directly, so public traffic keeps working while
# every tailnet client gets `connection refused` on 443. CI is a tailnet
# client — it pulls from registry.internal.jterrazz.com — so a deploy fails
# with the cluster otherwise green.
#
# The source is the node's own address (kube-proxy hands the packet to the
# svclb pod after DNAT), never a pod, so allow-same-namespace does not cover
# it and only an ipBlock matches.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-svclb-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      svccontroller.k3s.cattle.io/svcname: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 443
          protocol: UDP

---
# The apiserver's metrics API (`kubectl top`, HPA) dials metrics-server from
# the host, so this is an ipBlock and not a namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP

---
# VictoriaMetrics (platform-telemetry) scrapes CoreDNS on 9153 (kube-dns
# Service annotation) and Traefik on 9100 (pod annotation). It is the only
# scraper, so the namespaceSelector is the whole source set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-scrape
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry
      ports:
        - port: 9153
          protocol: TCP
        - port: 9100
          protocol: TCP

---
# klipper-lb's svclb pods forward into Traefik, and the helm-install jobs talk
# to the apiserver; both live here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
