---
# hazard: a wrong rule here takes the whole cluster down. Ports are containerPorts (post
# DNAT: Traefik pod 8000/8443, not 80/443); hostNetwork clients (cloudflared, apiserver)
# match only an ipBlock; docs/decisions/011-every-namespace-is-default-deny.md

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# hazard: DNS from every namespace; scoping it would break the next namespace created.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# hazard: only klipper-lb's svclb pods and the host netns may dial Traefik. The pod CIDR is
# excepted so a pod cannot pass private-access's 10.42.0.0/16 allowance; a pod needing a
# private hostname via Traefik gets its namespace added by name;
# docs/decisions/003-traefiks-service-is-the-tailnet-gate.md
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              svccontroller.k3s.cattle.io/svcname: traefik
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
      ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 8443
          protocol: UDP

---
# hazard: missing, every tailnet client (CI included) gets `connection refused` on 443 while
# public traffic via cloudflared keeps working. Source is the node address: ipBlock only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-svclb-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      svccontroller.k3s.cattle.io/svcname: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 443
          protocol: UDP

---
# outside: the apiserver dials metrics-server from the host, hence an ipBlock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP

---
# outside: VictoriaMetrics scrapes CoreDNS on 9153 and Traefik on 9100; the only scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-scrape
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry
      ports:
        - port: 9153
          protocol: TCP
        - port: 9100
          protocol: TCP
