---
# Additive policy in an app-chart workload's namespace: NetworkPolicies union,
# so this grants platform-ai access without touching the gateway's chart.
#
# It exists because LibreChat is NOT an app-chart workload (its pod labels come
# from the upstream LibreChat chart), so it cannot stamp the
# `platform-client.jterrazz.com/gateway-intelligence` label that the gateway's
# chart-rendered ingress rule selects on. Setting that label via the LibreChat
# chart's podLabels would let this file be deleted; deferred deliberately —
# one fewer moving part in the third-party chart.
#
# The namespace itself is pre-declared in kubernetes/cluster/namespaces.yaml so
# this lands on a fresh cluster before the gateway app's first CI deploy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-librechat
  namespace: prod-gateway-intelligence
spec:
  podSelector:
    matchLabels:
      app: gateway-intelligence
      environment: prod
  policyTypes:
    - Ingress
  ingress:
    # LibreChat (platform-ai) -> gateway-intelligence POD port 8317 (not the
    # Service port 80); sourced by kubernetes/services/librechat/values.yaml's
    # ANTHROPIC_REVERSE_PROXY / configYamlContent baseURL.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ai
      ports:
        - port: 8317
          protocol: TCP
