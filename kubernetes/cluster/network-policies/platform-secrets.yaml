---
# platform-secrets — the Infisical secrets-operator, and nothing else.
#
# The pod holds the machine-identity credentials for the whole Infisical project
# (Secret `infisical-credentials`, written by
# roles/platform/tasks/bootstrap.yml) and mints Kubernetes Secrets in
# EVERY namespace. Most privileged workload in the cluster — but that privilege
# flows entirely through the API SERVER, never pod-to-pod. So it needs no ingress
# at all, and its only egress is "Infisical" plus "the apiserver".

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # NO ingress rules, on purpose. The API server is not an exception: operators
  # are clients of it, and secrets-operator 0.11.5 registers no admission webhook
  # for it to call back into (contrast platform-networking, which DOES need a
  # 10250 hole for cert-manager's). The kubelet's :8081 probes are node-sourced,
  # which k3s' NetworkPolicy enforcement does not filter.

---
# Egress is DEFAULT-DENY (podSelector {} + policyTypes: Egress). Three rules,
# and the operator stops working if any of them goes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # operator -> CoreDNS on 53. Needed twice over: to resolve
    # eu.infisical.com, and to resolve kubernetes.default.svc.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # operator -> https://eu.infisical.com (every InfisicalSecret's `hostAPI`),
    # AND -> the kube-apiserver, which is the same rule because on this cluster
    # they are the same destination shape.
    #
    # NOTE THE MISSING `except`, and do not "tidy" it into the
    # `0.0.0.0/0 except RFC1918` form used for internet-only rules. The
    # apiserver is RFC1918 twice: the pod dials the `kubernetes` Service ClusterIP
    # (10.43.0.1:443), which iptables DNATs to the node's own address
    # (192.168.x.x:6443). Excluding 10/8 and 192.168/16 would cut the operator
    # off from the API server — i.e. from writing a single Secret — while
    # leaving the Infisical fetch working, so the failure would read as "auth
    # broke", not "netpol broke". Both ports are listed because which one the
    # filter sees depends on whether it runs before or after DNAT.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
