---
# invariant: the Infisical operator only: the most privileged pod, but every privilege flows
# through the apiserver, so no ingress and egress to Infisical + apiserver only.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # outside: no ingress on purpose: the operator registers no webhook; kubelet probes are
  # node-sourced and unfiltered.

---
# invariant: egress is default-deny; the operator stops working if any rule goes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # hazard: NO `except`, never tidy it into the internet-only form: the apiserver is
    # 10.43.0.1:443 -> node:6443, and cutting it reads as "auth broke", not "netpol broke";
    # docs/decisions/011-every-namespace-is-default-deny.md
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
