---
# Grafana / VictoriaMetrics / VictoriaLogs / VictoriaTraces /
# kube-state-metrics / node-exporter / OTel Collector.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    # node-exporter runs hostNetwork + hostPath here; baseline forbids both, so
    # enforcing it would evict it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: telemetry

---
# OpenPanel (self-hosted product analytics).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: analytics

---
# The gateway app's namespace, pre-declared here (not by its CI) for the Pod
# Security Admission labels below: Helm's --create-namespace would create an
# unlabelled namespace first and win the race, and PSA enforcement is a cluster
# concern, not an app's. Helm adopts an existing namespace as-is.
apiVersion: v1
kind: Namespace
metadata:
  name: prod-gateway-intelligence
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: app-gateway
