---
# outside: every platform namespace is declared here, never by `kubectl create ns`.

apiVersion: v1
kind: Namespace
metadata:
  name: platform-networking
  labels:
    # invariant: cloudflared and node-exporter need hostNetwork/hostPath, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: networking

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-registry
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: registry

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    # invariant: node-exporter runs hostNetwork + hostPath here; baseline forbids both, so
    # enforcing it would evict it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: telemetry

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: analytics

---
# hazard: pre-declared so PSA labels exist before the app's first `helm --create-namespace`,
# which would create it unlabelled; docs/decisions/018-pod-security-baseline-is-enforced-by-default.md
apiVersion: v1
kind: Namespace
metadata:
  name: prod-gateway-intelligence
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/component: app-gateway
    # invariant: the one app namespace this repo also declares, so it must carry the
    # owner label itself: every platform deploy re-applies this file, and an
    # unlisted label set by the app's first deploy was dropped (2026-10-24);
    # docs/decisions/017-app-repositories-deploy-as-their-github-oidc-identity.md
    app.jterrazz.com/repository: gateway-intelligence
