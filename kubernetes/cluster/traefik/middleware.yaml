---
# value: 100 req/s, burst 200: browsing passes, scrapers do not. Global, on websecure.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: rate-limit
spec:
  rateLimit:
    average: 100
    burst: 200
    # invariant: keyed on Cf-Connecting-Ip, which Cloudflare's edge always overwrites (not
    # spoofable); tailnet traffic, MASQUERADEd by klipper-lb, shares one bucket;
    # docs/decisions/003-traefiks-service-is-the-tailnet-gate.md
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  compress:
    excludedContentTypes:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""

---
# hazard: 10.42/16 is load-bearing: klipper-lb MASQUERADEs every tailnet request to an svclb
# pod source. The tailnet gate is loadBalancerSourceRanges, and allow-traefik-ingress keeps
# every other pod off Traefik; docs/decisions/003-traefiks-service-is-the-tailnet-gate.md
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-access
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: access-control
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10" # Tailscale CGNAT: humans on the tailnet.
      - "127.0.0.1/32" # node-local (hostPort / host-network clients).
      - "10.42.0.0/16" # k3s pod CIDR: the svclb SNAT source (see header).
