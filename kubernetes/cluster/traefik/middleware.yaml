---
# hazard: global rate limit, 100 req/s average, burst 200: normal browsing passes,
# aggressive scrapers do not. Attached to the websecure entrypoint for every
# route (kubernetes/services/traefik/helm-chart-config.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: rate-limit
spec:
  rateLimit:
    average: 100
    burst: 200
    # invariant: key the limiter on the REAL client IP, which for public traffic is
    # `Cf-Connecting-Ip`: Cloudflare's edge sets it on every request it
    # forwards and overwrites a value the client sent, so it cannot be spoofed
    # from the internet. It replaced an XFF walk with an `excludedIPs` list that
    # had to repeat the entrypoint's trustedIPs entry for entry (and a script
    # that checked it did).
    #
    # Tailnet traffic carries no such header and shares one bucket, as it did
    # before: klipper-lb MASQUERADEs it, so it never had a per-client address
    # here. That population is small and authenticated by the tailnet itself.
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  compress:
    excludedContentTypes:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""

---
# invariant: tailnet-only allow-list: platform-service chart `access: private`, app chart
# `public: false`. 10.42/16 is load-bearing, not slack: klipper-lb DNATs and
# MASQUERADEs inside the svclb pod's netns (the Traefik Service is
# externalTrafficPolicy: Cluster), so a tailnet request reaches Traefik with an
# svclb POD source; the tailnet gate on that path is the Service's
# loadBalancerSourceRanges. The node's own image pulls hairpin the same way
# (hostPort -> svclb -> Traefik), so the registry's request log records them as
# http.request.remoteaddr=<svclb pod IP>. What keeps every OTHER pod off private hosts is
# Traefik's own ingress policy, which admits no pod but the svclb one, kube-system's
# own included (allow-traefik-ingress,
# kubernetes/cluster/network-policies/kube-system.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-access
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: access-control
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10" # Tailscale CGNAT: humans on the tailnet.
      - "127.0.0.1/32" # node-local (hostPort / host-network clients).
      - "10.42.0.0/16" # k3s pod CIDR: the svclb SNAT source (see header).
