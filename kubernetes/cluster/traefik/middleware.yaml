---
# value: 100 req/s, burst 200: browsing passes, scrapers do not.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: rate-limit
spec:
  rateLimit:
    average: 100
    burst: 200
    # invariant: the edge always overwrites Cf-Connecting-Ip; tailnet traffic shares one bucket.
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  compress:
    excludedContentTypes:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""

---
# hazard: klipper-lb MASQUERADEs every tailnet request to an svclb pod address, hence 10.42/16;
# allow-traefik-ingress keeps every other pod off Traefik (ADR-003).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-access
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: access-control
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10"
      - "127.0.0.1/32"
      - "10.42.0.0/16"
