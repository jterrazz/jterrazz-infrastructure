---
# invariant: how an app repository deploys itself, with no credential stored anywhere.
# Its CI job authenticates with its GitHub OIDC token as user
# `github:jterrazz/<repo>`, group `github-actions:jterrazz`
# (ansible/roles/k3s/templates/authentication.yaml.j2), and gets exactly two
# things cluster-wide: this ClusterRole, and the right to bind
# `app-namespace-admin` to itself inside a namespace. Everything else it does
# happens inside its own namespaces, through the RoleBinding it creates there.
#
# There is no list of apps: a repository creates its namespaces on its first
# deploy and owns them from then on. Ownership is the
# `app.jterrazz.com/repository` label (the bare repository name), enforced by the policy in policy.yaml;
# RBAC alone cannot express "only namespaces you created".
#
# hazard: admission sees writes, never reads. That is why nothing here grants a read
# across namespaces: a `list secrets` granted cluster-wide would leak every
# Secret no matter what the policy says.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-deployer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, update, patch]
  # outside: the app chart renders its hostPath PersistentVolume (cluster-scoped);
  # policy.yaml pins its path to /var/lib/k8s-data/<pv name minus -data>.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [app-namespace-admin]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: github-actions:jterrazz
---
# invariant: what an app may do INSIDE a namespace it owns, granted by a RoleBinding
# it creates there itself (docker-deploy does it before `helm upgrade`). The
# kinds are the app chart's, plus Helm's own release Secrets and the reads
# `--wait` needs. No pods/exec, no RBAC, no Pod Security labels (policy.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-namespace-admin
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
