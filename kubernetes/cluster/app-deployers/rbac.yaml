---
# invariant: an app CI job authenticates by GitHub OIDC (group github-actions:jterrazz) and
# owns the namespaces it creates, enforced by policy.yaml. hazard: admission never sees
# reads, so grant no cross-namespace read here; docs/decisions/017-app-repositories-deploy-as-their-github-oidc-identity.md
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-deployer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, update, patch]
  # outside: the app chart's hostPath PV is cluster-scoped; policy.yaml pins its path.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [app-namespace-admin]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: github-actions:jterrazz
---
# invariant: bound by the app itself inside a namespace it owns; no exec, RBAC or PSA labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-namespace-admin
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
