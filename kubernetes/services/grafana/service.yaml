# outside: Service-chart values for Grafana (Cert + private IngressRoute + storage).
name: grafana
host: grafana.internal.jterrazz.com
# outside: tailnet-only. Grafana's datasources reach every telemetry backend in the
# cluster; there is no reason for it to answer the public internet.
access: private

# outside: Grafana bounces an unauthenticated browser to /login. 200 is also accepted:
# it is what an anonymous-allowed instance, or a future auth change, would
# serve. Anything else means Grafana is down.
smoke:
  expect: "302,200"

# outside: alert delivery. The operator renders the Infisical path
# /jterrazz-infrastructure/grafana into `grafana-alerting`, and the label is what
# Grafana's alerts sidecar (values.yaml, `sidecar.alerts`) selects: it writes
# the key into provisioning/alerting and reloads, with no pod restart.
#
#   SLACK_WEBHOOK_URL   a Slack incoming-webhook URL. Absent, the file is a bare
#                       `apiVersion: 1` and Grafana keeps its built-in policy;
#                       present, every alert routes to the `slack` contact point.
#
# hazard: the template is the OPERATOR's (text/template + sprig), not Helm's. A
# missing key renders an empty `.Value`, never a sync error, which is what makes
# landing this before the webhook exists safe.
secrets:
  path: /jterrazz-infrastructure/grafana
  secretName: grafana-alerting
  labels:
    grafana_alert: "1"
  template:
    data:
      contact-point-slack.yaml: |
        apiVersion: 1
        {{- with .SLACK_WEBHOOK_URL.Value }}
        contactPoints:
          - orgId: 1
            name: slack
            receivers:
              - uid: slack
                type: slack
                settings:
                  url: {{ quote . }}
        policies:
          - orgId: 1
            receiver: slack
            group_by: [grafana_folder, alertname]
        {{- end }}

storage:
  # invariant: grafana.db: users, API keys, starred dashboards, alert state. Dashboards
  # themselves are provisioned from ConfigMaps and are not stored here.
  data:
    size: 1Gi
    # outside: NODE-LOCAL on purpose: Grafana works this volume continuously and
    # virtiofs makes that measurably worse. See the CPU limit note in
    # values.yaml; the cost is that a repave resets logins, annotations and
    # dashboard-version history, all of which are safe to lose because
    # everything that matters is provisioned from git.
    nodeLocalPath: /var/lib/grafana-node-local

# outside: Traefik -> Grafana, and nothing else from outside platform-telemetry. Every
# other flow Grafana needs (its queries into the three Victoria stores, the
# apiserver, grafana.com for plugin installs) is namespace-wide and stays in
# kubernetes/cluster/network-policies/platform-telemetry.yaml.
network:
  podSelector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ingress:
    # invariant: 3000, NOT the Service's 80. The Service is `port: 80 -> targetPort:
    # grafana (3000)`, and a NetworkPolicy only ever sees the POD port:
    # kube-proxy has already rewritten the destination by the time the packet
    # is filtered.
    - from: traefik
      ports: [3000]
