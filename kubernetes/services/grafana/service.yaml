# outside: platform-service values for Grafana; the upstream chart's are values.yaml.
name: grafana
host: grafana.internal.jterrazz.com
access: private

# outside: an unauthenticated browser is bounced to /login; 200 is accepted too.
smoke:
  expect: "302,200"

# hazard: the operator's template (not Helm's): a missing SLACK_WEBHOOK_URL renders a
# bare `apiVersion: 1` and Grafana keeps its built-in policy, never a sync error.
secrets:
  path: /jterrazz-infrastructure/grafana
  secretName: grafana-alerting
  template:
    data:
      contact-point-slack.yaml: |
        apiVersion: 1
        {{- with .SLACK_WEBHOOK_URL.Value }}
        contactPoints:
          - orgId: 1
            name: slack
            receivers:
              - uid: slack
                type: slack
                settings:
                  url: {{ quote . }}
        policies:
          - orgId: 1
            receiver: slack
            group_by: [grafana_folder, alertname]
        {{- end }}

storage:
  # invariant: grafana.db (users, keys, alert state); dashboards are provisioned, not stored.
  data:
    size: 1Gi
    # outside: node-local, off virtiofs, on purpose; a repave resets logins and history,
    # nothing provisioned; docs/decisions/008-storage-on-orbstack-spends-fsyncs-not-bytes.md
    nodeLocalPath: /var/lib/grafana-node-local

# outside: Traefik only; the rest is the namespace baseline in platform-telemetry.yaml.
network:
  podSelector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ingress:
    # hazard: 3000, not the Service's 80: a NetworkPolicy sees the pod port.
    - from: traefik
      ports: [3000]
