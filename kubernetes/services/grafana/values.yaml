persistence:
  enabled: true
  existingClaim: grafana-data

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    # CPU limit is spin containment, not sizing: Grafana 13's unified-storage
    # enters a lock-contention spiral on grafana.db and eats every core it is
    # given until restarted. Capped so a recurrence degrades Grafana instead
    # of starving the node — it has already contained one.
    #
    # VIRTIOFS IS NOT THE CAUSE, though the first two occurrences (2026-07-26)
    # made it look that way. It recurred on node-local btrfs with the
    # nodeLocalPath fix in place, pegged at exactly the 1500m cap with
    # /api/health 503ing and kubelet SIGKILLing it on liveness. The trigger is
    # CPU starvation: lose the race once and the SQLite transactions behind
    # dashboard.grafana.app never get their lock back —
    #   resource-server ... error="begin: context deadline exceeded"
    # while Grafana times out calling its own apiserver on 127.0.0.1:3000.
    # RECOVERY: scale to 0, move grafana.db aside, scale to 1. The volume is
    # safe to lose (see service.yaml) — everything is provisioned from git.
    cpu: 1500m
    memory: 384Mi

# 3, not the chart's 10: ten ReplicaSets per Deployment is ten objects in a
# SQLite-backed apiserver for a rollback nobody performs. One step back suffices.
revisionHistoryLimit: 3

sidecar:
  # ONE `resources` block covers EVERY sidecar the chart renders (all five
  # containers interpolate `.Values.sidecar.resources` in _pod.tpl — there is no
  # per-sidecar override). Sized rather than left BestEffort because an evicted
  # sidecar is not a visible outage: dashboards and alert rules silently stop
  # updating while Grafana itself stays green.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  # Rules fire and show in the Alerting UI, but no contact point is wired, so
  # nothing is delivered anywhere. Deliberate — delivery is a later step.
  #
  # The RULES themselves live with the app that emits the metric: the app chart
  # renders `spec.alerts` into a ConfigMap labelled grafana_alert=1, which this
  # sidecar picks up from any namespace. Nothing in THIS repo applies app alert
  # rules — one that did would outlive the app it watches.
  alerts:
    enabled: true
    searchNamespace: ALL
    labelValue: "1"

# VictoriaLogs is not a core Grafana datasource — it ships as a plugin, signed
# by VictoriaMetrics and served from the Grafana catalog, so grafana-cli installs
# it with no unsigned-plugin allowlisting. Grafana installs plugins at pod start,
# which means the pod needs egress to grafana.com on every restart.
# https://docs.victoriametrics.com/victorialogs/integrations/grafana/
#
# Metrics and traces need NO plugin: VictoriaMetrics speaks the Prometheus query
# API and VictoriaTraces speaks the Jaeger one, both core datasource types.
plugins:
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    # Provisioning applies these BEFORE the datasources below, and that ordering
    # is what frees the uids: rows are matched by NAME, so these three deletes
    # release `prometheus`/`loki`/`tempo` for the entries that follow. Without
    # them the insert collides on the unique uid index and Grafana logs a
    # provisioning error. Keep them even though the live rows are gone — this
    # file is also what a from-scratch Grafana on a restored grafana.db reads.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      # THE UIDs `prometheus` / `loki` / `tempo` ARE THE STABLE IDENTIFIERS and
      # do NOT track the names or types below. Every dashboard JSON in
      # kubernetes/services/grafana/dashboards/ and every app-shipped alert rule
      # (the app chart's `spec.alerts`, which lives in other repos) references a
      # datasource by uid. Renaming a uid silently breaks all of them.
      - name: VictoriaMetrics
        # VictoriaMetrics serves the Prometheus HTTP API on :8428, so Grafana's
        # core prometheus datasource talks to it directly; MetricsQL is a
        # superset of PromQL, so every panel expression parses.
        type: prometheus
        uid: prometheus
        url: http://victoria-metrics.platform-telemetry.svc:8428
        isDefault: true
      - name: VictoriaLogs
        # Query language is LogsQL, not LogQL.
        type: victoriametrics-logs-datasource
        uid: loki
        url: http://victoria-logs.platform-telemetry.svc:9428
      - name: VictoriaTraces
        # VictoriaTraces exposes a Jaeger-compatible query API under
        # /select/jaeger; the path is part of the URL, not a jsonData option.
        # https://docs.victoriametrics.com/victoriatraces/querying/grafana/
        type: jaeger
        uid: tempo
        url: http://victoria-traces.platform-telemetry.svc:10428/select/jaeger
        jsonData:
          # These point at the uids above — the second reason uid stability
          # matters.
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
