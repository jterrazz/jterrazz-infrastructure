persistence:
  enabled: true
  existingClaim: grafana-data

# hazard: Grafana's default is `wal = false`, and the knob is inert on this image
# anyway: the CGO-free modernc.org/sqlite driver silently ignores it
# (grafana/grafana#127893). WAL is instead a persistent property of the db
# FILE, flipped offline; the driver honours it from then on:
#   kubectl scale deploy grafana -n platform-telemetry --replicas=0
#   sqlite3 /var/lib/grafana-node-local/grafana.db "PRAGMA journal_mode=WAL;"
#   kubectl scale deploy grafana -n platform-telemetry --replicas=1
# A FRESH grafana.db (a repave) starts in rollback mode; re-run the pragma.
# WAL here is hygiene (fewer fsyncs, readers don't block the writer), NOT the
# fix for the CPU spiral; that was the memory limit, see resources below.
grafana.ini:
  database:
    wal: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # outside: spin containment: with the cap, a repeat of the reclaim storm below
    # degrades only Grafana instead of starving the node.
    cpu: 1500m
    # invariant: 768Mi because 384Mi caused the recurring "Grafana spiral" (pegged at the
    # CPU cap, /api/health 503, SQLite "context deadline exceeded", diagnosed
    # 2026-07 as a lock bug, which it never was). Grafana 13's unified storage
    # holds ~320Mi anon, which left the grafana.db + bleve-index FILE pages
    # ~60Mi of the same cgroup budget; every periodic index rebuild pinned
    # memory.max and the kernel's direct reclaim burned the whole CPU quota as
    # system time (measured in the spiral: 98% of usage_usec in system, 549M
    # file refaults, 12.8M memory.max hits, while the Go process itself used
    # 5% of one core per pprof). Shrink this back below ~512Mi and the
    # thrashing returns.
    memory: 768Mi

# invariant: 3, not the chart's 10: ten ReplicaSets per Deployment is ten objects in a
# SQLite-backed apiserver for a rollback nobody performs. One step back suffices.
revisionHistoryLimit: 3

sidecar:
  # hazard: ONE `resources` block covers EVERY sidecar the chart renders (all five
  # containers interpolate `.Values.sidecar.resources` in _pod.tpl; there is no
  # per-sidecar override). Sized rather than left BestEffort because an evicted
  # sidecar is not a visible outage: dashboards and alert rules silently stop
  # updating while Grafana itself stays green.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    # invariant: ConfigMaps only, matching the RBAC below: a sidecar left on the
    # default `both` lists Secrets cluster-wide and gets a 403 on every loop.
    resource: configmap
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  # invariant: alert RULES live with the app that emits the metric: the app chart
  # renders `spec.alerts` into a ConfigMap labelled grafana_alert=1, which this
  # sidecar picks up from any namespace. Nothing in THIS repo applies app alert
  # rules; one that did would outlive the app it watches.
  alerts:
    enabled: true
    searchNamespace: ALL
    resource: configmap
    labelValue: "1"

# hazard: the chart's own ClusterRole grants get/list/watch on configmaps AND secrets
# in every namespace, and the service-account token is mounted in the Grafana
# container too, so a Grafana RCE read every Secret in the cluster (audit
# 2026-10-24: `can-i list secrets -A` answered yes). The sidecars need only
# ConfigMaps (both are `resource: configmap` above), so the binding points at
# this narrower ClusterRole instead, and the chart renders none of its own.
rbac:
  useExistingClusterRole: grafana-sidecar-configmaps
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: grafana-sidecar-configmaps
    rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "watch", "list"]

# invariant: alert DELIVERY, the one Secret Grafana reads. The Slack contact point and
# the policy routing every alert to it arrive as the `grafana-alerting` Secret,
# declared in service.yaml, which says what is delivered when its key is absent.
# Mounted by the kubelet rather than fetched by the alerts sidecar, so Grafana
# needs no Secret RBAC at all. A subPath mount does not follow updates: a new
# SLACK_WEBHOOK_URL lands at the next pod restart
# (`kubectl rollout restart deploy/grafana -n platform-telemetry`).
extraSecretMounts:
  - name: grafana-alerting
    secretName: grafana-alerting
    defaultMode: 0440
    mountPath: /etc/grafana/provisioning/alerting/contact-point-slack.yaml
    subPath: contact-point-slack.yaml
    readOnly: true

# outside: VictoriaLogs is not a core Grafana datasource: it ships as a plugin, signed
# by VictoriaMetrics and served from the Grafana catalog, so grafana-cli installs
# it with no unsigned-plugin allowlisting. Grafana installs plugins at pod start,
# which means the pod needs egress to grafana.com on every restart.
# https://docs.victoriametrics.com/victorialogs/integrations/grafana/
#
# Metrics and traces need NO plugin: VictoriaMetrics speaks the Prometheus query
# API and VictoriaTraces speaks the Jaeger one, both core datasource types.
plugins:
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    # invariant: provisioning applies these BEFORE the datasources below, and that ordering
    # is what frees the uids: rows are matched by NAME, so these three deletes
    # release `prometheus`/`loki`/`tempo` for the entries that follow. Without
    # them the insert collides on the unique uid index and Grafana logs a
    # provisioning error. Keep them even though the live rows are gone; this
    # file is also what a from-scratch Grafana on a restored grafana.db reads.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      # hazard: tHE UIDs `prometheus` / `loki` / `tempo` ARE THE STABLE IDENTIFIERS and
      # do NOT track the names or types below. Every dashboard JSON in
      # kubernetes/services/grafana/dashboards/ and every app-shipped alert rule
      # (the app chart's `spec.alerts`, which lives in other repos) references a
      # datasource by uid. Renaming a uid silently breaks all of them.
      - name: VictoriaMetrics
        # outside: VictoriaMetrics serves the Prometheus HTTP API on :8428, so Grafana's
        # core prometheus datasource talks to it directly; MetricsQL is a
        # superset of PromQL, so every panel expression parses.
        type: prometheus
        uid: prometheus
        url: http://victoria-metrics.platform-telemetry.svc:8428
        isDefault: true
      - name: VictoriaLogs
        # invariant: query language is LogsQL, not LogQL.
        type: victoriametrics-logs-datasource
        uid: loki
        url: http://victoria-logs.platform-telemetry.svc:9428
      - name: VictoriaTraces
        # outside: VictoriaTraces exposes a Jaeger-compatible query API under
        # /select/jaeger; the path is part of the URL, not a jsonData option.
        # https://docs.victoriametrics.com/victoriatraces/querying/grafana/
        type: jaeger
        uid: tempo
        url: http://victoria-traces.platform-telemetry.svc:10428/select/jaeger
        jsonData:
          # invariant: these point at the uids above, the second reason uid stability
          # matters.
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
