# Cloudflared (Cloudflare Tunnel) — the only public ingress path; the host has
# no open public IP.
#
# The tunnel is remote-managed (token-based) and routes PER HOSTNAME, not by
# wildcard: every public hostname needs its own Public Hostname rule in the
# Cloudflare Zero Trust dashboard pointing at Traefik. Adding one there
# auto-creates its CNAME; a bare CNAME with no matching rule 404s. Adding a
# hostname therefore never touches this manifest — see README.md in this dir.
#
# Apply secret.yaml (next to this file) FIRST: the pod CrashLoops until the
# `cloudflared-secrets` Secret it reads exists.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  # One replica is not a single point of failure the way it looks: cloudflared
  # maintains 4 redundant edge connections per replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  strategy:
    # Recreate: edge connections are transient and Cloudflare fails over to the
    # new replica, so there is nothing for a rolling update to protect.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
    spec:
      # hostNetwork so cloudflared dials the Cloudflare edge through the
      # host's network stack rather than CNI. The CNI bridge on OrbStack
      # mangles outbound TCP/7844 to Cloudflare in a way that yields
      # `connect: connection refused` for cloudflared specifically
      # (curl from the same pod IP connects fine; only cloudflared's
      # tunnel handshake gets RSTed at the edge). Bypassing CNI fixes
      # it. Safe because cloudflared has no listening ports — it's an
      # outbound-only QUIC/HTTP2 client.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args:
            - tunnel
            - --no-autoupdate
            # OrbStack's NAT eats outbound UDP/443 so cloudflared can't
            # establish a QUIC connection to the Cloudflare edge (every
            # dial times out with "no recent network activity"). Forcing
            # HTTP/2 falls back to TCP/443 which traverses the NAT fine.
            - --protocol
            - http2
            # Also serves /ready, which both probes below use.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          # /ready returns 200 once at least one edge connection is established;
          # used for liveness too, so a stuck process gets restarted.
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
