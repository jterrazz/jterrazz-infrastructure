# invariant: the only public ingress path. Each public hostname is a Public Hostname
# rule in the Zero Trust dashboard, never an edit here (README.md). CrashLoops until
# `cloudflared-secrets` (service.yaml) exists; docs/decisions/002-public-traffic-enters-through-a-cloudflare-tunnel.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  # value: one replica holds 4 redundant edge connections.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
    spec:
      # hazard: hostNetwork: the OrbStack CNI bridge gets the tunnel handshake on
      # TCP/7844 RSTed. Safe: outbound-only, no listening port but metrics.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args:
            - tunnel
            - --no-autoupdate
            # outside: OrbStack's NAT eats outbound UDP/443 (QUIC); HTTP/2 rides TCP/443.
            - --protocol
            - http2
            # invariant: also serves /ready, which both probes below use.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          # invariant: 200 once an edge connection is up; liveness too, so a stuck process restarts.
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
