# outside: VictoriaTraces single-node, 0.x knowingly (trace history is the one stream we
# can lose; never extend that to metrics or logs). OTLP/HTTP ingest and the Jaeger
# query API on :10428; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md

server:
  # invariant: without this the objects are named <release>-vt-single-server.
  fullnameOverride: victoria-traces

  # hazard: data loss if changed: names the PVC service.yaml declares.
  persistentVolume:
    existingClaim: victoria-traces-data

  # value: 30d.
  retentionPeriod: "720h"

  # value: 300s, longer than the other stores' 60s because trace history is expendable;
  # docs/decisions/008-storage-on-orbstack-spends-fsyncs-not-bytes.md
  extraArgs:
    inmemoryDataFlushInterval: 300s

  # hazard: caches are budgeted from the LIMIT; the request is small on purpose.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      # hazard: too tight OOMKills in a loop and flakes `helm --wait`; measure first.
      memory: 512Mi

  # outside: same as victoria-logs/values.yaml: hostPath arrives root-owned on first boot.
  initContainers:
    - name: fix-permissions
      image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
      command: ["sh", "-c", "chown -R 1000:2000 /storage"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        # invariant: `server-volume` is the chart's fixed name for the data volume.
        - name: server-volume
          mountPath: /storage
