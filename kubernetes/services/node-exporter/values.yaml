# outside: node-exporter, the source of every node_* series; scraped by annotation.

# invariant: without it every object is `node-exporter-prometheus-node-exporter`.
fullnameOverride: node-exporter

# value: 3, not the chart's 10 (ControllerRevisions); see grafana/values.yaml.
revisionHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
