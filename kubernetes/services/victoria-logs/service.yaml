# hazard: storage only, no host. The PVC <name>-<key> = victoria-logs-data is pinned by
# values.yaml's `existingClaim`; rename either half and it starts on a fresh volume.
name: victoria-logs
storage:
  # invariant: no pathSuffix: /var/lib/k8s-data/victoria-logs; nominal size, the Mac disk is the cap.
  data:
    size: 20Gi
