# Service-chart values for VictoriaLogs — storage only. `host` is deliberately
# unset (Grafana and the OTel collector both reach it in-cluster), and
# with no host the chart emits neither IngressRoute nor Certificate.
#
# The PVC name is load-bearing: victoria-logs/values.yaml pins
# `server.persistentVolume.existingClaim: victoria-logs-data`, which is
# <name>-<key> = victoria-logs-data.
#
# No `claimName` override needed: `existingClaim` makes the chart drop its
# StatefulSet volumeClaimTemplate entirely, so the storage-<release>-<ordinal>
# constraint never applies.
name: victoria-logs
storage:
  # No pathSuffix — the PV lands on /var/lib/k8s-data/victoria-logs.
  #
  # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
  data:
    size: 20Gi
