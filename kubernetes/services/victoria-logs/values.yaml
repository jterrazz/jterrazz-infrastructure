server:
  fullnameOverride: victoria-logs

  # hazard: the PVC service.yaml declares; unset, the store starts empty.
  persistentVolume:
    existingClaim: victoria-logs-data

  retentionPeriod: "90d"

  # value: 60s, not 5s: fewer fsyncs over virtiofs (ADR-008).
  extraArgs:
    inmemoryDataFlushInterval: 60s

  # invariant: caches are budgeted from the limit; the request is small on purpose.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 512Mi

  # outside: fsGroup never applies to hostPath, so a fresh data directory is root-owned.
  initContainers:
    - name: fix-permissions
      image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
      command: ["sh", "-c", "chown -R 1000:2000 /storage"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: server-volume
          mountPath: /storage
