# outside: app-chart values for op-dashboard, the Next.js admin UI. It SSRs through
# op-api's Service (API_URL_SSR), so its private host is tailnet-only like any
# other. See config.yaml.
metadata:
  name: op-dashboard

spec:
  image: lindesvard/openpanel-dashboard:2.3.0
  port: 3000
  servicePort: 3000

  # invariant: no uid pin; see the note in op-api.yaml.
  runAsRoot: true

  env:
    ALLOW_REGISTRATION: "false"
    NODE_OPTIONS: "--max-old-space-size=384"

  resources:
    cpu: 50m
    memory: 128Mi
    memoryLimit: 384Mi

  health:
    path: /api/healthcheck

  ingress:
    # outside: the catch-all half of the private host: op-api's route carries the same
    # host with `PathPrefix(/api)`, and Traefik ranks the more specific rule
    # first, so /api/* reaches the API and everything else lands here.
    - host: openpanel.internal.jterrazz.com
      access: private
      tlsSecret: openpanel-tls
      # invariant: the derived probe would be this host's /api/healthcheck, which the more
      # specific route sends to op-api, so it would not test the dashboard
      # at all. It SSRs and bounces an unauthenticated visitor to /login or
      # /onboarding, so 307 is the normal answer and 200 the already-rendered one.
      smoke:
        path: /
        expect: "307,200"

  network:
    exposeTo:
      - traefik
    egress:
      # outside: op-api (SSR, via API_URL_SSR in config.yaml) and the datastores. No
      # Traefik egress any more: until 2026-09-19 the dashboard fetched its own
      # public URL server-side and needed `to: traefik, ports: [8443, 8000]`
      # (8443, not 443: a NetworkPolicy is evaluated after kube-proxy's DNAT,
      # so it sees Traefik's containerPort). Bring that rule back, and the
      # host back into private_hostnames_via_traefik, only if a future image
      # loses API_URL_SSR.
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
