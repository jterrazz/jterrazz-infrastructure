# outside: op-dashboard, the Next.js admin UI; it SSRs through op-api (config.yaml).
metadata:
  name: op-dashboard

spec:
  image: lindesvard/openpanel-dashboard:2.3.0
  port: 3000
  servicePort: 3000

  # invariant: no uid pin; see the note in op-api.yaml.
  runAsRoot: true

  env:
    ALLOW_REGISTRATION: "false"
    NODE_OPTIONS: "--max-old-space-size=384"

  resources:
    cpu: 50m
    memory: 128Mi
    memoryLimit: 384Mi

  health:
    path: /api/healthcheck

  ingress:
    # invariant: the catch-all of the private host; op-api's more specific /api route wins.
    - host: openpanel.internal.jterrazz.com
      access: private
      tlsSecret: openpanel-tls
      # invariant: the derived /api/healthcheck would hit op-api; 307 to /login is normal.
      smoke:
        path: /
        expect: "307,200"

  network:
    exposeTo:
      - traefik
    egress:
      # hazard: no Traefik egress since API_URL_SSR; if an image loses it, see
      # docs/decisions/010-every-workload-renders-through-two-charts.md
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
