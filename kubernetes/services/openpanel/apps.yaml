# OpenPanel application workloads: op-api, op-worker, op-dashboard. Images
# pinned to the 2.2 minor (upstream ships a floating `2`).
#
# op-api owns DB migrations — it runs `migrate:deploy` before `pnpm start`, so
# it must reach Ready before the other two are useful, and its startupProbe is
# sized for first-boot migration time rather than for boot.
#
# ALLOW_REGISTRATION is "false" and appears twice below. To add users: flip
# both to "true", redeploy, invite, flip back — and always keep a password
# login, because OAuth-only plus signup-disabled can lock you out entirely
# (upstream issue #363).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-api
  namespace: platform-analytics
  labels:
    app: op-api
    app.kubernetes.io/part-of: openpanel
spec:
  # Recreate: op-api runs `migrate:deploy` on boot, so a rolling update would
  # put two migration runners on the same databases at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: op-api
  template:
    metadata:
      labels:
        app: op-api
    spec:
      containers:
        - name: op-api
          image: lindesvard/openpanel-api:2.2.1
          # No uid pin: the lindesvard/openpanel-* images do not document the
          # user they run as, and forcing runAsNonRoot on an image expecting
          # root fails the pod outright. OPEN: read the uid out of a running
          # container (`id`) and pin it, for all three op-* Deployments.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              echo 'Running migrations...'
              CI=true pnpm -r run migrate:deploy
              pnpm start
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: openpanel-config
            - secretRef:
                name: openpanel-secrets
          env:
            - name: ALLOW_REGISTRATION
              value: "false"
            # Without this V8 auto-detects a ~256Mi heap ceiling and aborts
            # (exit 134, "JS heap out of memory") well before the cgroup
            # limit. Pinned under the container limit so it GCs instead.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            requests:
              # The request does NOT have to cover the 768Mi max-old-space-size
              # above — that heap ceiling is bounded by the LIMIT (1Gi). Do not
              # lower the limit.
              cpu: 50m
              memory: 480Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: op-api
  namespace: platform-analytics
  labels:
    app: op-api
spec:
  selector:
    app: op-api
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-worker
  namespace: platform-analytics
  labels:
    app: op-worker
    app.kubernetes.io/part-of: openpanel
spec:
  selector:
    matchLabels:
      app: op-worker
  template:
    metadata:
      labels:
        app: op-worker
    spec:
      containers:
        - name: op-worker
          image: lindesvard/openpanel-worker:2.2.1
          # No uid pin — see the note on op-api above.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: openpanel-config
            - secretRef:
                name: openpanel-secrets
          env:
            # Same V8 heap-ceiling guard as op-api; the worker buffers events.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: op-worker
  namespace: platform-analytics
  labels:
    app: op-worker
spec:
  selector:
    app: op-worker
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-dashboard
  namespace: platform-analytics
  labels:
    app: op-dashboard
    app.kubernetes.io/part-of: openpanel
spec:
  selector:
    matchLabels:
      app: op-dashboard
  template:
    metadata:
      labels:
        app: op-dashboard
    spec:
      containers:
        - name: op-dashboard
          image: lindesvard/openpanel-dashboard:2.2.1
          # No uid pin — see the note on op-api above.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: openpanel-config
            - secretRef:
                name: openpanel-secrets
          env:
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: op-dashboard
  namespace: platform-analytics
  labels:
    app: op-dashboard
spec:
  selector:
    app: op-dashboard
  ports:
    - port: 3000
