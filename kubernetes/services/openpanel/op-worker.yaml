# App-chart values for op-worker — the BullMQ consumer that drains the Redis
# queue into ClickHouse. No route, no ingress, and the one op-* release with no
# ALLOW_REGISTRATION to flip.
metadata:
  name: op-worker

spec:
  image: lindesvard/openpanel-worker:2.2.1
  port: 3000
  servicePort: 3000

  # No uid pin — see the note in op-api.yaml.
  runAsRoot: true

  env:
    # Same V8 heap-ceiling guard as op-api; the worker buffers events.
    NODE_OPTIONS: "--max-old-space-size=512"

  resources:
    cpu: 50m
    memory: 320Mi
    memoryLimit: 768Mi

  health:
    path: /healthcheck

  network:
    # No `exposeTo`: nothing outside this namespace reaches the worker, and it
    # keeps working under an ingress policy that admits nothing because the
    # kubelet's probes are sourced from the node, which NetworkPolicy does not
    # filter.
    egress:
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
