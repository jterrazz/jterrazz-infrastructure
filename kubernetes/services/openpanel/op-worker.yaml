# outside: op-worker drains the Redis queue into ClickHouse; no route.
metadata:
  name: op-worker

spec:
  image: lindesvard/openpanel-worker:2.3.0
  port: 3000
  servicePort: 3000

  # invariant: no uid pin; see the note in op-api.yaml.
  runAsRoot: true

  env:
    # invariant: same V8 heap-ceiling guard as op-api; the worker buffers events.
    NODE_OPTIONS: "--max-old-space-size=512"

  resources:
    cpu: 50m
    memory: 320Mi
    memoryLimit: 768Mi

  health:
    path: /healthcheck

  network:
    # invariant: no `exposeTo`: nothing reaches it, and kubelet probes come from the node,
    # which NetworkPolicy does not filter.
    egress:
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
