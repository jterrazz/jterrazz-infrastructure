# outside: op-postgres: orgs, projects, dashboards, users. 17, above OpenPanel's 14 pin
# (14 is EOL 2026-11-12; 18 moved its data layout); docs/decisions/019-openpanel-datastores-run-supported-versions.md
metadata:
  name: op-postgres

environment: prod

spec:
  image: postgres:17-alpine
  port: 5432
  # outside: DATABASE_URL in Infisical dials op-postgres:5432.
  servicePort: 5432

  # outside: uid 70 is the alpine image's `postgres` user (Debian images use 999).
  securityContext:
    runAsUser: 70
    runAsGroup: 70

  env:
    POSTGRES_USER: openpanel
    POSTGRES_DB: openpanel
    # invariant: PGDATA in a subdir so the mount root never fails initdb's empty-dir check.
    PGDATA: /var/lib/postgresql/data/pgdata

  secrets:
    path: /jterrazz-infrastructure/openpanel
    env:
      - POSTGRES_PASSWORD

  storage:
    mountPath: /var/lib/postgresql/data
    # invariant: openpanel-platform owns this claim (service.yaml, Retain); this mounts it.
    claimName: openpanel-postgres
    owner: "70:70"

  health:
    exec: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]

  resources:
    cpu: 25m
    memory: 128Mi
    memoryLimit: 384Mi

  network:
    # hazard: reachable only from this namespace, dialling only DNS, like the two
    # unauthenticated stores beside it.
    isolated: true

environments:
  prod: {}
