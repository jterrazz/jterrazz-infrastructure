# OpenPanel's split exposure. Getting this wrong exposes the admin surface.
#
# PRIVATE  openpanel.internal.jterrazz.com (cluster-internal-access): /api/* -> op-api,
#   /* -> op-dashboard. Admin creation and dashboard browsing happen here.
# PUBLIC   analytics.jterrazz.com (cloudflared, NO access middleware):
#   /api/track -> op-api and NOTHING else — any other path 404s at Traefik,
#   which is what keeps dashboard/admin/export off the internet. Abuse is
#   guarded by the rate-limit middleware the websecure entrypoint attaches to
#   every route (services/traefik/helm-chart-config.yaml) plus OpenPanel's
#   per-project clientId/CORS.
#
# Both hosts strip /api before op-api, which serves /track, /trpc and /live at
# root.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openpanel-strip-api
  namespace: platform-analytics
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openpanel-tls
  namespace: platform-analytics
spec:
  secretName: openpanel-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - openpanel.internal.jterrazz.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openpanel-analytics-tls
  namespace: platform-analytics
spec:
  secretName: openpanel-analytics-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - analytics.jterrazz.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openpanel-private
  namespace: platform-analytics
  annotations:
    # The smoke contract scripts/smoke.sh discovers its checks from — the two
    # charts stamp these, a hand-written route writes them itself. The
    # dashboard SSRs and bounces an unauthenticated visitor to /login or
    # /onboarding, so 307 is the normal answer and 200 the already-rendered
    # one. Contract: kubernetes/charts/common/templates/_smoke.tpl.
    smoke.jterrazz.com/path: "/"
    smoke.jterrazz.com/expect: "307,200"
spec:
  entryPoints:
    - websecure
  routes:
    # Traefik auto-ranks the more specific rule (Host && PathPrefix) above the
    # bare Host rule below, so /api/* reaches op-api and the rest the dashboard.
    - match: Host(`openpanel.internal.jterrazz.com`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        # cluster-internal-access, NOT private-access: op-dashboard SSRs against
        # openpanel.internal.jterrazz.com from inside its own pod, so Traefik sees a
        # plain pod IP. Never chain the two — Traefik ANDs chained ipAllowLists.
        - name: cluster-internal-access
          namespace: platform-networking
        - name: openpanel-strip-api
      services:
        - name: op-api
          port: 3000
    - match: Host(`openpanel.internal.jterrazz.com`)
      kind: Rule
      middlewares:
        # cluster-internal-access, NOT private-access — same reason as above.
        - name: cluster-internal-access
          namespace: platform-networking
      services:
        - name: op-dashboard
          port: 3000
  tls:
    secretName: openpanel-tls
---
# PUBLIC — event ingest only (/api/track), through cloudflared.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openpanel-ingest
  namespace: platform-analytics
  annotations:
    # POST-only by design: only /api/track is routed on this host, and a GET is
    # NOT a valid probe — it answers 404 whether op-api is healthy or not. The
    # probe POSTs an empty JSON object, which reaches op-api and is rejected for
    # want of a client id: 401 proves the route is wired end to end AND that
    # ingest is not anonymous. (A body-less POST answers 400 and a non-JSON one
    # 415 — both prove liveness, only 401 also asserts the auth check runs.)
    # This is the ONE route with a method: no chart emits that annotation.
    smoke.jterrazz.com/method: POST
    smoke.jterrazz.com/path: /api/track
    smoke.jterrazz.com/expect: "401"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`analytics.jterrazz.com`) && PathPrefix(`/api/track`)
      kind: Rule
      middlewares:
        - name: openpanel-strip-api
      services:
        - name: op-api
          port: 3000
  tls:
    secretName: openpanel-analytics-tls
