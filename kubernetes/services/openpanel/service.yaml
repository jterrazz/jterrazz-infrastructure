# Service-chart values for OpenPanel — storage only.
#
# `host` is deliberately unset: OpenPanel is the one service whose ingress the
# chart cannot express (two hostnames, different exposure, path-level routing,
# a stripPrefix middleware), so ingress.yaml in this directory stays
# hand-written.
name: openpanel
storage:
  # Orgs, projects, dashboards, users. PGDATA is a `pgdata` subdir of the
  # mount (postgres.yaml) so initdb's empty-dir check never sees lost+found.
  postgres:
    size: 3Gi
    pathSuffix: postgres
  # BullMQ job queue + event buffer, not a cache: AOF durability is on, so
  # losing this volume loses in-flight events.
  redis:
    size: 1Gi
    pathSuffix: redis
  # The event store — every analytics event ever received.
  clickhouse:
    size: 10Gi
    pathSuffix: clickhouse
