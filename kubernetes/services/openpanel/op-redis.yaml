# invariant: op-redis is the BullMQ queue and event buffer, not a cache (`--appendonly
# yes`). No auth: `network:` below is all that keeps other namespaces off it.
metadata:
  name: op-redis

environment: prod

spec:
  # outside: 7.x as upstream pins, not 8; 7.4's AOF is unreadable by 7.2, so forward
  # only; docs/decisions/019-openpanel-datastores-run-supported-versions.md
  image: redis:7.4.11-alpine
  port: 6379
  # invariant: `redis://op-redis:6379` is REDIS_URL in config.yaml.
  servicePort: 6379

  # invariant: the image's `redis` user is uid 999, group 1000.
  securityContext:
    runAsUser: 999
    runAsGroup: 1000

  args:
    - "redis-server"
    - "--appendonly"
    - "yes"
    # value: `no`, not the `everysec` default: an fsync over virtiofs costs far more
    # than its bytes; a pod restart still replays the AOF; docs/decisions/008-storage-on-orbstack-spends-fsyncs-not-bytes.md
    - "--appendfsync"
    - "no"

  storage:
    mountPath: /data
    claimName: openpanel-redis
    owner: "999:1000"

  health:
    exec: ["redis-cli", "ping"]

  resources:
    cpu: 25m
    memory: 64Mi
    memoryLimit: 256Mi

  network:
    isolated: true

environments:
  prod: {}
