# PostgreSQL for OpenPanel (orgs, projects, dashboards, users). Upstream
# self-hosting pins postgres:14-alpine.
#
# HELD AT 14 ON PURPOSE. OpenPanel pins
# `postgres:14-alpine` in BOTH self-hosting/docker-compose.template.yml and the
# repo-root docker-compose.yml, and documents no supported version anywhere
# else; their self-hosting changelog has never recorded a Postgres bump. The
# only support statement reaching higher is Prisma 6's supported-databases list
# (PG 9.6-18) — that is the ORM, not the application. A major bump is a
# dump/restore one-way door on live data, so it is not worth taking on an
# uncited target. `14-alpine` already floats to the latest 14 patch (14.23).
#
# WORTH SCHEDULING SEPARATELY: PostgreSQL 14 goes EOL 2026-11-12. Before then
# this needs either an OpenPanel release that pins a newer major, or a
# deliberate accept-the-risk migration (procedure in docs/RUNBOOK.md).
#
# Recreate strategy — never two writers
# on one RWO hostPath volume. Data is on the `openpanel-postgres` manual
# hostPath PV/PVC (platform.yaml, Retain) so it survives a repave.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
    app.kubernetes.io/part-of: openpanel
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: op-postgres
  template:
    metadata:
      labels:
        app: op-postgres
    spec:
      # hostPath dirs are created root-owned. The postgres entrypoint would
      # chown PGDATA itself and su-exec down, but pinning uid 70 below means
      # that branch never runs. 70:70 is correct for the ALPINE variant ONLY —
      # the Debian-based postgres images use 999.
      initContainers:
        - name: fix-perms
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
          # Root with only the `chown -R` capabilities — see
          # kubernetes/charts/app/templates/deployment.yaml for why these three.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:14-alpine
          # uid/gid 70 is the alpine image's `postgres` user — the same uid the
          # initContainer above chowns to.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openpanel-secrets
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a subdir so lost+found / hostPath root never
            # collides with initdb's empty-dir check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openpanel-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
spec:
  selector:
    app: op-postgres
  ports:
    - port: 5432
