# `crds.enabled`, not the deprecated `installCRDs: true`.
crds:
  enabled: true
global:
  # 3, and this ONE key covers all three Deployments (controller, webhook,
  # cainjector) — see grafana/values.yaml for the reasoning.
  revisionHistoryLimit: 3
# 128Mi floor on every component: these Go processes spike well above idle RSS
# during cert reconciliation and CRD-watch reconnects, and an OOM-killed
# webhook flips 0/1 and times out `helm --wait` for the whole platform deploy.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
