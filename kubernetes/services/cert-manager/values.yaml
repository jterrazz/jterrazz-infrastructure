crds:
  enabled: true
global:
  # invariant: covers the controller, webhook and cainjector.
  revisionHistoryLimit: 3
# hazard: below 128Mi, reconcile spikes OOM-kill the webhook and time out `helm --wait`.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
