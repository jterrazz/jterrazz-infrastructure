# invariant: `crds.enabled`, not the deprecated `installCRDs: true`.
crds:
  enabled: true
global:
  # invariant: this one key covers controller, webhook and cainjector.
  revisionHistoryLimit: 3
# hazard: 128Mi floor: reconcile spikes OOM-kill the webhook, which times out
# `helm --wait` for the whole platform deploy.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
