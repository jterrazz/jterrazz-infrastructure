---
# DNS-01, not HTTP-01: the cluster has no public inbound path, so an HTTP-01
# challenge could never be reached. Adding a new public zone means adding it to
# the dnsZones list of BOTH issuers below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@jterrazz.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - jterrazz.com
            - clawssify.com
            - sig.news
            - spwn.sh
---
# Staging — higher rate limits, untrusted chain. For testing issuance only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@jterrazz.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - jterrazz.com
            - clawssify.com
            - sig.news
            - spwn.sh
