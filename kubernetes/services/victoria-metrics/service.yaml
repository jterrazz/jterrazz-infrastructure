# hazard: values.yaml mounts victoria-metrics-data by name; rename either and the store starts empty.
name: victoria-metrics
storage:
  # value: nominal; the Mac disk is the cap.
  data:
    size: 20Gi

# invariant: scrape targets are discovered at runtime; each namespace guards its own ingress.
network:
  podSelector:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics
  egress:
    - to: anywhere
