# hazard: storage only, no host. The PVC <name>-<key> = victoria-metrics-data is pinned by
# values.yaml's `existingClaim`; rename either half and it starts on a fresh volume.
name: victoria-metrics
storage:
  # invariant: no pathSuffix: /var/lib/k8s-data/victoria-metrics; nominal size, the Mac disk is the cap.
  data:
    size: 20Gi

# invariant: scrape egress unrestricted on purpose: targets are discovered at runtime,
# and every namespace still enforces its own ingress; docs/decisions/011-every-namespace-is-default-deny.md
network:
  podSelector:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics
  egress:
    - to: anywhere
