# Service-chart values for VictoriaMetrics — storage only. `host` is
# deliberately unset (Grafana and the OTel collector reach it in-cluster), and
# with no host the chart emits neither IngressRoute nor Certificate.
#
# The PVC name is load-bearing: victoria-metrics/values.yaml pins
# `server.persistentVolume.existingClaim: victoria-metrics-data`, which is
# <name>-<key> = victoria-metrics-data. Rename either half and VictoriaMetrics
# starts on a fresh dynamically-provisioned volume.
#
# No `claimName` override is needed even though the chart runs a StatefulSet:
# setting `existingClaim` makes it drop its volumeClaimTemplate and mount this
# PVC by name, so the storage-<release>-<ordinal> constraint never applies.
name: victoria-metrics
storage:
  # No pathSuffix — the PV lands on /var/lib/k8s-data/victoria-metrics.
  #
  # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
  data:
    size: 20Gi

# Scrape egress, DELIBERATELY UNRESTRICTED, and it has to be. The target set is
# discovered from prometheus.io annotations at runtime (server.scrape in
# values.yaml beside this file), so a static list here would have to be
# re-derived on every deploy. The blast radius is bounded on the far side
# instead: a scraper only ever GETs /metrics, and every namespace it reaches
# into still enforces its own ingress policy.
#
# `anywhere`, not `internet`: the apiserver it discovers targets through is
# RFC1918 twice over on this cluster.
network:
  podSelector:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics
  egress:
    - to: anywhere
