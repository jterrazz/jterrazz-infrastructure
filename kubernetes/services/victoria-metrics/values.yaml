# VictoriaMetrics single-node — the metrics store.
#
# Chart: vm/victoria-metrics-single, pinned in kubernetes/helmfile.yaml.gotmpl.
# Two ingest paths, both on :8428 —
#   * it SCRAPES, via `-promscrape.config` (server.scrape below), a
#     Prometheus-compatible scrape config;
#   * it RECEIVES Prometheus remote-write at /api/v1/write from the OTel
#     collector — no receiver flag to enable, the path is always on.
#     https://docs.victoriametrics.com/victoriametrics/url-examples/#apiv1write
#
# All three Victoria charts ship the server as a StatefulSet whose Service is
# HEADLESS (`clusterIP: None`) — it doubles as the StatefulSet's governing
# service, so `kubectl get svc` shows no ClusterIP and the name resolves to the
# pod IP directly. Left at the chart default: giving it a ClusterIP would break
# the per-pod DNS a StatefulSet guarantees.

server:
  # Without this the objects are named <release>-victoria-metrics-single-server.
  # Every consumer (Grafana datasource, the collector's remote-write exporter)
  # addresses the Service by name, so keep it short and stable.
  fullnameOverride: victoria-metrics

  # DATA LOSS IF CHANGED. Names the PVC that kubernetes/services/victoria-metrics/
  # service.yaml creates (<name>-<key> = victoria-metrics-data) over a hostPath
  # PV at /var/lib/k8s-data/victoria-metrics.
  #
  # `existingClaim` is load-bearing beyond the name: this chart runs the server
  # as a StatefulSet, and setting existingClaim makes the template drop its
  # volumeClaimTemplate entirely and mount the named PVC instead. Unset it and
  # the StatefulSet provisions server-volume-victoria-metrics-0 from the default
  # StorageClass and starts on an empty TSDB.
  persistentVolume:
    existingClaim: victoria-metrics-data

  # Age-based only. Do NOT add `-retention.maxDiskSpaceUsageBytes`: a size cap
  # silently clips the window (a 2GB cap gives roughly 7d here).
  retentionPeriod: "30d"

  # 60s, against the 5s default. Each flush writes a new part directory, and on
  # this target a flush is charged per fsync rather than per byte — see the
  # ~135KB-per-fsync gotcha in CLAUDE.md. What 60s risks is data still in RAM on
  # an UNCLEAN exit (OOM kill, SIGKILL, hard reset); a graceful stop flushes.
  # Upstream documents the flag for this exact trade. victoria-logs matches;
  # victoria-traces runs 300s, for the reason stated there.
  extraArgs:
    inmemoryDataFlushInterval: 60s

  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 896Mi

  # Reproduces the scrape surface of prometheus-community/prometheus 29.19.0's
  # default `serverFiles."prometheus.yml"` — derived by rendering that chart, not
  # hand-approximated. Enabling it also renders the ClusterRole/Binding
  # kubernetes_sd needs and mounts the config at /scrapeconfig/scrape.yml.
  # Two upstream jobs are deliberately absent: `kubernetes-services` (blackbox
  # probe; no Service carries prometheus.io/probe and its targets rewrite to the
  # unresolvable `blackbox`) and `prometheus-pushgateway` (disabled). The
  # `*-slow` variants stay — the fast jobs' `drop` rules reference them.
  scrape:
    enabled: true
    config:
      global:
        # 1m, not the chart's 15s default — Prometheus scraped at 1m here and a
        # 4x resolution bump is a 4x sample-rate bump on a memory-bound node.
        scrape_interval: 1m

      scrape_configs:
        # VictoriaMetrics' own metrics, on the port it listens on.
        - job_name: victoriametrics
          static_configs:
            - targets: ["localhost:8428"]

        - job_name: kubernetes-api-servers
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
            - action: keep
              regex: default;kubernetes;https
              source_labels:
                - __meta_kubernetes_namespace
                - __meta_kubernetes_service_name
                - __meta_kubernetes_endpointslice_port_name
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # CARDINALITY. These per-(verb × resource × subresource × scope × le)
          # histograms grow with the API surface, not with anything this cluster
          # does, and nothing reads them — no dashboard, no app alert rule.
          # Dropped at INGEST so they cost no index, cache or disk. Only the
          # `_bucket` series match, so _count/_sum survive and averages stay
          # computable. Measure via /api/v1/status/tsdb before re-adding one.
          metric_relabel_configs:
            - action: drop
              source_labels:
                - __name__
              regex: apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|etcd_request_duration_seconds_bucket

        - job_name: kubernetes-nodes
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true

        # cadvisor. Both Grafana dashboards depend on this job:
        # container_cpu_usage_seconds_total / container_memory_working_set_bytes
        # / container_network_*_bytes_total come from nowhere else.
        - job_name: kubernetes-nodes-cadvisor
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          metrics_path: /metrics/cadvisor
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels:
                - __metrics_path__
              target_label: metrics_path
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true

        - job_name: kubernetes-pods
          honor_labels: true
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            - action: drop
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
              replacement: "[$2]:$1"
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (\d+);((([0-9]+?)(\.|$)){4})
              replacement: $2:$1
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_name
              target_label: pod
            - action: drop
              regex: Pending|Succeeded|Failed|Completed
              source_labels:
                - __meta_kubernetes_pod_phase
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node

        - job_name: kubernetes-pods-slow
          honor_labels: true
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
              replacement: "[$2]:$1"
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (\d+);((([0-9]+?)(\.|$)){4})
              replacement: $2:$1
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_name
              target_label: pod
            - action: drop
              regex: Pending|Succeeded|Failed|Completed
              source_labels:
                - __meta_kubernetes_pod_phase
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node
          scrape_interval: 5m
          scrape_timeout: 30s

        # This is the job that picks up kube-state-metrics and node-exporter:
        # both charts annotate their own Service with prometheus.io/scrape=true.
        # Discovery is annotation-driven, so there is no install-order constraint
        # between those releases and this one.
        - job_name: kubernetes-service-endpoints
          honor_labels: true
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scrape
            - action: drop
              regex: true
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
            # DEDUP. Without this, a MULTI-PORT Service annotated
            # prometheus.io/scrape=true yields one target per endpointslice port,
            # and the __address__ rewrite below collapses them all onto the one
            # prometheus.io/port — N identical targets, scraped N times
            # (kube-system/kube-dns is the only such Service today). Spelling it
            # as `regex: (\d+);\1` does not work: RE2 has no backreferences, so
            # keep_if_equal (a VictoriaMetrics extension) is the only option.
            # THE `if` GUARD IS LOAD-BEARING: kube-state-metrics and node-exporter
            # set scrape=true with NO prometheus.io/port, and unguarded this rule
            # compares against an empty label and drops both — i.e. both dashboards.
            - action: keep_if_equal
              if: '{__meta_kubernetes_service_annotation_prometheus_io_port=~".+"}'
              source_labels:
                - __meta_kubernetes_endpointslice_port
                - __meta_kubernetes_service_annotation_prometheus_io_port
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (.+?)(?::\d+)?;(\d+)
              replacement: $1:$2
              source_labels:
                - __address__
                - __meta_kubernetes_service_annotation_prometheus_io_port
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_service_name
              target_label: service
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node

        - job_name: kubernetes-service-endpoints-slow
          honor_labels: true
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
            # Same dedup as the fast job above — see the DEDUP comment there for
            # why it exists and why the `if` guard is not optional. No Service
            # sets prometheus.io/scrape_slow today, so this has no live effect;
            # it is here so the bug does not come back with the first one that
            # does.
            - action: keep_if_equal
              if: '{__meta_kubernetes_service_annotation_prometheus_io_port=~".+"}'
              source_labels:
                - __meta_kubernetes_endpointslice_port
                - __meta_kubernetes_service_annotation_prometheus_io_port
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (.+?)(?::\d+)?;(\d+)
              replacement: $1:$2
              source_labels:
                - __address__
                - __meta_kubernetes_service_annotation_prometheus_io_port
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_service_name
              target_label: service
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node
          scrape_interval: 5m
          scrape_timeout: 30s
