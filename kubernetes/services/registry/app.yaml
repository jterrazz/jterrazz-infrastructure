# hazard: Zot's policies add to defaultPolicy and never narrow it, so write is granted by name to
# the push account's two rotation names and every other user, kubelet included, reads (ADR-014).
metadata:
  name: registry

environment: prod

spec:
  image: ghcr.io/project-zot/zot:v2.1.22
  port: 5000
  servicePort: 5000

  storage:
    mountPath: /var/lib/zot
    # invariant: registry-platform owns this claim.
    claimName: registry-zot
    owner: "1000:1000"

  secretMounts:
    # invariant: written by ansible/roles/platform/tasks/bootstrap.yml.
    - secretName: registry-auth
      mountPath: /auth

  configFiles:
    config.json:
      path: /etc/zot/config.json
      content: |
        {
          "distSpecVersion": "1.1.1",
          "storage": {
            "rootDirectory": "/var/lib/zot",
            "dedupe": true,
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "6h",
            "retention": {
              "delay": "24h",
              "policies": [
                { "repositories": ["**"], "deleteReferrers": true, "deleteUntagged": true }
              ]
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "compat": ["docker2s2"],
            "auth": { "htpasswd": { "path": "/auth/htpasswd" } },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [
                    { "users": ["deploy", "deploy-next"], "actions": ["read", "create", "update", "delete"] }
                  ],
                  "defaultPolicy": ["read"]
                }
              }
            }
          },
          "log": { "level": "info" }
        }

  # invariant: `/v2/` answers 401, so the probes use Zot's own endpoints.
  health:
    path: /readyz
    livenessPath: /livez

  resources:
    cpu: 10m
    memory: 128Mi
    # hazard: a tight limit thrashes Go's GC on large blobs until buildkit's upload times out.
    memoryLimit: 512Mi

  network:
    isolated: true
    exposeTo:
      - traefik

environments:
  prod: {}
