# invariant: the registry workload; service.yaml (`registry-platform`) owns the route,
# certificate and the blob PV/PVC this release only mounts. One htpasswd account,
# so a password rotation overlaps two accounts; docs/decisions/014-the-registry-collects-its-own-garbage.md
metadata:
  name: registry

environment: prod

spec:
  # hazard: distribution 3.x reads its config at /etc/distribution/config.yml; a
  # config file mounted at the 2.x path would be silently ignored.
  image: registry:3.1.2
  port: 5000
  # outside: containerd and CI both dial `registry.internal.jterrazz.com` and terminate at
  # Traefik, whose IngressRoute (service.yaml) names port 5000.
  servicePort: 5000

  # hazard: root-owned blob store; `storage.owner: ""` avoids chowning it every start.
  runAsRoot: true

  env:
    # hazard: not redundant: the image bakes in `log.level: debug`, which dumps every
    # request's spans as JSON; docs/decisions/014-the-registry-collects-its-own-garbage.md
    REGISTRY_LOG_LEVEL: "info"
    REGISTRY_AUTH: "htpasswd"
    REGISTRY_AUTH_HTPASSWD_REALM: "Registry"
    # invariant: /auth is the secretMount below; `htpasswd` is the Secret key.
    REGISTRY_AUTH_HTPASSWD_PATH: "/auth/htpasswd"
    REGISTRY_STORAGE_DELETE_ENABLED: "true"
    # hazard: the empty value disables the in-memory blob-descriptor cache, which
    # registry-gc needs: a swept layer stays "present" and the next push re-using it
    # writes an unpullable tag; docs/decisions/014-the-registry-collects-its-own-garbage.md
    REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: ""

  storage:
    mountPath: /var/lib/registry
    # invariant: from the platform-service chart (service.yaml -> storage.data).
    claimName: registry-data
    owner: ""

  secretMounts:
    # outside: bootstrapped by ansible/roles/platform/tasks/bootstrap.yml.
    - secretName: registry-auth
      mountPath: /auth

  # hazard: probe `/`, not `/v2/`: with htpasswd, `/v2/` answers 401 and kubelet
  # would CrashLoop a healthy registry.
  health:
    path: /

  resources:
    cpu: 10m
    memory: 128Mi
    # hazard: a tight limit makes Go's GC thrash on large blobs until buildkit's upload
    # times out ("blob upload invalid"), not an OOM.
    memoryLimit: 512Mi

  network:
    # invariant: only Traefik reaches :5000; `isolated` withholds internet egress.
    isolated: true
    exposeTo:
      - traefik

  # hazard: only correct while the blob-descriptor cache is off (env above). Skips
  # itself (exit 0) if an upload moved in the last 30 minutes; re-run `--dry-run`
  # before bumping `image:`; docs/decisions/014-the-registry-collects-its-own-garbage.md
  cronJobs:
    gc:
      schedule: "30 3 * * 0"
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          root=/var/lib/registry/docker/registry/v2/repositories
          if [ -n "$(find "$root" -path '*/_uploads/*' -mmin -30 2>/dev/null | head -n 1)" ]; then
            echo "registry-gc: an upload was touched in the last 30 minutes; skipping this run"
            exit 0
          fi
          echo "registry-gc: before $(du -sh /var/lib/registry | cut -f1)"
          registry garbage-collect --quiet --delete-untagged /etc/distribution/config.yml
          echo "registry-gc: after $(du -sh /var/lib/registry | cut -f1)"
      storage: true
      activeDeadlineSeconds: 1800

  # invariant: prod-only, like every spec.alerts; delivery is grafana/service.yaml's.
  # Measured from the last success; NoData alerts after `for: 1h`, so a fresh
  # CronJob has a scrape to appear first.
  alerts:
    registry: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: registry
          folder: registry
          interval: 1h
          rules:
            - uid: registry-gc-stale
              title: registry garbage collection has not succeeded in 8 days
              condition: C
              for: 1h
              noDataState: Alerting
              execErrState: OK
              labels:
                severity: warning
              annotations:
                summary: >-
                  registry-gc last succeeded more than 8 days ago (it runs weekly).
                  Untagged manifests are piling up on the node's disk again. Read
                  `kubectl logs -n platform-registry job/<latest registry-gc job>`.
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    refId: A
                    expr: 'time() - max(kube_cronjob_status_last_successful_time{namespace="platform-registry", cronjob="registry-gc"} or kube_cronjob_created{namespace="platform-registry", cronjob="registry-gc"})'
                    instant: false
                    range: true
                    intervalMs: 60000
                    maxDataPoints: 43200
                - refId: B
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: last
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator:
                          type: gt
                          params: [691200]

environments:
  prod: {}
