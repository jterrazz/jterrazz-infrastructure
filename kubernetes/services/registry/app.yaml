# App-chart values for the private container registry — the workload half.
# The IngressRoute, Certificate and blob PV/PVC are service.yaml next to this
# file (the `registry-platform` release, which owns the volume this one only
# mounts).
#
# AUTH is htpasswd because the registry image offers only that or `token`, and
# `token` needs a whole separate JWT-issuing server for a single-user registry.
# ONE account (`deploy`), bcrypt-hashed; the hash is in Secret `registry-auth`
# key `htpasswd`, bootstrapped by ansible/roles/platform/tasks/bootstrap.yml
# because a password hash must never be committed. Consequence: CI's pushes and
# every namespace's synced pull secret share one credential, which is why
# rotating it is an overlap of two accounts and not a swap — docs/04-operating.md,
# § Rotating the registry password. The other half of the story is `network:`
# below — nothing but Traefik reaches :5000 at all.
metadata:
  name: registry

environment: prod

spec:
  # distribution 3.x. The 2.8 -> 3.x jump is safe HERE specifically because
  # this workload configures the registry entirely through REGISTRY_* env vars
  # and mounts no config file: 3.0 moved the default config path from
  # /etc/docker/registry/config.yml to /etc/distribution/config.yml, so a
  # bind-mounted config at the old path would be silently ignored. If one is
  # ever added (spec.configFiles), mount it at the NEW path.
  #
  # The on-disk layout is unchanged (storagePathVersion is still "v2" in 3.x),
  # so /var/lib/registry is read in place — no migration. What 3.x drops:
  # schema1 manifests, the oss/swift storage drivers, the `reporting:` config
  # block, and TLS 1.0/1.1 as selectable minimums. None are used here (buildkit
  # pushes schema2/OCI, storage is filesystem, TLS terminates at Traefik).
  image: registry:3.1.1
  port: 5000
  # containerd and CI both dial `registry.internal.jterrazz.com` and terminate at
  # Traefik, whose IngressRoute (service.yaml) names port 5000.
  servicePort: 5000

  # The image runs as root and its blob store is root-owned. Pinning a uid
  # would need the whole tree chowned; `storage.owner: ""` says the same thing
  # from the other side — do not chown 10Gi of layers on every pod start.
  runAsRoot: true

  env:
    # THE LOG-VOLUME FIX — do not drop as redundant. No config file is mounted,
    # but the image BAKES IN distribution's config-dev.yml, which sets
    # `log.level: debug`; REGISTRY_* env overrides it. At debug, distribution
    # dumps every request's spans as JSON through the logger
    # (tracing/loggerwriter.go emits each span at DEBUG), and
    # OTEL_TRACES_EXPORTER does not stop that — the level is the switch.
    REGISTRY_LOG_LEVEL: "info"
    REGISTRY_AUTH: "htpasswd"
    REGISTRY_AUTH_HTPASSWD_REALM: "Registry"
    # /auth is the secretMount below; `htpasswd` is the Secret key.
    REGISTRY_AUTH_HTPASSWD_PATH: "/auth/htpasswd"
    REGISTRY_STORAGE_DELETE_ENABLED: "true"
    # NO BLOB-DESCRIPTOR CACHE — load-bearing for registry-gc below; do not
    # drop as a micro-optimisation. The image bakes in `storage.cache.
    # blobdescriptor: inmemory`, and garbage-collect never tells that cache
    # what it swept (it runs in its own pod anyway). A push that re-uses a
    # swept layer is then told "Layer already exists", skips the upload, and
    # the tag it writes cannot be pulled — until the registry restarts.
    # Reproduced on 2026-09-23 against registry:3.1.1 in a throwaway container:
    # cache on, the re-pushed image was broken; cache off, it pushed and pulled
    # fine. Upstream: distribution/distribution#1803, #3802, #4269, all still
    # open. The empty value disables it — the registry logs "unknown cache type
    # … caching disabled" at boot, which is the confirmation, not a fault.
    # Every blob lookup then reads the filesystem, which for one user's
    # registry is nothing.
    REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: ""

  storage:
    mountPath: /var/lib/registry
    # From the platform-service chart (service.yaml -> storage.data).
    claimName: registry-data
    owner: ""

  secretMounts:
    # Bootstrapped by ansible/roles/platform/tasks/bootstrap.yml.
    - secretName: registry-auth
      mountPath: /auth

  # Probe `/`, NOT `/v2/`: with REGISTRY_AUTH=htpasswd, `GET /v2/` answers 401
  # without credentials, which kubelet reads as a failure and which would
  # CrashLoop a healthy registry. Port 5000 deliberately, not the debug
  # listener on 5001 (which config-dev.yml also enables, serving /debug/health
  # and /metrics unauthenticated): a probe belongs on the port the Service
  # targets, so that a wedged main listener actually fails readiness.
  health:
    path: /

  resources:
    cpu: 10m
    memory: 128Mi
    # Do not lower: a tight limit makes Go's GC thrash while streaming a large
    # blob, throughput collapses to ~0.6MB/s, and buildkit's ~60s upload
    # timeout fires — surfacing as "blob upload invalid" on the retried,
    # wrong-offset resume rather than as an OOM.
    memoryLimit: 512Mi

  network:
    # Traefik and nothing else: every pull and push arrives that way, and there
    # is no direct ClusterIP consumer. `isolated` is what keeps the chart from
    # also granting the internet egress an app gets — storage is a local
    # hostPath, so DNS (which the namespace baseline grants) is the whole of
    # what the registry legitimately dials.
    isolated: true
    exposeTo:
      - traefik

  # GARBAGE COLLECTION. Every CI push moves `:latest` to a new manifest and
  # leaves the old one behind, untagged but still holding its layers — a
  # registry never deletes on its own, by design, so that a digest stays
  # pullable for a rollback. Nothing here pulls by digest (every workload
  # references a tag), so the history is pure weight: on 2026-09-23 it was 796
  # manifests for 10 tags, 14G of blobs, and a one-off collection took it to
  # 1.0G.
  #
  # It is only correct because the blob-descriptor cache is off (env above):
  # with it on, a layer this job sweeps stays "present" in the registry's
  # memory, and the next push that re-uses it breaks its tag.
  #
  # `--delete-untagged` is safe on what buildkit pushes: each tag points at an
  # OCI index whose image and attestation manifests carry no tag of their own,
  # and 3.1.1 marks an index's children before it sweeps (verified against the
  # dry run on every live tag). RE-VERIFY with `--dry-run` before bumping
  # `image:` — an older distribution swept those children and broke the tag.
  #
  # THE RACE, and why this is a guard and not the textbook answer. A collection
  # marks, then sweeps; a push that uploads its layers during the mark and
  # writes its manifest before the sweep leaves a tag pointing at deleted
  # blobs. Distribution's answer is read-only mode for the duration, but it
  # cannot be toggled on a running registry: it is a config block (the
  # REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED env var PANICS 3.1.1 at boot —
  # "readonly config key must contain additional keys"), so flipping it means
  # two restarts, and under Recreate each one is a full outage of the registry
  # every deploy logs into. Instead: the only pushers are app CI on merge (no
  # repo builds on a schedule), so the run sits at 03:30 UTC on a Sunday, and
  # it skips itself if any upload was touched in the last 30 minutes. The
  # skip exits 0 on purpose; the alert below is on the last SUCCESS, so a
  # registry that skips every week still surfaces after eight days.
  cronJobs:
    gc:
      schedule: "30 3 * * 0"
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          root=/var/lib/registry/docker/registry/v2/repositories
          if [ -n "$(find "$root" -path '*/_uploads/*' -mmin -30 2>/dev/null | head -n 1)" ]; then
            echo "registry-gc: an upload was touched in the last 30 minutes; skipping this run"
            exit 0
          fi
          echo "registry-gc: before $(du -sh /var/lib/registry | cut -f1)"
          registry garbage-collect --quiet --delete-untagged /etc/distribution/config.yml
          echo "registry-gc: after $(du -sh /var/lib/registry | cut -f1)"
      storage: true
      activeDeadlineSeconds: 1800

  # prod-only, like every spec.alerts. No contact point is wired (see
  # kubernetes/services/grafana/values.yaml): it shows in the Alerting UI.
  # The age is measured from the last success, or from the CronJob's creation
  # when it has never succeeded — max() picks the later, and a success is
  # always later than the creation. NoData means the CronJob itself is gone,
  # which is the same fact as "nothing collects", so it alerts too — but only
  # after `for: 1h`, i.e. two hourly evaluations in a row. A CronJob that has
  # just been created (a first deploy, a repave) has no series yet until
  # kube-state-metrics' next scrape, and with `for: 0s` its very first
  # evaluation fired a NoData alert (2026-09-23).
  alerts:
    registry: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: registry
          folder: registry
          interval: 1h
          rules:
            - uid: registry-gc-stale
              title: registry garbage collection has not succeeded in 8 days
              condition: C
              for: 1h
              noDataState: Alerting
              execErrState: OK
              labels:
                severity: warning
              annotations:
                summary: >-
                  registry-gc last succeeded more than 8 days ago (it runs weekly).
                  Untagged manifests are piling up on the node's disk again — read
                  `kubectl logs -n platform-registry job/<latest registry-gc job>`.
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    refId: A
                    expr: 'time() - max(kube_cronjob_status_last_successful_time{namespace="platform-registry", cronjob="registry-gc"} or kube_cronjob_created{namespace="platform-registry", cronjob="registry-gc"})'
                    instant: false
                    range: true
                    intervalMs: 60000
                    maxDataPoints: 43200
                - refId: B
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: last
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator:
                          type: gt
                          params: [691200]

environments:
  prod: {}
