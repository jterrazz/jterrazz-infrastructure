# invariant: the registry workload, Zot; service.yaml (`registry-platform`) owns the
# route, certificate and the PV/PVCs this release only mounts. Two htpasswd
# accounts (registry-auth, generated by Ansible from the jterrazz-ci Infisical
# project): `kubelet` reads only (accessControl below, the name is
# REGISTRY_PULL_USERNAME), the push account does everything, and its rotation
# overlaps two names;
# docs/decisions/014-the-registry-collects-its-own-garbage.md
metadata:
  name: registry

environment: prod

spec:
  image: ghcr.io/project-zot/zot:v2.1.22
  port: 5000
  # outside: containerd and CI both dial `registry.internal.jterrazz.com` and terminate at
  # Traefik, whose IngressRoute (service.yaml) names port 5000.
  servicePort: 5000

  storage:
    mountPath: /var/lib/zot
    # invariant: from the platform-service chart (service.yaml -> storage.zot), a
    # directory of its own beside distribution's old one, which stays as the
    # rollback until it is deleted by hand.
    claimName: registry-zot
    owner: "1000:1000"

  secretMounts:
    # outside: bootstrapped by ansible/roles/platform/tasks/bootstrap.yml.
    - secretName: registry-auth
      mountPath: /auth

  configFiles:
    config.json:
      path: /etc/zot/config.json
      content: |
        {
          "distSpecVersion": "1.1.1",
          "storage": {
            "rootDirectory": "/var/lib/zot",
            "dedupe": true,
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "6h",
            "retention": {
              "delay": "24h",
              "policies": [
                { "repositories": ["**"], "deleteReferrers": true, "deleteUntagged": true }
              ]
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "compat": ["docker2s2"],
            "auth": { "htpasswd": { "path": "/auth/htpasswd" } },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [ { "users": ["kubelet"], "actions": ["read"] } ],
                  "defaultPolicy": ["read", "create", "update", "delete"]
                }
              }
            }
          },
          "log": { "level": "info" }
        }

  # invariant: Zot's own probes; `/v2/` answers 401 with htpasswd and would CrashLoop
  # a healthy registry.
  health:
    path: /readyz
    livenessPath: /livez

  resources:
    cpu: 10m
    memory: 128Mi
    # hazard: a tight limit makes Go's GC thrash on large blobs until buildkit's upload
    # times out ("blob upload invalid"), not an OOM.
    memoryLimit: 512Mi

  network:
    # invariant: only Traefik reaches :5000; `isolated` withholds internet egress.
    isolated: true
    exposeTo:
      - traefik

environments:
  prod: {}
