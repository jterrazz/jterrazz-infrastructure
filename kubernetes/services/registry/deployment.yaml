# Private container registry — Deployment + Service only. The
# IngressRoute/Certificate/PV/PVC come from the service chart (service.yaml in
# this directory).
#
# AUTH is htpasswd because the registry image offers only that or `token`,
# and `token` needs a whole separate JWT-issuing server for a single-user
# registry. ONE account (`deploy`), bcrypt-hashed; the hash is in Secret
# `registry-auth` key `htpasswd`, bootstrapped by
# ansible/roles/platform/tasks/bootstrap.yml because a password hash must never
# be committed. Consequence: CI pushes and containerd's node-level pulls share
# one credential, so rotating means re-running that task AND updating
# DOCKER_REGISTRY_PASSWORD in Infisical. The other half of the story is
# kubernetes/cluster/network-policies/platform-registry.yaml — nothing but
# Traefik reaches :5000 at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: platform-registry
  labels:
    app: registry
spec:
  # Recreate: /var/lib/registry is an RWO hostPath PVC, and two writers on one
  # is the same trap the three openpanel datastores avoid.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          # distribution 3.x. The 2.8 -> 3.x jump is safe HERE specifically
          # because this Deployment configures the registry entirely through
          # REGISTRY_* env vars and mounts no config file: 3.0 moved the
          # default config path from /etc/docker/registry/config.yml to
          # /etc/distribution/config.yml, so a bind-mounted config at the old
          # path would be silently ignored. If one is ever added, mount it at
          # the NEW path.
          #
          # The on-disk layout is unchanged (storagePathVersion is still "v2"
          # in 3.x), so /var/lib/registry is read in place — no migration, and
          # the image still runs as root with the same volume and port. What
          # 3.x drops: schema1 manifests, the oss/swift storage drivers, the
          # `reporting:` config block, and TLS 1.0/1.1 as selectable minimums.
          # None are used here (buildkit pushes schema2/OCI, storage is
          # filesystem, TLS terminates at Traefik).
          image: registry:3.1.1
          ports:
            - containerPort: 5000
          env:
            # THE LOG-VOLUME FIX — do not drop as redundant. No config file is
            # mounted, but the image BAKES IN distribution's config-dev.yml,
            # which sets `log.level: debug`; REGISTRY_* env overrides it. At
            # debug, distribution dumps every request's spans as JSON through
            # the logger (tracing/loggerwriter.go emits each span at DEBUG), and
            # OTEL_TRACES_EXPORTER does not stop that — the level is the switch.
            - name: REGISTRY_LOG_LEVEL
              value: "info"
            - name: REGISTRY_AUTH
              value: "htpasswd"
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "Registry"
            # /auth is the `auth` volume below; `htpasswd` is the Secret key.
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: "/auth/htpasswd"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            # Do not lower: a tight limit makes Go's GC thrash while streaming
            # a large blob, throughput collapses to ~0.6MB/s, and buildkit's
            # ~60s upload timeout fires — surfacing as "blob upload invalid"
            # on the retried, wrong-offset resume rather than as an OOM.
            limits:
              memory: 512Mi
          # Probe `/`, NOT `/v2/`: with REGISTRY_AUTH=htpasswd, `GET /v2/`
          # answers 401 without credentials, which kubelet reads as a failure
          # and which would CrashLoop a healthy registry.
          #
          # Port 5000 deliberately, not the debug listener on 5001 (which
          # config-dev.yml also enables, serving /debug/health and /metrics
          # unauthenticated): a probe belongs on the port the Service targets, so
          # that a wedged main listener actually fails readiness. The cost is one
          # access-log line per probe, which is why the periods are 15s/30s
          # rather than the usual 10s.
          #
          # No startupProbe: this is a Go binary over a local hostPath, it is
          # listening in well under a second.
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            # From the service chart (service.yaml -> storage.data).
            claimName: registry-data
        - name: auth
          secret:
            # Bootstrapped by ansible/roles/platform/tasks/bootstrap.yml.
            secretName: registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: platform-registry
  labels:
    app: registry
spec:
  ports:
    - port: 5000
  selector:
    app: registry
