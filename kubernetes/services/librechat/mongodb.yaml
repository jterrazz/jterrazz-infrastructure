# App-chart values for the standalone MongoDB LibreChat stores everything in,
# in place of the chart's bundled Bitnami subchart. Release `librechat-mongodb`
# in kubernetes/helmfile.yaml.gotmpl; the PVC it mounts belongs to
# `librechat-platform` (service.yaml, storage.data).
#
# NO AUTH: mongod listens on 27017 with no user, no password and no TLS, and it
# holds every account and every conversation. `network:` below is what stands in
# for the authentication — one pod label, in this namespace only. Add MongoDB
# auth (and a Secret-injected MONGO_URI) before adding a second tenant here.
metadata:
  name: librechat-mongodb

environment: prod

spec:
  # ONE-WAY DOOR: the 7.0 minor, never the floating `7`. A minor jump rewrites
  # on-disk feature-compatibility metadata and mongod then refuses to start
  # against files a newer release wrote; bump deliberately, setting
  # featureCompatibilityVersion either side. 8.0 is the version LibreChat pins
  # and it does not boot on the OrbStack kernel (SERVER-121912).
  image: mongo:7.0
  port: 27017
  # `mongodb://librechat-mongodb:27017/LibreChat` is in values.yaml's MONGO_URI,
  # so the Service has to answer on the real port rather than the chart's 80.
  servicePort: 27017

  args:
    - "--quiet"
    - "--wiredTigerCacheSizeGB"
    - "0.25"

  # uid/gid 999 is the image's `mongodb` user — the same uid `storage.owner`
  # chowns to. Pinning it bypasses the mongo entrypoint's own chown, which is
  # why the initContainer is not optional here.
  securityContext:
    runAsUser: 999
    runAsGroup: 999

  storage:
    mountPath: /data/db
    claimName: librechat-data
    owner: "999:999"

  # TCP, NOT `mongosh --eval`: mongosh is a heavy Node REPL whose cold start
  # alone exceeds the probe timeout, which crash-loops a healthy mongod on the
  # liveness kill.
  health:
    tcp: true

  resources:
    cpu: 25m
    memory: 192Mi
    memoryLimit: 384Mi

  network:
    # Nothing reaches a database with no password except the one client that
    # owns it, and mongod dials nothing but DNS — a database that calls out is
    # a database doing something it was not asked to do.
    isolated: true
    exposeTo:
      # `pods:` is a bare podSelector, i.e. THIS namespace. The
      # `any-namespace-pods:` spelling of the same label would admit a pod
      # called librechat from anywhere in the cluster.
      - pods:app.kubernetes.io/name=librechat

environments:
  prod: {}
