# Values for the official LibreChat chart
#   oci://ghcr.io/danny-avila/librechat-chart/librechat
# Chart version is pinned on the `librechat` release in
# kubernetes/helmfile.yaml.gotmpl.
#
# The two bundled datastore subcharts the chart enables by default — mongodb
# and meilisearch — are disabled: they pull from the deprecated Bitnami repo.
# A standalone mongo:7.0 (mongodb.yaml) on a `manual` hostPath PVC replaces
# them; that survives a repave, `local-path` does not. (redis is off in the
# chart's own defaults.)

# Tag pinned EXPLICITLY: an empty tag inherits the chart's appVersion, so the
# running image would change under us with no diff here. Bump this together
# with the chart version in kubernetes/helmfile.yaml.gotmpl.
image:
  tag: "v0.8.7"

# IngressRoute (service.yaml) targets a Service literally named `librechat`,
# so override the chart's fullname to match.
fullnameOverride: librechat

# MUST STAY FALSE. The chart default is `true`, with the placeholder host
# chat.example.com — and k3s' Traefik serves Ingress objects as well as
# IngressRoutes, so leaving it unset publishes an unauthenticated route to this
# Service that bypasses the `private-access` middleware service.yaml applies.
ingress:
  enabled: false

# One PVC (`librechat-uploads`, from service.yaml's storage map) mounted at
# both LibreChat asset dirs via subPath. Without it uploads and generated
# images sit on the container fs and are lost on every restart.
volumes:
  - name: uploads
    persistentVolumeClaim:
      claimName: librechat-uploads
volumeMounts:
  - name: uploads
    mountPath: /app/uploads
    subPath: uploads
  - name: uploads
    mountPath: /app/client/public/images
    subPath: images

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 768Mi

# NON-SECRET placeholder, deliberately not in Infisical: the gateway enforces
# no client API key (netpol + private ingress is the boundary), and the
# Anthropic SDK only requires the string be non-empty.
global:
  librechat:
    env:
      - name: ANTHROPIC_API_KEY
        value: "gateway-noauth"

# Bundled datastores: OFF (see header).
mongodb:
  enabled: false
meilisearch:
  enabled: false

librechat:
  # Off because the `volumes:` block above already provides persistence, on a
  # repave-safe manual hostPath PVC rather than local-path.
  imageVolume:
    enabled: false

  configEnv:
    HOST: "0.0.0.0"
    MONGO_URI: "mongodb://librechat-mongodb:27017/LibreChat"
    # No open registration while the route is tailnet-only. Flipping this to
    # "true" also means reconsidering the private-access middleware.
    ALLOW_REGISTRATION: "false"
    ALLOW_EMAIL_LOGIN: "true"
    ALLOW_SOCIAL_LOGIN: "false"
    # Meilisearch is disabled above, so conversation search has no backend.
    SEARCH: "false"
    # Bare host, NO /v1: the Anthropic SDK appends `/v1/messages` itself. This
    # native endpoint is the only one that can trigger server-side web_search.
    ANTHROPIC_REVERSE_PROXY: "http://gateway-intelligence.prod-gateway-intelligence.svc.cluster.local"

  # Always the gateway's in-cluster Service, never gateway-intelligence.internal.jterrazz.com: that
  # hostname resolves to the node's own tailnet IP and a pod cannot hairpin to
  # the node's ServiceLB (the connection times out). The matching ingress hole
  # is the gateway's own `spec.network.exposeTo: [namespace:platform-ai]`.
  configYamlContent: |
    version: 1.2.8
    cache: true
    endpoints:
      custom:
        - name: "Gateway Intelligence"
          # Non-secret placeholder — gateway does no client-key auth (netpol-only).
          apiKey: "gateway-noauth"
          baseURL: "http://gateway-intelligence.prod-gateway-intelligence.svc.cluster.local/v1"
          models:
            # fetch:false -> the menu shows exactly this list, and default[0]
            # is pre-selected.
            default:
              - "claude-opus-4-8"
              - "claude-sonnet-4-6"
              - "claude-haiku-4-5-20251001"
            fetch: false
          titleConvo: true
          titleModel: "current"
          modelDisplayLabel: "Claude (Gateway)"
      # baseURL = ANTHROPIC_REVERSE_PROXY, key = ANTHROPIC_API_KEY (both above).
      anthropic:
        titleModel: "current"
        # Built-in endpoints take a plain array here (not {default,fetch}).
        models:
          - "claude-opus-4-8"
          - "claude-sonnet-4-6"
          - "claude-haiku-4-5-20251001"
    # enforce:false keeps the raw model menu reachable as a fallback; flip to
    # true to lock the UI to this spec alone. `executeCode` is unset because
    # it needs a code-execution backend that does not exist here.
    modelSpecs:
      enforce: false
      prioritize: true
      list:
        # UPGRADE THE DEFAULT MODEL (new Opus): bump `model`, `label` and
        # `description` together — procedure and rationale in README.md,
        # "Upgrading the default model".
        - name: "opus-full"
          label: "Opus 4.8 — Web + Artifacts"          # bump on new Opus
          default: true
          description: "Claude Opus 4.8 with native web search and artifacts."
          preset:
            endpoint: "anthropic"
            model: "claude-opus-4-8"                   # <-- bump on new Opus
            web_search: true
          artifacts: "default"
    interface:
      modelSelect: true
