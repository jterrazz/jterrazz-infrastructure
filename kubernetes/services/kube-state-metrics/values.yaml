# outside: kube-state-metrics, the source of every kube_* series; scraped by annotation
# (victoria-metrics' kubernetes-service-endpoints job), so install order is free.

# value: 3, not the chart's 10; see grafana/values.yaml.
revisionHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi
