# kube-state-metrics — the source of every kube_* series. Its own release, from
# prometheus-community. Chart version: the `kube-state-metrics` release in
# kubernetes/helmfile.yaml.gotmpl.
#
# Nothing here configures scraping: the chart annotates its own Service with
# prometheus.io/scrape=true and victoria-metrics' `kubernetes-service-endpoints`
# job keeps exactly that annotation, so the two releases install in either order.
# Both dashboards query the kube_* metric names directly, never `service`/`instance`.

# 3, not the chart's 10 — see grafana/values.yaml for the reasoning.
revisionHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi
