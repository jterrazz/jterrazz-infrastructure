image:
  repository: otel/opentelemetry-collector-contrib

# hazard: one node, so one Deployment sees every pod's log file. The day a second node
# exists this must become `mode: daemonset` (plus a k8s_attributes node filter),
# or it silently collects one node's logs; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
mode: deployment

# value: 3, not the chart's 10; see grafana/values.yaml.
revisionHistoryLimit: 3

# hazard: Recreate, not RollingUpdate: file_storage is a bolt DB one process can hold,
# so a surged pod dies on the lock and `helm --wait` fails the deploy; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
rollout:
  strategy: Recreate

# invariant: no manual GOMEMLIMIT: the chart injects it at 80% of limits.memory.
resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    memory: 320Mi

# outside: root, because containerd's /var/log/pods files are not readable by the
# image's 10001; a wrong uid starts fine and ships nothing; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
securityContext:
  runAsUser: 0
  runAsGroup: 0

# outside: /var/log covers /var/log/pods and its /var/log/containers symlinks; read-only.
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  # hazard: a hostPath, not an emptyDir, so read offsets survive a pod replacement; off
  # virtiofs on purpose (bbolt, worthless after a repave); docs/decisions/008-storage-on-orbstack-spends-fsyncs-not-bytes.md
  - name: filestorage
    hostPath:
      path: /var/lib/otelcol-file-storage
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: filestorage
    mountPath: /var/lib/otelcol-file-storage

# invariant: the rules `presets.kubernetesAttributes` would create, without the preset,
# which would inject k8s_attributes into every pipeline (traces/langfuse included).
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

# invariant: pins the Service DNS name of every OTEL_EXPORTER_OTLP_ENDPOINT
# (app.platformCatalog in kubernetes/charts/app/templates/_helpers.tpl).
fullnameOverride: otel-collector

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# invariant: read by the otlp_http/langfuse exporter; the Secret is secret.yaml's.
extraEnvs:
  - name: LANGFUSE_BASIC_AUTH
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: LANGFUSE_BASIC_AUTH

config:
  extensions:
    # invariant: persisted read offsets are what make `start_at: beginning` safe.
    file_storage:
      directory: /var/lib/otelcol-file-storage
      timeout: 10s

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # hazard: /var/log/pods, never /var/log/containers: the container operator derives
    # pod/namespace/uid only from this path layout, and pod_association keys on the uid.
    file_log:
      include: [/var/log/pods/*/*/*.log]
      # invariant: excludes the collector's own logs (no feedback loop).
      exclude:
        - /var/log/pods/platform-telemetry_otel-collector-*_*/opentelemetry-collector/*.log
      # hazard: `beginning` is safe only with `storage:` set (else every restart re-reads every
      # file); `end` silently drops what was written while the collector was down.
      start_at: beginning
      storage: file_storage
      retry_on_failure:
        enabled: true
      # invariant: add_metadata_from_filepath reads log.file.path, which needs this.
      include_file_path: true
      include_file_name: false
      operators:
        - type: container
          id: container-parser
          max_log_size: 102400

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024

    # invariant: enriches the filelog stream only (logs/pods). The underscore spellings are
    # canonical at Collector 0.160 and fail config load below 0.149.0.
    k8s_attributes:
      passthrough: false
      # hazard: k8s.pod.uid only: the default `from: connection` would label every
      # file-tailed log as the collector's own.
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - k8s.deployment.name
        labels:
          # invariant: both charts stamp the `app` label on every workload.
          - tag_name: app
            key: app
            from: pod

    # outside: drops parentless client spans (undici opens a root span per fetch outside a
    # request, ~99% of all traces); spans under a parent are kept; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
    filter/drop-orphan-client-spans:
      error_mode: ignore
      traces:
        span:
          - 'kind == SPAN_KIND_CLIENT and IsRootSpan()'

    # outside: Langfuse bills per span, so it gets one `chat` span per LLM call, prod only;
    # the filter DROPS what a condition matches; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
    filter/genai:
      error_mode: ignore
      traces:
        span:
          - 'resource.attributes["deployment.environment"] != "prod"'
          - 'attributes["gen_ai.operation.name"] == nil or attributes["gen_ai.operation.name"] != "chat"'

  exporters:
    otlp_http/victoria-traces:
      # outside: `traces_endpoint`, not `endpoint`, which would append /v1/traces.
      traces_endpoint: http://victoria-traces.platform-telemetry.svc:10428/insert/opentelemetry/v1/traces
      tls:
        insecure: true
    otlp_http/victoria-logs:
      # outside: same as above for logs; no VL-Stream-Fields, the default stream set is small here.
      logs_endpoint: http://victoria-logs.platform-telemetry.svc:9428/insert/opentelemetry/v1/logs
      tls:
        insecure: true
    otlp_http/victoria-logs-pods:
      # invariant: same destination, different stream-field policy: the only reason it exists.
      logs_endpoint: http://victoria-logs.platform-telemetry.svc:9428/insert/opentelemetry/v1/logs
      tls:
        insecure: true
      headers:
        # hazard: keep this list short; without it every attribute (k8s.pod.uid included) becomes
        # a stream field and cardinality explodes.
        VL-Stream-Fields: "k8s.namespace.name,k8s.pod.name,k8s.container.name,app"
    prometheus_remote_write:
      # outside: VictoriaMetrics takes remote-write v1 natively; kept over OTLP because it
      # changes nothing; docs/decisions/005-telemetry-runs-on-the-victoriametrics-family.md
      endpoint: http://victoria-metrics.platform-telemetry.svc:8428/api/v1/write
      tls:
        insecure: true
      # invariant: without it an app's prod/next/staging series collide into one.
      resource_to_telemetry_conversion:
        enabled: true
    otlp_http/langfuse:
      # outside: Langfuse accepts OTLP/HTTP only, never gRPC.
      endpoint: https://cloud.langfuse.com/api/public/otel
      headers:
        Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"

  service:
    # hazard: must list health_check: Helm replaces lists, and health_check backs the
    # probes; drop it and the collector fails its probes forever.
    extensions:
      - health_check
      - file_storage
    pipelines:
      traces:
        receivers: [otlp]
        processors: [filter/drop-orphan-client-spans, batch]
        exporters: [otlp_http/victoria-traces]
      traces/langfuse:
        receivers: [otlp]
        processors: [filter/genai, batch]
        exporters: [otlp_http/langfuse]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp_http/victoria-logs]
      # invariant: pod stdout/stderr in a separate pipeline: k8s_attributes and the stream-field
      # policy apply to file-tailed logs only.
      logs/pods:
        receivers: [file_log]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/victoria-logs-pods]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus_remote_write]
