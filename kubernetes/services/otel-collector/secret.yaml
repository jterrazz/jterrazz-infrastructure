# Syncs the Langfuse OTLP Basic-Auth header into the `otel-collector-secrets`
# Secret, which the collector reads via extraEnvs (helm.yaml).
#
# Required key in Infisical /jterrazz-infrastructure/otel-collector:
#   LANGFUSE_BASIC_AUTH   base64("public_key:secret_key") of the Langfuse
#                         project's API keys — the value lives in Infisical,
#                         never here: echo -n "pk-lf-x:sk-lf-x" | base64
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: otel-collector-infisical
  namespace: platform-telemetry
spec:
  hostAPI: https://eu.infisical.com
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: jterrazz
        envSlug: prod
        secretsPath: /jterrazz-infrastructure/otel-collector
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: platform-secrets
  # Name MUST stay otel-collector-secrets — helm.yaml's
  # extraEnvs.LANGFUSE_BASIC_AUTH.secretKeyRef reads it by that literal name,
  # and ansible/roles/platform/tasks/bootstrap.yml blocks on it appearing.
  managedKubeSecretReferences:
    - secretName: otel-collector-secrets
      secretNamespace: platform-telemetry
      secretType: Opaque
