name: registry
host: registry.internal.jterrazz.com
port: 5000

# invariant: 401: containerd relies on the challenge, and a 200 would mean anonymous reads.
smoke:
  path: /v2/
  expect: "401"

storage:
  # value: distribution's old store, unmounted, kept as the rollback of the move to Zot (ADR-014).
  data:
    size: 10Gi
  zot:
    size: 20Gi
    pathSuffix: zot

