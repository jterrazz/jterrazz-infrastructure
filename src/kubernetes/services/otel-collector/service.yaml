name: otel-collector

# invariant: LANGFUSE_BASIC_AUTH, base64("pk:sk"); values.yaml reads the Secret by name.
secrets:
  path: /studio-infrastructure/otel-collector
  secretName: otel-collector-secrets

# invariant: it serves every app (`uses: [telemetry]`), so every app namespace may write OTLP, by the
# tier label only an app's own deploy sets; its own namespace's pods reach it through the baseline
# (ADR-011, ADR-029).
network:
  podSelector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
  ingress:
    - from: namespace-label:studio.jterrazz.com/tier=app
      ports: [4317, 4318]
