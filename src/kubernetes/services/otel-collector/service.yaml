name: otel-collector

# invariant: LANGFUSE_BASIC_AUTH, base64("pk:sk"); values.yaml reads the Secret by name.
secrets:
  path: /studio-infrastructure/otel-collector
  secretName: otel-collector-secrets

# invariant: any namespace may write OTLP; nothing narrower is expressible yet (ADR-011).
network:
  podSelector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
  ingress:
    - from: any-namespace
      ports: [4317, 4318]
