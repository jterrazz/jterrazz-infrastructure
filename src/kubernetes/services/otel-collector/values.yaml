image:
  repository: otel/opentelemetry-collector-contrib

# hazard: one node, one Deployment; a second node needs `mode: daemonset` (ADR-005).
mode: deployment

# value: 3, not 10 (ADR-013).
revisionHistoryLimit: 3

# hazard: one process holds file_storage's bolt DB, so a surged pod dies on the lock (ADR-005).
rollout:
  strategy: Recreate

# invariant: the chart sets GOMEMLIMIT to 80% of limits.memory.
resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    memory: 320Mi

# hazard: the image's uid cannot read /var/log/pods, and fails by shipping nothing (ADR-005).
securityContext:
  runAsUser: 0
  runAsGroup: 0

extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  # invariant: read offsets survive a pod replacement, off virtiofs (ADR-008).
  - name: filestorage
    hostPath:
      path: /var/lib/otelcol-file-storage
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: filestorage
    mountPath: /var/lib/otelcol-file-storage

# invariant: the preset's rules without the preset, which would put k8s_attributes in every pipeline.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

# invariant: the Service name app.platformCatalog's OTLP endpoint dials.
fullnameOverride: otel-collector

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # invariant: the collector's own counters (sent, failed, dropped per exporter), scraped by
  # annotation like every pod (ADR-005).
  metrics:
    enabled: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

extraEnvs:
  - name: LANGFUSE_BASIC_AUTH
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: LANGFUSE_BASIC_AUTH

config:
  extensions:
    file_storage:
      directory: /var/lib/otelcol-file-storage
      timeout: 10s

  receivers:
    # hazard: never /var/log/containers: the container operator parses this path layout only.
    file_log:
      include: [/var/log/pods/*/*/*.log]
      exclude:
        - /var/log/pods/platform-telemetry_otel-collector-*_*/opentelemetry-collector/*.log
      # hazard: `beginning` is safe only with `storage:`; `end` drops what arrived while down.
      start_at: beginning
      storage: file_storage
      retry_on_failure:
        enabled: true
      include_file_path: true
      include_file_name: false
      operators:
        - type: container
          id: container-parser
          max_log_size: 102400

  processors:
    # value: the chart's guard, which these pipelines replaced: a file_log replay after downtime
    # is when the collector's memory spikes.
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch:
      timeout: 5s
      send_batch_size: 1024

    # invariant: the underscore spellings fail config load below Collector 0.149.
    k8s_attributes:
      passthrough: false
      # hazard: the default `from: connection` labels every tailed log as the collector's own.
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - k8s.deployment.name
        labels:
          - tag_name: app
            key: app
            from: pod

    # value: parentless client spans were 99% of all traces (ADR-005).
    filter/drop-orphan-client-spans:
      error_mode: ignore
      traces:
        span:
          - 'kind == SPAN_KIND_CLIENT and IsRootSpan()'

    # hazard: op-dashboard prints its whole environment, secrets included, on every server render
    # (OpenPanel 2.3.0); none of the dump's lines reaches the store.
    filter/drop-env-dumps:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["k8s.container.name"] == "op-dashboard" and IsMatch(body, "^(ENVS \\{|\\}|\\s+[A-Za-z0-9_]+: .*)$")'

    # value: Langfuse bills per span, so it gets prod's `chat` span alone; a match DROPS (ADR-005).
    filter/genai:
      error_mode: ignore
      traces:
        span:
          - 'resource.attributes["deployment.environment"] != "prod"'
          - 'attributes["gen_ai.operation.name"] == nil or attributes["gen_ai.operation.name"] != "chat"'

  exporters:
    otlp_http/victoria-traces:
      # hazard: `traces_endpoint`, not `endpoint`, which would append /v1/traces.
      traces_endpoint: http://victoria-traces.platform-telemetry.svc:10428/insert/opentelemetry/v1/traces
      tls:
        insecure: true
    otlp_http/victoria-logs:
      logs_endpoint: http://victoria-logs.platform-telemetry.svc:9428/insert/opentelemetry/v1/logs
      tls:
        insecure: true
    otlp_http/victoria-logs-pods:
      # invariant: same store, its own stream fields: the one reason for a second exporter.
      logs_endpoint: http://victoria-logs.platform-telemetry.svc:9428/insert/opentelemetry/v1/logs
      tls:
        insecure: true
      headers:
        # hazard: unpinned, every attribute becomes a stream field.
        VL-Stream-Fields: "k8s.namespace.name,k8s.pod.name,k8s.container.name,app"
    prometheus_remote_write:
      endpoint: http://victoria-metrics.platform-telemetry.svc:8428/api/v1/write
      tls:
        insecure: true
      # invariant: every resource attribute becomes a label; without it an app's environments
      # collide into one series.
      resource_constant_labels:
        included: ["*"]
    otlp_http/langfuse:
      endpoint: https://cloud.langfuse.com/api/public/otel
      headers:
        Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"

  service:
    # value: the chart's inline resource map is a format the collector deprecates; its own
    # counters need no resource labels beyond what the scrape adds.
    telemetry:
      resource: null
    # hazard: lists replace: drop health_check and the probes fail forever.
    extensions:
      - health_check
      - file_storage
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/drop-orphan-client-spans, batch]
        exporters: [otlp_http/victoria-traces]
      traces/langfuse:
        receivers: [otlp]
        processors: [memory_limiter, filter/genai, batch]
        exporters: [otlp_http/langfuse]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/victoria-logs]
      logs/pods:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, filter/drop-env-dumps, batch]
        exporters: [otlp_http/victoria-logs-pods]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus_remote_write]
