---
# outside: the values of k3s' bundled Traefik release (ADR-003).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # value: v3.7.16 ahead of the v3.7.13 k3s bundles, for eight GHSA fixes; Rancher's mirror
    # lacks it, so the official image; drop it when k3s ships it (ADR-003).
    image:
      registry: docker.io
      repository: traefik
      tag: v3.7.16
    # hazard: loadBalancerSourceRanges is the ONLY tailnet gate on host ports 80/443
    # (klipper-lb DNATs before any input filter). Chart v41 renders only `.service.spec` and does
    # not reject unknown keys, so a flat or renamed key silently opens them. NodePorts
    # are off because the source range never filters them. After any rebuild,
    # `kubectl -n kube-system get svc traefik -o yaml`: the range non-empty, no
    # nodePort; docs/decisions/003-traefiks-service-is-the-tailnet-gate.md
    service:
      spec:
        allocateLoadBalancerNodePorts: false
        loadBalancerSourceRanges:
          - 100.64.0.0/10      # Tailscale CGNAT, the only permitted source.
      # invariant: `traefik-tunnel`, a ClusterIP Service for the tunnel entrypoint alone, so
      # cloudflared never reaches websecure and the tailnet never reaches tunnel (ADR-002).
      additionalServices:
        tunnel:
          type: ClusterIP

    ports:
      websecure:
        # value: 10m, not the 60s default: a registry layer push over the tailnet takes
        # longer and is cut with a 499; the tunnel edge bounds public clients.
        transport:
          respondingTimeouts:
            readTimeout: 10m
        http:
          middlewares:
            - platform-networking-rate-limit@kubernetescrd
            - platform-networking-compress@kubernetescrd
            - platform-networking-security-headers@kubernetescrd
        http3:
          enabled: true
          # value: not a default: unset, Alt-Svc advertises the in-container UDP/8443.
          advertisedPort: 443
      # invariant: the public routes' one entrypoint, plain HTTP: the edge terminates their TLS
      # (ADR-001), and only cloudflared may dial it (allow-traefik-ingress).
      tunnel:
        port: 8090
        exposedPort: 80
        protocol: TCP
        expose:
          default: false
          tunnel: true
        http:
          middlewares:
            - platform-networking-rate-limit@kubernetescrd
            - platform-networking-compress@kubernetescrd
            - platform-networking-security-headers@kubernetescrd
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https

    # value: the chart ships no resources (BestEffort, first evicted) and every surface
    # terminates here; the memory limit makes it Burstable. No CPU limit on purpose.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi

    # invariant: one JSON line per request (host, path, status, duration, router), the one per-path
    # signal every routed app has without instrumenting anything; VictoriaLogs keeps it 90 days.
    # hazard: no client field, no header and no query string. ClientHost is the visitor's real IP
    # (trustedIPs makes Traefik read X-Forwarded-For), and a query string can hold a reset link's
    # token; none of them may sit in the store (ADR-027).
    accessLog:
      enabled: true
      format: json
      fields:
        names:
          ClientAddr: drop
          ClientHost: drop
          ClientPort: drop
          ClientUsername: drop
        headers:
          defaultMode: drop
        queryParameters:
          defaultMode: drop

    # invariant: request rate, errors and latency per Kubernetes service, the one RED source every
    # routed app has without instrumenting anything (studio-infrastructure / Ingress, ADR-027).
    # value: buckets from 50ms to a minute: the default four (0.1, 0.3, 1.2, 5) put every p95 at
    # 95ms or 5s, and a server-rendered page or a streamed answer runs past 5s.
    metrics:
      prometheus:
        addServicesLabels: true
        buckets: "0.05,0.1,0.25,0.5,1,2.5,5,10,30,60"

    # invariant: the websecure middlewares live in platform-networking; no route is an Ingress.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false

    # hazard: trustedIPs are the direct peers allowed to set X-Forwarded-*; a wrong list
    # silently drops the client IP, and on tunnel the edge's `X-Forwarded-Proto: https`. Both
    # peers, klipper-lb's svclb and cloudflared, are pods;
    # docs/decisions/003-traefiks-service-is-the-tailnet-gate.md
    additionalArguments:
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16"
      - "--entryPoints.tunnel.forwardedHeaders.trustedIPs=10.42.0.0/16"
