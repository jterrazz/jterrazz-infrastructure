# invariant: the env op-api, op-worker and op-dashboard load before their own values.

environment: prod

spec:
  env:
    NODE_ENV: "production"
    SELF_HOSTED: "true"
    BATCH_SIZE: "5000"
    BATCH_INTERVAL: "10000"
    ALLOW_INVITATION: "true"
    REDIS_URL: "redis://op-redis:6379"
    # invariant: op-clickhouse.yaml's init-db.sh creates the `openpanel` database.
    CLICKHOUSE_URL: "http://op-clickhouse:8123/openpanel"
    DASHBOARD_URL: "https://openpanel.internal.jterrazz.com"
    API_URL: "https://openpanel.internal.jterrazz.com/api"
    # invariant: the dashboard's server-side fetches; dropping it brings back three workarounds
    # together (ADR-010).
    API_URL_SSR: "http://op-api:3000"
    # hazard: a sending site missing here is refused at the CORS preflight, silently.
    API_CORS_ORIGINS: "https://openpanel.internal.jterrazz.com,https://jterrazz.com,https://www.jterrazz.com,https://spwn.sh,https://sig.news"

  secrets:
    path: /jterrazz-infrastructure/openpanel
    env:
      - DATABASE_URL
      - DATABASE_URL_DIRECT
      - COOKIE_SECRET

  network:
    isolated: true

environments:
  prod: {}
