metadata:
  name: op-worker

spec:
  image: lindesvard/openpanel-worker:2.3.0
  port: 3000
  servicePort: 3000

  env:
    NODE_OPTIONS: "--max-old-space-size=512"

  resources:
    cpu: 50m
    memory: 416Mi
    memoryLimit: 768Mi

  health:
    path: /healthcheck

  network:
    egress:
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
