metadata:
  name: op-dashboard

spec:
  image: lindesvard/openpanel-dashboard:2.3.0
  port: 3000
  servicePort: 3000

  runAsRoot: true

  env:
    ALLOW_REGISTRATION: "false"
    NODE_OPTIONS: "--max-old-space-size=384"

  resources:
    cpu: 50m
    memory: 128Mi
    memoryLimit: 384Mi

  health:
    path: /api/healthcheck

  ingress:
    # invariant: the private host's catch-all; op-api's /api route is more specific.
    - host: openpanel.internal.jterrazz.com
      access: private
      tlsSecret: openpanel-tls
      # invariant: the derived /api/healthcheck would reach op-api instead.
      smoke:
        path: /
        expect: "307,200"

  network:
    exposeTo:
      - traefik
    egress:
      - to: namespace:platform-analytics
      - to: internet
        ports: [443]
