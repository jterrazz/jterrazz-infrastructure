# hazard: a major is a dump and restore (docs/guides/operate.md), never an image swap (ADR-019).
metadata:
  name: op-postgres

environment: prod

spec:
  image: postgres:17-alpine
  port: 5432
  servicePort: 5432

  # outside: the alpine image's `postgres` user.
  securityContext:
    runAsUser: 70
    runAsGroup: 70

  env:
    POSTGRES_USER: openpanel
    POSTGRES_DB: openpanel
    # invariant: a subdirectory, so initdb's empty-directory check never sees the mount root.
    PGDATA: /var/lib/postgresql/data/pgdata

  secrets:
    path: /jterrazz-infrastructure/openpanel
    env:
      - POSTGRES_PASSWORD

  storage:
    mountPath: /var/lib/postgresql/data
    claimName: openpanel-postgres
    owner: "70:70"

  health:
    exec: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]

  resources:
    cpu: 25m
    memory: 64Mi
    memoryLimit: 384Mi

  network:
    isolated: true

environments:
  prod: {}
