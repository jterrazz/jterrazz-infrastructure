# hazard: the BullMQ queue, unauthenticated: the `network:` block is all that guards it (ADR-019).
metadata:
  name: op-redis

environment: prod

spec:
  # hazard: 7.x, not 8; 7.4's AOF is unreadable by 7.2, so forward only (ADR-019).
  image: redis:7.4.11-alpine
  port: 6379
  servicePort: 6379

  # outside: the image's `redis` user.
  securityContext:
    runAsUser: 999
    runAsGroup: 1000

  args:
    - "redis-server"
    - "--appendonly"
    - "yes"
    # value: not `everysec`: an fsync per second over virtiofs (ADR-008).
    - "--appendfsync"
    - "no"
    # value: no RDB snapshot beside the AOF, one fsync every five minutes less (ADR-008).
    - "--save"
    - ""

  storage:
    mountPath: /data
    claimName: openpanel-redis
    owner: "999:1000"

  health:
    exec: ["redis-cli", "ping"]

  resources:
    cpu: 25m
    memory: 32Mi
    memoryLimit: 256Mi

  network:
    isolated: true

environments:
  prod: {}
