# invariant: no `host`: each route lives with its release (op-api, op-dashboard).
name: openpanel

storage:
  # hazard: changing a pathSuffix moves live data.
  postgres:
    size: 3Gi
    pathSuffix: postgres
  redis:
    size: 1Gi
    pathSuffix: redis
  clickhouse:
    size: 10Gi
    pathSuffix: clickhouse
