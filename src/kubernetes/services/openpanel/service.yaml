# invariant: no `host`: each route lives with its release; op-api and op-dashboard share a
# hostname, so its certificate lives here.
name: openpanel

certificates:
  openpanel-tls:
    dnsNames:
      - openpanel.internal.jterrazz.com
  openpanel-analytics-tls:
    dnsNames:
      - analytics.jterrazz.com

storage:
  # hazard: changing a pathSuffix moves live data.
  postgres:
    size: 3Gi
    pathSuffix: postgres
  redis:
    size: 1Gi
    pathSuffix: redis
  clickhouse:
    size: 10Gi
    pathSuffix: clickhouse
