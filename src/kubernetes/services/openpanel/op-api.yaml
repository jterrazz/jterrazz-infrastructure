# invariant: op-api migrates the schema before it starts.
metadata:
  name: op-api

spec:
  image: lindesvard/openpanel-api:2.3.0
  port: 3000
  servicePort: 3000

  # outside: the op-* images document no uid; capabilities are still dropped.
  runAsRoot: true

  # invariant: never two migrators against one database.
  strategy: Recreate

  command:
    - sh
    - -c
    - |
      echo 'Running migrations...'
      CI=true pnpm -r run migrate:deploy
      pnpm start

  env:
    ALLOW_REGISTRATION: "false"
    # value: the V8 default heap aborts long before the 1Gi limit.
    NODE_OPTIONS: "--max-old-space-size=768"

  resources:
    cpu: 50m
    memory: 480Mi
    memoryLimit: 1Gi

  health:
    path: /healthcheck

  # invariant: /api of the private host, and the public ingest alone; openpanel-platform owns
  # both certificates.
  ingress:
    - host: openpanel.internal.jterrazz.com
      path: /api
      access: private
      tlsSecret: openpanel-tls
    - host: analytics.jterrazz.com
      path: /api/track
      access: public
      # invariant: routed on /api/track, served on /track.
      stripPrefix: /api
      tlsSecret: openpanel-analytics-tls
      smoke:
        method: POST
        path: /api/track
        # invariant: 2.3.0 refuses the empty body with 400, which proves the route reaches op-api.
        expect: "400"

  network:
    exposeTo:
      - traefik
    egress:
      - to: namespace:platform-analytics
      # outside: enrichment and avatars from hosts nobody has enumerated.
      - to: internet
        ports: [443]
