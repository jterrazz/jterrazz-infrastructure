# invariant: the Cloudflare token external-dns reads, synced from Infisical; no route, no storage.
name: external-dns

# hazard: /studio-infrastructure holds every deploy secret; the template copies the token alone.
secrets:
  path: /studio-infrastructure
  secretName: external-dns-secrets
  template:
    data:
      CF_API_TOKEN: "{{ .CLOUDFLARE_RECORDS_TOKEN.Value }}"
