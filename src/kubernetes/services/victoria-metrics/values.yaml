server:
  fullnameOverride: victoria-metrics

  # invariant: scraped by annotation like every pod, the store watching itself (ADR-005).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8428"

  # hazard: the PVC service.yaml declares; unset, the store starts empty.
  persistentVolume:
    existingClaim: victoria-metrics-data

  # hazard: by age only; a disk-space cap would silently clip the window.
  retentionPeriod: "30d"

  # value: 60s, not 5s: fewer fsyncs over virtiofs (ADR-008).
  extraArgs:
    inmemoryDataFlushInterval: 60s
    # hazard: without it VictoriaMetrics reads scrape.yml once at start, and a scrape
    # change deploys green while the old jobs keep running (2026-10-25).
    promscrape.configCheckInterval: 1m

  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 896Mi

  # outside: prometheus-community/prometheus 29.19.0's default jobs, minus the blackbox probe,
  # pushgateway, the `-slow` jobs no target opts into, and the apiserver job (ADR-005).
  scrape:
    enabled: true
    config:
      global:
        # value: 1m, not 15s: no panel reads finer, and each sample is a write to virtiofs.
        scrape_interval: 1m

      scrape_configs:
        # outside: k3s is one binary, so the kubelet's /metrics also serves the apiserver's
        # registry; the kubelet's own series are kept, the control plane's 65k are not (ADR-005).
        - job_name: kubernetes-nodes
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          metric_relabel_configs:
            - action: keep
              source_labels:
                - __name__
              regex: kubelet_.+

        - job_name: kubernetes-nodes-cadvisor
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          metrics_path: /metrics/cadvisor
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels:
                - __metrics_path__
              target_label: metrics_path
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true

        - job_name: kubernetes-pods
          honor_labels: true
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            # hazard: role pod yields one target per container port; without this a
            # multi-port pod is scraped once per port at the annotated address and
            # VictoriaMetrics logs every duplicate (cert-manager, Traefik).
            - action: keep_if_equal
              if: '{__meta_kubernetes_pod_annotation_prometheus_io_port=~".+"}'
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_container_port_number
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
              replacement: "[$2]:$1"
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (\d+);((([0-9]+?)(\.|$)){4})
              replacement: $2:$1
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_name
              target_label: pod
            - action: drop
              regex: Pending|Succeeded|Failed|Completed
              source_labels:
                - __meta_kubernetes_pod_phase
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node

        - job_name: kubernetes-service-endpoints
          honor_labels: true
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scrape
            # hazard: dedups multi-port Services; without the `if` guard the port-less
            # kube-state-metrics and node-exporter targets go, with both dashboards.
            - action: keep_if_equal
              if: '{__meta_kubernetes_service_annotation_prometheus_io_port=~".+"}'
              source_labels:
                - __meta_kubernetes_endpointslice_port
                - __meta_kubernetes_service_annotation_prometheus_io_port
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_service_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (.+?)(?::\d+)?;(\d+)
              replacement: $1:$2
              source_labels:
                - __address__
                - __meta_kubernetes_service_annotation_prometheus_io_port
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_service_name
              target_label: service
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node
