server:
  fullnameOverride: victoria-traces

  # invariant: scraped by annotation like every pod, the store watching itself (ADR-005).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10428"

  # hazard: the PVC service.yaml declares; unset, the store starts empty.
  persistentVolume:
    existingClaim: victoria-traces-data

  retentionPeriod: "720h"

  # value: 300s: trace history is the one stream that may be lost (ADR-005, ADR-008).
  extraArgs:
    inmemoryDataFlushInterval: 300s

  # invariant: caches are budgeted from the limit; the request is small on purpose.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 512Mi

