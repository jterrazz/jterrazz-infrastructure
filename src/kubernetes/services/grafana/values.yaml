persistence:
  enabled: true
  existingClaim: grafana-data

# hazard: without it a rolled pod fails its migration on SQLITE_BUSY behind the running one
# and the release fails (ADR-013).
grafana.ini:
  database:
    wal: true
  # value: none of the five preinstalled apps (323 MB) reads a VictoriaMetrics-family source.
  plugins:
    preinstall_disabled: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # value: contains a reclaim storm to Grafana.
    cpu: 1500m
    # hazard: below ~512Mi Grafana spirals in direct reclaim at its CPU cap (ADR-013).
    memory: 768Mi

# value: 3, not 10: each ReplicaSet is a row in a SQLite-backed apiserver (ADR-013).
revisionHistoryLimit: 3

sidecar:
  # hazard: one block sizes all five sidecars; an evicted one stops updates silently.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    # invariant: ConfigMaps only, matching the RBAC below.
    resource: configmap
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  # invariant: alert rules ship with each app (`spec.alerts`); this repo applies none.
  alerts:
    enabled: true
    searchNamespace: ALL
    resource: configmap
    labelValue: "1"

# hazard: the chart's ClusterRole reads every Secret, hence this one; roleRef is immutable, so a
# rename deletes `grafana-clusterrolebinding` first (ADR-013).
rbac:
  useExistingClusterRole: grafana-sidecar-configmaps
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: grafana-sidecar-configmaps
    rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "watch", "list"]

# invariant: a subPath mount does not follow updates: a new webhook lands at the next restart.
extraSecretMounts:
  - name: grafana-alerting
    secretName: grafana-alerting
    defaultMode: 0440
    mountPath: /etc/grafana/provisioning/alerting/contact-point-slack.yaml
    subPath: contact-point-slack.yaml
    readOnly: true

# outside: installed from grafana.com at every pod start.
plugins:
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # hazard: every dashboard and app alert names a datasource by these uids, the store's own
      # name, so nobody writes LogQL against a uid called loki (ADR-005).
      - name: VictoriaMetrics
        type: prometheus
        uid: victoria-metrics
        url: http://victoria-metrics.platform-telemetry.svc:8428
        isDefault: true
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victoria-logs
        url: http://victoria-logs.platform-telemetry.svc:9428
      - name: VictoriaTraces
        type: jaeger
        uid: victoria-traces
        url: http://victoria-traces.platform-telemetry.svc:10428/select/jaeger
