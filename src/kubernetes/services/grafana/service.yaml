name: grafana
host: grafana.internal.jterrazz.com
access: private

# invariant: an unauthenticated browser is sent to /login.
smoke:
  expect: "302,200"

# invariant: the operator's template, not Helm's; without SLACK_WEBHOOK_URL it provisions nothing.
secrets:
  path: /jterrazz-infrastructure/grafana
  secretName: grafana-alerting
  template:
    data:
      contact-point-slack.yaml: |
        apiVersion: 1
        {{- with .SLACK_WEBHOOK_URL.Value }}
        contactPoints:
          - orgId: 1
            name: slack
            receivers:
              - uid: slack
                type: slack
                settings:
                  url: {{ quote . }}
        policies:
          - orgId: 1
            receiver: slack
            group_by: [grafana_folder, alertname]
        {{- end }}

storage:
  data:
    size: 1Gi
    # value: in the VM, off virtiofs; a repave resets logins and history only (ADR-008).
    nodeLocalPath: /var/lib/grafana-node-local

network:
  podSelector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ingress:
    # hazard: the pod port, never the Service's 80.
    - from: traefik
      ports: [3000]
