name: grafana
host: grafana.internal.jterrazz.com

# invariant: an unauthenticated browser is sent to /login.
smoke:
  expect: "302,200"

# invariant: the operator's template, not Helm's. Every notification goes to studio-alerts, the
# relay that keeps one Slack message per incident and turns it green when it resolves (ADR-028).
# hazard: an alert about the relay itself cannot travel through it, so whatever names its namespace
# goes straight to the plain Slack webhook, when SLACK_WEBHOOK_URL is set.
secrets:
  path: /studio-infrastructure/grafana
  secretName: grafana-alerting
  template:
    data:
      contact-point-slack.yaml: |
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: studio-alerts
            receivers:
              - uid: studio-alerts
                type: webhook
                settings:
                  url: http://studio-alerts.studio-alerts.svc.cluster.local/grafana
                  httpMethod: POST
        {{- with .SLACK_WEBHOOK_URL.Value }}
          - orgId: 1
            name: slack
            receivers:
              - uid: slack
                type: slack
                settings:
                  url: {{ quote . }}
        {{- end }}
        policies:
          - orgId: 1
            receiver: studio-alerts
            group_by: [grafana_folder, alertname]
        {{- with .SLACK_WEBHOOK_URL.Value }}
            routes:
              - receiver: slack
                object_matchers:
                  - [namespace, =, studio-alerts]
        {{- end }}

storage:
  data:
    size: 1Gi
    # value: in the VM, off virtiofs; a repave resets logins and history only (ADR-008).
    nodeLocalPath: /var/lib/grafana-node-local

network:
  podSelector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ingress:
    # hazard: the pod port, never the Service's 80.
    - from: traefik
      ports: [3000]
  egress:
    # invariant: notifications go to studio-alerts, the Slack relay (ADR-028), a shared app in
    # namespace studio-alerts (ADR-029); its pod port.
    - to: namespace:studio-alerts
      ports: [8080]
