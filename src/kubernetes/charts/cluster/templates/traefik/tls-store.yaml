---
# invariant: every route's certificate, chosen by SNI; the wildcards are issued by the
# traefik-platform release (services/traefik/service.yaml). A route writes `tls: {}` (ADR-001).
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-internal-tls
  certificates:
    - secretName: wildcard-internal-tls
    - secretName: wildcard-staging-tls
