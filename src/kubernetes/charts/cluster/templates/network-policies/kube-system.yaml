---
# hazard: a wrong rule here takes the cluster down; ports are pod ports, and hostNetwork
# clients match only an ipBlock (ADR-011).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# invariant: DNS from every namespace, the next one created included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# hazard: the tailnet (svclb pods) reaches web and websecure alone, cloudflared the tunnel
# entrypoint alone, and no other pod reaches Traefik: this split is what keeps a request that
# crossed Cloudflare off every private route (ADR-002, ADR-003).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              svccontroller.k3s.cattle.io/svcname: traefik
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
      ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 8443
          protocol: UDP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-networking
          podSelector:
            matchLabels:
              # invariant: the app chart's pod selector label (ADR-029); a rename 502s the tunnel.
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 8090
          protocol: TCP

---
# hazard: without it every tailnet client gets `connection refused` while public traffic works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-svclb-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      svccontroller.k3s.cattle.io/svcname: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 443
          protocol: UDP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-scrape
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-telemetry
      ports:
        - port: 9153
          protocol: TCP
        - port: 9100
          protocol: TCP
