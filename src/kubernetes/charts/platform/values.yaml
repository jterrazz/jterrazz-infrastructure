# invariant: every default; each key's shape and traps are README.md.
name: ""
host: ""
port: 80

# invariant: a route is tailnet-only unless it says otherwise.
public: false

# hazard: never accept a 5xx or 000.
smoke:
  path: /
  expect: "200"

certificates: {}

secrets: {}

# hazard: names and paths address live data.
storage: {}

# hazard: ports are pod ports, never Service ports.
network: {}

# invariant: name -> dashboard JSON, one ConfigMap each; the helmfile reads the files.
dashboards: {}

# invariant: name -> Grafana alert provisioning document, all in one ConfigMap; the helmfile
# reads the files.
alerts: {}

# invariant: set by the helmfile from $NODE_NAME.
infrastructure:
  nodeName: ""
