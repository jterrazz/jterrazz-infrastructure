{{- /* invariant: the workload is another chart's, so its podSelector cannot be derived. */ -}}
{{- if .Values.network }}
{{- $net := .Values.network }}
{{- $selector := $net.podSelector | required "network.podSelector is required; the workload is rendered by another chart, so its labels cannot be derived" }}
{{- $policyTypes := list }}
{{- if $net.ingress }}{{ $policyTypes = append $policyTypes "Ingress" }}{{ end }}
{{- if $net.egress }}{{ $policyTypes = append $policyTypes "Egress" }}{{ end }}
{{- if not $policyTypes }}
{{- fail "network: declares neither `ingress:` nor `egress:`; a policy that selects pods and grants nothing is a silent deny" }}
{{- end }}
{{- include "common.networkPolicy" (dict
      "name" (include "platform.name" .)
      "labels" (include "platform.labels" .)
      "podSelector" (toYaml $selector)
      "policyTypes" $policyTypes
      "ingress" ($net.ingress | default list)
      "egress" ($net.egress | default list)) }}
{{- end }}
