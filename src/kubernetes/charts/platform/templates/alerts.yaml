{{- /* invariant: the platform's alert rules; an app ships its own through the app chart's spec.alerts. */}}
{{- $alerts := fromYaml (include "common.alerts" (dict "alerts" .Values.alerts "field" "alerts")) -}}
{{- if $alerts }}
{{ include "common.alertsConfigMap" (dict
     "name" (printf "%s-alerts" (include "platform.name" .))
     "labels" (include "platform.labels" .)
     "alerts" $alerts) }}
{{- end }}
