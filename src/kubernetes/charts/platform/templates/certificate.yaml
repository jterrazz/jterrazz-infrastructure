{{- /* invariant: certificates no route issues itself, such as the private zones' wildcards; the key names the Secret. */ -}}
{{- range $name, $cert := .Values.certificates }}
---
{{ include "common.certificate" (dict
     "name" $name
     "labels" (include "platform.labels" $)
     "secretName" $name
     "dnsNames" ($cert.dnsNames | required (printf "certificates.%s.dnsNames is required" $name))) }}
{{- end }}
