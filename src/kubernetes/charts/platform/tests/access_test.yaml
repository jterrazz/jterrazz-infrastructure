suite: public -> the route's reach
# invariant: the chart's network-exposure switch; a forgotten key means tailnet-only.
templates:
  - templates/ingress-route.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: serves a route on websecure alone by default, which cloudflared cannot reach
    asserts:
      - equal:
          path: spec.entryPoints
          value: [websecure]
      - equal:
          path: spec.routes[0].match
          value: Host(`ci-test-service.jterrazz.com`)
      - notExists:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]

  - it: "serves a `public: true` route on the tunnel alone, with no TLS, published by external-dns"
    set:
      public: true
    asserts:
      - equal:
          path: spec.entryPoints
          value: [tunnel]
      - notExists:
          path: spec.tls
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]
          value: tunnel.jterrazz.com

  - it: routes to the named service on the declared port, TLS from the default store
    asserts:
      - equal:
          path: spec.routes[0].services
          value:
            - name: ci-test-service
              port: 8080
      - equal:
          path: spec.tls
          value: {}

  - it: renders nothing without a host
    set:
      host: null
    asserts:
      - hasDocuments:
          count: 0
