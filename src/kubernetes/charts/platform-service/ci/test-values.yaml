# invariant: the chart's validation contract: every template is gated on a value, so
# defaults render nothing. `public` stays default; tests/access_test.yaml pins both arms.

name: ci-test-service
host: ci-test-service.jterrazz.com
port: 8080


# invariant: both halves away from the defaults, so a stamped contract shows in the snapshot.
smoke:
  path: /v2/
  expect: "401"

# invariant: a host whose routes live on another release (the openpanel shape).
certificates:
  ci-test-shared-tls:
    dnsNames:
      - ci-test-shared.jterrazz.com

# invariant: `secretName` is a consumer contract, required and never derived.
secrets:
  path: /studio-infrastructure/ci-test-service
  secretName: ci-test-service-credentials
  labels:
    ci_test_watcher: "1"
  template:
    data:
      config.yaml: '{{ with .CI_TEST_TOKEN.Value }}token: {{ quote . }}{{ end }}'

# invariant: PV is always <name>-<key>; hostPath /var/lib/k8s-data/<name>[/<pathSuffix>].
storage:
  # invariant: reproduces the historical <name>-data name.
  data:
    size: 3Gi
  uploads:
    size: 5Gi
    pathSuffix: uploads
  # invariant: claimName renames the PVC only; the PV keeps <name>-<key>.
  metrics:
    size: 1Gi
    pathSuffix: metrics
    claimName: storage-ci-test-0
  # invariant: nodeLocalPath leaves /var/lib/k8s-data: in the VM, lost on repave.
  node-local:
    size: 1Gi
    nodeLocalPath: /var/lib/ci-test-node-local

# invariant: populated so nodeAffinity renders; empty must omit it, never `values: [""]`.
infrastructure:
  nodeName: ci-test-node

# invariant: every peer form and both port spellings: an unreached peer is unvalidated.
network:
  podSelector:
    app.kubernetes.io/name: ci-test-service
    app.kubernetes.io/instance: ci-test-service
  ingress:
    - from: traefik
      ports: [8080]
    - from: any-namespace-pods:platform-client.jterrazz.com/ci-test=true
      ports: [8080]
  egress:
    # outside: bare 53 is TCP, the Kubernetes default.
    - to: any-namespace
      ports: ["53/UDP", 53]
    - to: namespace:platform-telemetry
      ports: [4317, 4318]
    - to: internet
      ports: [443]
    # invariant: no ports, the unrestricted-egress shape victoria-metrics needs.
    - to: anywhere

# invariant: one dashboard, so the ConfigMap's labels and folder are pinned.
dashboards:
  node: '{"title": "anything", "id": 7, "panels": []}'

# invariant: one valid document, so the ConfigMap and the shared validation are pinned.
alerts:
  ci-test-overview: |
    apiVersion: 1
    groups:
      - name: ci
        folder: studio-infrastructure
        rules:
          - uid: ci-test-rule
