suite: public -> the route's reach
# invariant: the chart's network-exposure switch; a forgotten key means tailnet-only.
templates:
  - templates/ingress-route.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: attaches private-access and the Cf-Ray guard by default
    asserts:
      - equal:
          path: spec.routes[0].middlewares
          value:
            - name: private-access
              namespace: platform-networking
      - equal:
          path: spec.routes[0].match
          value: (Host(`ci-test-service.jterrazz.com`)) && !HeaderRegexp(`Cf-Ray`, `.+`)

  - it: "attaches no access middleware for `public: true`"
    set:
      public: true
    asserts:
      - notExists:
          path: spec.routes[0].middlewares
      - equal:
          path: spec.routes[0].match
          value: Host(`ci-test-service.jterrazz.com`)

  - it: routes to the named service on the declared port, TLS from the default store
    asserts:
      - equal:
          path: spec.routes[0].services
          value:
            - name: ci-test-service
              port: 8080
      - equal:
          path: spec.tls
          value: {}

  - it: renders nothing without a host
    set:
      host: null
    asserts:
      - hasDocuments:
          count: 0
