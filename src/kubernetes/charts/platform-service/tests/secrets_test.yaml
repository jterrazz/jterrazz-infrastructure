suite: certificates and credentials owned by the service, not by its routes
# outside: both names are read literally from outside this chart, so both are required.
# The fixture loads per test: `set` deep-merges, so a missing secretName needs a bare base.
tests:
  - it: renders the declared certificates alone, none for the route
    # invariant: a route is served by the default TLSStore; only wildcards are issued here.
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/certificate.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: names the certificate and its secret after the map key
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/certificate.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ci-test-shared-tls
      - equal:
          path: spec.secretName
          value: ci-test-shared-tls
      - equal:
          path: spec.dnsNames
          value:
            - ci-test-shared.jterrazz.com

  - it: renders no InfisicalSecret when the service has no credentials
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    set:
      secrets: null
    asserts:
      - hasDocuments:
          count: 0

  - it: syncs the declared path into the Secret name the consumer reads
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ci-test-service-infisical
      - equal:
          path: spec.authentication.universalAuth.secretsScope.secretsPath
          value: /jterrazz-infrastructure/ci-test-service
      - equal:
          path: spec.authentication.universalAuth.secretsScope.envSlug
          value: prod
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: ci-test-service-credentials
      - equal:
          path: spec.managedKubeSecretReferences[0].secretNamespace
          value: NAMESPACE

  - it: stamps the extra labels on the CR, beside the chart's own
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    asserts:
      - equal:
          path: metadata.labels.ci_test_watcher
          value: "1"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: ci-test-service

  - it: passes the operator template through untouched
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    asserts:
      - equal:
          path: spec.managedKubeSecretReferences[0].template.data["config.yaml"]
          value: "{{ with .CI_TEST_TOKEN.Value }}token: {{ quote . }}{{ end }}"

  - it: renders no template when the service names none
    values:
      - ../ci/test-values.yaml
    templates:
      - templates/infisical.yaml
    set:
      secrets.template: null
    asserts:
      - notExists:
          path: spec.managedKubeSecretReferences[0].template

  - it: hard-fails a credentials block with no secretName to write into
    templates:
      - templates/infisical.yaml
    set:
      name: ci-test-service
      secrets:
        path: /jterrazz-infrastructure/ci-test-service
    asserts:
      - failedTemplate:
          errorMessage: "secrets.secretName is required; the consumer reads it by that literal name"
