{{- /* invariant: the infrastructure dashboards; an app ships its own through the app chart's spec.dashboards. */ -}}
{{- range $name, $json := .Values.dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ $name }}
  labels:
    {{- include "platform-service.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: infrastructure
data:
  {{ $name }}.json: |
    {{- $json | nindent 4 }}
{{- end }}
