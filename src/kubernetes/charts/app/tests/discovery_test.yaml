suite: what the cluster records about the app repo and its clients
# invariant: the stamps that spare a list outside the cluster (ADR-016).
tests:
  - it: annotates the Deployment with the repo CI passed
    templates:
      - templates/deployment.yaml
    values:
      - ../ci/test-values.yaml
    asserts:
      - equal:
          path: metadata.annotations["app.jterrazz.com/repository"]
          value: jterrazz/ci-test-app

  - it: stamps nothing when CI passed no repository
    # hazard: a missing meta.repository must be reported missing, never guessed.
    templates:
      - templates/deployment.yaml
    values:
      - ../ci/test-values.yaml
    set:
      meta.repository: ""
    asserts:
      - notExists:
          path: metadata.annotations["app.jterrazz.com/repository"]

  - it: opens the app port to every peer in spec.network.exposeTo
    templates:
      - templates/network-policy.yaml
    set:
      metadata.name: api
      environment: prod
      spec:
        image: r/api:1
        port: 8317
        network:
          exposeTo:
            - namespace:platform-telemetry
      environments:
        prod: {}
    asserts:
      # outside: [0] is the unconditional Traefik rule; the declared peers follow it.
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: platform-telemetry
            ports:
              - port: 8317

  - it: hard-fails an exposeTo peer outside the vocabulary
    # hazard: a typo'd peer would render a policy that silently admits nothing.
    templates:
      - templates/network-policy.yaml
    set:
      metadata.name: api
      environment: prod
      spec:
        image: r/api:1
        network:
          exposeTo:
            - namesapce:platform-telemetry
      environments:
        prod: {}
    asserts:
      - failedTemplate:
          errorMessage: 'network: unknown peer "namesapce:platform-telemetry" (valid: traefik, any-namespace, internet, anywhere, namespace:<ns>, pods:<key>=<value>, any-namespace-pods:<key>=<value>)'
