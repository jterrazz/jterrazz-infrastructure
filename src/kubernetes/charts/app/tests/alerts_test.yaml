suite: spec.alerts -> Grafana alert-rule ConfigMap
# hazard: Grafana's alerts sidecar selects `grafana_alert: "1"` cluster-wide; a ConfigMap
# that loses the label is silently inert. Gating lives in environment_gating_test.yaml.
templates:
  - templates/alert-configmap.yaml
tests:
  - it: renders nothing when the app declares no alerts
    # invariant: no empty-`data` ConfigMap, or a rule-less app churns Grafana every deploy.
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts: null
    asserts:
      - hasDocuments:
          count: 0

  - it: puts every entry in ONE ConfigMap named <app>-alerts
    # invariant: one object, N keys: a per-iteration overwrite of `data` fails here.
    values:
      - ../ci/test-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: ci-test-app-alerts
      - isSubset:
          path: metadata.labels
          content:
            app: ci-test-app
            environment: prod
            grafana_alert: "1"
      # invariant: no grafana_folder annotation: each group names its own `folder:`.
      - notExists:
          path: metadata.annotations
      - exists:
          path: data["ci-test-app.yaml"]
      - exists:
          path: data["ci-test-app-extra.yaml"]

  - it: keys each entry <name>.yaml and passes the payload through verbatim
    # hazard: byte-for-byte: any re-indent or re-quote is a rule that silently fails to provision.
    values:
      - ../ci/test-values.yaml
    asserts:
      - equal:
          path: data["ci-test-app.yaml"]
          value: |
            apiVersion: 1
            groups:
              - orgId: 1
                name: ci-test-app
                folder: ci-test-app
                interval: 1m
                rules: []
      - equal:
          path: data["ci-test-app-extra.yaml"]
          value: |
            apiVersion: 1
            groups:
              - orgId: 1
                name: ci-test-app-extra
                folder: ci-test-app
                interval: 5m
                rules: []

  - it: takes alerts from an environment override like any other spec key
    # value: maps deep-merge, so an environment may add or replace an entry (only ever in prod).
    values:
      - ../ci/test-values.yaml
    set:
      environments.prod.alerts:
        ci-test-app: |
          apiVersion: 1
          groups: []
    asserts:
      - equal:
          path: data["ci-test-app.yaml"]
          value: |
            apiVersion: 1
            groups: []
      - exists:
          path: data["ci-test-app-extra.yaml"]

  - it: passes a rule whose uid is exactly 40 characters
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              interval: 1m
              rules:
                - uid: ci-test-app-a-uid-of-exactly-forty-chars
                  title: forty
    asserts:
      - hasDocuments:
          count: 1

  - it: fails the render on a rule uid over 40 characters
    # hazard: Grafana caps a uid at 40 and rejects every app's rules while one such file is mounted.
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              interval: 1m
              rules:
                - uid: ci-test-app-a-uid-of-forty-one-characters
                  title: forty-one
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule uid "ci-test-app-a-uid-of-forty-one-characters" is 41 characters; Grafana caps a uid at 40 and rejects the whole alerting reload, for every app, when one exceeds it'

  - it: fails the render in staging too, before the rule reaches prod
    values:
      - ../ci/test-values.yaml
    set:
      environment: staging
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci-test-app-a-uid-of-forty-one-characters
    asserts:
      - failedTemplate: {}

  - it: fails the render on a rule with no uid
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - title: anonymous
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule 0 of group "ci-test-app" has no `uid`'

  - it: fails the render on a uid outside [a-zA-Z0-9_-]
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci.test.app
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule uid "ci.test.app" may hold only letters, digits, `-` and `_`'

  - it: fails the render on one uid used by two entries
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci-test-app-shared
        ci-test-app-extra: |
          apiVersion: 1
          groups:
            - name: ci-test-app-extra
              folder: ci-test-app
              rules:
                - uid: ci-test-app-shared
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app-extra: rule uid "ci-test-app-shared" is already used by spec.alerts.ci-test-app'

  - it: fails the render on a payload that is not an apiVersion 1 document
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          groups: []
    asserts:
      - failedTemplate:
          errorMessage: "spec.alerts.ci-test-app: the payload must be a Grafana provisioning document with `apiVersion: 1`"

  - it: fails the render on a group with no folder
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              rules: []
    asserts:
      - failedTemplate:
          errorMessage: "spec.alerts.ci-test-app: group 0 must name both `name` and `folder`"

  - it: fails the render on a rule that hides its own query errors
    # invariant: `execErrState: OK` keeps a broken query green forever; unset means Error.
    values:
      - ../ci/test-values.yaml
    set:
      spec.alerts:
        ci-test-app: |
          apiVersion: 1
          groups:
            - name: ci-test-app
              folder: ci-test-app
              rules:
                - uid: ci-test-app-silent
                  execErrState: OK
    asserts:
      - failedTemplate:
          errorMessage: 'spec.alerts.ci-test-app: rule "ci-test-app-silent" sets `execErrState: OK`, which keeps a broken query green; leave it unset'
