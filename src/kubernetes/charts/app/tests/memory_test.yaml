suite: memory quantity parsing (app.memMi / app.memoryLimit)
# invariant: app.memMi understands `<n>Mi` and `<n>Gi` only, else "" (leave it alone).
templates:
  - templates/deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: passes a Mi request through and doubles it for the limit
    set:
      spec.resources.memory: 512Mi
      spec.resources.memoryLimit: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1024Mi

  - it: converts a Gi request to Mi for the derived limit
    # invariant: derived limits are always in Mi, whatever the input unit.
    set:
      spec.resources.memory: 1Gi
      spec.resources.memoryLimit: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2048Mi

  - it: uses an explicit memoryLimit verbatim, without unit conversion
    # value: an explicit limit bypasses the parser and stays verbatim.
    set:
      spec.resources.memory: 512Mi
      spec.resources.memoryLimit: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: leaves an unparseable request alone rather than guessing
    # hazard: an unknown unit falls back to the request, never a 1000x-wrong doubled limit.
    set:
      spec.resources.memory: 1000000Ki
      spec.resources.memoryLimit: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1000000Ki

# outside: no no-request case: the defaults live in values.yaml, not the template.
