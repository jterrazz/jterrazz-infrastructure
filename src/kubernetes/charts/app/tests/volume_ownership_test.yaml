suite: the PersistentVolume names the repository that owns it
# invariant: the cluster's ownership policy judges a PV by this label alone, and the value is
# the bare repo name (`owner/name` is no valid label value).
values:
  - ../ci/test-values.yaml
templates:
  - templates/storage.yaml
tests:
  - it: labels the PV with the bare repository name
    documentSelector:
      path: kind
      value: PersistentVolume
    asserts:
      - equal:
          path: metadata.labels["studio.jterrazz.com/repository"]
          value: ci-test-app

  - it: leaves the label off when CI passes no repository
    set:
      meta.repository: ""
    documentSelector:
      path: kind
      value: PersistentVolume
    asserts:
      - notExists:
          path: metadata.labels["studio.jterrazz.com/repository"]
