suite: ingress list, replace-not-merge, and the explicit-visibility guard
# hazard: lists are REPLACED wholesale by an environment (mergeOverwrite), or staging would
# inherit prod's public hostname. Synthetic cases use a `probe` env to avoid Helm's
# "ignoring non-table value" noise.
templates:
  - templates/ingress.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: REPLACES the base list with the environment's, never merges them
    # invariant: staging has one entry, spec several; a merge would expose staging publicly.
    set:
      environment: staging
    asserts:
      - hasDocuments:
          count: 1 # one IngressRoute; no strip-prefix, path is /
      - equal:
          path: spec.routes[0].match
          value: Host(`ci-test-app-staging.jterrazz.com`)

  - it: "serves a `public: false` entry on websecure alone, with no middleware of its own"
    # invariant: the entrypoint is the gate: cloudflared reaches only `tunnel` (ADR-002).
    set:
      environment: staging
    asserts:
      - equal:
          path: spec.entryPoints
          value: [websecure]
      - notExists:
          path: spec.routes[0].middlewares

  - it: "serves a `public: true` entry on the tunnel alone, without TLS, for external-dns to publish"
    set:
      environment: probe
      environments.probe.ingress:
        - host: probe.jterrazz.com
          path: /
          public: true
    asserts:
      - equal:
          path: spec.entryPoints
          value: [tunnel]
      - notExists:
          path: spec.tls
      - notExists:
          path: spec.routes[0].middlewares
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]
          value: tunnel.jterrazz.com

  - it: renders no Certificate, and serves TLS from the default store
    # invariant: the private zones' wildcards are the default TLSStore's; public TLS ends at
    # the edge (ADR-001).
    set:
      environment: probe
      environments.probe.ingress:
        - host: probe.internal.jterrazz.com
          public: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: IngressRoute
      - equal:
          path: spec.tls
          value: {}

  - it: "hard-fails an ingress entry with no explicit `public` field"
    # hazard: visibility is never implied by omission.
    set:
      environment: probe
      environments.probe.ingress:
        - host: probe.jterrazz.com
          path: /
    asserts:
      - failedTemplate:
          errorMessage: "ingress entry 0 for ci-test-app needs `public: true|false`; network visibility is never defaulted"

  - it: names each IngressRoute by its index, so two entries on one host never collide
    set:
      environment: probe
      environments.probe.ingress:
        - host: shared.jterrazz.com
          path: /api
          public: true
        - host: shared.jterrazz.com
          path: /admin
          public: false
    asserts:
      - hasDocuments:
          count: 4 # 2 strip-prefix Middlewares + 2 IngressRoutes
      - equal:
          path: metadata.name
          value: ci-test-app-0
        documentIndex: 1
      - equal:
          path: metadata.name
          value: ci-test-app-1
        documentIndex: 3

  - it: skips the strip-prefix middleware when the app opts out
    # invariant: an MCP server at the literal /mcp path keeps its prefix.
    set:
      environment: probe
      environments.probe.ingress:
        - host: probe.jterrazz.com
          path: /mcp
          public: false
          stripPrefix: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.routes[0].match
          value: Host(`probe.jterrazz.com`) && PathPrefix(`/mcp`)

  - it: leaves a public route reachable through the tunnel
    documentSelector:
      path: metadata.name
      value: ci-test-app-0
    asserts:
      - equal:
          path: spec.routes[0].match
          value: Host(`ci-test-app.jterrazz.com`) && PathPrefix(`/api`)
