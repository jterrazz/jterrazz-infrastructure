suite: platformServices catalog opt-in and its typo guard
# invariant: each name resolves against app.platformCatalog into env, an egress hole and
# (for a catalog target) a client label; validated in the one accessor all consumers call.
values:
  - ../ci/test-values.yaml
tests:
  - it: hard-fails the render on an unknown service name
    # invariant: a typo is a build error, never telemetry quietly off.
    set:
      spec.platformServices:
        - otel-colector
    asserts:
      - failedTemplate:
          errorMessage: 'spec.platformServices: unknown service "otel-colector" (valid: otel-collector, studio-intelligence-gateway)'

  - it: hard-fails even when only one name of several is wrong
    set:
      spec.platformServices:
        - otel-collector
        - nope
    asserts:
      - failedTemplate:
          errorMessage: 'spec.platformServices: unknown service "nope" (valid: otel-collector, studio-intelligence-gateway)'

  - it: hard-fails on a name introduced by an environment override
    # invariant: checked on the resolved list, since an environment replaces it.
    set:
      environments.prod.platformServices:
        - studio-inteligence
    asserts:
      - failedTemplate:
          errorMessage: 'spec.platformServices: unknown service "studio-inteligence" (valid: otel-collector, studio-intelligence-gateway)'

  - it: injects the catalog env for each declared service
    templates:
      - templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.platform-telemetry:4318"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STUDIO_INTELLIGENCE_BASE_URL
            value: "http://studio-intelligence-gateway.studio-intelligence-prod.svc.cluster.local/v1"

  - it: lets an app-declared env of the same name win over the catalog
    templates:
      - templates/deployment.yaml
    set:
      spec.env.OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://localhost:4318"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.platform-telemetry:4318"

  - it: stamps the client pod label only for a catalog entry that has one
    # invariant: the target selects on this label, so a new consumer needs no edit there.
    templates:
      - templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["platform-client.jterrazz.com/studio-intelligence-gateway"]
          value: "true"

  - it: keeps the client label OUT of the immutable selector
    templates:
      - templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.selector.matchLabels["platform-client.jterrazz.com/studio-intelligence-gateway"]
      - equal:
          path: spec.selector.matchLabels
          value:
            app: ci-test-app
            environment: prod

  - it: opens one egress rule per declared service, on the POD ports
    # hazard: the catalog's POD ports; the Service port would yield a policy that drops all.
    templates:
      - templates/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: platform-telemetry
            ports:
              - port: 4317
              - port: 4318
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: studio-intelligence-gateway-prod
            ports:
              - port: 8317

  - it: opts out completely when the list is empty
    # invariant: OTel is opt-in since chart 2.0.
    templates:
      - templates/deployment.yaml
    set:
      spec.platformServices: []
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: STUDIO_INTELLIGENCE_BASE_URL
          any: true

  - it: renders the server-side ingress rule when the app IS a catalog target
    # invariant: an app named after a clientLabel target admits every pod stamped with it.
    templates:
      - templates/network-policy.yaml
    set:
      metadata.name: studio-intelligence-gateway
      spec.platformServices: []
    # value: selects the app's own policy; `<app>-cronjobs` also renders.
    documentSelector:
      path: metadata.name
      value: studio-intelligence-gateway
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    platform-client.jterrazz.com/studio-intelligence-gateway: "true"
            ports:
              - port: 3000
