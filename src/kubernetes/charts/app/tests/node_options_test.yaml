suite: NODE_OPTIONS heap cap and its 512Mi floor
# hazard: the heap cap is 75% of the request, from 512Mi up only (ADR-010).
templates:
  - templates/deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: injects nothing one MiB under the 512Mi floor
    # hazard: below it the cap starves the heap: spwn.sh crash-looped at 128Mi -> a 96MB cap.
    set:
      spec.resources.memory: 511Mi
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
          any: true

  - it: injects a 75% cap exactly AT the floor
    # value: 512 * 3 / 4 = 384. The floor is inclusive (`ge 512`).
    set:
      spec.resources.memory: 512Mi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=384"

  - it: derives the cap from a Gi request through app.memMi
    # value: tracks the REQUEST, never the (2x) limit.
    set:
      spec.resources.memory: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"

  - it: lets an app-declared NODE_OPTIONS win and injects nothing extra
    # hazard: two NODE_OPTIONS entries is an invalid PodSpec; the app's own value wins alone.
    set:
      spec.resources.memory: 1Gi
      spec.env.NODE_OPTIONS: "--max-old-space-size=900 --enable-source-maps"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=900 --enable-source-maps"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"

  - it: skips injection for a request in an unparseable unit
    # invariant: an unknown unit means no cap.
    set:
      spec.resources.memory: 1000000Ki
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
          any: true

  - it: derives the cap from an environment-level resources override
    # invariant: resources deep-merge, so an environment raising memory moves the cap.
    set:
      spec.resources.memory: 256Mi
      environments.prod.resources.memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_OPTIONS
            value: "--max-old-space-size=768"
