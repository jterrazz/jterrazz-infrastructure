suite: an app reads its own Infisical folder, in its own environment
# invariant: the folder is /<app> and the env slug the release's environment, the one pair the
# app-deployer-ownership policy admits; nothing in application.yaml can name another (ADR-029).
templates:
  - templates/infisical.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: derives the folder from the app's name
    documentSelector:
      path: metadata.name
      value: ci-test-app-infisical
    asserts:
      - equal:
          path: spec.authentication.universalAuth.secretsScope.secretsPath
          value: /ci-test-app
      - equal:
          path: spec.authentication.universalAuth.secretsScope.projectSlug
          value: studio-infrastructure
      - equal:
          path: spec.managedKubeSecretReferences[0].secretName
          value: ci-test-app-secrets

  - it: reads the release's own environment, never another's
    set:
      environment: staging
    documentSelector:
      path: metadata.name
      value: ci-test-app-infisical
    asserts:
      - equal:
          path: spec.authentication.universalAuth.secretsScope.envSlug
          value: staging

  - it: renders no app InfisicalSecret when no key is listed
    # value: staging's public image renders no pull secret either, so nothing is left.
    set:
      environment: staging
      spec.secrets.env: []
    asserts:
      - hasDocuments:
          count: 0
