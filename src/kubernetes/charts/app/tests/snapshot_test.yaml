suite: full fixture render (snapshot)
# invariant: the whole fixture render; every template is listed, and a diff is read before
# `helm unittest -u` (ADR-010).
templates:
  - templates/alert-configmap.yaml
  - templates/configmap.yaml
  - templates/dashboard-configmap.yaml
  - templates/deployment.yaml
  - templates/infisical.yaml
  - templates/ingress.yaml
  - templates/network-policy.yaml
  - templates/service.yaml
  - templates/storage.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: matches the recorded render of the CI fixture
    asserts:
      - matchSnapshot: {}
