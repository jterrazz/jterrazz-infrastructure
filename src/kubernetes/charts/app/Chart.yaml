apiVersion: v2
name: app
description: The chart every workload of the fleet deploys through
type: application
# hazard: bump with any template change: apps pull it unversioned and the publisher never
# overwrites a version, so an unbumped change ships nothing (ADR-010).
version: 4.1.0

# invariant: common's exact version; bundled into the .tgz.
dependencies:
  - name: common
    version: 2.2.0
    repository: file://../common
