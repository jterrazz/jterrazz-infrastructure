# invariant: the chart's validation contract. Every template is gated on app.envExists, so
# default values render nothing; `prod` is the realistic app shape kubeconform renders,
# `staging` the mutually exclusive arm of every switch, rendered by the unit tests.

metadata:
  name: ci-test-app

# value: pinned so the app.jterrazz.com/repository annotation branch renders.
meta:
  repository: jterrazz/ci-test-app

environment: prod

spec:
  # value: pinned so app.image renders the explicit branch, not the :latest fallback.
  image: registry.internal.jterrazz.com/ci-test-app:ci

  port: 3000

  command: ["node", "server.js"]
  args: ["--enable-source-maps"]

  # invariant: one capability back over the hardened defaults.
  securityContext:
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]

  runAsRoot: false

  # value: >= 512Mi so the NODE_OPTIONS heap-cap branch renders (nothing below the floor).
  resources:
    cpu: 100m
    memory: 512Mi
    memoryLimit: 1Gi

  health:
    path: /health
    # invariant: startup + liveness on /healthz, readiness on /health.
    livenessPath: /healthz

  # hazard: size and mountPath are both `required`; dropping either must fail the render.
  storage:
    size: 2Gi
    mountPath: /data

  # invariant: both catalog entries; jterrazz-intelligence also stamps its clientLabel.
  platformServices:
    - otel-collector
    - jterrazz-intelligence

  # invariant: a peer that cannot stamp the clientLabel, plus one declared egress rule.
  network:
    exposeTo:
      - namespace:platform-telemetry
    egress:
      - to: namespace:platform-analytics
        ports: [5432]

  secrets:
    path: /jterrazz-ci/ci-test-app
    env:
      - DATABASE_URL
      - API_TOKEN

  env:
    LOG_LEVEL: info

  # invariant: both forms: content at /app/<filename>, and { path, content }.
  configFiles:
    ci-test.json: |
      { "fixture": true }
    ci-test.xml:
      path: /etc/ci-test/conf.d/ci-test.xml
      content: |
        <fixture/>

  secretMounts:
    - secretName: ci-test-app-files
      mountPath: /etc/ci-test-files

  # invariant: prod-only.
  dashboards:
    service: |
      { "title": "anything", "uid": "anything", "panels": [] }

  # hazard: two entries: the alerts ConfigMap is ONE object with a key per entry, so one
  # entry would not catch a template emitting only the last key.
  alerts:
    ci-test-app: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: ci-test-app
          folder: ci-test-app
          interval: 1m
          rules: []
    ci-test-app-extra: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: ci-test-app-extra
          folder: ci-test-app
          interval: 5m
          rules: []

  ingress:
    # invariant: public sub-path -> stripPrefix.
    - host: ci-test-app.jterrazz.com
      path: /api
      public: true
    # invariant: private -> websecure alone, TLS from the default store.
    - host: ci-test-app-internal.jterrazz.com
      path: /
      public: false
    # invariant: stripPrefix false -> no strip Middleware, and smoke opts the route out.
    - host: ci-test-app-mcp.jterrazz.com
      path: /mcp
      public: true
      stripPrefix: false
    # invariant: redirect, preservePath defaulting TRUE.
    - host: ci-test-app-old.jterrazz.com
      public: true
      redirectTo: https://ci-test-app.jterrazz.com
    # invariant: redirect, preservePath false -> one fixed landing page.
    - host: ci-test-app-legacy.jterrazz.com
      public: true
      redirectTo: https://ci-test-app.jterrazz.com/moved
      preservePath: false
    # invariant: an explicit smoke override replaces the derived /health and 200.
    - host: ci-test-app-probe.jterrazz.com
      path: /
      public: false
      smoke:
        path: /ready
        expect: "204,200"
    # invariant: the openpanel ingest shape: a string stripPrefix and an explicit smoke block
    # with its verb.
    - host: ci-test-app-ingest.jterrazz.com
      path: /api/track
      public: true
      stripPrefix: /api
      smoke:
        method: POST
        path: /api/track
        expect: "401"

environments:
  prod:
    tag: main
    replicas: 1
  # invariant: THE DATASTORE SHAPE: the other arm of every switch prod takes.
  staging:
    tag: main
    replicas: 1
    secretsEnv: prod
    runAsRoot: true
    resources:
      memory: 256Mi
    # invariant: public image: no pull secret, no imagePullPolicy override.
    image: postgres:14-alpine
    servicePort: 5432
    # invariant: Recreate without storage (migration on boot).
    strategy: Recreate
    # invariant: a claim another release owns: no PV/PVC.
    storage:
      mountPath: /var/lib/postgresql/data
      claimName: ci-test-existing-claim
    health:
      exec: ["sh", "-c", "pg_isready"]
    # invariant: isolated: the whole security model of an unauthenticated datastore.
    network:
      isolated: true
      exposeTo:
        - pods:app=ci-test-worker
    ingress:
      - host: ci-test-app-staging.jterrazz.com
        path: /
        public: false
