{{- /* invariant: prod only, since a dashboard uid is global; the identity is common.dashboards'. */ -}}
{{- if and (eq (include "app.envExists" .) "true") (eq .Values.environment "prod") -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{ include "common.dashboards" (dict
     "owner" (include "app.name" .)
     "dashboards" $spec.dashboards
     "field" "spec.dashboards"
     "labels" (include "app.labels" .)
     "configMapPrefix" (printf "%s-dashboard-" (include "app.name" .))
     "workload" (dict "namespace" (printf "%s-prod" (include "app.name" .)) "container" (include "app.name" .))) }}
{{- end }}
