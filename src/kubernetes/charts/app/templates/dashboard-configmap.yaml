{{- /* invariant: the primary release only, since a dashboard uid is global; the identity is
       common.dashboards'. */ -}}
{{- if and (eq (include "app.envExists" .) "true") (eq (include "app.isPrimary" .) "true") -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{ include "common.dashboards" (dict
     "owner" (include "app.name" .)
     "dashboards" $spec.dashboards
     "field" "spec.dashboards"
     "labels" (include "app.labels" .)
     "configMapPrefix" (printf "%s-dashboard-" (include "app.name" .))
     "workload" (dict "namespace" (include "app.instanceName" .) "container" (include "app.name" .))) }}
{{- end }}
