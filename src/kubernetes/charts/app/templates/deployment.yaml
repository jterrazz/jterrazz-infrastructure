{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $resources := $spec.resources -}}
{{- $platformClientLabels := fromYaml (include "app.platformClientLabels" .) -}}
{{- $storage := $spec.storage -}}
{{- /* invariant: an RWO hostPath never gets two writers, so storage implies Recreate. */ -}}
{{- $strategy := $spec.strategy | default (ternary "Recreate" "" (not (not $storage))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  {{- if or .Values.meta.repository $spec.secrets.path }}
  annotations:
    {{- with .Values.meta.repository }}
    app.jterrazz.com/repository: {{ . | quote }}
    {{- end }}
    {{- if $spec.secrets.path }}
    {{- /* invariant: the operator rolls the pods when a synced value changes, the one event that needs it. */}}
    secrets.infisical.com/auto-reload: "true"
    {{- end }}
  {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas }}
  revisionHistoryLimit: 3
  {{- if $strategy }}
  strategy:
    type: {{ $strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* invariant: a pod rolls on a new image digest, a config change or a secret change,
             never on a bare upgrade, which would restart the registry under every platform deploy. */}}
      annotations:
        checksum/config: {{ $spec.configFiles | default dict | toJson | sha256sum | quote }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- /* invariant: pod labels only: selectorLabels are immutable. */}}
        {{- range $key, $value := $platformClientLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with include "app.podSecurityContext" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if eq (include "app.privateImage" .) "true" }}
      imagePullSecrets:
        - name: registry-credentials
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          {{- if $spec.command }}
          command:
            {{- range $spec.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $spec.args }}
          args:
            {{- range $spec.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
          env:
            {{- include "app.containerEnv" (dict "ctx" . "resources" $resources) | trim | nindent 12 }}
          {{- if or $storage $spec.configFiles $spec.secretMounts }}
          volumeMounts:
            {{- include "app.volumeMounts" (dict "ctx" . "storage" (not (not $storage))) | trim | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu }}
              memory: {{ $resources.memory }}
            limits:
              memory: {{ include "app.memoryLimit" . }}
          {{- /* value: 5s, not 1s: a Node app doing background work answers late; 30 x 10s of boot grace. */}}
          startupProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" true) | nindent 12 }}
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" true) | nindent 12 }}
            timeoutSeconds: 5
          readinessProbe:
            {{- include "app.probe" (dict "ctx" . "liveness" false) | nindent 12 }}
            timeoutSeconds: 5
      {{- if or $storage $spec.configFiles $spec.secretMounts }}
      volumes:
        {{- include "app.volumes" (dict "ctx" . "storage" (not (not $storage))) | trim | nindent 8 }}
      {{- end }}
{{- end }}
