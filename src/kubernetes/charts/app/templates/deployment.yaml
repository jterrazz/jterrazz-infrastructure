{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $resources := $spec.resources -}}
{{- $storage := $spec.storage -}}
{{- /* invariant: an RWO hostPath never gets two writers, so storage implies Recreate. */ -}}
{{- $strategy := $spec.strategy | default (ternary "Recreate" "" (not (not $storage))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  {{- if or .Values.meta.repository $spec.secrets.env }}
  annotations:
    {{- with .Values.meta.repository }}
    studio.jterrazz.com/repository: {{ . | quote }}
    {{- end }}
    {{- if $spec.secrets.env }}
    {{- /* invariant: the operator rolls the pods when a synced value changes, the one event that needs it. */}}
    secrets.infisical.com/auto-reload: "true"
    {{- end }}
  {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas }}
  revisionHistoryLimit: 3
  {{- if $strategy }}
  strategy:
    type: {{ $strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* invariant: a pod rolls on a new image digest, a config change or a secret change,
             never on a bare upgrade, which would restart the registry under every platform deploy. */}}
      annotations:
        checksum/config: {{ $spec.configFiles | default dict | toJson | sha256sum | quote }}
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with include "app.podSecurityContext" $spec }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if eq (include "app.privateImage" (dict "ctx" . "spec" $spec)) "true" }}
      imagePullSecrets:
        - name: registry-credentials
      {{- end }}
      {{- /* invariant: the migration runs as the app runs: same image, env, secrets, volumes and
             securityContext, as the image's own argv (no shell, so a distroless image works). A
             failing one holds the new pod in Init, so a rolling update never cuts over and a
             Recreate one is undone by the deploy's --rollback-on-failure (README.md, spec.migrate). */}}
      {{- with $spec.migrate }}
      initContainers:
        - name: migrate
          image: {{ include "app.image" $spec }}
          securityContext:
            {{- include "app.containerSecurityContext" (dict "ctx" $ "spec" $spec) | nindent 12 }}
          command:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "app.containerEnv" (dict "ctx" $ "spec" $spec) | trim | nindent 12 }}
          {{- if or $storage $spec.configFiles $spec.secretMounts }}
          volumeMounts:
            {{- include "app.volumeMounts" (dict "spec" $spec) | trim | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu }}
              memory: {{ $resources.memory }}
            limits:
              memory: {{ include "app.memoryLimit" $resources }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" $spec }}
          securityContext:
            {{- include "app.containerSecurityContext" (dict "ctx" . "spec" $spec) | nindent 12 }}
          {{- if $spec.command }}
          command:
            {{- range $spec.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $spec.args }}
          args:
            {{- range $spec.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
          {{- /* hazard: Traefik keeps routing to a terminating pod until its endpoint is removed; the
                 sleep holds SIGTERM until it is, inside the default 30s grace period. */}}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            {{- include "app.containerEnv" (dict "ctx" . "spec" $spec) | trim | nindent 12 }}
          {{- if or $storage $spec.configFiles $spec.secretMounts }}
          volumeMounts:
            {{- include "app.volumeMounts" (dict "spec" $spec) | trim | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu }}
              memory: {{ $resources.memory }}
            limits:
              memory: {{ include "app.memoryLimit" $resources }}
          {{- /* value: 5s, not 1s: a Node app doing background work answers late; 30 x 10s of boot grace. */}}
          startupProbe:
            {{- include "app.probe" (dict "spec" $spec "liveness" true) | nindent 12 }}
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            {{- include "app.probe" (dict "spec" $spec "liveness" true) | nindent 12 }}
            timeoutSeconds: 5
          readinessProbe:
            {{- include "app.probe" (dict "spec" $spec "liveness" false) | nindent 12 }}
            timeoutSeconds: 5
      {{- if or $storage $spec.configFiles $spec.secretMounts }}
      volumes:
        {{- include "app.volumes" (dict "ctx" . "spec" $spec) | trim | nindent 8 }}
      {{- end }}
{{- end }}
