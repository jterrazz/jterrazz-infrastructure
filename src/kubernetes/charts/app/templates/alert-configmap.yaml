{{- /* invariant: prod only, since rule uids are global; validated in every environment. */}}
{{- if eq (include "app.envExists" .) "true" -}}
{{- $alerts := fromYaml (include "app.alerts" .) -}}
{{- if and $alerts (eq .Values.environment "prod") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-alerts
  labels:
    {{- include "app.labels" . | nindent 4 }}
    grafana_alert: "1"
data:
  {{- range $name, $rules := $alerts }}
  {{ $name }}.yaml: |
    {{- $rules | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
