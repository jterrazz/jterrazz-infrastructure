{{- /* invariant: always rendered; the rules are README.md's "NetworkPolicy" section. */ -}}
{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $net := $spec.network | default dict -}}
{{- $ingress := list -}}
{{- if not $net.isolated -}}
{{- $ingress = append $ingress (dict "from" "traefik" "ports" (list $spec.port)) -}}
{{- end -}}
{{- /* invariant: the provider's half of the consent `uses` asks for, judged on namespace labels,
       which only a namespace's owning repository sets (ADR-029). */ -}}
{{- with $spec.serves -}}
{{- $peer := printf "namespace-label:studio.jterrazz.com/app=%s" (join "," .) -}}
{{- if has "all" . -}}
{{- $peer = "namespace-label:studio.jterrazz.com/tier=app" -}}
{{- end -}}
{{- $ingress = append $ingress (dict "from" $peer "ports" (list $spec.port)) -}}
{{- end -}}
{{- range $peer := ($net.exposeTo | default list) -}}
{{- $ingress = append $ingress (dict "from" $peer "ports" (list $spec.port)) -}}
{{- end -}}
{{- $egress := list (dict "to" "any-namespace" "ports" (list "53/UDP" 53)) -}}
{{- if not $net.isolated -}}
{{- $egress = append $egress (dict "to" "internet") -}}
{{- end -}}
{{- range $rule := ($net.egress | default list) -}}
{{- $egress = append $egress $rule -}}
{{- end -}}
{{- range $entry := fromYamlArray (include "app.uses" $spec) -}}
{{- $egress = append $egress (dict "to" (printf "namespace:%s" $entry.namespace) "ports" $entry.ports) -}}
{{- end -}}
{{- include "common.networkPolicy" (dict
      "name" (include "app.name" .)
      "labels" (include "app.labels" .)
      "podSelector" (include "app.selectorLabels" .)
      "policyTypes" (list "Ingress" "Egress")
      "ingress" $ingress
      "egress" $egress) }}
{{- end }}
