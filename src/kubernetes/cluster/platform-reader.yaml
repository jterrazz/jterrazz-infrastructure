---
# invariant: smoke.yaml's identity, this repository's OIDC user: it writes nothing and reads no
# Secret (ADR-022).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, services, serviceaccounts]
    verbs: [get, list, watch]
  # invariant: every pod template a NetworkPolicy may select (specs/specs/cluster/network-policies).
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list, watch]
  # invariant: asks the authorizer about another identity; grants nothing.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: github:jterrazz/jterrazz-infrastructure
