---
# value: 100 req/s, burst 200: browsing passes, scrapers do not.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: rate-limit
spec:
  rateLimit:
    average: 100
    burst: 200
    # invariant: the edge always overwrites Cf-Connecting-Ip; tailnet traffic shares one bucket.
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
# value: text alone: registry layers and images are compressed already, and the edge compresses
# public traffic again.
spec:
  compress:
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - image/svg+xml

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""

---
# hazard: klipper-lb MASQUERADEs every tailnet request to an svclb pod address, so 10.42/16 is
# the one source a request ever has; allow-traefik-ingress keeps every other pod off Traefik,
# and the Cf-Ray guard the tunnel's requests (ADR-003).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-access
  namespace: platform-networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: access-control
spec:
  ipAllowList:
    sourceRange:
      - "10.42.0.0/16"
