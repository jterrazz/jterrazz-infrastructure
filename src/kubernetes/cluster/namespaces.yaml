---
# invariant: every platform namespace, with its Pod Security level and `tier: platform`; an app
# namespace is created by the app's own deploy, labelled `tier: app` (ADR-017).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-networking
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.jterrazz.com/tier: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-registry
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.jterrazz.com/tier: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.jterrazz.com/tier: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    # invariant: node-exporter runs hostNetwork and hostPath, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.jterrazz.com/tier: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.jterrazz.com/tier: platform
