[defaults]
inventory = inventories/laptop.yml
roles_path = roles
forks = 10
gathering = smart
host_key_checking = false
timeout = 30
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[privilege_escalation]
become = true
become_method = sudo
become_user = root

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining = true
