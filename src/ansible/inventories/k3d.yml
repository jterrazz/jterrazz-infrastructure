---
# invariant: the upgrade test's k3d cluster; the host name is the k3d server node's, since it
# becomes NODE_NAME, the hostPath PV nodeAffinity.
all:
  children:
    cluster:
      hosts:
        k3d-ci-server-0:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
