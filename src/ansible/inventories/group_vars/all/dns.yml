---
# invariant: only the records no other owner creates; one wildcard per private zone (ADR-012).
dns_zone: jterrazz.com
dns_records:
  - record: "*.internal"
    value: "{{ tailscale_dns_hostname }}"
    proxied: false
  - record: "*.staging"
    value: "{{ tailscale_dns_hostname }}"
    proxied: false
  # invariant: the tunnel's one alias, which every public host's record (external-dns's) points
  # at, so only this record knows the tunnel id, the connector token's `t` field. Proxied, since
  # cfargotunnel.com resolves only at the edge; another zone's proxied CNAME to it is followed too.
  - record: tunnel
    value: "{{ (cloudflare_tunnel_token | b64decode | from_json).t }}.cfargotunnel.com"
    proxied: true
