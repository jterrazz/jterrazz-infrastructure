---
# invariant: every secret a deploy reads; `scope: site` is fetched by site.yml only (ADR-015).
infisical_project: studio-infrastructure
infisical_environment: prod
infisical_secrets:
  # invariant: two Cloudflare tokens: DNS01 (DNS:Edit on jterrazz.com) for cert-manager alone,
  # RECORDS (DNS:Edit on every public zone, Tunnel:Edit) for this play and external-dns.
  - { var: cloudflare_dns01_token, path: /studio-infrastructure, key: CLOUDFLARE_DNS01_TOKEN }
  - { var: cloudflare_records_token, path: /studio-infrastructure, key: CLOUDFLARE_RECORDS_TOKEN }
  - { var: cloudflare_tunnel_token, path: /studio-infrastructure, key: CLOUDFLARE_TUNNEL_TOKEN }
  - { var: registry_username, project: studio-ci, path: /, key: DOCKER_REGISTRY_USERNAME }
  - { var: registry_password, project: studio-ci, path: /, key: DOCKER_REGISTRY_PASSWORD }
  - { var: registry_pull_username, project: studio-ci, path: /, key: REGISTRY_PULL_USERNAME }
  - { var: registry_pull_password, project: studio-ci, path: /, key: REGISTRY_PULL_PASSWORD }
  - { var: grafana_admin_password, path: /studio-infrastructure/grafana, key: ADMIN_PASSWORD }
  - { var: tailscale_oauth_client_id, path: /studio-infrastructure, key: TAILSCALE_OAUTH_CLIENT_ID, scope: site }
  - { var: tailscale_oauth_client_secret, path: /studio-infrastructure, key: TAILSCALE_OAUTH_CLIENT_SECRET, scope: site }
