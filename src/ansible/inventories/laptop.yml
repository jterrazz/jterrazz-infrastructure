---
# invariant: the VM through OrbStack's SSH proxy; `orb` is an ssh-config alias, so every real
# address (TLS SANs, kubeconfig) uses the tailnet name instead.
all:
  children:
    cluster:
      hosts:
        studio-infrastructure:
          ansible_host: orb
          ansible_user: root@studio-infrastructure
          ansible_ssh_common_args: "-F {{ lookup('env', 'HOME') }}/.orbstack/ssh/config -o StrictHostKeyChecking=no"
