---
# invariant: what the cluster chart cannot own: Traefik's bundled config, its NodePorts, released
# PVs' claims, and the private zones in CoreDNS.
- name: Apply the cluster manifests
  ansible.builtin.import_tasks: manifests.yml

- name: Answer the private zones in CoreDNS
  ansible.builtin.import_tasks: coredns.yml
