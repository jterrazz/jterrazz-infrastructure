---
# invariant: CoreDNS cannot chase the public CNAME into *.ts.net, so it answers every name of
# the private zones with the node's tailnet IP, AAAA with no record, and the rest falls through
# (ADR-012).
- name: Ensure the Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined

# hazard: an empty tailscale_ip renders an A answer with no address and takes cluster DNS down.
- name: Assert the node has a tailnet address
  ansible.builtin.assert:
    that:
      - tailscale_ip | default('') | length > 0
    fail_msg: >-
      This node has no Tailscale IPv4 address, so CoreDNS would answer the
      private zones with no address and take cluster DNS down.
      Join the tailnet first: `make deploy` (the tailscale role), or on the node
      `/usr/local/bin/tailscale-autoauth.sh`.
    quiet: true

- name: Apply the CoreDNS private-zones config
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.template', 'coredns-custom.yaml.j2') | from_yaml }}"
  notify: Restart CoreDNS

# invariant: CoreDNS reads it only on restart, and the next tasks need the records now.
- name: Restart CoreDNS now if the config changed
  ansible.builtin.meta: flush_handlers
