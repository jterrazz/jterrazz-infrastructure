---
# invariant: checked by version, not presence: a stale node renders differently from CI.

- name: Get the installed Helm version
  ansible.builtin.command:
    argv: [helm, version, --template, "{% raw %}{{.Version}}{% endraw %}"]
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Install Helm
  when: (helm_installed.rc | default(1)) != 0 or (helm_installed.stdout | default('') | trim) != helm_version
  block:
    # invariant: the release archive, checked against its published sha256; no script runs as root.
    - name: Download the Helm release archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ node_arch }}.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-{{ node_arch }}.tar.gz.sha256sum"
        dest: /tmp/helm.tar.gz
        mode: "0600"

    - name: Unpack helm into /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: ["linux-{{ node_arch }}/helm"]
        extra_opts: [--strip-components=1]
        mode: "0755"

    - name: Remove the Helm archive
      ansible.builtin.file:
        path: /tmp/helm.tar.gz
        state: absent

# outside: `helm plugin list` drops the leading `v`, hence the strip on both sides.
- name: Get the installed helm-diff plugin version
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      helm plugin list | awk '$1 == "diff" { print $2 }'
    executable: /bin/bash
  register: helm_diff_installed
  changed_when: false
  failed_when: false

- name: Install the helm-diff plugin
  when: >-
    (helm_diff_installed.stdout | default('') | trim)
    != (helm_diff_version | regex_replace('^v', ''))
  block:
    # outside: `helm plugin install` refuses to overwrite.
    - name: Remove any mismatched helm-diff plugin
      ansible.builtin.command: helm plugin uninstall diff
      changed_when: true
      failed_when: false

    # outside: helm-diff publishes no signature, which Helm 4 verifies by default.
    - name: Install the pinned helm-diff plugin
      ansible.builtin.command:
        argv: [helm, plugin, install, https://github.com/databus23/helm-diff, --version, "{{ helm_diff_version }}", --verify=false]
      changed_when: true

- name: Get the installed helmfile version
  ansible.builtin.command:
    argv: [helmfile, --version]
  register: helmfile_installed
  changed_when: false
  failed_when: false

- name: Install helmfile
  when: >-
    (helmfile_installed.rc | default(1)) != 0
    or (helmfile_version | regex_replace('^v', '')) not in (helmfile_installed.stdout | default(''))
  block:
    - name: Download the helmfile release archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/helmfile/helmfile/releases/download/{{ helmfile_version }}/helmfile_{{
          helmfile_version | regex_replace('^v', '') }}_linux_{{ node_arch }}.tar.gz
        dest: /tmp/helmfile.tar.gz
        mode: "0600"

    - name: Unpack helmfile into /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/helmfile.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: [helmfile]
        mode: "0755"

    - name: Remove the helmfile archive
      ansible.builtin.file:
        path: /tmp/helmfile.tar.gz
        state: absent

    # invariant: the archive's contents are not version-named; this proves the pin.
    - name: Verify the installed helmfile version
      ansible.builtin.command:
        argv: [helmfile, --version]
      register: helmfile_verify
      changed_when: false
      failed_when: (helmfile_version | regex_replace('^v', '')) not in helmfile_verify.stdout
