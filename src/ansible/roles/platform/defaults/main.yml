---
kubeconfig: /etc/rancher/k3s/k3s.yaml
# invariant: staged by tasks/stage-manifests.yml, removed by platform.yml's post_tasks.
manifest_dir: /tmp/k8s-manifests
# hazard: the `.gotmpl` suffix makes helmfile render its `requiredEnv` calls (ADR-009).
platform_helmfile: "{{ manifest_dir }}/kubernetes/helmfile.yaml.gotmpl"
helmfile_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_architecture] }}"
