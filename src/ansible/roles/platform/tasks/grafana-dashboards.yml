---
# invariant: the infrastructure dashboards, one ConfigMap per JSON file; an app ships its own through
# the app chart. `tier=platform` tells them apart, so a file removed here is a ConfigMap removed.
- name: Converge the Grafana infrastructure dashboards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      wanted=""
      for json_file in "{{ manifest_dir }}"/kubernetes/services/grafana/dashboards/*.json; do
        name="dashboard-$(basename "$json_file" .json)"
        wanted="$wanted $name"
        kubectl create configmap "$name" \
          --from-file="$(basename "$json_file")=$json_file" \
          --namespace platform-telemetry \
          --dry-run=client -o yaml | \
        kubectl label -f - --local --dry-run=client -o yaml \
          grafana_dashboard=1 app.jterrazz.com/tier=platform | \
        kubectl annotate -f - --local --dry-run=client -o yaml \
          grafana_folder=infrastructure | \
        kubectl apply -f -
      done
      for live in $(kubectl get configmaps --namespace platform-telemetry \
          --selector grafana_dashboard=1,app.jterrazz.com/tier=platform -o name); do
        case " $wanted " in *" ${live#configmap/} "*) ;; *) kubectl delete --namespace platform-telemetry "$live" ;; esac
      done
    executable: /bin/bash
  register: dashboards
  changed_when: dashboards.stdout is search(' (created|configured|deleted)')
