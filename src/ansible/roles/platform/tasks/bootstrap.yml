---
# invariant: the Secrets Infisical cannot provide, `pass: operators` (the CRDs), the
# ClusterIssuers, then `pass: claims` (the volumes and Secrets later passes mount); ADR-009.
# hazard: Secrets go through the k8s module, never a shell, which mangles `$` and backticks.
- name: Create the Cloudflare API token Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: platform-networking
      type: Opaque
      stringData:
        api-token: "{{ cloudflare_api_token }}"
  no_log: true

- name: Create the Infisical credentials Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-credentials
        namespace: platform-secrets
      type: Opaque
      stringData:
        clientId: "{{ infisical_client_id }}"
        clientSecret: "{{ infisical_client_secret }}"
  no_log: true

- name: Install htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true

# hazard: the password on stdin, never as an argument (`ps`); both names come from Infisical,
# since a rotation overlaps two push accounts (ADR-014, ADR-015).
- name: Hash the registry's push and pull accounts
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' "$REGISTRY_PASSWORD" | htpasswd -niB "$REGISTRY_USERNAME"
    executable: /bin/bash
  environment:
    REGISTRY_USERNAME: "{{ item.username }}"
    REGISTRY_PASSWORD: "{{ item.password }}"
  loop:
    - { username: "{{ registry_username }}", password: "{{ registry_password }}" }
    - { username: "{{ registry_pull_username }}", password: "{{ registry_pull_password }}" }
  register: htpasswd_result
  changed_when: false
  no_log: true

- name: Create the registry htpasswd Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: registry-auth
        namespace: platform-registry
      type: Opaque
      stringData:
        htpasswd: "{{ htpasswd_result.results | map(attribute='stdout') | map('trim') | reject('equalto', '') | join('\n') }}"
  no_log: true

- name: Install cert-manager and the Infisical operator
  ansible.builtin.include_tasks: helmfile-apply.yml
  vars:
    helmfile_pass: operators

- name: Wait for the cert-manager webhook
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/cert-manager-webhook -n platform-networking --timeout=120s
  changed_when: false

- name: Apply the cert-manager ClusterIssuers
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/cert-manager/issuers.yaml
  register: issuers_result
  changed_when: "'created' in issuers_result.stdout or 'configured' in issuers_result.stdout"

- name: Install the platform-service releases
  ansible.builtin.include_tasks: helmfile-apply.yml
  vars:
    helmfile_pass: claims
