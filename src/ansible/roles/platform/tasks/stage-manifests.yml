---
- name: Create the manifest directory on the node
  ansible.builtin.file:
    path: "{{ manifest_dir }}"
    state: directory
    mode: "0755"

- name: Copy the src/kubernetes/ tree to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/"
    dest: "{{ manifest_dir }}/kubernetes/"
    mode: "0644"

- name: Ensure the Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined

# hazard: an empty tailscale_ip renders an A answer with no address and takes cluster DNS down.
- name: Assert the node has a tailnet address
  ansible.builtin.assert:
    that:
      - tailscale_ip | default('') | length > 0
    fail_msg: >-
      This node has no Tailscale IPv4 address, so CoreDNS would answer the
      private zones with no address and take cluster DNS down.
      Join the tailnet first: `make deploy` (the tailscale role), or on the node
      `/usr/local/bin/tailscale-autoauth.sh`.
    quiet: true
