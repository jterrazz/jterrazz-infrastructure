---
# invariant: one pass; `helmfile_pass` selects a `pass:` label, omitted selects every release, so
# an unlabelled one still deploys. Exit 2 means changed and synced (ADR-009).

- name: "Apply the platform Helm releases ({{ helmfile_pass | default('every release') }})"
  ansible.builtin.command:
    cmd: >-
      helmfile --file {{ platform_helmfile }}
      apply --detailed-exitcode --concurrency 1
      {{ ('--selector pass=' ~ helmfile_pass) if (helmfile_pass | default('')) else '' }}
  environment:
    # invariant: read by the helmfile's `requiredEnv`, so the password never reaches argv.
    NODE_NAME: "{{ inventory_hostname }}"
    PLATFORM_HELM_WAIT: "{{ platform_helm_wait | default(true) | string | lower }}"
    GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
  register: helmfile_apply
  changed_when: helmfile_apply.rc == 2
  failed_when: helmfile_apply.rc not in [0, 2]

# hazard: the next apply diffs against a failed revision and skips it; the fix is
# `helmfile sync -l name=<release>`, which does not diff (ADR-009).
- name: "Assert no Helm release is left failed ({{ helmfile_pass | default('every release') }})"
  ansible.builtin.command:
    argv: [helm, list, --all-namespaces, --failed, --short]
  register: helm_failed_releases
  changed_when: false
  failed_when: helm_failed_releases.rc != 0 or (helm_failed_releases.stdout | trim | length > 0)
