---
# invariant: converged on every deploy, so a lost record comes back; `solo` makes a changed
# target replace the record rather than join it (ADR-012).
- name: Require the node's tailnet name, the private wildcards' target
  ansible.builtin.assert:
    that:
      - tailscale_dns_hostname | default('') | length > 0
    fail_msg: >-
      No tailnet DNS name for this node, so the private wildcards would point at
      nothing. Join the tailnet first: `make deploy` (the tailscale role).
    quiet: true

- name: Converge the DNS records
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_api_token }}"
    zone: "{{ dns_zone }}"
    record: "{{ item.record }}"
    type: CNAME
    value: "{{ item.value }}"
    proxied: "{{ item.proxied }}"
    ttl: 1
    solo: true
    comment: "Managed by jterrazz-infrastructure: dns_records in src/ansible/inventories/group_vars/all.yml"
  loop: "{{ dns_records }}"
  loop_control:
    label: "{{ item.record }}"
