---
# invariant: CoreDNS cannot chase the public CNAME into *.ts.net, so it answers every name of
# the private zones with the node's tailnet IP, AAAA with no record, and the rest falls through
# (ADR-012).
- name: Apply the CoreDNS private-hosts config
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.template', 'coredns-custom.yaml.j2') | from_yaml }}"
  notify: Restart CoreDNS

# invariant: CoreDNS reads it only on restart, and the next tasks need the records now.
- name: Restart CoreDNS now if the config changed
  ansible.builtin.meta: flush_handlers
