---
# invariant: ssh.service, never ssh.socket: roles/base turns socket activation off.
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted

- name: Reload the nftables guard
  ansible.builtin.systemd_service:
    name: nft-guard.service
    state: restarted
    daemon_reload: true
