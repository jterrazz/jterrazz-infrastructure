---
security_ssh_permit_root_login: "prohibit-password"
security_ssh_password_authentication: "no"
security_ssh_max_auth_tries: 3
security_ssh_client_alive_interval: 300
security_ssh_client_alive_count_max: 2

# hazard: the public half of the CI_DEPLOY_SSH_PRIVATE secret; rotation is docs/guides/operate.md.
security_ci_deploy_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPPCsf2boqXrePRFuhL3KfJjpabJ0bjAeNqpTLl7GREf ci-deploy@studio-infrastructure"

# invariant: what the kernel defaults leave open: source routing. rp_filter stays systemd's loose
# 2, which Tailscale's subnet routes need.
security_kernel_params:
  - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }

# invariant: the node's firewall, the nft guard (ADR-006).
security_guard_interface: eth0
security_guard_host_ip: 192.168.139.1
# invariant: SSH, Traefik's two ports and the API server; klipper-lb DNATs 80/443 before this
# chain, so Traefik's loadBalancerSourceRanges is their first gate (ADR-003).
security_guard_tailnet_tcp: [22, 80, 443, 6443]
