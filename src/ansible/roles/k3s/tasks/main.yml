---
# hazard: k3s_version stays out of defaults/: a role default would silently win wherever
# group_vars is not loaded (ADR-007).

- name: Create the k3s directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - "{{ k3s_data_dir }}"

- name: Check if k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get the installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Determine if k3s needs installation
  ansible.builtin.set_fact:
    k3s_needs_install: "{{ not k3s_binary.stat.exists or (k3s_version not in (k3s_current_version.stdout | default(''))) }}"

# hazard: generated once; a new token on an existing cluster invalidates its registration.
- name: Check if the k3s token file exists
  ansible.builtin.stat:
    path: /etc/rancher/k3s/token
  register: k3s_token_file

- name: Read the existing token
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/token
  register: k3s_existing_token
  when: k3s_token_file.stat.exists
  no_log: true

- name: Generate a new token if none exists
  ansible.builtin.command: openssl rand -hex 32
  register: k3s_generated_token
  changed_when: false
  when: not k3s_token_file.stat.exists
  no_log: true

- name: Set the k3s token fact
  ansible.builtin.set_fact:
    k3s_cluster_token: >-
      {%- if k3s_token_file.stat.exists -%}
        {{ k3s_existing_token.content | b64decode | trim }}
      {%- else -%}
        {{ k3s_generated_token.stdout }}
      {%- endif -%}
  no_log: true

- name: Save the token to file
  ansible.builtin.copy:
    content: "{{ k3s_cluster_token }}"
    dest: /etc/rancher/k3s/token
    mode: "0600"
  when: not k3s_token_file.stat.exists
  no_log: true

# invariant: the tailnet IP and name become TLS SANs; set already in a full site.yml run.
- name: Ensure Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined

- name: Generate the audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: "0640"
  notify: Restart k3s

# invariant: the apiserver does not start without its audit log directory.
- name: Ensure the audit log directory exists
  ansible.builtin.file:
    path: "{{ k3s_data_dir }}/server/logs"
    state: directory
    mode: "0700"

- name: Generate the Pod Security defaults and the OIDC authentication config
  ansible.builtin.template:
    src: "{{ item }}.yaml.j2"
    dest: "/etc/rancher/k3s/{{ item }}.yaml"
    mode: "0640"
  loop: [pod-security, authentication]
  notify: Restart k3s

- name: Generate the k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0640"
  notify: Restart k3s

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: k3s_needs_install

- name: Install k3s
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION={{ k3s_version }} sh /tmp/k3s-install.sh
  environment:
    K3S_TOKEN: "{{ k3s_cluster_token }}"
  changed_when: true
  when: k3s_needs_install
  notify: Restart k3s

- name: Cleanup the install script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent

- name: Enable the k3s service
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

# hazard: here exactly: later, the readiness checks pass on the old config; earlier, a fresh
# host has no k3s unit yet.
- name: Restart k3s now if the config changed
  ansible.builtin.meta: flush_handlers

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ k3s_node_ip }}"
    timeout: 120

- name: Verify the cluster is running
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false
  retries: 10
  delay: 5
  until: k3s_nodes.rc == 0

# invariant: secrets-encryption covers only Secrets written after it was enabled; this
# rewrites the existing ones.
- name: Check the secrets encryption status
  ansible.builtin.command: k3s secrets-encrypt status
  register: k3s_secrets_encrypt
  changed_when: false
  failed_when: false

# invariant: once, until every Secret is rewritten; a finished rotation answers reencrypt_finished.
- name: Re-encrypt existing secrets
  ansible.builtin.command: k3s secrets-encrypt reencrypt --force
  when:
    - "'Encryption Status: Enabled' in k3s_secrets_encrypt.stdout"
    - "'reencrypt_finished' not in k3s_secrets_encrypt.stdout"
  changed_when: true

- name: Create the kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Set the kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0600"

- name: Create the .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy the kubeconfig for root
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Publish the kubeconfig to the machine that ran the playbook
  ansible.builtin.import_tasks: kubeconfig.yml

- name: Install the image-prune service and timer
  ansible.builtin.template:
    src: "image-prune.{{ item }}.j2"
    dest: "/etc/systemd/system/image-prune.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  register: image_prune_units

- name: Enable the image-prune timer
  ansible.builtin.systemd_service:
    name: image-prune.timer
    enabled: true
    state: started
    daemon_reload: "{{ image_prune_units.changed }}"
