---
- name: Fetch the kubeconfig to the local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../../kubeconfig.yaml"
    flat: true
    # invariant: a cluster-admin credential.
    mode: "0600"

# invariant: the MagicDNS name, a TLS SAN; the regexp matches both loopback spellings k3s writes.
- name: Update the kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../../kubeconfig.yaml"
    regexp: 'https://(127\.0\.0\.1|0\.0\.0\.0):6443'
    replace: "https://{{ tailscale_dns_hostname | default('') or tailscale_ip | default('') or ansible_host }}:6443"
  delegate_to: localhost
  become: false
