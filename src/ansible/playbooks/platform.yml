---
# hazard: also run alone by deploy-platform.yaml: never assume site.yml's host plays ran.
# invariant: dependency order; one release is `helmfile apply -l name=<release>`, not a tag (ADR-009).
- name: Deploy the platform layer
  hosts: cluster
  become: true
  gather_facts: true
  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kubernetes_dir: "{{ manifest_dir }}/src/kubernetes"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  pre_tasks:
    # hazard: include_role, never a role-level `when:`, which is evaluated per loop item (ADR-015);
    # `apply` hands `always` to the included tasks so a `--tags` run still has its secrets.
    - name: Fetch the deploy's secrets from Infisical
      ansible.builtin.include_role:
        name: secrets
        apply:
          tags: [always]
      when: cloudflare_records_token is not defined
      tags: [always]

    # invariant: staged with the repository's own layout, so a path relative to the helmfile
    # (../../.infrastructure) holds on the node; one directory per run, since a run from the Mac
    # and one from CI once deleted each other's tree.
    - name: Name this run's staging directory
      ansible.builtin.set_fact:
        manifest_dir: "/tmp/k8s-manifests-{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8) }}"
      tags: [always]

    # invariant: staging and its cleanup change nothing deployed, so a quiet deploy reports changed=0.
    - name: Create the manifest directory on the node
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: directory
        mode: "0755"
      changed_when: false
      tags: [always]

    # value: one archive, not one round trip per file: the per-file copy was 266s of a 6-minute CI deploy.
    - name: Pack src/kubernetes and .infrastructure on the controller
      community.general.archive:
        path:
          - "{{ (playbook_dir ~ '/../../kubernetes') | realpath }}"
          - "{{ (playbook_dir ~ '/../../../.infrastructure') | realpath }}"
        dest: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}/studio-platform.tgz"
        exclude_path:
          - "{{ (playbook_dir ~ '/../../kubernetes/charts/app/tests') | realpath }}"
          - "{{ (playbook_dir ~ '/../../kubernetes/charts/platform/tests') | realpath }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      tags: [always]

    - name: Unpack them on the node
      ansible.builtin.unarchive:
        src: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}/studio-platform.tgz"
        dest: "{{ manifest_dir }}"
      changed_when: false
      tags: [always]

  roles:
    - role: cluster
      tags: [cluster]
    - role: cloudflare
      tags: [cloudflare]
    - role: helm
      tags: [helm]
    - role: releases
      tags: [releases]
    - role: publish
      tags: [publish]

  post_tasks:
    - name: Remove the staged manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent
      changed_when: false
      tags: [always]
