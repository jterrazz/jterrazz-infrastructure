---
# invariant: raw SSH before fact gathering: every later play needs python3.
- name: Bootstrap the Python interpreter
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: command -v python3 || (apt-get update && apt-get install -y python3)
      register: python_bootstrap
      changed_when: "'Setting up python3' in python_bootstrap.stdout"

# invariant: base installs systemd-resolved; resolved repairs DNS before tailscale and k3s read it.
- name: Configure the node
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - role: secrets
      vars:
        secrets_scope: site
      tags: [always]
    - role: base
      tags: [base]
    - role: security
      tags: [security]
    - role: resolved
      tags: [resolved]
    - role: tailscale
      tags: [tailscale]
    - role: k3s
      tags: [k3s]
    - role: backup
      tags: [backup]

- name: Deploy the platform layer
  ansible.builtin.import_playbook: platform.yml
