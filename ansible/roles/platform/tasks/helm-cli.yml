---
# The VERSION, not just the presence: `helm_version` is the pin three machines
# share (group_vars/all.yml), so a node left behind on an older Helm renders
# charts differently from the CI that validated them. A non-zero rc is "no helm
# at all"; the installer is the only way to move an existing one.
- name: Get the installed Helm version
  ansible.builtin.command:
    argv: [helm, version, --template, "{% raw %}{{.Version}}{% endraw %}"]
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Install Helm
  when: (helm_installed.rc | default(1)) != 0 or (helm_installed.stdout | default('') | trim) != helm_version
  block:
    # A TAG, never `main`: this script is fetched and executed as root, so a
    # moving branch lets an upstream commit change what runs on the host
    # between two deploys with no change on our side.
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
        dest: /tmp/get_helm.sh
        mode: "0755"

    - name: Run Helm install script
      ansible.builtin.command: /tmp/get_helm.sh
      environment:
        DESIRED_VERSION: "{{ helm_version }}"
      changed_when: true

    - name: Cleanup Helm install script
      ansible.builtin.file:
        path: /tmp/get_helm.sh
        state: absent

- name: Add Helm repositories
  ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: infisical, url: "https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/" }
    # Grafana's OSS charts live here, renumbered; sole consumer is `grafana`.
    # The OLD `grafana` repo is deliberately NOT added — nothing pulls from it.
    - { name: grafana-community, url: "https://grafana-community.github.io/helm-charts" }
    # The whole VictoriaMetrics family — victoria-metrics-single,
    # victoria-logs-single, victoria-traces-single.
    - { name: vm, url: "https://victoriametrics.github.io/helm-charts/" }
    # kube-state-metrics and prometheus-node-exporter, each its own release —
    # both dashboards depend on the series they produce.
    - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
    - { name: open-telemetry, url: "https://open-telemetry.github.io/opentelemetry-helm-charts" }
  register: repo_add
  changed_when: "'has been added' in repo_add.stdout"
  failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false
