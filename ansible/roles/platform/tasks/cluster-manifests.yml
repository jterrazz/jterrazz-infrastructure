---
# Everything under kubernetes/cluster/: namespaces, the `manual` StorageClass,
# Traefik middlewares/TLS options and the default-deny NetworkPolicies. Plus
# the one file outside that tree this step owns: Traefik's own HelmChartConfig,
# which is the VALUES of a single release (k3s' bundled Traefik) and therefore
# lives in kubernetes/services/traefik/ with every other release's values, not
# among the cluster-wide objects.

# Apply the HelmChartConfig BEFORE waiting on the Traefik install job, not
# after: on a k3s version bump the bundled chart can require the NEW values
# schema to reconcile at all (v38→v40 renamed the service/ports keys), so
# wait-then-apply deadlocks — the job retries with stale values for 8 minutes
# while the config that would fix it sits unapplied. Applying a
# HelmChartConfig for a not-yet-installed chart is safe: helm-controller
# just picks it up when the chart lands.
- name: Apply the Traefik HelmChartConfig first
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ manifest_dir }}/kubernetes/services/traefik/helm-chart-config.yaml"
  register: traefik_config_apply
  changed_when: "'created' in traefik_config_apply.stdout or 'configured' in traefik_config_apply.stdout"

# Retried, because a HelmChartConfig change makes the helm-controller
# DELETE and recreate the install job asynchronously — a bare `kubectl wait`
# right after the apply can land in the window where the job does not exist
# and fail instantly with NotFound instead of waiting. The long per-try
# deadline is for a fresh VM with no image cache, where the job needs
# minutes to pull.
- name: Wait for Traefik to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=complete
      - job
      - -l
      - helmcharts.helm.cattle.io/chart=traefik
      - -n
      - kube-system
      - --timeout=480s
  register: traefik_wait
  changed_when: false
  retries: 6
  delay: 10
  until: traefik_wait.rc == 0

# A PV whose PVC was deleted goes to Released and will NOT rebind while it
# still carries the old claimRef, so the app's new PVC stays Pending forever
# and its pod never schedules. Do NOT make this `failed_when: false`: a
# kubectl/RBAC problem here then surfaces minutes later as an unexplained
# scheduling failure instead of as itself.
- name: Clear claimRef from released PVs
  block:
    - name: Patch released PVs to drop their stale claimRef
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for pv in $(kubectl get pv -o jsonpath='{.items[?(@.status.phase=="Released")].metadata.name}'); do
            kubectl patch pv $pv -p '{"spec":{"claimRef":null}}' --type=merge
          done
        executable: /bin/bash
      register: pv_clear
      changed_when: pv_clear.stdout != ''
  rescue:
    - name: Report the released-PV patch failure
      ansible.builtin.fail:
        msg: >-
          Failed to clear claimRef from Released PVs. Any app whose PVC was
          recreated will stay Pending until this succeeds. kubectl said:
          {{ pv_clear.stderr | default('(no stderr captured)') }}

# Recursive apply, no kustomize — so a new file under kubernetes/cluster/ is
# deployed without editing a resource list. kubectl walks the directory
# lexically, which namespaces.yaml relies on to sort before network-policies/.
- name: Deploy the cluster-wide manifests
  ansible.builtin.command:
    cmd: kubectl apply -f {{ manifest_dir }}/kubernetes/cluster -R
  register: cluster_base_result
  changed_when: "'created' in cluster_base_result.stdout or 'configured' in cluster_base_result.stdout"
