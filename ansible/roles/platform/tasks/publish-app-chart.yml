---
# invariant: the one publisher of the app chart (ADR-010).

# outside: on a fresh cluster DNS-01 issuance lags the registry pod, and login needs TLS.
- name: Wait for the registry TLS certificate to be issued
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready certificate/registry-tls
    -n platform-registry --timeout=180s
  changed_when: false

- name: Log in to the registry
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - registry.internal.jterrazz.com
      - --username
      - "{{ registry_username }}"
      - --password-stdin
    stdin: "{{ registry_password }}"
  no_log: true
  changed_when: false

- name: Read the app chart metadata
  ansible.builtin.slurp:
    src: "{{ manifest_dir }}/kubernetes/charts/app/Chart.yaml"
  register: app_chart_yaml

- name: Extract the app chart version
  ansible.builtin.set_fact:
    app_chart_version: "{{ (app_chart_yaml.content | b64decode | from_yaml).version }}"

# invariant: never overwrite a published version: apps pull it unversioned, so an unbumped
# Chart.yaml publishes nothing.
- name: Check whether this chart version is already published
  ansible.builtin.command: >
    helm pull oci://registry.internal.jterrazz.com/charts/app
    --version {{ app_chart_version }}
    --destination /tmp/app-chart-check
  register: app_chart_published
  changed_when: false
  failed_when: false

- name: Report that the app chart version is already published
  ansible.builtin.debug:
    msg: >-
      app chart {{ app_chart_version }} is already in the registry, nothing to
      publish. If you CHANGED templates, bump version: in
      kubernetes/charts/app/Chart.yaml.
  when: app_chart_published.rc == 0

- name: Package and push the app chart
  when: app_chart_published.rc != 0
  block:
    # invariant: emptied first, so the one .tgz in it is the chart.
    - name: Reset the chart staging directory
      ansible.builtin.file:
        path: /tmp/app-chart
        state: absent

    - name: Create the chart staging directory
      ansible.builtin.file:
        path: /tmp/app-chart
        state: directory
        mode: "0700"

    # outside: `common` is an unvendored file:// dependency, bundled into the .tgz.
    - name: Resolve the app chart's library dependency
      ansible.builtin.command: helm dependency update {{ manifest_dir }}/kubernetes/charts/app
      changed_when: true

    - name: Package the app Helm chart
      ansible.builtin.command: helm package {{ manifest_dir }}/kubernetes/charts/app --destination /tmp/app-chart
      changed_when: true

    - name: Locate the packaged chart
      ansible.builtin.find:
        paths: /tmp/app-chart
        patterns: "*.tgz"
      register: packaged_chart

    - name: Assert exactly one chart archive was produced
      ansible.builtin.assert:
        that:
          - packaged_chart.files | length == 1
        fail_msg: >-
          Expected exactly one .tgz in /tmp/app-chart after `helm package`, found
          {{ packaged_chart.files | length }}. Refusing to guess which one to push.
        quiet: true

    - name: Push the app chart to the OCI registry
      ansible.builtin.command: "helm push {{ packaged_chart.files[0].path }} oci://registry.internal.jterrazz.com/charts"
      changed_when: true

- name: Clean up the chart staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/app-chart
    - /tmp/app-chart-check
