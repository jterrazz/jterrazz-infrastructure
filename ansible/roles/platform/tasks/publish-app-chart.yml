---
# Deliberately DUPLICATES .github/workflows/publish-chart.yaml. That workflow
# is the normal path; this exists for the fresh-cluster case, where the
# registry is empty and no app can pull the chart at all until someone
# hand-runs it. Skip with `--skip-tags chart-publish` when the chart is there.

- name: Login to the OCI registry for Helm
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - registry.internal.jterrazz.com
      - --username
      - deploy
      - --password-stdin
    stdin: "{{ registry_password }}"
  no_log: true
  changed_when: false

- name: Read the app chart metadata
  ansible.builtin.slurp:
    src: "{{ manifest_dir }}/kubernetes/charts/app/Chart.yaml"
  register: app_chart_yaml

- name: Extract the app chart version
  ansible.builtin.set_fact:
    app_chart_version: "{{ (app_chart_yaml.content | b64decode | from_yaml).version }}"

# Mirrors the guard in .github/workflows/publish-chart.yaml: the chart is
# pulled UNVERSIONED by every app deploy, so overwriting a published version
# means two different template sets answer to one tag depending on when an app
# pulled. It SKIPS rather than fails, to keep a routine redeploy green — which
# is why an unbumped kubernetes/charts/app/Chart.yaml publishes nothing.
- name: Check whether this chart version is already published
  ansible.builtin.command: >
    helm pull oci://registry.internal.jterrazz.com/charts/app
    --version {{ app_chart_version }}
    --destination /tmp/app-chart-check
  register: app_chart_published
  changed_when: false
  failed_when: false

- name: Report that the app chart version is already published
  ansible.builtin.debug:
    msg: >-
      app chart {{ app_chart_version }} is already in the registry — nothing to
      publish. If you CHANGED templates, bump version: in
      kubernetes/charts/app/Chart.yaml.
  when: app_chart_published.rc == 0

- name: Package and push the app chart
  when: app_chart_published.rc != 0
  block:
    # The .tgz filename is not knowable here (helm derives it from Chart.yaml),
    # and parsing it out of `helm package` stdout breaks on any warning line.
    # Emptying the directory first means the one file in it IS the chart.
    - name: Reset the chart staging directory
      ansible.builtin.file:
        path: /tmp/app-chart
        state: absent

    - name: Create the chart staging directory
      ansible.builtin.file:
        path: /tmp/app-chart
        state: directory
        mode: "0700"

    # `common` (the library chart) is a file://../common dependency and nothing
    # is vendored, so it has to be resolved before `helm package` will run at
    # all. It is then bundled into the .tgz, which is what lets an app repo
    # keep pulling one unversioned chart. Local path, so no network.
    - name: Resolve the app chart's library dependency
      ansible.builtin.command: helm dependency update {{ manifest_dir }}/kubernetes/charts/app
      changed_when: true

    - name: Package the app Helm chart
      ansible.builtin.command: helm package {{ manifest_dir }}/kubernetes/charts/app --destination /tmp/app-chart
      changed_when: true

    - name: Locate the packaged chart
      ansible.builtin.find:
        paths: /tmp/app-chart
        patterns: "*.tgz"
      register: packaged_chart

    - name: Assert exactly one chart archive was produced
      ansible.builtin.assert:
        that:
          - packaged_chart.files | length == 1
        fail_msg: >-
          Expected exactly one .tgz in /tmp/app-chart after `helm package`, found
          {{ packaged_chart.files | length }}. Refusing to guess which one to push.
        quiet: true

    - name: Push the app chart to the OCI registry
      ansible.builtin.command: "helm push {{ packaged_chart.files[0].path }} oci://registry.internal.jterrazz.com/charts"
      changed_when: true

- name: Clean up the chart staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/app-chart
    - /tmp/app-chart-check
