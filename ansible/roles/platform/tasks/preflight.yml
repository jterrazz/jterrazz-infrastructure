---
# Every secret the platform play consumes is asserted here, before anything is
# deployed. The list must stay COMPLETE: a secret checked only at its point of
# use fails halfway through a deploy, and one with a fallback default fails
# worse — the deploy goes green and the service comes up with a known password.
#
# KEEP IN SYNC with `SCOPES` in scripts/infisical-vars.py, which is what
# both callers (scripts/deploy.sh and
# .github/workflows/deploy-platform.yaml) use to produce this exact set.

- name: Validate required secrets
  ansible.builtin.assert:
    that:
      - cloudflare_api_token is defined and cloudflare_api_token | length > 0
      - cloudflare_tunnel_token is defined and cloudflare_tunnel_token | length > 0
      - infisical_client_id is defined and infisical_client_id | length > 0
      - infisical_client_secret is defined and infisical_client_secret | length > 0
      - registry_username is defined and registry_username | length > 0
      - registry_password is defined and registry_password | length > 0
      - grafana_admin_password is defined and grafana_admin_password | length > 0
    fail_msg: >
      Missing required secrets. Ensure cloudflare_api_token, cloudflare_tunnel_token,
      infisical_client_id, infisical_client_secret, registry_username,
      registry_password and grafana_admin_password are passed as extra vars.
      They come from Infisical
      /jterrazz-infrastructure (plus the grafana/ subfolder) — see
      scripts/infisical-vars.py.
    quiet: true
