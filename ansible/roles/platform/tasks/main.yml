---
# Ordering is dependency order, not preference.
#
# Every Helm release lives in kubernetes/helmfile.yaml.gotmpl and nowhere else.
# This role applies it in three passes because two things have to happen in the
# middle: the InfisicalSecrets need the operator installed (pass 1) and the
# hand-written workloads need the PV/PVCs the `-platform` releases create
# (pass 2). The final pass is deliberately unselected, so a release that
# carries no tier label is still applied.
#
# `preflight` and `stage-manifests` are tagged `always` because every file
# below reads the staged tree out of {{ manifest_dir }} and most need the
# Tailscale facts — a targeted `--tags releases` fails on a missing path
# without them. `--skip-tags chart-publish` leaves the published OCI chart
# alone. To redeploy ONE release, use the helmfile's own selector rather than a
# tag: `helmfile -f <staged>/kubernetes/helmfile.yaml.gotmpl apply -l name=grafana`.

- name: Validate required secrets
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Stage the kubernetes/ tree and gather node facts
  ansible.builtin.import_tasks: stage-manifests.yml
  tags: [always]

# BEFORE coredns.yml, which waits on svc/traefik: that wait would otherwise let
# k3s' bundled Traefik install without the HelmChartConfig applied here, i.e.
# without `loadBalancerSourceRanges` restricting host ports 80/443 to the
# tailnet.
- name: Deploy the cluster-wide manifests
  ansible.builtin.import_tasks: cluster-manifests.yml
  tags: [cluster-manifests, namespaces]

- name: Configure CoreDNS split-DNS for private hostnames
  ansible.builtin.import_tasks: coredns.yml
  tags: [coredns, dns]

- name: Install helm, helm-diff and helmfile
  ansible.builtin.import_tasks: helm-tooling.yml
  tags: [helm]

- name: Bootstrap secrets, CRDs, issuers and service storage
  ansible.builtin.import_tasks: bootstrap.yml
  tags: [bootstrap, secrets, certmanager, infisical]

- name: Deploy the hand-written workloads
  ansible.builtin.import_tasks: raw-manifests.yml
  tags: [raw-manifests, cloudflared, librechat, openpanel, registry, grafana]

- name: Apply every platform Helm release
  ansible.builtin.import_tasks: helmfile-apply.yml
  tags: [releases]

- name: Publish the app Helm chart
  ansible.builtin.import_tasks: publish-app-chart.yml
  tags: [chart-publish]
