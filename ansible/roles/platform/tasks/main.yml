---
# Ordering is dependency order, not preference.
#
# `preflight` and `stage-manifests` are tagged `always` because every file
# below reads manifests out of {{ manifest_dir }} and most need the Tailscale
# facts — a targeted `--tags telemetry` fails on a missing path without them.
# `--skip-tags chart-publish` leaves the published OCI chart alone.

- name: Validate required secrets
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Stage the kubernetes/ tree and gather node facts
  ansible.builtin.import_tasks: stage-manifests.yml
  tags: [always]

# BEFORE coredns.yml, which waits on svc/traefik: that wait would otherwise let
# k3s' bundled Traefik install without the HelmChartConfig applied here, i.e.
# without `loadBalancerSourceRanges` restricting host ports 80/443 to the
# tailnet.
- name: Deploy the cluster-wide manifests
  ansible.builtin.import_tasks: cluster-manifests.yml
  tags: [cluster-manifests, namespaces]

- name: Configure CoreDNS split-DNS for private hostnames
  ansible.builtin.import_tasks: coredns.yml
  tags: [coredns, dns]

- name: Install the Helm CLI and repositories
  ansible.builtin.import_tasks: helm-cli.yml
  tags: [helm]

- name: Deploy the cluster bootstrap services
  ansible.builtin.import_tasks: bootstrap-services.yml
  tags: [bootstrap-services, secrets, certmanager, infisical, cloudflared]

- name: Deploy the telemetry stack
  ansible.builtin.import_tasks: telemetry.yml
  tags: [telemetry]

- name: Deploy LibreChat
  ansible.builtin.import_tasks: librechat.yml
  tags: [services, librechat, gateway]

- name: Deploy OpenPanel
  ansible.builtin.import_tasks: openpanel.yml
  tags: [services, openpanel]

- name: Deploy the container registry
  ansible.builtin.import_tasks: registry.yml
  tags: [registry]

- name: Publish the app Helm chart
  ansible.builtin.import_tasks: publish-app-chart.yml
  tags: [chart-publish]
