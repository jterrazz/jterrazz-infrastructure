---
# What is left after every workload that a chart CAN express became a Helm
# release: cloudflared's Deployment, and the Grafana dashboard ConfigMaps this
# repo generates from JSON.
#
# cloudflared is a raw manifest on purpose — `hostNetwork: true` and
# `dnsPolicy: ClusterFirstWithHostNet`, which the app chart does not express,
# for the one workload that needs them (see the Gotchas in CLAUDE.md). Anything
# else that lands here should be a release instead.
#
# Position is load-bearing: this runs AFTER bootstrap.yml, whose `tier: platform`
# pass declares the InfisicalSecret whose Secret cloudflared reads at startup.

# Its tunnel token arrives via the InfisicalSecret bootstrap.yml applied; a pod
# scheduled before that Secret exists sits in CreateContainerConfigError rather
# than retrying gracefully.
- name: Apply the cloudflared deployment
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/cloudflared/deployment.yaml
  register: cloudflared_result
  changed_when: "'created' in cloudflared_result.stdout or 'configured' in cloudflared_result.stdout"

# APP alert rules and dashboards are deliberately NOT applied here: they ship
# with the app that emits the metric, through the app chart's `spec.alerts` /
# `spec.dashboards` (which render the same labelled ConfigMaps the sidecars in
# grafana/values.yaml watch). One living in this repo outlives the app it watches
# and goes stale invisibly. Only the infrastructure dashboards below, which
# describe the cluster itself, belong here — and the sidecar picks them up
# whenever they appear, so they need no ordering against the Grafana release.
- name: Deploy Grafana infrastructure dashboards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DASHBOARD_DIR="{{ manifest_dir }}/kubernetes/services/grafana/dashboards"
      for json_file in "$DASHBOARD_DIR"/*.json; do
        [ -f "$json_file" ] || continue
        name="dashboard-$(basename "$json_file" .json)"
        kubectl create configmap "$name" \
          --from-file="$(basename "$json_file")=$json_file" \
          --namespace platform-telemetry \
          --dry-run=client -o yaml | \
        kubectl label -f - --local --dry-run=client -o yaml \
          grafana_dashboard=1 | \
        kubectl annotate -f - --local --dry-run=client -o yaml \
          grafana_folder=infrastructure | \
        kubectl apply -f -
      done
    executable: /bin/bash
  changed_when: true
