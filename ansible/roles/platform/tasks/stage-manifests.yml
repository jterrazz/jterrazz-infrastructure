---
# outside: every task runs on the node against this staged copy; platform.yml removes it.

- name: Create the manifest directory on the node
  ansible.builtin.file:
    path: "{{ manifest_dir }}"
    state: directory
    mode: "0755"

- name: Copy the kubernetes/ tree to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/"
    dest: "{{ manifest_dir }}/kubernetes/"
    mode: "0644"

# invariant: deploy-platform.yaml runs this play without the tailscale role.
- name: Ensure Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined

# hazard: an EMPTY tailscale_ip renders a one-field CoreDNS hosts entry and crashloops
# cluster DNS; fail before anything is applied.
- name: Assert the node has a tailnet address
  ansible.builtin.assert:
    that:
      - tailscale_ip | default('') | length > 0
    fail_msg: >-
      This node has no Tailscale IPv4 address, so the CoreDNS private-hostname
      overrides would render as blank hosts entries and take cluster DNS down.
      Join the tailnet first: `make deploy` (the tailscale role), or on the node
      `/usr/local/bin/tailscale-autoauth.sh`.
    quiet: true
