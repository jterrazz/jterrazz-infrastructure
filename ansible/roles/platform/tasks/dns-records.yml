---
# outside: converges group_vars `dns_records` on every deploy, so a lost record comes
# back (docs/decisions/012-private-hostnames-are-wildcard-zones.md).
# invariant: `solo: true`: a changed target REPLACES the record instead of joining it.

- name: Require the node's tailnet name, the private wildcards' target
  ansible.builtin.assert:
    that:
      - tailscale_dns_hostname | default('') | length > 0
    fail_msg: >-
      No tailnet DNS name for this node, so the private wildcards would point at
      nothing. Join the tailnet first: `make deploy` (the tailscale role).
    quiet: true

- name: Converge the DNS records
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_api_token }}"
    zone: "{{ dns_zone }}"
    record: "{{ item.record }}"
    type: CNAME
    value: "{{ item.value }}"
    proxied: "{{ item.proxied }}"
    ttl: 1
    solo: true
    # invariant: compared like any field; tells the Cloudflare dashboard who owns it.
    comment: "Managed by jterrazz-infrastructure: dns_records in ansible/inventories/group_vars/all.yml"
  loop: "{{ dns_records }}"
  loop_control:
    label: "{{ item.record }}"
