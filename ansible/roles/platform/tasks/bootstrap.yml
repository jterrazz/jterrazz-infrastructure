---
# invariant: dependency order: the Secrets Infisical cannot provide, `tier: bootstrap`
# (the CRDs), the ClusterIssuers, then `tier: platform` (the claims and Secrets
# later passes mount) (docs/decisions/009-one-helmfile-declares-every-platform-release.md).

# hazard: the k8s module, never a shell: `$`, backticks or newlines would be mangled.
- name: Create the Cloudflare API token secret for networking
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: platform-networking
      type: Opaque
      stringData:
        api-token: "{{ cloudflare_api_token }}"
  no_log: true

- name: Create the Infisical credentials secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-credentials
        namespace: platform-secrets
      type: Opaque
      stringData:
        clientId: "{{ infisical_client_id }}"
        clientSecret: "{{ infisical_client_secret }}"
  no_log: true

- name: Install apache2-utils for htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true

# hazard: stdin, never `htpasswd -nbB <user> <password>` (visible in `ps`). The
# account NAME is Infisical's too, never a literal: a rotation overlaps two
# accounts (docs/decisions/015-deploy-secrets-are-fetched-once-by-ansible.md).
- name: Generate the htpasswd hash for the registry
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' "$REGISTRY_PASSWORD" | htpasswd -niB "$REGISTRY_USERNAME"
    executable: /bin/bash
  environment:
    REGISTRY_USERNAME: "{{ registry_username }}"
    REGISTRY_PASSWORD: "{{ registry_password }}"
  register: htpasswd_result
  changed_when: false
  no_log: true

# hazard: the k8s module, never a shell: a bcrypt hash is full of `$` and `/`.
- name: Create the registry htpasswd bootstrap secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: registry-auth
        namespace: platform-registry
      type: Opaque
      stringData:
        htpasswd: "{{ htpasswd_result.stdout | trim }}"
  no_log: true

- name: Install cert-manager and the Infisical operator
  ansible.builtin.include_tasks: helmfile-apply.yml
  vars:
    helmfile_tier: bootstrap

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/cert-manager-webhook -n platform-networking --timeout=120s
  changed_when: false

- name: Apply cert-manager ClusterIssuers
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/cert-manager/issuers.yaml
  register: issuers_result
  changed_when: "'created' in issuers_result.stdout or 'configured' in issuers_result.stdout"

- name: Deploy the platform-service chart storage, certificates, ingress and secrets
  ansible.builtin.include_tasks: helmfile-apply.yml
  vars:
    helmfile_tier: platform
