---
- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

# hazard: never `systemctl restart systemd-networkd`: the play reaches the host over
# this link. reload + reconfigure withdraw the DHCP DNS without dropping the lease.
- name: Reload systemd-networkd
  ansible.builtin.command:
    cmd: "{{ item }}"
  changed_when: true
  loop:
    - networkctl reload
    - networkctl reconfigure {{ ansible_default_ipv4.interface }}
