---
# invariant: OrbStack's DHCP resolver (0.250.250.200) drops queries, and kubelet hands CoreDNS
# the uplink file this role repairs; it runs before tailscale and k3s (ADR-004).

# outside: the image ships systemd-resolved masked.
- name: Enable systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    masked: false
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure the systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure the systemd-resolved global DNS overrides
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/upstream.conf
    mode: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 9.9.9.9
      FallbackDNS=1.0.0.1 8.8.8.8
      # Both default to yes and both open a listener on 5355 (LLMNR) and
      # 5353 (mDNS) bound to every interface, answerable by any peer on the
      # OrbStack bridge. Nothing here resolves by either protocol: names are
      # tailnet MagicDNS, cluster DNS or public.
      LLMNR=no
      MulticastDNS=no
  notify: Restart systemd-resolved

# hazard: a global `DNS=` keeps DHCP's per-link server; only a networkd drop-in removes it.
- name: Discover the systemd-networkd file configuring the default interface
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      networkctl status {{ ansible_default_ipv4.interface }} --no-pager \
        | awk '/Network File:/ {print $3; exit}'
    executable: /bin/bash
  register: resolved_networkd_file
  changed_when: false

# invariant: a drop-in beside a renamed .network file is inert, so fail loudly instead.
- name: Assert the default interface is managed by systemd-networkd
  ansible.builtin.assert:
    that:
      - resolved_networkd_file.stdout is match('.*\.network$')
    fail_msg: >-
      networkctl reports no .network file for
      {{ ansible_default_ipv4.interface }} (got
      {{ resolved_networkd_file.stdout | default('') | trim | default('nothing', true) }}).
      This role disables the DHCP-supplied resolver through a systemd-networkd
      drop-in, which only works if networkd owns the link. If the OrbStack image
      switched network stacks, this role has to switch with it.

- name: Ensure the systemd-networkd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/network/{{ resolved_networkd_file.stdout | trim | basename }}.d
    state: directory
    mode: "0755"

- name: Stop DHCP from installing its own resolver on the default link
  ansible.builtin.copy:
    dest: /etc/systemd/network/{{ resolved_networkd_file.stdout | trim | basename }}.d/10-no-dhcp-dns.conf
    mode: "0644"
    content: |
      # Managed by ansible/roles/resolved. OrbStack's DHCP hands out
      # 0.250.250.200, which silently drops every query; a global DNS= cannot
      # remove a per-link server. Only UseDNS is disabled: address, route
      # and search domain still come from DHCP.
      [DHCPv4]
      UseDNS=false

      [DHCPv6]
      UseDNS=false

      # RDNSS from router advertisements, the IPv6 equivalent of the same trap.
      [IPv6AcceptRA]
      UseDNS=false
  notify: Reload systemd-networkd

- name: Apply the resolved and networkd config changes now
  ansible.builtin.meta: flush_handlers

# invariant: roles/tailscale restarts tailscaled when this changes.
- name: Point /etc/resolv.conf at the systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  register: resolved_stub_link
