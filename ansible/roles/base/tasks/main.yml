---
# Target OS is Debian 13 (trixie); package names below are Debian-native.

- name: Display deployment target
  ansible.builtin.debug:
    msg: "Deploying to {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags: [always]

- name: Wait for system to be ready
  ansible.builtin.wait_for_connection:
    connect_timeout: 20
    timeout: 300
  tags: [always]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [base, packages]

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - jq
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-yaml
      - python3-kubernetes
      # Required by ansible.builtin.deb822_repository (roles/tailscale). Debian
      # 13 removed apt-key, so deb822 sources are the only supported path.
      - python3-debian
      - iptables
      # A SEPARATE, non-default package on Debian 12+. Must be installed here,
      # before the tailscale role symlinks /etc/resolv.conf at its stub and
      # before k3s pins --resolv-conf=/run/systemd/resolve/resolv.conf.
      - systemd-resolved
      # OrbStack VMs ship without sshd; the security role needs `sshd -t` to
      # validate its drop-in, and skips the hardening entirely without it.
      - openssh-server
    state: present
  tags: [base, packages]

# Debian 13 ships OpenSSH socket-activated, which breaks the security role two
# ways: `Port` in sshd_config is ignored (ListenStream decides it), and
# restarting ssh.service does not re-bind, so a config change looks applied but
# is not. Switch to the classic always-listening daemon instead.
- name: Check for a socket-activated sshd unit
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/ssh.socket
  register: ssh_socket_unit
  tags: [base, ssh]

- name: Disable socket activation for sshd
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false
  when: ssh_socket_unit.stat.exists
  tags: [base, ssh]

# Also creates /run/sshd, which `sshd -t` needs: on a fresh install that has
# never started the daemon, the security role's validation fails without it.
- name: Ensure ssh service is started and enabled
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true
    daemon_reload: true
  tags: [base, ssh]

# kubelet opens /dev/kmsg at startup and k3s crashloops without it. Some
# lightweight VMs do not expose it, hence the conditional /dev/console
# fallback plus a tmpfiles.d entry to recreate the symlink on reboot.
- name: Stat /dev/kmsg
  ansible.builtin.stat:
    path: /dev/kmsg
  register: kmsg_dev
  tags: [base, kmsg]

- name: Backfill /dev/kmsg when the kernel doesn't expose it
  when: not kmsg_dev.stat.exists
  tags: [base, kmsg]
  block:
    - name: Persist /dev/kmsg symlink via tmpfiles.d
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/orbstack-kmsg.conf
        content: "L /dev/kmsg - - - - /dev/console\n"
        mode: "0644"

    - name: Create /dev/kmsg now
      ansible.builtin.file:
        src: /dev/console
        dest: /dev/kmsg
        state: link
        force: true

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"
  tags: [base]

- name: Configure system limits for Kubernetes
  ansible.builtin.blockinfile:
    path: /etc/security/limits.d/kubernetes.conf
    create: true
    mode: "0644"
    block: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 65536
      * hard nproc 65536
  tags: [base]

# DO NOT CHANGE THESE PATHS. /var/lib/k8s-data is baked into every PV manifest
# under kubernetes/ and holds live data. It is a symlink into OrbStack's
# auto file-share of the Mac home, which is what makes the data survive a
# `make destroy` of the VM while the PV path itself stays stable.
- name: Resolve Mac bind dir
  ansible.builtin.set_fact:
    # Created on the Mac by scripts/deploy.sh (vm_up) before the VM is ever
    # created, so it always exists.
    storage_orbstack_data_dir: "/mnt/mac/Users/{{ lookup('env', 'USER') }}/.jterrazz-infrastructure/data"
  tags: [base, storage]

- name: Replace /var/lib/k8s-data with a symlink to the Mac dir
  ansible.builtin.file:
    src: "{{ storage_orbstack_data_dir }}"
    dest: /var/lib/k8s-data
    state: link
    force: true
  tags: [base, storage]
