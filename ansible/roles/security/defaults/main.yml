---
security_ssh_permit_root_login: "prohibit-password"
security_ssh_password_authentication: "no"
security_ssh_max_auth_tries: 3
security_ssh_client_alive_interval: 300
security_ssh_client_alive_count_max: 2

security_ufw_default_forward: "deny"

# Public half of a split keypair; installed into root's authorized_keys so
# .github/workflows/deploy-platform.yaml can ssh in over the tailnet.
#
# KEEP IN SYNC with the GitHub secret `CI_DEPLOY_SSH_PRIVATE` on this repo.
# Rotating = regenerate, replace this value, update that secret, then
# `make deploy` to roll the new pubkey onto the VM — in that order, or CI
# locks itself out.
security_ci_deploy_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPPCsf2boqXrePRFuhL3KfJjpabJ0bjAeNqpTLl7GREf ci-deploy@jterrazz-infrastructure"

# NOTE UFW is the second gate for 80/443, not the first: klipper-lb DNATs in
# PREROUTING before UFW's INPUT filter sees the packet, so the real gate is
# `loadBalancerSourceRanges` in
# kubernetes/cluster/traefik/traefik-config.yaml.
security_ufw_rules:
  # Any source -> sshd. Deliberately unrestricted: the host has no public
  # inbound path at all, so a source rule buys nothing and can lock out the Mac.
  - { port: "22", proto: "tcp", rule: "allow", comment: "SSH" }
  # Tailnet clients -> Traefik. Public HTTP arrives via cloudflared's outbound
  # tunnel to Traefik's ClusterIP instead, never through these ports.
  - { port: "80", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "HTTP (Tailscale only)" }
  - { port: "443", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "HTTPS (Tailscale only)" }
  # Tailnet clients (laptop kubectl, CI runners) -> the k3s API server.
  - { port: "6443", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "K8s API (Tailscale)" }

security_kernel_params:
  - { name: "net.ipv4.tcp_syncookies", value: "1" }
  - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
  - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
  - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
  - { name: "net.ipv4.conf.default.rp_filter", value: "1" }

# Peer-isolation guard. OrbStack puts every machine on one bridge and gives
# each one the others' filesystems at /mnt/machines; these are the ports that
# were still answering over the network. See templates/nft-guard.conf.j2 for
# why this is nftables and not a UFW rule.
security_guard_interface: eth0
security_guard_host_ip: 192.168.139.1
security_guard_peer_subnet: 192.168.139.0/24
security_guard_blocked_tcp: [22, 2000, 6443, 9100, 10250]
security_guard_blocked_udp: [5355]
