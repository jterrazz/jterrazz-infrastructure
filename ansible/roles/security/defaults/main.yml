---
security_ssh_permit_root_login: "prohibit-password"
security_ssh_password_authentication: "no"
security_ssh_max_auth_tries: 3
security_ssh_client_alive_interval: 300
security_ssh_client_alive_count_max: 2

security_ufw_default_forward: "deny"

# hazard: KEEP IN SYNC with the repo secret `CI_DEPLOY_SSH_PRIVATE` (deploy-platform.yaml).
# Rotate in order: regenerate, replace here, update the secret, `make deploy`.
security_ci_deploy_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPPCsf2boqXrePRFuhL3KfJjpabJ0bjAeNqpTLl7GREf ci-deploy@jterrazz-infrastructure"

# outside: UFW is only the second gate for 80/443: klipper-lb DNATs first, so the real
# gate is `loadBalancerSourceRanges` (kubernetes/services/traefik/helm-chart-config.yaml).
security_ufw_rules:
  # hazard: deliberately unrestricted: no public inbound path exists, and a source
  # rule can lock out the Mac.
  - { port: "22", proto: "tcp", rule: "allow", comment: "SSH" }
  # invariant: tailnet only; public HTTP arrives through cloudflared, never these ports.
  - { port: "80", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "HTTP (Tailscale only)" }
  - { port: "443", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "HTTPS (Tailscale only)" }
  # outside: tailnet clients (laptop kubectl, CI runners) -> the k3s API server.
  - { port: "6443", proto: "tcp", rule: "allow", from: "100.64.0.0/10", comment: "K8s API (Tailscale)" }

security_kernel_params:
  - { name: "net.ipv4.tcp_syncookies", value: "1" }
  - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
  - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
  - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
  - { name: "net.ipv4.conf.default.rp_filter", value: "1" }

# outside: peer isolation from the other OrbStack machines on the bridge
# (templates/nft-guard.conf.j2; docs/decisions/006-the-host-has-no-public-inbound-path.md).
security_guard_interface: eth0
security_guard_host_ip: 192.168.139.1
security_guard_peer_subnet: 192.168.139.0/24
security_guard_blocked_tcp: [22, 2000, 6443, 9100, 10250]
security_guard_blocked_udp: [5355]
