---
# invariant: ssh.service, NOT ssh.socket: the base role turns socket activation off so the
# daemon owns the listener and a restart actually re-binds it.
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted

- name: Reload the nftables guard
  ansible.builtin.systemd_service:
    name: nft-guard.service
    state: restarted
    daemon_reload: true
