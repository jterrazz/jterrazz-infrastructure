---
- name: Fetch the kubeconfig to the local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig.yaml"
    flat: true
    # Not the local umask: this file carries a cluster-admin client certificate.
    mode: "0600"

# The Tailscale MagicDNS name, NOT `ansible_host`: that is `orb`, an SSH-config
# alias no resolver knows, so the fetched kubeconfig would point at
# https://orb:6443. MagicDNS works from any tailnet client and is in the API
# server's TLS SANs (roles/k3s/templates/config.yaml.j2), so the cert verifies.
# The regexp matches both loopback spellings k3s can write (127.0.0.1, or
# 0.0.0.0 when bind-address is set explicitly).
- name: Update the kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../kubeconfig.yaml"
    regexp: 'https://(127\.0\.0\.1|0\.0\.0\.0):6443'
    replace: "https://{{ tailscale_dns_hostname | default('') or tailscale_ip | default('') or ansible_host }}:6443"
  delegate_to: localhost
  become: false
