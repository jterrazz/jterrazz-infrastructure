---
- name: Fetch the kubeconfig to the local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig.yaml"
    flat: true
    # invariant: not the local umask: this file carries a cluster-admin client certificate.
    mode: "0600"

# outside: the MagicDNS name (a TLS SAN), never `ansible_host` (`orb`, which no
# resolver knows). The regexp matches both loopback spellings k3s writes.
- name: Update the kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../kubeconfig.yaml"
    regexp: 'https://(127\.0\.0\.1|0\.0\.0\.0):6443'
    replace: "https://{{ tailscale_dns_hostname | default('') or tailscale_ip | default('') or ansible_host }}:6443"
  delegate_to: localhost
  become: false
