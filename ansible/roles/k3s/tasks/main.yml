---
# k3s installation and configuration tasks

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Debug k3s binary check
  ansible.builtin.debug:
    msg: "k3s_binary.stat.exists = {{ k3s_binary.stat.exists | default('undefined') }}"

- name: Get installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Check if k3s version update is needed
  ansible.builtin.set_fact:
    k3s_needs_installation: "{{ not k3s_binary.stat.exists or (k3s_installed_version.stdout is defined and k3s_version not in k3s_installed_version.stdout) }}"

- name: Download k3s installation script (only if needed)
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  register: k3s_script_downloaded
  when: k3s_needs_installation

- name: Create k3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Check if k3s config exists
  ansible.builtin.stat:
    path: "{{ k3s_config_dir }}/config.yaml"
  register: k3s_config_exists

- name: Read existing k3s token from config
  ansible.builtin.slurp:
    src: "{{ k3s_config_dir }}/config.yaml"
  register: k3s_existing_config
  when: k3s_config_exists.stat.exists

- name: Extract token from existing config
  ansible.builtin.set_fact:
    existing_token: "{{ (k3s_existing_config.content | b64decode | regex_search('token: (.+)', '\\1'))[0] | default('') }}"
  when: k3s_config_exists.stat.exists and k3s_existing_config.content is defined

- name: Generate secure k3s token for single-node cluster
  ansible.builtin.command: openssl rand -hex 32
  register: k3s_generated_token
  when:
    - k3s_token == ""
    - not k3s_config_exists.stat.exists or (existing_token | default('')) == ""
  changed_when: false

- name: Set k3s token (prioritize existing > configured > generated)
  ansible.builtin.set_fact:
    k3s_token: "{{ existing_token | default(k3s_token if k3s_token != '' else k3s_generated_token.stdout | default('')) }}"

- name: Display k3s token status
  ansible.builtin.debug:
    msg: "✅ k3s token {{ 'reused from existing config' if existing_token | default('') != '' else ('set from configuration' if k3s_token != k3s_generated_token.stdout | default('') else 'auto-generated for single-node setup') }}"

- name: Generate k3s configuration file
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0640"
    owner: root
    group: root
  notify: restart k3s

- name: Test k3s installation debug
  ansible.builtin.debug:
    msg: "About to install k3s version {{ k3s_version }}"

- name: Install k3s server (only if needed) # noqa command-instead-of-shell
  ansible.builtin.shell: "INSTALL_K3S_VERSION={{ k3s_version }} sh /tmp/k3s-install.sh"
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
  register: k3s_installation_result
  when: k3s_needs_installation

- name: Ensure k3s service is started and enabled
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: "{{ k3s_service_state }}"
    enabled: "{{ k3s_service_enabled }}"
    daemon_reload: true

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ k3s_node_ip }}"
    delay: 10
    timeout: 300

- name: Verify k3s cluster is running
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false
  retries: 5
  delay: 10
  until: k3s_nodes.rc == 0

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0644"

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copy kubeconfig for root user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Display k3s cluster status
  ansible.builtin.debug:
    msg: |
      ✅ k3s cluster is ready!
      • Version: {{ k3s_version }}
      • API Server: https://{{ ansible_host }}:6443
      • Kubeconfig: /etc/rancher/k3s/k3s.yaml
      • Nodes: {{ k3s_nodes.stdout_lines | length }}

- name: Clean up installation script (only if downloaded)
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent
  when: k3s_script_downloaded is defined and k3s_script_downloaded.changed
