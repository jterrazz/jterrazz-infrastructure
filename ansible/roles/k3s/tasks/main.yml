---
# This role has NO defaults/main.yml on purpose: k3s_version lives in
# inventories/group_vars/all.yml and must not be duplicated, since a role
# default silently wins whenever group_vars is not loaded.

- name: Create the k3s directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - "{{ k3s_data_dir }}"
    - /var/log/k3s
  tags: [k3s]

- name: Check if k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  tags: [k3s]

- name: Get the installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists
  tags: [k3s]

- name: Determine if k3s needs installation
  ansible.builtin.set_fact:
    k3s_needs_install: "{{ not k3s_binary.stat.exists or (k3s_version not in (k3s_current_version.stdout | default(''))) }}"
  tags: [k3s]

# Generated once and persisted at /etc/rancher/k3s/token — regenerating it
# on an existing cluster invalidates every node's registration.
- name: Check if the k3s token file exists
  ansible.builtin.stat:
    path: /etc/rancher/k3s/token
  register: k3s_token_file
  tags: [k3s]

- name: Read the existing token
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/token
  register: k3s_existing_token
  when: k3s_token_file.stat.exists
  no_log: true
  tags: [k3s]

- name: Generate a new token if none exists
  ansible.builtin.command: openssl rand -hex 32
  register: k3s_generated_token
  changed_when: false
  when: not k3s_token_file.stat.exists
  no_log: true
  tags: [k3s]

- name: Set the k3s token fact
  ansible.builtin.set_fact:
    k3s_cluster_token: >-
      {%- if k3s_token_file.stat.exists -%}
        {{ k3s_existing_token.content | b64decode | trim }}
      {%- else -%}
        {{ k3s_generated_token.stdout }}
      {%- endif -%}
  no_log: true
  tags: [k3s]

- name: Save the token to file
  ansible.builtin.copy:
    content: "{{ k3s_cluster_token }}"
    dest: /etc/rancher/k3s/token
    mode: "0600"
  when: not k3s_token_file.stat.exists
  no_log: true
  tags: [k3s]

# Only fires when this role runs standalone (site.yml's tailscale role sets
# them). The IP and DNS name go into the API server's TLS SANs, which is the
# only way kubectl over the tailnet gets a valid cert.
- name: Ensure Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined
  tags: [k3s]

- name: Generate the audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: "0640"
  notify: Restart k3s
  tags: [k3s]

# Must exist before the apiserver starts: it does not create the directory for
# audit-log-path and fails to come up at all if the parent is missing.
- name: Ensure the audit log directory exists
  ansible.builtin.file:
    path: "{{ k3s_data_dir }}/server/logs"
    state: directory
    mode: "0700"
  tags: [k3s]

- name: Generate the k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0640"
  notify: Restart k3s
  tags: [k3s]

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: k3s_needs_install
  tags: [k3s]

- name: Install k3s
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION={{ k3s_version }} sh /tmp/k3s-install.sh
  environment:
    K3S_TOKEN: "{{ k3s_cluster_token }}"
  changed_when: true
  when: k3s_needs_install
  notify: Restart k3s
  tags: [k3s]

- name: Cleanup the install script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent
  tags: [k3s]

- name: Enable the k3s service
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true
  tags: [k3s]

# Placement is load-bearing in BOTH directions. Later than this and the
# readiness checks below pass against the OLD config, so a broken config change
# looks green until the next run. Earlier (right after the config template) and
# a fresh host dies with "Could not find the requested service k3s", because
# the unit does not exist until the install task above.
- name: Restart k3s now if the config changed
  ansible.builtin.meta: flush_handlers

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ k3s_node_ip }}"
    timeout: 120
  tags: [k3s]

- name: Verify the cluster is running
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false
  retries: 10
  delay: 5
  until: k3s_nodes.rc == 0
  tags: [k3s]

# `secrets-encryption: true` only covers Secrets written after the restart.
# This rewrites the ones already in the datastore; without it the plaintext
# copies of every existing app credential stay exactly where they were.
# Idempotent — a re-encrypt on an already-encrypted store is a no-op rewrite.
- name: Check the secrets encryption status
  ansible.builtin.command: k3s secrets-encrypt status
  register: k3s_secrets_encrypt
  changed_when: false
  failed_when: false
  tags: [k3s, security]

- name: Re-encrypt existing secrets
  ansible.builtin.command: k3s secrets-encrypt reencrypt --force
  when: "'Encryption Status: Enabled' in k3s_secrets_encrypt.stdout"
  register: k3s_reencrypt
  changed_when: k3s_reencrypt.rc == 0
  failed_when: false
  tags: [k3s, security]

- name: Create the kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  tags: [k3s]

- name: Set the kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0600"
  tags: [k3s]

- name: Create the .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"
  tags: [k3s]

- name: Copy the kubeconfig for root
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"
  tags: [k3s]

- name: Publish the kubeconfig to the machine that ran the playbook
  ansible.builtin.import_tasks: kubeconfig.yml
  tags: [k3s, kubeconfig]
