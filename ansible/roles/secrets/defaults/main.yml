---
# invariant: `site` adds the entries marked `scope: site` (the Tailscale OAuth pair the
# tailscale role logs in with); platform.yml only reads Tailscale facts off a
# node that already joined, so it never fetches them.
secrets_scope: platform

# outside: the entries this scope fetches.
secrets_wanted: "{{ infisical_secrets | selectattr('scope', 'undefined') | list + (infisical_secrets | selectattr('scope', 'defined') | selectattr('scope', 'eq', secrets_scope) | list) }}"
