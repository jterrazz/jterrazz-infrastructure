---
# invariant: THE fetch of every deploy secret, on the controller, failing on a missing
# key before anything deploys; never a default (docs/decisions/015-deploy-secrets-are-fetched-once-by-ansible.md).

- name: Read the Infisical identity from the environment
  ansible.builtin.set_fact:
    infisical_client_id: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') }}"
    infisical_client_secret: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') }}"
  no_log: true

- name: Require the Infisical identity
  ansible.builtin.assert:
    that:
      - infisical_client_id | length > 0
      - infisical_client_secret | length > 0
    fail_msg: INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET must be set (`.env` locally, GitHub secrets in CI).
    quiet: true

- name: Log in to Infisical
  ansible.builtin.uri:
    url: "{{ infisical_api }}/api/v1/auth/universal-auth/login"
    method: POST
    body_format: json
    body:
      clientId: "{{ infisical_client_id }}"
      clientSecret: "{{ infisical_client_secret }}"
  register: infisical_login
  delegate_to: localhost
  become: false
  no_log: true

- name: Fetch each secret folder once
  ansible.builtin.uri:
    url: "{{ infisical_api }}/api/v3/secrets/raw?workspaceSlug={{ infisical_project }}&environment={{ infisical_environment }}&secretPath={{ item | urlencode }}"
    headers:
      Authorization: "Bearer {{ infisical_login.json.accessToken }}"
  loop: "{{ secrets_wanted | map(attribute='path') | unique }}"
  register: infisical_folders
  delegate_to: localhost
  become: false
  no_log: true

- name: Set every secret as a variable, refusing a missing one
  ansible.builtin.set_fact:
    "{{ item.var }}": "{{ secrets_by_path[item.path][item.key] | mandatory('Infisical ' ~ item.path ~ ' has no ' ~ item.key) }}"
  loop: "{{ secrets_wanted }}"
  loop_control:
    label: "{{ item.var }}"
  vars:
    secrets_by_path: >-
      {{ dict(infisical_folders.results | map(attribute='item')
              | zip(infisical_folders.results | map(attribute='json.secrets')
                    | map('items2dict', key_name='secretKey', value_name='secretValue'))) }}
  no_log: true
