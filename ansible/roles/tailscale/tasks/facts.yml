---
# hazard: THE single place that shells out for the node's tailnet identity; do not
# re-derive tailscale_ip / tailscale_dns_hostname elsewhere. Callers that may
# run without the tailscale role (roles/k3s/tasks/main.yml,
# roles/platform/tasks/stage-manifests.yml) include this file guarded by
# `when: tailscale_ip is not defined`.

- name: Get Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_result
  changed_when: false
  failed_when: false

- name: Get Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_result
  changed_when: false
  failed_when: false

- name: Set shared Tailscale facts
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout | default('') | trim }}"
    # outside: DNSName comes back with a trailing dot; strip it so the value drops
    # straight into Helm values and TLS SANs.
    tailscale_dns_hostname: >-
      {{ (tailscale_status_result.stdout | from_json).Self.DNSName | regex_replace('\.$', '')
         if tailscale_status_result.rc == 0 else '' }}
    cacheable: true
