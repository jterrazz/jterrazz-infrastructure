---
# Install + join only. The systemd-resolved/networkd DNS repair this depends on
# is roles/resolved, which site.yml runs immediately before this role.

- name: Check if Tailscale is installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary
  tags: [tailscale]

# Only for an already-running tailscaled holding a stale resolv.conf: the
# fresh-install branch below starts the daemon after roles/resolved has put the
# symlink in place. `default(false)` because a `--tags tailscale` run skips
# roles/resolved entirely and never registers the fact.
- name: Restart tailscaled to pick up the systemd-resolved integration
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
  when:
    - resolved_stub_link.changed | default(false)
    - tailscale_binary.stat.exists
  tags: [tailscale]

- name: Install Tailscale
  when: not tailscale_binary.stat.exists
  tags: [tailscale]
  block:
    # deb822, NOT apt_key + apt_repository: Debian 13 removed the apt-key
    # binary so apt_key has nothing to call. Needs python3-debian on the
    # target, installed by the base role.
    - name: Add the Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: https://pkgs.tailscale.com/stable/debian
        suites: [trixie]
        components: [main]
        signed_by: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
        state: present
        enabled: true

    # update_cache here, not as a separate step: the source was only just
    # written, so apt has no index for it and the install would fail with
    # "Unable to locate package tailscale".
    - name: Install the Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Enable the Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  tags: [tailscale]

# Boot-time self-heal: after a reboot tailscaled can come back "Logged out"
# (node-key expiry) and does NOT auto-reconnect. A logged-out node cannot
# resolve *.ts.net, so registry.internal.jterrazz.com NXDOMAINs, every app pod
# ImagePullBackOffs and Cloudflare 503s the public hostnames.
#
# The script is ALSO how this play logs in (last task in the block) — do not
# re-spell `tailscale up` as an argv here, or a flag added to one copy silently
# misses the other. It is idempotent: it exits 0 when BackendState is Running.
- name: Set up Tailscale login and boot-time auto-reauth
  when:
    - tailscale_oauth_client_id != ""
    - tailscale_oauth_client_secret != ""
  tags: [tailscale]
  block:
    - name: Create the Tailscale config directory
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        mode: "0700"

    - name: Write the Tailscale auto-reauth credentials
      ansible.builtin.template:
        src: tailscale-autoauth.env.j2
        dest: /etc/tailscale/autoauth.env
        mode: "0600"
      no_log: true

    - name: Install the Tailscale auto-reauth script
      ansible.builtin.template:
        src: tailscale-autoauth.sh.j2
        dest: /usr/local/bin/tailscale-autoauth.sh
        mode: "0750"

    - name: Install the Tailscale auto-reauth systemd unit
      ansible.builtin.template:
        src: tailscale-autoauth.service.j2
        dest: /etc/systemd/system/tailscale-autoauth.service
        mode: "0644"

    - name: Enable the Tailscale auto-reauth service
      ansible.builtin.systemd_service:
        name: tailscale-autoauth.service
        enabled: true
        daemon_reload: true

    # The OAuth secret goes via the task environment, never a command line.
    - name: Connect to Tailscale
      ansible.builtin.command: /usr/local/bin/tailscale-autoauth.sh
      environment:
        TS_CLIENT_ID: "{{ tailscale_oauth_client_id }}"
        TS_CLIENT_SECRET: "{{ tailscale_oauth_client_secret }}"
      register: tailscale_up
      changed_when: "'re-authenticating' in tailscale_up.stdout"
      no_log: true

# Publishes tailscale_ip / tailscale_dns_hostname for the k3s role (TLS SANs,
# kubeconfig server URL) and the platform role (CoreDNS overrides, Helm values).
- name: Gather Tailscale facts for downstream plays
  ansible.builtin.include_tasks: facts.yml
  tags: [tailscale]
