---
# EXACT pins, never `>=`: a floor lets the GHA runner (clean cache, always
# newest) and a laptop (already satisfies it, never upgrades) resolve
# different versions from this same file. Bump deliberately.

#
# community.general crossed a MAJOR here (12 -> 13). Its breaking changes are
# a module-utils privatisation, dropping ansible-core 2.17, and defaults/
# positional-arg changes in github_repo / rocketchat / the *_pet|string|words
# lookups — none of which this repo uses. The only two modules it consumes
# (`timezone` in roles/base, `ufw` in roles/security) are untouched by 13.0.0
# and appear nowhere in its Removed Features list. 13.x requires
# ansible-core >= 2.18; CI installs 2.21.4.

collections:
  - name: kubernetes.core
    version: "6.5.0"
  - name: community.general
    version: "13.2.0"
  - name: ansible.posix
    version: "2.2.2"
