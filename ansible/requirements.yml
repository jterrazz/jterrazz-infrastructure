---
# invariant: EXACT pins from GitHub tags, never `>=` and never Galaxy. A git source
# resolves no dependencies, so community.library_inventory_filtering is
# community.general's, pinned by hand (docs/decisions/020-validation-gates-fail-loudly-and-pin-what-they-run.md).

collections:
  - name: https://github.com/ansible-collections/kubernetes.core.git
    type: git
    version: "6.5.0"
  - name: https://github.com/ansible-collections/community.general.git
    type: git
    version: "13.2.0"
  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git
    type: git
    version: "1.1.5"
  - name: https://github.com/ansible-collections/ansible.posix.git
    type: git
    version: "2.2.2"
