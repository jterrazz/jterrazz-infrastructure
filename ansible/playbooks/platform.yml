---
# hazard: everything above k3s (Helm releases + raw manifests). All kubectl/helm
# commands run ON the node, so no external k8s API access is needed.
#
# ALSO run standalone by .github/workflows/deploy-platform.yaml, so it must
# never assume the site.yml host-layer plays ran in the same invocation. The
# body is roles/platform, whose includes are tagged for targeted redeploys:
#
#   ansible-playbook playbooks/platform.yml -i inventories/laptop.yml \
#     -e "@vars.yml" --tags telemetry
- name: Platform Services Deployment
  hosts: cluster
  become: true
  gather_facts: true

  # hazard: include_role, not a `roles:` entry with `when:`. A role's `when` is
  # inherited by every task and evaluated per LOOP ITEM, so once the first
  # secret was set the rest of the loop was skipped (the first CI deploy after
  # roles/secrets landed failed on cloudflare_tunnel_token). An include's
  # `when` is evaluated once. Skipped when site.yml already fetched the wider
  # `site` scope on this run.
  pre_tasks:
    - name: Fetch the deploy's secrets from Infisical
      ansible.builtin.include_role:
        name: secrets
        # invariant: an include does not hand its tags to the tasks it includes;
        # `apply` does, so a targeted `--tags releases` still has its secrets.
        apply:
          tags: [always]
      when: cloudflare_api_token is not defined
      tags: [always]

  roles:
    # hazard: KUBECONFIG once, here, instead of on ~36 individual tasks: every
    # kubectl/helm command in the role runs on the node against the k3s
    # kubeconfig, and a task that forgot the block silently talked to
    # ~/.kube/config (i.e. nothing) instead. The role's `kubeconfig` default
    # is in scope for its own tasks, so the value still comes from
    # roles/platform/defaults/main.yml. Handlers do NOT inherit this; see
    # roles/platform/handlers/main.yml, which keeps its own block.
    - role: platform
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

  post_tasks:
    - name: Cleanup temporary manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent
      tags: [always]

    # invariant: names neither a service nor a version: a hand-written inventory drifts
    # from the tasks and then confidently reports something that was never
    # deployed. `helm list -A` is the only honest answer.
    - name: Deployment complete
      ansible.builtin.debug:
        msg: |
          Platform deployment complete.

          App chart published to: oci://registry.internal.jterrazz.com/charts/app
          Installed releases:     helm list -A --kubeconfig {{ kubeconfig }}
      tags: [always]
