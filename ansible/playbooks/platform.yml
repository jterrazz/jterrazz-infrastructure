---
# hazard: also run alone by deploy-platform.yaml: never assume site.yml's host plays ran.
- name: Deploy the platform layer
  hosts: cluster
  become: true
  gather_facts: true

  pre_tasks:
    # hazard: include_role, never a role-level `when:`, which is evaluated per loop item (ADR-015);
    # `apply` hands `always` to the included tasks so a `--tags` run still has its secrets.
    - name: Fetch the deploy's secrets from Infisical
      ansible.builtin.include_role:
        name: secrets
        apply:
          tags: [always]
      when: cloudflare_api_token is not defined
      tags: [always]

  roles:
    # hazard: handlers do not inherit this environment; roles/platform/handlers sets its own.
    - role: platform
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

  post_tasks:
    - name: Remove the staged manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent
      tags: [always]
