---
# outside: host layer + platform layer in one run; Debian 13 only.

# invariant: raw SSH before fact gathering: every later play needs python3.
- name: Bootstrap Python interpreter
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: command -v python3 || (apt-get update && apt-get install -y python3)
      register: python_bootstrap
      changed_when: "'Setting up python3' in python_bootstrap.stdout"

# invariant: role order is load-bearing: base installs systemd-resolved, resolved
# repairs DNS before tailscale and k3s read it.
- name: Configure the cluster node
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - role: secrets
      vars:
        secrets_scope: site
      tags: [always]
    - role: base
      tags: [base]
    - role: security
      tags: [security]
    - role: resolved
      tags: [resolved, dns, networking]
    - role: tailscale
      tags: [tailscale, networking]
    - role: k3s
      tags: [k3s]

- name: Platform Services
  ansible.builtin.import_playbook: platform.yml
