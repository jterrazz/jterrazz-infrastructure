---
# outside: CI inventory — the same OrbStack VM, reached over Tailscale because a GitHub
# Actions runner has no OrbStack. Used by .github/workflows/deploy-platform.yaml.
#
# The SSH private key is the repo's GitHub secret `CI_DEPLOY_SSH_PRIVATE`, NOT
# Infisical; its public half is `security_ci_deploy_pubkey` in
# ansible/roles/security/defaults/main.yml, which the security role installs
# into root's authorized_keys. Rotating means changing both.
all:
  children:
    cluster:
      hosts:
        jterrazz-infrastructure:
          # invariant: MagicDNS FQDN — resolves only because the runner joins the tailnet
          # with accept-dns via tailscale/github-action.
          ansible_host: jterrazz-infrastructure.tail77a797.ts.net
          ansible_user: root
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
