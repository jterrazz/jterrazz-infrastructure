---
# Global variables — the visible config surface of this repo. This file MUST
# stay beside the inventory files: Ansible auto-loads `group_vars/` from next
# to the inventory (or the playbook) and nowhere else. Role `defaults/main.yml`
# is only for values a user should not normally touch.

timezone: UTC

# KEEP IN SYNC with the `azure/setup-helm` version in BOTH
# .github/workflows/validate.yaml and .github/workflows/publish-chart.yaml.
# Three machines, one Helm: a chart packaged by one version and rendered by
# another is a silent behaviour difference.
#
# DELIBERATELY v3, not v4: v4 changes CLI flags/output, makes server-side apply
# the default upgrade path, and rewrites the plugin ABI — this repo's toolchain
# (helm-diff, helm-unittest + its committed snapshots, the `changed_when` stdout
# matching in roles/platform/tasks/*) is calibrated on v3.
helm_version: "v3.21.3"

# SINGLE SOURCE OF TRUTH — deliberately NOT duplicated in roles/k3s/defaults
# (which is why that file does not exist): a role default wins only when this
# file is not loaded, so two copies is a silent-drift trap.
#
# In-place minor bump is the supported path: roles/k3s re-runs get.k3s.io with
# INSTALL_K3S_VERSION and restarts the unit, which takes the CONTROL PLANE down
# for tens of seconds (containers keep running). NEVER SKIP A MINOR —
# Kubernetes' version-skew policy forbids it.
#
# A k3s minor can move the BUNDLED TRAEFIK CHART across a breaking major, so
# re-read kubernetes/cluster/traefik/traefik-config.yaml against the new chart's
# values.schema.json IN THE SAME CHANGE. Renamed *port* keys hard-fail the
# helm-install job; a renamed `service.*` key does NOT — `service` carries no
# `additionalProperties: false`, so a stale key is a SILENT no-op. That is the
# dangerous half: it would drop `loadBalancerSourceRanges: 100.64.0.0/10`, the
# only thing restricting Traefik's host ports 80/443 to the tailnet (klipper-lb
# DNATs in PREROUTING, so UFW never sees the packet). Post-upgrade gate, never
# skip it:
#   kubectl -n kube-system get svc traefik \
#     -o jsonpath='{.spec.loadBalancerSourceRanges}'   # must be non-empty
k3s_version: "v1.36.2+k3s1"
# k3s' own default data-dir, repeated here only because tasks/main.yml and the
# apiserver's audit-log-path need the path as a value.
k3s_data_dir: "/var/lib/rancher/k3s"
k3s_node_ip: "{{ ansible_default_ipv4.address }}"

# Upstream Helm chart versions. Every `helm upgrade --install` in
# roles/platform MUST pass one of these: unpinned, it silently adopts whatever
# the repo's latest is at deploy time, turning an unrelated deploy into an
# uncontrolled upgrade of somebody else's service.
#
# `grafana` below is a version from the `grafana-community` repo, NOT the old
# `grafana` one — the OSS charts moved and restarted their numbering, and the
# chart in the old repo is frozen at 10.5.15. Repo added in
# roles/platform/tasks/helm-cli.yml, consumed in tasks/telemetry.yml.
platform_chart_versions:
  cert_manager: "v1.21.0"
  infisical: "0.11.5"
  # vm repo. Chart minors move fast; read the app version each one ships.
  victoria_metrics: "0.43.0"
  victoria_logs: "0.13.9"
  # PRE-1.0, KNOWINGLY — see the boxed note in victoria-traces/helm.yaml. Do NOT
  # extend that tolerance to the two 1.x pins above.
  victoria_traces: "0.1.10"
  # prometheus-community repo, both of them.
  kube_state_metrics: "8.0.0"
  # The CHART is `prometheus-node-exporter`; the RELEASE is `node-exporter`
  # (hence the fullnameOverride in its helm.yaml).
  node_exporter: "4.56.1"
  otel_collector: "0.165.0"
  # grafana-community repo. grafana.db migrates itself on first boot and is NOT
  # reversible, so the rollback is the /var/lib/k8s-data/grafana restore.
  grafana: "12.8.0"
  # Bump together with the image tag pinned in librechat/helm.yaml.
  librechat: "2.0.7"

# Private hostnames, short-circuited IN-CLUSTER to the node's own tailnet IP.
# Needed because CoreDNS cannot chase a CNAME from a public zone into the
# tailnet zone, so without the override an in-cluster lookup NXDOMAINs.
# Rendered into the `coredns-custom` ConfigMap by
# roles/platform/tasks/coredns.yml via templates/coredns-custom.yaml.j2.
#
# NOT paired with anything on the public-DNS side: every name here is
# `<svc>.internal.jterrazz.com`, covered by the single `*.internal` wildcard in
# pulumi/src/dns.ts. Adding a private service means adding ONE line here and
# nothing else, anywhere.
#
# An explicit list rather than a wildcard because CoreDNS's `hosts` plugin
# matches exact names only — expressing `*.internal` needs the `template`
# plugin, which k3s's CoreDNS build does not include.
private_hostnames:
  - registry.internal.jterrazz.com
  - grafana.internal.jterrazz.com
  - gateway-intelligence.internal.jterrazz.com
  - chat.internal.jterrazz.com

# Same as above, but mapped to Traefik's ClusterIP rather than the node's
# tailnet IP — for a pod that fetches its own PUBLIC URL from inside the
# cluster. A pod cannot hairpin to the node's ServiceLB; it times out.
# openpanel is here because its dashboard image cannot split the SSR and the
# browser URL — that rationale and the retirement order live in
# kubernetes/services/openpanel/config.yaml.
private_hostnames_via_traefik:
  - openpanel.internal.jterrazz.com
