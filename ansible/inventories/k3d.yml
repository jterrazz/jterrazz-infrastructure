---
# invariant: the upgrade test's throwaway k3d cluster; the host name is the k3d server
# node's, since it becomes NODE_NAME, the hostPath nodeAffinity (docs/decisions/021-the-deploy-is-tested-on-a-throwaway-k3d-cluster.md).
all:
  children:
    cluster:
      hosts:
        k3d-ci-server-0:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
