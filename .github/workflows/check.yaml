name: Check

# invariant: pushes too, or a direct push reaches deploy.yaml unchecked (ADR-020); Deploy starts
# from a push's Check run, and applies only when its Upgrade test ran and passed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Revision the upgrade test deploys first (default HEAD^; HEAD gives a re-run test)
        required: false

# invariant: a pull request's stale run is cancelled; a push to main never is, since its run is
# what Deploy starts from: each push's run is a group of its own commit.
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # invariant: the upgrade test runs when the change can move the platform: Ansible, the
  # Kubernetes sources, .infrastructure/ (the platform's dashboards and alert rules deploy from
  # there, ADR-025), the specs, or this workflow; a manual run always runs it.
  plan:
    name: Plan
    runs-on: ubuntu-26.04-arm
    outputs:
      platform: ${{ steps.changes.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read what the change touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if grep -qE '^(src/ansible/|src/kubernetes/|\.infrastructure/|specs/|\.github/workflows/check\.yaml$)' <<< "$changed"; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the platform deploys changed: no upgrade test, and Deploy applies nothing."
          fi

  scripts:
    name: Scripts
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck src/scripts/*.sh src/scripts/lib/*.sh

  docs:
    name: Docs
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hazard: the image's own npm crashed inside `npm exec`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Content check
        run: make check-docs

  specs:
    name: Specs
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      - name: Specs check
        working-directory: specs
        run: npx typescript check

  ansible:
    name: Ansible
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # value: ansible-core 2.21 needs 3.12-3.14; 3.13 has the widest wheels (ADR-020).
          python-version: "3.13"

      - name: Install Ansible
        run: pip install -r src/ansible/requirements.txt

      - name: Install Ansible collections
        working-directory: src/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible Lint
        run: ansible-lint -c src/ansible/.ansible-lint src/ansible/

      - name: Syntax Check
        working-directory: src/ansible
        run: |
          set -euo pipefail
          ansible-playbook playbooks/site.yml -i inventories/laptop.yml --syntax-check
          ansible-playbook playbooks/platform.yml -i inventories/ci.yml --syntax-check

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-26.04-arm
    env:
      # invariant: tried in order: the vendored overrides, the core kinds, the datreeio catalog;
      # never `-ignore-missing-schemas` (ADR-020).
      KUBECONFORM_SCHEMA_ARGS: >-
        -schema-location src/kubernetes/schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        -schema-location default
        -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned tool versions
        id: versions
        run: |
          {
            echo "helm=$(yq '.helm_version' src/ansible/inventories/group_vars/all/versions.yml)"
            echo "helmfile=$(yq '.helmfile_version' src/ansible/inventories/group_vars/all/versions.yml)"
            echo "helm_unittest=$(make -s print-helm-unittest-version)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.8.0
          KUBECONFORM_SHA256=1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate the cluster chart
        run: |
          set -euo pipefail
          helm lint src/kubernetes/charts/cluster
          # shellcheck disable=SC2086
          helm template cluster src/kubernetes/charts/cluster \
            | kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary -

      # invariant: default values render nothing; each fixture is its chart's contract.
      - name: Validate the charts against their fixtures
        run: |
          set -euo pipefail
          helm lint src/kubernetes/charts/common
          for chart in app platform; do
            fixture="src/kubernetes/charts/$chart/ci/test-values.yaml"
            echo "== $chart chart =="
            helm dependency update "src/kubernetes/charts/$chart"
            helm lint "src/kubernetes/charts/$chart" -f "$fixture"
            # shellcheck disable=SC2086
            helm template ci-test "src/kubernetes/charts/$chart" -f "$fixture" \
              | kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary -
          done

      # invariant: pinned by tag (a plugin has no digest) and unsigned, which Helm 4 refuses
      # without --verify=false; it embeds its own renderer, so the snapshots reproduce.
      - name: Install helm-unittest
        env:
          HELM_UNITTEST_VERSION: ${{ steps.versions.outputs.helm_unittest }}
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false

      # hazard: without `--strict` a typo'd assertion name silently never runs.
      - name: Helm chart unit tests
        run: helm unittest --strict src/kubernetes/charts/app src/kubernetes/charts/platform src/kubernetes/charts/cluster

      - name: Install helmfile
        run: |
          set -euo pipefail
          HELMFILE_VERSION=${{ steps.versions.outputs.helmfile }}
          curl -sSL -o /tmp/helmfile.tar.gz \
            "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_arm64.tar.gz"
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile --version

      # invariant: a bad version, moved values file or dangling `needs:` fails here, not mid-deploy.
      - name: Render the platform helmfile
        env:
          NODE_NAME: ci-render
          GRAFANA_ADMIN_PASSWORD: ci-render
        run: helmfile --file src/kubernetes/helmfile.yaml.gotmpl template > /dev/null

      # invariant: a raw manifest is a file with a top-level `apiVersion:`; no file list.
      - name: Validate the raw service manifests
        run: |
          set -euo pipefail
          mapfile -t manifests < <(grep -rl '^apiVersion:' src/kubernetes/services --include='*.yaml')
          # shellcheck disable=SC2086
          kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary "${manifests[@]}"

  secrets:
    name: Secrets
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hazard: version and sha256 pinned, so a re-tagged release cannot run here.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # hazard: --no-git: the history holds rotated credentials; this gate stops new ones (ADR-020).
      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --no-banner --redact -v

  # invariant: the real platform.yml on a throwaway k3d cluster, base tree then this one: it proves
  # releases apply, never that pods start; nothing leaves the runner (ADR-021).
  upgrade:
    name: Upgrade test
    needs: plan
    if: needs.plan.outputs.platform == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the base tree
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="${DISPATCH_BASE:-${PR_BASE:-${PUSH_BEFORE:-}}}"
          base=$(git rev-parse "$base" 2>/dev/null || echo "$base")
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "base: $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          ansible_dir="$RUNNER_TEMP/base/src/ansible"
          echo "BASE_ANSIBLE=$ansible_dir" >> "$GITHUB_ENV"
          # invariant: the base may predate the k3d inventory; group_vars stay each tree's own.
          cp src/ansible/inventories/k3d.yml "$ansible_dir/inventories/k3d.yml"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # invariant: the play's k8s modules run here, on the node's python3-kubernetes version.
      - name: Install Ansible, its collections and the node's k8s client library
        run: |
          pip install -r src/ansible/requirements.txt kubernetes==30.1.0
          ansible-galaxy collection install -r src/ansible/requirements.yml

      - name: Create the k3d cluster at the production k3s version
        run: |
          set -euo pipefail
          K3D_VERSION=v5.9.0
          curl -sSfL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" | TAG="${K3D_VERSION}" bash
          k3s=$(yq '.k3s_version' src/ansible/inventories/group_vars/all/versions.yml | tr '+' '-')
          k3d cluster create ci --image "rancher/k3s:$k3s" \
            --k3s-arg "--disable=local-storage@server:0" --wait
          k3d kubeconfig get ci > "$RUNNER_TEMP/kubeconfig"
          chmod 644 "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get nodes

      - name: Write the dummy deploy variables
        run: |
          cat > "$RUNNER_TEMP/k3d-vars.yml" <<EOF
          kubeconfig: $RUNNER_TEMP/kubeconfig
          platform_helm_wait: false
          tailscale_ip: 127.0.0.1
          tailscale_dns_hostname: k3d.invalid
          cloudflare_dns01_token: ci-dummy
          cloudflare_records_token: ci-dummy
          # outside: the name a base tree before ADR-026 reads; drop it once that base is gone.
          cloudflare_api_token: ci-dummy
          cloudflare_tunnel_token: ci-dummy
          registry_username: ci
          registry_password: ci-dummy
          registry_pull_username: kubelet
          registry_pull_password: ci-dummy
          grafana_admin_password: ci-dummy
          infisical_client_id: ci-dummy
          infisical_client_secret: ci-dummy
          EOF

      - name: Deploy the base tree
        working-directory: ${{ env.BASE_ANSIBLE }}
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags cloudflare,publish

      - name: Upgrade to this tree
        working-directory: src/ansible
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags cloudflare,publish

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # invariant: impersonating app identities needs an admin kubeconfig, so the admission
      # specs run here and never on the live cluster.
      - name: Cluster and admission contract
        working-directory: specs
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: npx vitest --run specs/cluster specs/admission

      - name: What the cluster holds
        if: always()
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sudo -E helm list -A || true
          kubectl get pods -A -o wide || true
