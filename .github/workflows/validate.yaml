name: Validate

# invariant: PRs AND pushes to main: a direct push would otherwise reach
# deploy-platform.yaml unvalidated (docs/decisions/020-validation-gates-fail-loudly-and-pin-what-they-run.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# value: read-only checks, so a stale run is cancelled (never a deploy workflow's setting).
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # outside: ubuntu-latest ships shellcheck; mirrors `make check`.
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh

  docs:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hazard: the image's baked-in npm crashed inside `npm exec`; pin the node major.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # invariant: `make docs` owns the command and its pin; this job is why the
      # laptop's soft skip is safe.
      - name: Content check
        run: make docs

  ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # outside: ansible-core 2.21 needs 3.12-3.14; 3.13 has the widest wheels for
          # ansible-lint's compiled deps. Never a floating "3.x".
          python-version: "3.13"

      - name: Install Ansible
        run: pip install -r ansible/requirements.txt

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible Lint
        # hazard: `-c` is required: config discovery walks UP from the CWD, so
        # without it ansible/.ansible-lint is silently ignored.
        run: ansible-lint -c ansible/.ansible-lint ansible/

      - name: Syntax Check
        # outside: from ansible/ so ansible.cfg (relative roles_path) is picked up.
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook playbooks/site.yml -i inventories/laptop.yml --syntax-check
          ansible-playbook playbooks/platform.yml -i inventories/ci.yml --syntax-check

  kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    env:
      # invariant: tried IN ORDER: vendored overrides (kubernetes/schemas/README.md),
      # core kinds, the datreeio catalog. Never `-ignore-missing-schemas`: an
      # unknown CRD must fail loudly (docs/decisions/020-validation-gates-fail-loudly-and-pin-what-they-run.md).
      KUBECONFORM_SCHEMA_ARGS: >-
        -schema-location kubernetes/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        -schema-location default
        -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # invariant: the node's own tool versions, read where the node reads them.
      - name: Read the pinned tool versions
        id: versions
        run: |
          {
            echo "helm=$(yq '.helm_version' ansible/inventories/group_vars/all.yml)"
            echo "helmfile=$(yq '.helmfile_version' ansible/inventories/group_vars/all.yml)"
            echo "helm_unittest=$(make -s print-helm-unittest-version)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate cluster manifests
        # outside: plain manifests applied with `kubectl apply -R`, so walked whole.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary kubernetes/cluster
          echo "All cluster manifests are valid!"

      - name: Validate Helm charts against CI fixtures
        # invariant: default values render (near) nothing; ci/test-values.yaml is
        # the fixture that exercises the real templates.
        run: |
          set -euo pipefail
          # `common` is a library chart, linted alone; its consumers need a
          # local `helm dependency update` before they render.
          helm lint kubernetes/charts/common
          for chart in app platform-service; do
            fixture="kubernetes/charts/$chart/ci/test-values.yaml"
            echo "== $chart chart =="
            helm dependency update "kubernetes/charts/$chart"
            helm lint "kubernetes/charts/$chart" -f "$fixture"
            # shellcheck disable=SC2086
            helm template ci-test "kubernetes/charts/$chart" -f "$fixture" \
              | kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary -
          done

      # invariant: kubeconform proves schema validity only; helm-unittest asserts what
      # the templates computed. Pinned by tag (a plugin has no digest); it embeds
      # its own renderer, which keeps the snapshots reproducible.
      - name: Install helm-unittest
        # outside: scripts/lib/helm-plugin.sh carries the Helm 3/4 --verify fallback, so
        # this and scripts/helmfile.sh install plugins the same way.
        run: |
          set -euo pipefail
          HELM_UNITTEST_VERSION=${{ steps.versions.outputs.helm_unittest }}
          source scripts/lib/helm-plugin.sh
          helm_plugin_install https://github.com/helm-unittest/helm-unittest "$HELM_UNITTEST_VERSION"
          helm plugin list

      - name: Helm chart unit tests
        # hazard: without `--strict` a typo'd assertion name silently never runs.
        run: helm unittest --strict kubernetes/charts/app kubernetes/charts/platform-service

      # invariant: renders the one state file roles/platform applies, with the node's
      # helmfile, so a bad version, moved values file or dangling `needs:` fails
      # here rather than mid-deploy.
      - name: Install helmfile
        run: |
          set -euo pipefail
          HELMFILE_VERSION=${{ steps.versions.outputs.helmfile }}
          curl -sSL -o /tmp/helmfile.tar.gz \
            "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile --version

      - name: Render the platform helmfile
        # invariant: no cluster needed; the two variables only satisfy `requiredEnv`.
        env:
          NODE_NAME: ci-render
          GRAFANA_ADMIN_PASSWORD: ci-render
        run: helmfile --file kubernetes/helmfile.yaml.gotmpl template > /dev/null

      - name: Validate raw service manifests
        # invariant: a raw manifest is a file with a top-level `apiVersion:`, the same
        # test roles/platform/tasks/raw-manifests.yml applies; no file list.
        run: |
          set -euo pipefail
          mapfile -t manifests < <(grep -rl '^apiVersion:' kubernetes/services --include='*.yaml')
          echo "Validating ${#manifests[@]} raw manifests:"
          printf '  %s\n' "${manifests[@]}"
          # shellcheck disable=SC2086
          kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary "${manifests[@]}"

  secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hazard: version + sha256 pinned, so a re-tagged release cannot run here.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        # hazard: --no-git on purpose: the history holds rotated credentials and this
        # gate stops NEW secrets. No .gitleaks.toml: a tripping fixture is rewritten,
        # never allowlisted (docs/decisions/020-validation-gates-fail-loudly-and-pin-what-they-run.md).
        run: gitleaks detect --source . --no-git --no-banner --redact -v
