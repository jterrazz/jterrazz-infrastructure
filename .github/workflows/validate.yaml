name: Validate

# Runs on PRs (pre-merge gate) AND on push to main (a direct push — e.g. a
# merge commit made outside a PR, or an admin bypass — would otherwise reach
# main, and therefore deploy-platform.yaml/publish-chart.yaml, unvalidated).
#
# No `workflow_call:` here: nothing in this repo (or known to reference it
# externally) invokes this workflow as a reusable one — grepped for
# `uses:.*validate` and found no callers. If that changes, re-add it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One validation run per ref at a time; a new push supersedes whatever was
# already validating for the same branch/PR. Unlike the deploy workflows
# (which must never be cancelled mid-apply), validation is pure read-only
# checks, so cancelling a stale run is safe and saves runner time.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pulumi:
    name: Validate Pulumi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 is the current Active LTS (Node 20 went EOL 2026-04-30, 22 is in
          # maintenance). NOT 26: it is the current line but does not enter LTS
          # until 2026-10-28.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: pulumi/package-lock.json

      - name: Install dependencies
        working-directory: pulumi
        run: npm ci

      # Typecheck only. There is deliberately NO `pulumi preview` step: the one
      # stack this repo has is `jterrazz/local`, whose provider drives orbctl on
      # the dev Mac — a GHA runner has no OrbStack, so a preview could only ever
      # fail or lie. tsc is what actually catches breakage in pulumi/src.
      - name: TypeScript Check
        working-directory: pulumi
        run: npx tsc --noEmit

  scripts:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors the shellcheck step in `make check`. ubuntu-latest ships
      # shellcheck preinstalled, so there is nothing to set up.
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Python syntax check
        # ast.parse rather than py_compile: same check, no __pycache__ artifact.
        run: |
          set -euo pipefail
          for f in scripts/infisical-vars.py scripts/assert-sync.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" "$f"
          done

      # Several facts in this repo are necessarily written down twice, in two
      # languages, because two different machines consume them (a Traefik
      # entrypoint argument vs a Traefik Middleware CRD; a Python secret map vs
      # an Ansible assert). Each pair carries a "KEEP IN SYNC" comment — and a
      # comment is not a check. This step is the check. Stdlib-only, so this
      # job still installs nothing.
      - name: Cross-file sync assertions
        run: python3 scripts/assert-sync.py

  ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # ansible-core 2.21 requires Python >= 3.12 and is tested on 3.12-3.14.
          # 3.13 sits in the middle of that window with the widest wheel
          # coverage for ansible-lint's compiled deps (cffi, cryptography,
          # ruamel-yaml-clib — which ansible-lint drops entirely on 3.14).
          # Never a floating "3.x": it would roll to 3.15 and out of the
          # tested matrix.
          python-version: "3.13"

      # Pinned exact (not `ansible ansible-lint`, which pulls whatever the
      # latest ansible-core/ansible-lint happen to be that day, and pulls in
      # the full `ansible` community package's bundled collections instead
      # of the explicit set in requirements.yml below).
      - name: Install Ansible
        run: pip install ansible-core==2.21.2 ansible-lint==26.6.0

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible Lint
        # Lint the whole ansible/ tree (roles + templates + inventories), not
        # just playbooks/, and from the repo root so paths in the output are
        # repo-relative. `-c` is required: ansible-lint's config discovery
        # searches the CWD and walks UP, never down into the linted directory,
        # so without it ansible/.ansible-lint (profile + skips) is ignored.
        run: ansible-lint -c ansible/.ansible-lint ansible/

      - name: Syntax Check
        # From ansible/ so ansible.cfg (relative roles_path) is picked up.
        # Both playbooks, each against the inventory that actually runs it.
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook playbooks/site.yml -i inventories/laptop.yml --syntax-check
          ansible-playbook playbooks/platform.yml -i inventories/ci.yml --syntax-check

  kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    env:
      # Three locations, tried IN ORDER — kubeconform uses the first that
      # resolves and falls through when a file is absent:
      #
      #   1. kubernetes/schemas/ — vendored, in this repo. Overrides for CRDs
      #      whose catalog copy is behind the version we actually run. Today
      #      that is exactly one file, secrets.infisical.com/InfisicalSecret:
      #      the catalog schema still marks the deprecated flat
      #      `resyncInterval` REQUIRED and rejects `syncConfig`, so a correct
      #      manifest for secrets-operator 0.11.5 fails against it. Extracted
      #      from the CRD the operator chart itself ships — see
      #      kubernetes/schemas/README.md for the regeneration command and the
      #      sync obligation.
      #   2. `default` — core/built-in Kubernetes kinds.
      #   3. the datreeio catalog — every other CRD this repo renders
      #      (traefik.io IngressRoute/Middleware, cert-manager.io
      #      Certificate/ClusterIssuer).
      #
      # Deliberately NOT paired with `-ignore-missing-schemas`: if a future
      # manifest introduces a CRD kind with no schema in any location, this
      # should fail loudly so the list gets updated, rather than silently
      # skipping validation of that object.
      KUBECONFORM_SCHEMA_ARGS: >-
        -schema-location kubernetes/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        -schema-location default
        -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate cluster manifests
        # kubernetes/cluster/ is plain manifests applied with
        # `kubectl apply -f <dir> -R` (the kustomization.yaml is gone — it was a
        # hand-maintained resource list with no overlay left to serve), so
        # kubeconform walks the directory directly.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary kubernetes/cluster
          echo "All cluster manifests are valid!"

      - name: Validate Helm charts against CI fixtures
        # Plain `helm lint`/`helm template` with default values renders
        # (near) zero objects for these charts — everything meaningful is
        # gated behind values apps/services actually set. ci/test-values.yaml
        # (maintained alongside each chart) supplies a representative values
        # set so lint + template + schema validation exercise the real
        # templates.
        run: |
          set -euo pipefail
          for chart in app service; do
            fixture="kubernetes/charts/$chart/ci/test-values.yaml"
            echo "== $chart chart =="
            helm lint "kubernetes/charts/$chart" -f "$fixture"
            # shellcheck disable=SC2086
            helm template ci-test "kubernetes/charts/$chart" -f "$fixture" \
              | kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary -
          done

      # kubeconform proves each rendered object is SCHEMA-valid. It cannot see
      # whether the template computed the right value — a NODE_OPTIONS heap cap
      # derived from the wrong number, a dockerconfigjson whose escaping broke,
      # an `access:` value that silently picked the wrong ipAllowList are all
      # perfectly valid YAML. helm-unittest asserts the logic.
      #
      # Pinned by tag: Helm plugins are installed from a git ref, so there is no
      # digest to pin the way the kubeconform tarball's sha256 is pinned above.
      # The plugin embeds its own Helm rendering library, so its output does not
      # depend on the helm CLI version installed alongside it — which is what
      # keeps the committed snapshots reproducible between a laptop and here.
      - name: Install helm-unittest
        # scripts/lib/helm-plugin.sh carries the Helm 3/4 --verify fallback, so
        # this and scripts/helmfile.sh install plugins the same way.
        run: |
          set -euo pipefail
          HELM_UNITTEST_VERSION=v1.1.2
          source scripts/lib/helm-plugin.sh
          helm_plugin_install https://github.com/helm-unittest/helm-unittest "$HELM_UNITTEST_VERSION"
          helm plugin list

      - name: Helm chart unit tests
        # Both charts at once so a failure in either fails the job. `--strict`
        # rejects unknown keys in a test file, so a typo'd assertion name is an
        # error rather than an assertion that silently never runs.
        run: helm unittest --strict kubernetes/charts/app kubernetes/charts/service

      # kubernetes/helmfile.yaml.gotmpl is the ONLY declaration of every
      # platform release, and roles/platform applies it verbatim. Rendering it
      # here catches a bad chart version, a values file that moved, a `needs:`
      # pointing at a release that no longer exists — all of which would
      # otherwise surface mid-deploy, after some releases have already been
      # upgraded.
      #
      # KEEP IN SYNC with `helmfile_version` in
      # ansible/inventories/group_vars/all.yml (asserted by
      # scripts/assert-sync.py).
      - name: Install helmfile
        run: |
          set -euo pipefail
          HELMFILE_VERSION=v1.7.4
          curl -sSL -o /tmp/helmfile.tar.gz \
            "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile --version

      - name: Render the platform helmfile
        # No cluster: `template` is `helm template` per release, so it needs
        # the chart repositories and nothing else. The two variables are
        # `requiredEnv` in the state file — real values only matter at apply
        # time, and helm never sees these because nothing is installed.
        env:
          NODE_NAME: ci-render
          GRAFANA_ADMIN_PASSWORD: ci-render
        run: helmfile --file kubernetes/helmfile.yaml.gotmpl template > /dev/null

      - name: Validate raw service manifests
        # kubernetes/services/** mixes Helm values files (values.yaml for the
        # upstream chart, service.yaml for the service chart) with actual
        # hand-written K8s objects (openpanel's stack, LibreChat's
        # mongodb/secret/netpol, cloudflared's Deployment, cert-manager
        # issuers, the registry Deployment, ...). Rather than maintain an
        # explicit file list that goes stale the moment someone adds a file,
        # filter by the one structural property that distinguishes them: a
        # real manifest has a top-level `apiVersion:` key, a values file
        # doesn't. (roles/platform/tasks/raw-manifests.yml applies the same
        # test for the same reason.)
        run: |
          set -euo pipefail
          mapfile -t manifests < <(grep -rl '^apiVersion:' kubernetes/services --include='*.yaml')
          echo "Validating ${#manifests[@]} raw manifests:"
          printf '  %s\n' "${manifests[@]}"
          # shellcheck disable=SC2086
          kubeconform -strict $KUBECONFORM_SCHEMA_ARGS -summary "${manifests[@]}"

  secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same install pattern as kubeconform above: pinned version + sha256 of
      # the release tarball, so a compromised or re-tagged release cannot
      # silently execute here.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        # --no-git scans the CHECKED-OUT FILES ONLY, never the commit history.
        #
        # That is deliberate and it is not a bug to "fix": this repository
        # predates any secret hygiene and its history is known to contain
        # credentials that have since been rotated. Scanning it would fail
        # every run forever, and the only remedies — a filter-repo rewrite or a
        # baseline file enumerating historical findings — are explicitly out of
        # scope. What this gate is for is stopping a NEW secret from landing:
        # every PR and every push to main is checked before merge, so anything
        # this misses was already committed before the gate existed.
        #
        # --redact so a true positive does not print the secret into a public
        # Actions log (which would leak it a second time, more widely).
        #
        # There is deliberately NO .gitleaks.toml: the default ruleset runs
        # unmodified and the tree is clean under it. When a fixture tripped a
        # rule, the fixture was rewritten to an obviously-non-secret form
        # rather than allowlisted (see the registry credentials in
        # kubernetes/charts/app/ci/test-values.yaml, and the decode-and-match
        # assertions in the chart tests that no longer embed a base64 blob).
        # That keeps EVERY scanner quiet — gitleaks here, and whatever runs
        # against the repo on GitHub's side — not just the one configured here.
        # An allowlist is the last resort, for a finding that structurally
        # cannot be rewritten; none exists today.
        run: gitleaks detect --source . --no-git --no-banner --redact -v
