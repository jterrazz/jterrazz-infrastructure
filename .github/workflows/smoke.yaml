name: Smoke

# invariant: the platform contract against the live cluster from two vantages (ADR-022); the
# daily run catches what no deploy triggers, beside the Grafana alerts (ADR-025).
on:
  schedule:
    # value: daily, off the hour, when GitHub's scheduler queues every :00 job; about 1.3 runner
    # minutes a run.
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Platform"]
    types: [completed]

permissions:
  contents: read
  # invariant: one token for Tailscale and for the apiserver (github:jterrazz/jterrazz-infrastructure).
  id-token: write

# invariant: a cancelled observation reads as "unknown", not "fine".
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  tailnet:
    name: Contract from the tailnet
    runs-on: ubuntu-latest
    # invariant: after a failed deploy a probe would only report that failure twice.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        uses: jterrazz/jterrazz-actions/actions/infra-connect@a56e32078360198f0262f9d6bacd0594ac310237 # main, 2026-10-24

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # invariant: built as jterrazz-actions docker-deploy builds it: an exec plugin minting the
      # job's OIDC token, the CA from k3s' /cacerts; it reads through platform-reader.
      - name: Write the OIDC kubeconfig
        env:
          API_SERVER: https://jterrazz-infrastructure.tail77a797.ts.net:6443
          AUDIENCE: jterrazz-infrastructure
        run: |
          set -euo pipefail
          plugin="$RUNNER_TEMP/github-oidc-credential"
          cat > "$plugin" <<'PLUGIN'
          #!/usr/bin/env bash
          set -euo pipefail
          token=$(curl -sSf --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GITHUB_OIDC_AUDIENCE" | jq -r .value)
          expires=$(date -u -d '+4 minutes' +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg t "$token" --arg e "$expires" \
            '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential", status: {token: $t, expirationTimestamp: $e}}'
          PLUGIN
          chmod 700 "$plugin"
          ca=$(curl -sSfk "$API_SERVER/cacerts" | base64 -w0)
          cat > "$RUNNER_TEMP/kubeconfig" <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - name: k3s
              cluster: {server: "$API_SERVER", certificate-authority-data: "$ca"}
          users:
            - name: github-oidc
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: "$plugin"
                  interactiveMode: Never
                  env: [{name: GITHUB_OIDC_AUDIENCE, value: "$AUDIENCE"}]
          contexts:
            - name: k3s
              context: {cluster: k3s, user: github-oidc}
          current-context: k3s
          KUBECONFIG
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl auth whoami

      # invariant: the internet job cannot reach the apiserver, so it probes this snapshot.
      - name: Snapshot the IngressRoutes for the internet job
        run: kubectl get ingressroutes.traefik.io --all-namespaces -o json > "$RUNNER_TEMP/ingressroutes.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}/ingressroutes.json
          retention-days: 1

      - name: Routes, certificates, cluster invariants, health
        working-directory: specs
        run: npx vitest --run specs/api/routes specs/api/certificates specs/cluster specs/health

  internet:
    name: Boundary from the internet
    runs-on: ubuntu-latest
    needs: tailnet
    # invariant: never on the tailnet: this job stands where an outsider does.
    if: ${{ !cancelled() && needs.tailnet.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}

      - name: Public routes answer, private hosts do not
        working-directory: specs
        env:
          INGRESSROUTES_FILE: ${{ runner.temp }}/ingressroutes.json
        run: npx vitest --run specs/api/routes/public specs/api/boundary
