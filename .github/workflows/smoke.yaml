name: Smoke

# Black-box verification that the cluster is actually serving: every public
# hostname through the Cloudflare tunnel, every private hostname over the
# tailnet, and the TLS expiry of both sets. The logic is scripts/smoke.sh —
# this workflow only supplies a runner with tailnet membership.
#
# Three triggers, three different questions:
#   * workflow_run after Deploy Platform — "did that deploy break anything a
#     green ansible-playbook run would not have noticed?" A platform apply can
#     succeed and still leave a service unreachable (a broken IngressRoute, a
#     middleware that no longer resolves, a pod that comes back CrashLooping
#     after --wait returned).
#   * schedule — nothing else notices a certificate that quietly stopped
#     renewing, or an app that died days after its last deploy. This repo has
#     no uptime monitor; the weekly run is it.
#   * workflow_dispatch — after a manual change, or to confirm a suspicion.
#
# The check LIST is not in this repo: every IngressRoute carries its own smoke
# contract as annotations, and scripts/smoke.sh reads them off the live cluster.
# So a surface an app added yesterday is probed today with no edit here.

on:
  schedule:
    # Mondays 07:17 UTC. Off the hour on purpose: GitHub's scheduler queues
    # every :00 job on the planet at once and delays are routine.
    - cron: "17 7 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Platform"]
    types: [completed]

permissions:
  contents: read

# Never cancel a run in flight: each one is a point-in-time observation, and a
# cancelled smoke test reads as "unknown", not "fine".
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Probe public + private surfaces
    runs-on: ubuntu-latest
    # A workflow_run fires on completion regardless of outcome; probing right
    # after a FAILED deploy would just report the failure a second time, in a
    # place that looks like an independent signal. The other two triggers have
    # no such object and must always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same first-party action deploy-platform.yaml uses, at @main for the
      # same reason (owner-controlled, meant to roll across the fleet). It
      # fetches the Infisical-held CI secrets and joins the tailnet as tag:ci —
      # without it the --private and the private half of --certs cannot resolve
      # or connect, since Traefik's 443 only accepts Tailscale CGNAT sources.
      - name: Setup infrastructure
        uses: jterrazz/jterrazz-actions/actions/infra-connect@main
        with:
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      # smoke.sh discovers WHAT to probe from the cluster's own IngressRoutes,
      # so it needs a read of the API server. The same CI_DEPLOY_SSH_PRIVATE
      # keypair deploy-platform.yaml uses gets it there — kubectl runs on the
      # node over SSH. No kubeconfig, no new secret: KUBECONFIG_BASE64 is
      # regenerated by every repave and would be one more thing to refresh
      # before this workflow could tell you anything.
      - name: Write SSH deploy key
        env:
          CI_DEPLOY_SSH_PRIVATE: ${{ secrets.CI_DEPLOY_SSH_PRIVATE }}
        run: |
          if [ -z "${CI_DEPLOY_SSH_PRIVATE:-}" ]; then
            echo "::error::CI_DEPLOY_SSH_PRIVATE missing — smoke.sh cannot list the cluster's IngressRoutes"
            exit 1
          fi
          KEY_FILE="$(mktemp -t ci-deploy-XXXXXX.key)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$CI_DEPLOY_SSH_PRIVATE" > "$KEY_FILE"
          echo "CLUSTER_SSH_KEY=$KEY_FILE" >> "$GITHUB_ENV"

      # curl and openssl are preinstalled on ubuntu-latest; there is nothing to
      # set up. The script exits non-zero if any single check fails and prints
      # a per-check PASS/FAIL line plus a summary of the failures.
      - name: Smoke test
        run: ./scripts/smoke.sh --public --private --certs

      - name: Wipe the deploy key
        if: always()
        run: rm -f "${CLUSTER_SSH_KEY:-}" || true
