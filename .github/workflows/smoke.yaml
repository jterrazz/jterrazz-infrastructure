name: Smoke

# invariant: the platform contract against the LIVE cluster, from two vantages: a job on
# the tailnet (every route, every certificate, the cluster's invariants read through the
# API) and a job on the bare internet (what must stay unreachable from there). The specs
# are harness/specs/ (docs/guides/test.md); this workflow only supplies the vantages.
#
# Three triggers, three different questions:
#   * workflow_run after Deploy Platform: "did that deploy break anything a green
#     ansible-playbook run would not have noticed?"
#   * schedule: nothing else notices a certificate that quietly stopped renewing, or an
#     app that died days after its last deploy. The weekly run is the uptime monitor.
#   * workflow_dispatch: after a manual change, or to confirm a suspicion.
#
# The check LIST is not in this repo: every IngressRoute carries its own smoke contract
# as annotations, read off the live cluster, so a surface an app added yesterday is
# probed today with no edit here.

on:
  schedule:
    # outside: Mondays 07:17 UTC. Off the hour on purpose: GitHub's scheduler queues every
    # :00 job on the planet at once and delays are routine.
    - cron: "17 7 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Platform"]
    types: [completed]

permissions:
  contents: read
  # invariant: one token, two audiences: Tailscale's workload identity (infra-connect) and
  # the k3s apiserver, which maps it to user github:jterrazz/jterrazz-infrastructure.
  id-token: write

# invariant: never cancel a run in flight: each one is a point-in-time observation, and a
# cancelled smoke test reads as "unknown", not "fine".
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  tailnet:
    name: Contract from the tailnet
    runs-on: ubuntu-latest
    # invariant: a workflow_run fires on completion regardless of outcome; probing right
    # after a FAILED deploy would just report the failure a second time, in a place that
    # looks like an independent signal. The other two triggers must always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # outside: joins the tailnet as tag:ci; Traefik's 443 and the apiserver's 6443 only
      # answer Tailscale CGNAT sources.
      - name: Setup infrastructure
        uses: jterrazz/jterrazz-actions/actions/infra-connect@a56e32078360198f0262f9d6bacd0594ac310237 # main, 2026-10-24

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the harness
        working-directory: harness
        run: npm ci

      # invariant: docker-deploy's kubeconfig, built the same way (jterrazz-actions
      # actions/docker-deploy): an exec plugin minting this job's OIDC token per call, the
      # CA read from k3s' /cacerts. The identity reads through kubernetes/cluster/platform-reader.yaml
      # and stores nothing.
      - name: Write the OIDC kubeconfig
        env:
          API_SERVER: https://jterrazz-infrastructure.tail77a797.ts.net:6443
          AUDIENCE: jterrazz-infrastructure
        run: |
          set -euo pipefail
          plugin="$RUNNER_TEMP/github-oidc-credential"
          cat > "$plugin" <<'PLUGIN'
          #!/usr/bin/env bash
          set -euo pipefail
          token=$(curl -sSf --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GITHUB_OIDC_AUDIENCE" | jq -r .value)
          expires=$(date -u -d '+4 minutes' +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg t "$token" --arg e "$expires" \
            '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential", status: {token: $t, expirationTimestamp: $e}}'
          PLUGIN
          chmod 700 "$plugin"
          ca=$(curl -sSfk "$API_SERVER/cacerts" | base64 -w0)
          cat > "$RUNNER_TEMP/kubeconfig" <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - name: k3s
              cluster: {server: "$API_SERVER", certificate-authority-data: "$ca"}
          users:
            - name: github-oidc
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: "$plugin"
                  interactiveMode: Never
                  env: [{name: GITHUB_OIDC_AUDIENCE, value: "$AUDIENCE"}]
          contexts:
            - name: k3s
              context: {cluster: k3s, user: github-oidc}
          current-context: k3s
          KUBECONFIG
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl auth whoami

      # invariant: the internet job cannot reach the apiserver, so it probes the routes
      # this job read: one snapshot, taken before either job probes anything.
      - name: Snapshot the IngressRoutes for the internet job
        run: kubectl get ingressroutes.traefik.io --all-namespaces -o json > "$RUNNER_TEMP/ingressroutes.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}/ingressroutes.json
          retention-days: 1

      - name: Routes, certificates, cluster invariants, private_hostnames
        working-directory: harness
        run: npx vitest --run specs/deployment/routes specs/deployment/certificates specs/cluster specs/routes

  internet:
    name: Boundary from the internet
    runs-on: ubuntu-latest
    needs: tailnet
    # invariant: deliberately NOT on the tailnet: this job is where an outsider stands. It
    # runs whatever the tailnet job's probes concluded, once that job took the snapshot.
    if: ${{ !cancelled() && needs.tailnet.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the harness
        working-directory: harness
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}

      - name: Public routes answer, private hosts do not
        working-directory: harness
        env:
          INGRESSROUTES_FILE: ${{ runner.temp }}/ingressroutes.json
        run: npx vitest --run specs/deployment/routes/public specs/deployment/boundary
