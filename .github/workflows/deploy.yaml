name: Deploy
run-name: Deploy platform · ${{ github.event_name == 'workflow_run' && format('push · {0}', github.event.workflow_run.display_title) || format('manual run by {0}', github.triggering_actor) }}

# hazard: platform.yml only: the host roles restart sshd and tailscaled under the runner's own
# session, and creating the VM is orbctl on the Mac.
# invariant: a push deploys only once its whole Check passed, its Upgrade test included; the
# Check's Plan decides whether the change can move the platform at all (ADR-021).
on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # invariant: Plan reads the jobs of the Check run that triggered this one.
  actions: read
  # invariant: connect-infra joins the tailnet with this job's OIDC token.
  id-token: write

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  # invariant: a push's Check run applies only when it passed and its Upgrade test ran: a change
  # that cannot move the platform (docs, scripts alone) skips the test and deploys nothing.
  plan:
    name: Plan
    runs-on: ubuntu-26.04-arm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      apply: ${{ steps.plan.outputs.apply }}
    steps:
      - name: Read the Check run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upgrade=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "Upgrade test") | .conclusion')
          echo "Upgrade test: ${upgrade:-absent}"
          if [ "$upgrade" = "success" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the platform deploys changed: nothing to apply."
          fi

  deploy:
    name: Deploy · platform
    needs: plan
    if: needs.plan.outputs.apply == 'true'
    runs-on: ubuntu-26.04-arm
    # hazard: no `environment:`: it rewrites the OIDC subject, which Tailscale's trust
    # credential (`...:ref:refs/heads/main`) then refuses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Join the tailnet
        uses: jterrazz/studio-actions/actions/connect-infra@4338afaeb793d0f030f89f8b9b0a4615904fdd4f # main, 2026-10-29

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Ansible + collections
        working-directory: src/ansible
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Write the SSH deploy key
        env:
          CI_DEPLOY_SSH_PRIVATE: ${{ secrets.CI_DEPLOY_SSH_PRIVATE }}
        run: |
          if [ -z "${CI_DEPLOY_SSH_PRIVATE:-}" ]; then
            echo "::error::CI_DEPLOY_SSH_PRIVATE missing; set it via: gh secret set CI_DEPLOY_SSH_PRIVATE -R jterrazz/studio-infrastructure < /tmp/ci-deploy"
            exit 1
          fi
          KEY_FILE="$(mktemp -t ci-deploy-XXXXXX.key)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$CI_DEPLOY_SSH_PRIVATE" > "$KEY_FILE"
          echo "CI_DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Deploy the platform layer
        working-directory: src/ansible
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          ansible-playbook playbooks/platform.yml \
            -i inventories/ci.yml \
            -e "ansible_ssh_private_key_file=$CI_DEPLOY_KEY_FILE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # hazard: sshd's MaxStartups 3 drops parallel connections, so the files run one at a time
      # over one multiplexed connection.
      - name: Host contract
        working-directory: specs
        run: |
          set -euo pipefail
          node=$(awk '/ansible_host:/ {print $2; exit}' ../src/ansible/inventories/ci.yml)
          export HOST_SHELL="ssh -i $CI_DEPLOY_KEY_FILE -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o LogLevel=ERROR -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/ssh-%C -o ControlPersist=120 root@$node"
          npx vitest --run --no-file-parallelism specs/host

      - name: Remove the SSH deploy key
        if: always()
        run: |
          rm -f "${CI_DEPLOY_KEY_FILE:-}" || true

  # invariant: the platform contract from both vantages, the same jobs Watch runs daily: a deploy
  # is green only once the platform answers as its contract says (ADR-022).
  verify:
    name: Verify
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/watch.yaml
