name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/charts/app/**'
      # Bundled INTO the app chart by `helm package`, so a change here
      # changes what every app renders.
      - 'kubernetes/charts/common/**'
      - 'scripts/publish-app-chart.sh'
  workflow_dispatch:

concurrency:
  group: publish-chart
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Package and Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      # Left at @main deliberately: this is jterrazz's own first-party
      # action (owner-controlled, not a third-party supply-chain risk in
      # the same sense as the pinned actions above), and floating on @main
      # is how it's meant to pick up changes across the fleet of app repos
      # that also consume it.
      - name: Setup infrastructure
        uses: jterrazz/jterrazz-actions/actions/infra-connect@main
        with:
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      # The login, the already-published guard and the push all live in the
      # script, which is also what documents them — and what
      # scripts/assert-sync.py compares against the Ansible copy of the same
      # guard. Credentials go through `env:` so the registry password never
      # lands in the expanded shell text of a step.
      - name: Publish the app chart
        env:
          REGISTRY_USERNAME: ${{ env.DOCKER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ env.DOCKER_REGISTRY_PASSWORD }}
        run: ./scripts/publish-app-chart.sh
