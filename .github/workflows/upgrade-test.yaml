name: Upgrade test

# invariant: the real platform.yml on a throwaway k3d cluster, base tree then this
# one; it proves releases APPLY, never that pods start (docs/guides/test.md,
# docs/decisions/021-the-deploy-is-tested-on-a-throwaway-k3d-cluster.md). Nothing reaches outside the runner:
# dummy secrets, `dns-records` and `chart-publish` skipped.

on:
  pull_request:
    branches: [main]
    paths: ['ansible/**', 'kubernetes/**', 'harness/**', '.github/workflows/upgrade-test.yaml']
  push:
    branches: [main]
    paths: ['ansible/**', 'kubernetes/**', 'harness/**', '.github/workflows/upgrade-test.yaml']
  workflow_dispatch:
    inputs:
      base:
        description: Revision to deploy first (default HEAD^; HEAD gives a re-run test)
        required: false

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    name: Deploy base, then upgrade to this tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the base tree
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="${DISPATCH_BASE:-${PR_BASE:-${PUSH_BEFORE:-}}}"
          base=$(git rev-parse "$base" 2>/dev/null || echo "$base")
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "base: $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          # value: the inventory comes from THIS tree in both passes (the base may
          # predate it); group_vars still resolve from each tree's own inventories/.
          cp ansible/inventories/k3d.yml "$RUNNER_TEMP/base/ansible/inventories/k3d.yml"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v7.0.0
        with:
          python-version: "3.13"

      # invariant: kubernetes==30.1.0 is the node's python3-kubernetes (roles/base);
      # the play's k8s modules run here instead of on the node.
      - name: Install Ansible, its collections and the node's k8s client library
        run: |
          pip install -r ansible/requirements.txt kubernetes==30.1.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Create the k3d cluster at the production k3s version
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/k3d-io/k3d/v5.9.0/install.sh | TAG=v5.9.0 bash
          k3s=$(yq '.k3s_version' ansible/inventories/group_vars/all.yml | tr '+' '-')
          k3d cluster create ci --image "rancher/k3s:$k3s" \
            --k3s-arg "--disable=local-storage@server:0" --wait
          k3d kubeconfig get ci > "$RUNNER_TEMP/kubeconfig"
          chmod 644 "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get nodes

      - name: Write the dummy deploy variables
        run: |
          cat > "$RUNNER_TEMP/k3d-vars.yml" <<EOF
          kubeconfig: $RUNNER_TEMP/kubeconfig
          platform_helm_wait: false
          tailscale_ip: 127.0.0.1
          tailscale_dns_hostname: k3d.invalid
          cloudflare_api_token: ci-dummy
          cloudflare_tunnel_token: ci-dummy
          registry_username: ci
          registry_password: ci-dummy
          registry_pull_username: kubelet
          registry_pull_password: ci-dummy
          grafana_admin_password: ci-dummy
          infisical_client_id: ci-dummy
          infisical_client_secret: ci-dummy
          EOF

      - name: Deploy the base tree
        working-directory: ${{ runner.temp }}/base/ansible
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags dns-records,chart-publish

      - name: Upgrade to this tree
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags dns-records,chart-publish

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the harness
        working-directory: harness
        run: npm ci

      # invariant: the upgraded cluster holds the cluster contract, and the ownership policy
      # admits and refuses what it says; the admission specs impersonate app identities,
      # which only an admin kubeconfig can, so they run here and never on the live cluster.
      - name: Cluster and admission contract
        working-directory: harness
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: npx vitest --run specs/cluster specs/admission

      - name: What the cluster holds
        if: always()
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sudo -E helm list -A || true
          kubectl get pods -A -o wide || true
