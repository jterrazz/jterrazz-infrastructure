name: Upgrade test

# invariant: the real platform.yml on a throwaway k3d cluster, base tree then this one: it
# proves releases apply, never that pods start; nothing leaves the runner (ADR-021).

on:
  pull_request:
    branches: [main]
    paths: ['src/ansible/**', 'src/kubernetes/**', 'specs/**', '.github/workflows/upgrade-test.yaml']
  push:
    branches: [main]
    paths: ['src/ansible/**', 'src/kubernetes/**', 'specs/**', '.github/workflows/upgrade-test.yaml']
  workflow_dispatch:
    inputs:
      base:
        description: Revision to deploy first (default HEAD^; HEAD gives a re-run test)
        required: false

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    name: Deploy base, then upgrade to this tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the base tree
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="${DISPATCH_BASE:-${PR_BASE:-${PUSH_BEFORE:-}}}"
          base=$(git rev-parse "$base" 2>/dev/null || echo "$base")
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "base: $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          # outside: a base from before the src/ move keeps ansible/ at its root.
          ansible_dir="$RUNNER_TEMP/base/src/ansible"
          [ -d "$ansible_dir" ] || ansible_dir="$RUNNER_TEMP/base/ansible"
          echo "BASE_ANSIBLE=$ansible_dir" >> "$GITHUB_ENV"
          # invariant: the base may predate the k3d inventory; group_vars stay each tree's own.
          cp src/ansible/inventories/k3d.yml "$ansible_dir/inventories/k3d.yml"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # invariant: the play's k8s modules run here, on the node's python3-kubernetes version.
      - name: Install Ansible, its collections and the node's k8s client library
        run: |
          pip install -r src/ansible/requirements.txt kubernetes==30.1.0
          ansible-galaxy collection install -r src/ansible/requirements.yml

      - name: Create the k3d cluster at the production k3s version
        run: |
          set -euo pipefail
          K3D_VERSION=v5.9.0
          curl -sSfL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" | TAG="${K3D_VERSION}" bash
          k3s=$(yq '.k3s_version' src/ansible/inventories/group_vars/all/versions.yml | tr '+' '-')
          k3d cluster create ci --image "rancher/k3s:$k3s" \
            --k3s-arg "--disable=local-storage@server:0" --wait
          k3d kubeconfig get ci > "$RUNNER_TEMP/kubeconfig"
          chmod 644 "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get nodes

      - name: Write the dummy deploy variables
        run: |
          cat > "$RUNNER_TEMP/k3d-vars.yml" <<EOF
          kubeconfig: $RUNNER_TEMP/kubeconfig
          platform_helm_wait: false
          tailscale_ip: 127.0.0.1
          tailscale_dns_hostname: k3d.invalid
          cloudflare_api_token: ci-dummy
          cloudflare_tunnel_token: ci-dummy
          registry_username: ci
          registry_password: ci-dummy
          registry_pull_username: kubelet
          registry_pull_password: ci-dummy
          grafana_admin_password: ci-dummy
          infisical_client_id: ci-dummy
          infisical_client_secret: ci-dummy
          EOF

      - name: Deploy the base tree
        working-directory: ${{ env.BASE_ANSIBLE }}
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags cloudflare,publish

      - name: Upgrade to this tree
        working-directory: src/ansible
        run: >-
          ansible-playbook playbooks/platform.yml -i inventories/k3d.yml
          -e "@$RUNNER_TEMP/k3d-vars.yml" --skip-tags cloudflare,publish

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # invariant: impersonating app identities needs an admin kubeconfig, so the admission
      # specs run here and never on the live cluster.
      - name: Cluster and admission contract
        working-directory: specs
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: npx vitest --run specs/cluster specs/admission

      - name: What the cluster holds
        if: always()
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sudo -E helm list -A || true
          kubectl get pods -A -o wide || true
