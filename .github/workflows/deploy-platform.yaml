name: Deploy Platform

# hazard: platform.yml only: the host roles restart sshd and tailscaled under the runner's own
# session, and creating the VM is orbctl on the Mac.
# invariant: a push deploys only once its upgrade test passed, and its Validate run with it; the
# upgrade test's path filter is this workflow's (ADR-021).
on:
  workflow_run:
    workflows: ["Upgrade test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # invariant: reads the Validate run of the same commit.
  actions: read
  # invariant: infra-connect joins the tailnet with this job's OIDC token.
  id-token: write

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply platform via Ansible
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # hazard: no `environment:`: it rewrites the OIDC subject, which Tailscale's trust
    # credential (`...:ref:refs/heads/main`) then refuses.
    steps:
      - name: Require the commit's Validate run to pass
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w validate.yaml -c "$SHA" -L 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Validate concluded '${run#completed }' for $SHA"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::no finished Validate run for $SHA after 10 minutes"; exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Join the tailnet
        uses: jterrazz/jterrazz-actions/actions/infra-connect@a56e32078360198f0262f9d6bacd0594ac310237 # main, 2026-10-24

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Ansible + collections
        working-directory: src/ansible
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Write the SSH deploy key
        env:
          CI_DEPLOY_SSH_PRIVATE: ${{ secrets.CI_DEPLOY_SSH_PRIVATE }}
        run: |
          if [ -z "${CI_DEPLOY_SSH_PRIVATE:-}" ]; then
            echo "::error::CI_DEPLOY_SSH_PRIVATE missing; set it via: gh secret set CI_DEPLOY_SSH_PRIVATE -R jterrazz/jterrazz-infrastructure < /tmp/ci-deploy"
            exit 1
          fi
          KEY_FILE="$(mktemp -t ci-deploy-XXXXXX.key)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$CI_DEPLOY_SSH_PRIVATE" > "$KEY_FILE"
          echo "CI_DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Deploy the platform layer
        working-directory: src/ansible
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          ansible-playbook playbooks/platform.yml \
            -i inventories/ci.yml \
            -e "ansible_ssh_private_key_file=$CI_DEPLOY_KEY_FILE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # hazard: sshd's MaxStartups 3 drops parallel connections, so the files run one at a time
      # over one multiplexed connection.
      - name: Host contract
        working-directory: specs
        run: |
          set -euo pipefail
          node=$(awk '/ansible_host:/ {print $2; exit}' ../src/ansible/inventories/ci.yml)
          export HOST_SHELL="ssh -i $CI_DEPLOY_KEY_FILE -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o LogLevel=ERROR -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/ssh-%C -o ControlPersist=120 root@$node"
          npx vitest --run --no-file-parallelism specs/host

      - name: Remove the SSH deploy key
        if: always()
        run: |
          rm -f "${CI_DEPLOY_KEY_FILE:-}" || true
