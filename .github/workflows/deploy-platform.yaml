name: Deploy Platform

# Runs ansible-playbook against the OrbStack VM over Tailscale to apply
# platform-layer changes (cert-manager, otel-collector, librechat, ...) and
# any manifests under kubernetes/services or kubernetes/cluster.
#
# Pulumi is deliberately NOT in scope here — `pulumi up` drives orbctl on the
# dev Mac, which a GHA runner cannot satisfy. Provisioning stays on the laptop
# via `make deploy`; this workflow only handles incremental updates.
#
# Auth: the deploy keypair lives split — public half in
# ansible/roles/security/defaults/main.yml (security_ci_deploy_pubkey)
# so the security role installs it in root's authorized_keys, private
# half as the CI_DEPLOY_SSH_PRIVATE GitHub Action secret on this repo.
# To rotate: regen the keypair, paste the new pub into the security
# role default, set the new priv via `gh secret set CI_DEPLOY_SSH_PRIVATE
# -R jterrazz/jterrazz-infrastructure`, then `make deploy` to roll the
# pubkey onto the VM.

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'kubernetes/services/**'
      - 'kubernetes/cluster/**'
      - 'kubernetes/charts/platform-service/**'
      # The library chart platform-service renders through.
      - 'kubernetes/charts/common/**'
      # The one declaration of every platform Helm release.
      - 'kubernetes/helmfile.yaml.gotmpl'
      # The job runs this to build its extra-vars file.
      - 'scripts/infisical-vars.py'
  workflow_dispatch:

permissions:
  contents: read
  # `environment: production` below makes the runner's GITHUB_TOKEN create
  # and update a Deployment record (in_progress → success/failure) — that
  # needs the deployments scope, not just contents:read.
  deployments: write

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply platform via Ansible
    runs-on: ubuntu-latest
    # Records a GitHub Deployment under the `production` environment and
    # auto-updates its status (in_progress → success/failure) as this job
    # runs, so the repo's Environments/Deployments view stays live.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch CI secrets (Tailscale OAuth, docker registry creds) + join
      # the tailnet as tag:ci. After this step the runner can reach the
      # OrbStack VM at jterrazz-infrastructure.tail77a797.ts.net.
      #
      # Left at @main deliberately: this is jterrazz's own first-party
      # action (owner-controlled, not a third-party supply-chain risk in
      # the same sense as the pinned actions below), and floating on @main
      # is how it's meant to pick up changes across the fleet of app repos
      # that also consume it.
      - name: Setup infrastructure
        uses: jterrazz/jterrazz-actions/actions/infra-connect@main
        with:
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must be >= 3.12 or ansible-core 2.21 is not installable at all —
          # pip would silently resolve an ancient core instead. Same value as
          # the `ansible` job in validate.yaml, deliberately.
          python-version: "3.13"

      - name: Install Ansible + collections
        working-directory: ansible
        run: |
          # Pinned exact, and ansible-CORE rather than the `ansible` community
          # bundle — same reasoning as validate.yaml: the bundle ships its own
          # copies of the collections that requirements.yml pins explicitly,
          # so the version that actually runs would depend on install order.
          # KEEP IN SYNC with the pin in validate.yaml's `ansible` job: the
          # thing that lints a playbook and the thing that APPLIES it must be
          # the same interpreter.
          pip install ansible-core==2.21.2
          ansible-galaxy collection install -r requirements.yml

      # Materialise the deploy private key in a 0600 tempfile so ansible
      # can consume it without it ever touching the workspace.
      - name: Write SSH deploy key
        env:
          CI_DEPLOY_SSH_PRIVATE: ${{ secrets.CI_DEPLOY_SSH_PRIVATE }}
        run: |
          if [ -z "${CI_DEPLOY_SSH_PRIVATE:-}" ]; then
            echo "::error::CI_DEPLOY_SSH_PRIVATE missing — set via: gh secret set CI_DEPLOY_SSH_PRIVATE -R jterrazz/jterrazz-infrastructure < /tmp/ci-deploy"
            exit 1
          fi
          KEY_FILE="$(mktemp -t ci-deploy-XXXXXX.key)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$CI_DEPLOY_SSH_PRIVATE" > "$KEY_FILE"
          echo "CI_DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      # Same script scripts/deploy.sh uses, in its `platform` scope — one
      # implementation of the Infisical fetch, the missing-key hard-fail and
      # the YAML escaping instead of two hand-synced copies. `platform` omits
      # the Tailscale OAuth credentials: platform.yml only reads Tailscale
      # facts off an already-joined node.
      - name: Build extra-vars file
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          EXTRA="$(mktemp -t platform-vars-XXXXXX.yml)"
          python3 scripts/infisical-vars.py platform "$EXTRA"
          echo "EXTRA_VARS_FILE=$EXTRA" >> "$GITHUB_ENV"

      # Scope: platform.yml only (Helm-managed services + manifests).
      # Skips the base/security/resolved/tailscale/k3s roles because those can restart
      # sshd or tailscaled and would kill the runner's SSH session mid-run.
      # Use `make deploy` from the laptop when you need to apply changes
      # outside the platform layer.
      - name: Run ansible-playbook (platform layer only)
        working-directory: ansible
        run: |
          ansible-playbook playbooks/platform.yml \
            -i inventories/ci.yml \
            -e "@$EXTRA_VARS_FILE" \
            -e "ansible_ssh_private_key_file=$CI_DEPLOY_KEY_FILE"

      - name: Wipe temp secrets
        if: always()
        run: |
          rm -f "${CI_DEPLOY_KEY_FILE:-}" "${EXTRA_VARS_FILE:-}" || true
