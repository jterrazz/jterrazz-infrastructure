name: Deploy Platform

# outside: platform.yml over Tailscale only; creating the VM is `orbctl` on the Mac,
# which no runner has. The SSH key is split between security_ci_deploy_pubkey and
# the CI_DEPLOY_SSH_PRIVATE secret (rotation: docs/guides/operate.md).

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'kubernetes/services/**'
      - 'kubernetes/cluster/**'
      - 'kubernetes/charts/platform-service/**'
      # invariant: the app chart: the helmfile installs platform workloads from the LOCAL
      # copy of it (./charts/app), not from the published OCI one.
      - 'kubernetes/charts/app/**'
      - 'kubernetes/charts/common/**'
      - 'kubernetes/helmfile.yaml.gotmpl'
  workflow_dispatch:

permissions:
  contents: read
  # invariant: infra-connect joins the tailnet with this job's GitHub OIDC token
  # (Tailscale workload identity); there is no Tailscale secret any more.
  id-token: write
  # invariant: `environment: production` writes a Deployment record, which needs this.
  deployments: write

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply platform via Ansible
    runs-on: ubuntu-latest
    # outside: keeps the repo's Deployments view live for this job.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # outside: fetches the CI secrets and joins the tailnet as tag:ci, after which
      # the runner reaches the VM by its MagicDNS name.
      - name: Setup infrastructure
        uses: jterrazz/jterrazz-actions/actions/infra-connect@60c1159ab9137685d21d2e66b8d1875017d4d420 # main, 2026-10-24
        with:
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # hazard: below 3.12 pip silently resolves an ancient ansible-core; same as validate.yaml.
          python-version: "3.13"

      - name: Install Ansible + collections
        working-directory: ansible
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      # invariant: a 0600 tempfile outside the workspace.
      - name: Write SSH deploy key
        env:
          CI_DEPLOY_SSH_PRIVATE: ${{ secrets.CI_DEPLOY_SSH_PRIVATE }}
        run: |
          if [ -z "${CI_DEPLOY_SSH_PRIVATE:-}" ]; then
            echo "::error::CI_DEPLOY_SSH_PRIVATE missing; set it via: gh secret set CI_DEPLOY_SSH_PRIVATE -R jterrazz/jterrazz-infrastructure < /tmp/ci-deploy"
            exit 1
          fi
          KEY_FILE="$(mktemp -t ci-deploy-XXXXXX.key)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$CI_DEPLOY_SSH_PRIVATE" > "$KEY_FILE"
          echo "CI_DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      # hazard: platform.yml only: the host roles restart sshd or tailscaled and would
      # kill this session. The play fetches its own secrets with this identity.
      - name: Run ansible-playbook (platform layer only)
        working-directory: ansible
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          ansible-playbook playbooks/platform.yml \
            -i inventories/ci.yml \
            -e "ansible_ssh_private_key_file=$CI_DEPLOY_KEY_FILE"

      - name: Wipe temp secrets
        if: always()
        run: |
          rm -f "${CI_DEPLOY_KEY_FILE:-}" || true
