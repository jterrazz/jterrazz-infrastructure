name: Watch

# invariant: the platform contract against the live cluster from two vantages (ADR-022); the
# daily run catches what no deploy triggers, beside the Grafana alerts (ADR-025), and Deploy calls
# the same jobs as its Verify.
on:
  schedule:
    # value: daily, off the hour, when GitHub's scheduler queues every :00 job; about 1.3 runner
    # minutes a run.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # invariant: one token for Tailscale and for the apiserver (github:jterrazz/studio-infrastructure).
  id-token: write

# invariant: a cancelled observation reads as "unknown", not "fine".
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  smoke-tailnet:
    name: Smoke · tailnet
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        uses: jterrazz/studio-actions/actions/connect-infra@4338afaeb793d0f030f89f8b9b0a4615904fdd4f # main, 2026-10-29

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      # invariant: the identity app deploys use, here reading through platform-reader.
      - name: Connect to the cluster
        uses: jterrazz/studio-actions/actions/connect-cluster@4338afaeb793d0f030f89f8b9b0a4615904fdd4f # main, 2026-10-29

      # invariant: the internet job cannot reach the apiserver, so it probes this snapshot.
      - name: Snapshot the IngressRoutes for the internet job
        run: kubectl get ingressroutes.traefik.io --all-namespaces -o json > "$RUNNER_TEMP/ingressroutes.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}/ingressroutes.json
          retention-days: 1

      - name: Routes, certificates, cluster invariants, health
        working-directory: specs
        run: npx vitest --run specs/api/routes specs/api/certificates specs/cluster specs/health

  smoke-internet:
    name: Smoke · internet
    runs-on: ubuntu-26.04-arm
    needs: smoke-tailnet
    # invariant: never on the tailnet: this job stands where an outsider does.
    if: ${{ !cancelled() && needs.smoke-tailnet.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the specs project
        working-directory: specs
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingressroutes
          path: ${{ runner.temp }}

      - name: Public routes answer, private hosts do not
        working-directory: specs
        env:
          INGRESSROUTES_FILE: ${{ runner.temp }}/ingressroutes.json
        run: npx vitest --run specs/api/routes/public specs/api/boundary
